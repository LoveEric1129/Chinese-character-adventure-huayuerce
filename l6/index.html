/* ===== 02-store.js ===== */
/* =============================================================================
   SAVE SYSTEM — localStorage, one JSON blob, exportable.
   Nothing else in the game touches localStorage directly.
   ========================================================================== */

/* ---- profiles ---------------------------------------------------------

   One file, many children. A class opens the same link, each types a name,
   and each gets their own save. The roster and every save live in this
   browser's localStorage — which is the honest limit of a single HTML file
   with no server behind it:

     · same device, different children  →  works, that is what this is for
     · same child, a different device   →  starts over; nothing follows them
     · the teacher seeing everyone      →  only on the device they played on
                                           (家长面板 → 导出 gets it as a file)

   Say that out loud to whoever deploys this rather than letting them discover
   it in week three. */
const ROSTER_KEY = 'hanzi-adventure.roster.v1';
const SAVE_PREFIX = 'hanzi-adventure.save.';
const LAST_KEY = 'hanzi-adventure.last';
const LEGACY_KEY = 'eric-hanzi-adventure.v1';

/** a stable key for a name, so 「小明」 and 「 小明 」 are the same child */
function slugOf(name){
  return String(name || '').trim().replace(/\s+/g, ' ').slice(0, 24) || '小朋友';
}

const BLANK = () => ({
  v: 1,
  name: EDITION.player,
  stars: 0, coins: 0, gems: 0,
  level: 1, xp: 0,
  streak: 0, lastPlayDay: null, daysPlayed: [],
  chars: {},                 // ch -> memory record (see 03-memory.js)
  confusion: {},             // "马|妈" -> 次数（哪两个字被认混了）
  daily: {},                 // "2026-9-3" -> {seen,right,wrong,fresh} 家长面板用
  unitsCleared: {},          // unitId -> true
  bossBeaten: {},            // unitId -> times
  badges: [],
  cosmetics: {owned:['none'], hat:'none', pet:'none', trail:'none'},
  sessionCount: 0,
  addedChars: [],            // characters created in the parent panel
  unitOverrides: {},         // unitId -> 字表（家长面板导入后覆盖）
  unlocked: {},              // unitId -> true（老师在家长面板里放出来的课）
  plants: ['sunflower'],     // 商店里买下的植物（向日葵免费送）
  pvzLevel: 1,               // 旧存档留着，现在只有一关，不再用它解锁
  pvzWins: 0,
  voiceName: '',
  lock: '',                  // 两个小图案，进自己的存档要点对（空 = 没设过）
  hero: 'boy',               // 选的卡通形象：boy / girl
  pinyin: true,
  wallBest: 0,              // 字词砌墙的个人纪录             // 读故事时汉字上方标拼音（可关）             // 家长在设置里选的朗读语音（空 = 自动挑）
});

const Store = {
  data: BLANK(),
  who: null,                 // the child currently playing

  /* ------------------------------------------------------------ roster -- */
  roster(){
    try{ return JSON.parse(localStorage.getItem(ROSTER_KEY)) || []; }
    catch(e){ return []; }
  },

  saveRoster(list){
    try{ localStorage.setItem(ROSTER_KEY, JSON.stringify(list)); }catch(e){}
  },

  /** summary of one child, for the picker and the teacher's list */
  cardOf(name){
    const raw = localStorage.getItem(SAVE_PREFIX + slugOf(name));
    if (!raw) return {name, stars:0, known:0, last:null};
    try{
      const d = JSON.parse(raw);
      return {name, stars:d.stars || 0,
              known:Object.keys(d.chars || {}).length,
              last:d.lastPlayDay || null};
    }catch(e){ return {name, stars:0, known:0, last:null}; }
  },

  /** Load a profile WITHOUT putting it on the roster. Used before anyone has
      typed a name, so the placeholder never shows up as a classmate who has
      never played. */
  useQuietly(name){
    this.who = slugOf(name);
    this.load();
    return this.data;
  },

  /** start (or resume) a child; creates the profile if it is new */
  use(name){
    const who = slugOf(name);
    this.who = who;
    const list = this.roster();
    if (!list.includes(who)){ list.push(who); this.saveRoster(list); }
    try{ localStorage.setItem(LAST_KEY, who); }catch(e){}
    this.load();
    this.data.name = who;
    this.save();
    return this.data;
  },

  lastUsed(){
    try{ return localStorage.getItem(LAST_KEY); }catch(e){ return null; }
  },

  forget(name){
    const who = slugOf(name);
    this.saveRoster(this.roster().filter(n => n !== who));
    try{ localStorage.removeItem(SAVE_PREFIX + who); }catch(e){}
    /* 老版本的存档也要删掉，否则删了等于没删：load() 里有一条兼容逻辑 ——
       找不到存档时会从 LEGACY_KEY 把数据恢复回来。删完一打开，进度原样
       长回来，看着像"删除没生效"。 */
    if (who === slugOf(EDITION.player)){
      try{ localStorage.removeItem(LEGACY_KEY); }catch(e){}
    }
  },

  key(){ return SAVE_PREFIX + (this.who || slugOf(EDITION.player)); },

  /** 这台设备到底存不存得下？

      save() 一直是 try/catch 静默失败的 —— 存不下就当没这回事。在电脑上没
      问题，到了平板上就要命：iPad 从「文件」App 直接打开本地 HTML 时，
      Safari 可能不给 localStorage。孩子玩一节课，一关掉全没了，而且屏幕上
      什么都不会说。宁可开机就讲清楚。 */
  canSave(){
    if (this._canSave != null) return this._canSave;
    try{
      const k = 'hanzi-adventure.probe';
      localStorage.setItem(k, '1');
      const ok = localStorage.getItem(k) === '1';
      localStorage.removeItem(k);
      this._canSave = ok;
    }catch(e){ this._canSave = false; }
    return this._canSave;
  },

  /* ------------------------------------------------------------- 小锁 ----

     Each child has their own device, but a name they used once stays on the
     sign-in list — and a curious classmate on a shared iPad could tap it and
     be inside someone else's practice. A password is the wrong tool at seven:
     they forget it and they cannot type it. Two pictures, tapped in order,
     they can remember, and 12 pictures give 144 combinations — plenty against
     a classmate poking around, which is the whole threat here.

     The lock is READ WITHOUT LOADING the save. Checking it after switching
     profiles would be no lock at all. */
  LOCK_PICS: ['🐶','🐱','🐰','🐼','🦊','🐸','🍎','🍌','🍓','🚗','🚀','⚽'],

  /** what someone must tap to open this name ('' = never set one) */
  lockOf(name){
    try{
      const raw = localStorage.getItem(SAVE_PREFIX + slugOf(name));
      if (!raw) return '';
      return (JSON.parse(raw) || {}).lock || '';
    }catch(e){ return ''; }
  },

  /** does this tapping open that name? */
  unlocks(name, pics){
    const want = this.lockOf(name);
    return !want || want === pics;
  },

  setLock(pics){ this.data.lock = pics || ''; this.save(); },

  setHero(kind){ this.data.hero = kind === 'girl' ? 'girl' : 'boy'; this.save(); },

  /** 家长面板用：孩子忘了自己选的图案 */
  clearLock(name){
    const k = SAVE_PREFIX + slugOf(name);
    try{
      const raw = localStorage.getItem(k);
      if (!raw) return false;
      const d = JSON.parse(raw);
      d.lock = '';
      localStorage.setItem(k, JSON.stringify(d));
      if (this.who === slugOf(name)) this.data.lock = '';
      return true;
    }catch(e){ return false; }
  },

  load(){
    // Start from blank every time. Without this, switching to a child who has
    // never played left the PREVIOUS child's data in place — their stars, their
    // characters — and the next save wrote it under the new name.
    this.data = BLANK();
    try{
      // a save from before profiles existed becomes that child's first profile
      let raw = localStorage.getItem(this.key());
      if (!raw && this.who === slugOf(EDITION.player)){
        const old = localStorage.getItem(LEGACY_KEY);
        if (old){ raw = old; localStorage.setItem(this.key(), old); }
      }
      if (raw){
        const d = JSON.parse(raw);
        this.data = Object.assign(BLANK(), d);
        this.data.cosmetics = Object.assign(BLANK().cosmetics, d.cosmetics || {});
        this.heal();
        (this.data.addedChars || []).forEach(r => Data.addChar(r));
        Object.entries(this.data.unitOverrides || {}).forEach(([id, chars]) => {
          const u = Data.unit(id);
          if (u && Array.isArray(chars) && chars.length) u.chars = chars.slice();
        });
      }
    }catch(e){ console.warn('save unreadable, starting fresh', e); this.data = BLANK(); }
    return this.data;
  },

  /** 把老版本写下的记录补齐到当前格式。

      Memory.rec() 本来就会在读的时候补字段，但代码里有十几处是直接
      `Store.data.chars[ch]` 拿记录的 —— 绕过了那道补丁。只要有一处读到
      老记录上不存在的字段（比如 firstTry.c），那一整页就抛错崩掉：孩子
      看到的是"点了没反应"，而且看不出哪里坏了。

      与其在十几个读取点各防一次，不如在装载存档的那一刻补一次。 */
  heal(){
    if (typeof Memory === 'undefined') return;
    Object.keys(this.data.chars || {}).forEach(ch => {
      try{ Memory.rec(ch); }catch(e){}
    });
  },

  save(){
    try{ localStorage.setItem(this.key(), JSON.stringify(this.data)); }
    catch(e){ console.warn('could not save', e); }
  },

  reset(){ this.data = BLANK(); this.save(); },

  /* ----------------------------------------------------- confusion ------- */
  /** He answered `right` but tapped `wrong`. Stored as an unordered pair, so
      马→妈 and 妈→马 accumulate on the same counter: what matters is that
      these two characters are not yet distinct to him, not the direction. */
  confKey(a, b){ return [a, b].sort().join('|'); },

  noteConfusion(right, wrong){
    const c = this.data.confusion || (this.data.confusion = {});
    const k = this.confKey(right, wrong);
    c[k] = (c[k] || 0) + 1;
  },

  /** the pairs he actually mixes up, worst first */
  confusionPairs(min = 2){
    return Object.entries(this.data.confusion || {})
      .map(([k, n]) => { const [a, b] = k.split('|'); return {a, b, n}; })
      .filter(p => p.n >= min && Data.char(p.a) && Data.char(p.b))
      .sort((x, y) => y.n - x.n);
  },

  /* --------------------------------------------------------- daily ------- */
  /** One line per day, so the parent panel can answer "本周学了多少" without
      keeping a full event log. */
  noteDay(field, n = 1){
    const all = this.data.daily || (this.data.daily = {});
    const d = all[this.today()] || (all[this.today()] = {seen:0, right:0, wrong:0, fresh:0});
    d[field] = (d[field] || 0) + n;
    // a school year of single-line days is small; a decade of them is not
    const keys = Object.keys(all);
    if (keys.length > 400) delete all[keys[0]];
  },

  /** rolled-up totals for the last `days` days */
  since(days){
    const out = {seen:0, right:0, wrong:0, fresh:0};
    const cut = Date.now() - days * 864e5;
    Object.entries(this.data.daily || {}).forEach(([day, d]) => {
      const t = new Date(day.replace(/-/g, '/'));
      if (t.getTime() >= cut)
        Object.keys(out).forEach(k => out[k] += d[k] || 0);
    });
    return out;
  },

  /* ------------------------------------------------------------ rewards -- */
  award({stars=0, coins=0, gems=0, xp=0} = {}){
    const d = this.data;
    d.stars += stars; d.coins += coins; d.gems += gems; d.xp += xp;
    while (d.xp >= this.xpNeeded(d.level)){ d.xp -= this.xpNeeded(d.level); d.level++; }
    this.save();
  },
  xpNeeded(lv){ return 60 + lv * 40; },

  /* -------------------------------------------------------------- streak -- */
  today(){ const t = new Date(); return `${t.getFullYear()}-${t.getMonth()+1}-${t.getDate()}`; },
  touchDay(){
    const d = this.data, day = this.today();
    if (d.lastPlayDay === day) return;
    const y = new Date(); y.setDate(y.getDate() - 1);
    const yd = `${y.getFullYear()}-${y.getMonth()+1}-${y.getDate()}`;
    d.streak = (d.lastPlayDay === yd) ? d.streak + 1 : 1;
    d.lastPlayDay = day;
    if (!d.daysPlayed.includes(day)) d.daysPlayed.push(day);
    d.sessionCount++;
    this.save();
  },

  /* -------------------------------------------------------------- shop ---- */
  owns(plantId){ return (this.data.plants || []).includes(plantId); },
  buy(plant){
    if (this.owns(plant.id)) return 'owned';
    if (this.data.stars < plant.star) return 'poor';
    this.data.stars -= plant.star;
    this.data.plants.push(plant.id);
    this.save();
    return 'ok';
  },

  /* ------------------------------------------------------------- badges --- */
  giveBadge(id, label){
    if (this.data.badges.some(b => b.id === id)) return false;
    this.data.badges.push({id, label, at: Date.now()});
    this.save();
    return true;
  },

  /* ------------------------------------------------- export / import ------ */
  exportJSON(){ return JSON.stringify(this.data, null, 2); },
  importJSON(text){
    const d = JSON.parse(text);
    if (!d || typeof d !== 'object') throw new Error('不是有效的存档');
    this.data = Object.assign(BLANK(), d);
    this.heal();                     // 导入的存档可能是很久以前导出的
    this.save();
    return true;
  },
};


/* ===== 03-memory.js ===== */
/* =============================================================================
   MEMORY MODEL — spaced retrieval + mastery.

   Two ideas drive everything here:
   1. A character is not one skill. Recognising 水 from a picture and
      recognising it from the sound "shuǐ" are tracked separately.
   2. Mastery is earned by retrieving a character in DIFFERENT ways on
      DIFFERENT days — never by looking at it.
   ========================================================================== */

const SKILLS = ['audio','image','meaning','build','fix','context','tell','read','write','pinyin','recall'];
const SKILL_CN = {
  audio:'听音找字', image:'看图找字', meaning:'认字义', build:'拼字',
  fix:'补笔画', context:'组词造句', tell:'分辨像的字',
  read:'在故事里读出来', write:'凭记忆写出来', pinyin:'读出它的音', recall:'看着字说出来',
};

const MIN = 60e3, DAY = 864e5;
const RETRY_MS = 20e3;   // 同一道题再点一次的时间窗
/* box 0 comes back inside the same sitting; the rest stretch out */
const BOX_MS = [8*MIN, 1*DAY, 3*DAY, 7*DAY, 16*DAY, 35*DAY];

const MASTERY_LABEL = ['☆ 新朋友','⭐ 认识了','⭐⭐ 熟悉','⭐⭐⭐ 很牢','🏆 掌握'];
const MASTERY_STARS = ['☆','⭐','⭐⭐','⭐⭐⭐','🏆'];

const Memory = {

  rec(ch, create=false){
    const all = Store.data.chars;
    if (!all[ch] && create){
      all[ch] = {
        ch, exposures:0, correct:0, incorrect:0, mastery:0, box:0,
        lastSeen:0, nextReview:0, streak:0, days:[],
        skills: SKILLS.reduce((o,s)=>(o[s]={c:0,i:0},o), {}),
      };
    }
    const r = all[ch];
    /* Records written by earlier versions are missing the newer fields. Fill
       them in on read rather than in one migration pass — a save can arrive
       from an export file at any moment, so there is no single moment to
       migrate, and an old save must never lose the practice it already holds. */
    if (r){
      /* skills 是后来才加的，老记录整个没有这一块 —— 而 recomputeMastery
         直接读 r.skills[s].c，老存档一答题就崩。它必须排在最前面补。 */
      if (!r.skills) r.skills = SKILLS.reduce((o, k) => (o[k] = {c:0, i:0}, o), {});
      else SKILLS.forEach(k => { if (!r.skills[k]) r.skills[k] = {c:0, i:0}; });
      if (!r.days)    r.days    = [];
      if (!r.firstTry) r.firstTry = {c:r.correct || 0, i:r.incorrect || 0};
      if (!r.confus)   r.confus   = {};           // 答错时错选成了谁
      if (!r.log)      r.log      = [];           // 最近 24 次作答
      if (r.hinted  === undefined) r.hinted = 0;  // 有提示才答对的次数
      if (r.lapses  === undefined) r.lapses = 0;  // 曾经会、后来又忘的次数
      if (r.peakBox === undefined) r.peakBox = r.box || 0;
    }
    return r;
  },

  seen(ch){ return !!Store.data.chars[ch]; },

  /** every character the child has met at least once */
  known(){ return Object.keys(Store.data.chars); },

  /* ------------------------------------------------------------- scoring -- */
  /** record one retrieval attempt. skill must be in SKILLS. */
  /** Draw the next character to ask about, keeping the last few out.

      Memory.pick returns the weakest character — and answering it once does
      not stop it being the weakest, so a naive loop asks the same character
      over and over. The child taps, the question comes back looking identical,
      and he reads that as the game being broken. */
  nextAsk(pool, recent, keep){
    keep = keep === undefined ? Math.min(4, Math.max(1, pool.length - 2)) : keep;
    const fresh = pool.filter(c => recent.indexOf(c) < 0);
    const from = fresh.length >= 2 ? fresh : pool;
    const ch = this.pick(from, 1, 'any')[0] || rand(from);
    recent.push(ch);
    while (recent.length > keep) recent.shift();
    return ch;
  },

  /* Every game reports here, so this is the one place that can see how the
     session is actually going — a streak building, or a good run breaking. */
  run: 0,
  cheerFor(ok){
    if (ok){
      this.run++;
      if (this.run % 3 === 0) Say.cheer('streak');
      else if (Math.random() < 0.12) Say.cheer('praise');
    } else {
      if (this.run >= 3) Say.cheer('comfort', true);   // a good run just broke
      else if (Math.random() < 0.25) Say.cheer('comfort');
      this.run = 0;
    }
  },

  /**
   * Record one retrieval attempt.
   *   ch     the character being retrieved
   *   skill  one of SKILLS
   *   ok     did he get it
   *   opts   {chose, hinted, ms} — all optional, so every existing call site
   *          keeps working unchanged.
   *            chose  the character he actually tapped when wrong. This is
   *                   what confusion pairs are built from, and every game
   *                   already knew it — it was simply being thrown away.
   *            hinted the answer was shown or replayed before he chose
   *            ms     how long he took
   */
  score(ch, skill, ok, opts){
    if (!Data.char(ch) && !Data.PART_INFO[ch]) return null;
    opts = opts || {};
    const r = this.rec(ch, true);
    const now = Date.now(), day = Store.today();

    /* A wrong answer followed by another go at the same character and skill a
       few seconds later is the child having a SECOND try at the same question,
       not a fresh retrieval. Infer it here rather than asking all 27 call
       sites to report it — they would each get it subtly wrong. */
    const retry = r.lastSkill === skill && r.lastOk === false &&
                  now - (r.lastAt || 0) < RETRY_MS;

    r.exposures++;
    r.lastSeen = now;
    r.lastAt = now; r.lastSkill = skill; r.lastOk = ok;
    if (!r.days.includes(day)) r.days.push(day);
    if (r.skills[skill]) r.skills[skill][ok ? 'c' : 'i']++;
    if (!retry) r.firstTry[ok ? 'c' : 'i']++;
    if (ok && opts.hinted) r.hinted++;

    // what he mistook it for — the raw material for 易混字
    if (!ok && opts.chose && opts.chose !== ch && Data.char(opts.chose)){
      r.confus[opts.chose] = (r.confus[opts.chose] || 0) + 1;
      Store.noteConfusion(ch, opts.chose);
    }

    // a short rolling log: enough for the parent panel to say what happened
    // this week, without keeping every tap since September
    r.log.push({d:day, s:skill, ok:ok ? 1 : 0});
    if (r.log.length > 24) r.log.splice(0, r.log.length - 24);
    Store.noteDay('seen');
    Store.noteDay(ok ? 'right' : 'wrong');
    if (r.exposures === 1) Store.noteDay('fresh');

    if (ok){
      r.correct++; r.streak++;
      // A hinted or second-attempt hit does not earn a full promotion: he
      // retrieved it with help, which is not the same as retrieving it.
      if (!retry && !opts.hinted) r.box = Math.min(BOX_MS.length - 1, r.box + 1);
      r.peakBox = Math.max(r.peakBox || 0, r.box);
      r.nextReview = now + BOX_MS[r.box];
    } else {
      r.incorrect++; r.streak = 0;
      if (!retry && r.mastery >= 2) r.lapses++;   // he knew this one before
      r.box = Math.max(0, r.box - 1);
      r.nextReview = now + 6*MIN;          // returns later this session
    }
    this.recomputeMastery(r);
    Store.save();
    this.cheerFor(ok);   // was unreachable below the return — no praise ever fired
    return r;
  },

  /** counts as "met" without being a graded retrieval (origin cards, dex) */
  expose(ch){
    const r = this.rec(ch, true);
    r.exposures++;
    r.lastSeen = Date.now();
    if (!r.nextReview) r.nextReview = Date.now() + BOX_MS[0];
    Store.save();
    return r;
  },

  /* ---------------------------------------------------------- mastery -- */
  /** Mastery is EARNED, and the currency is first-attempt retrieval.

      Answering correctly on the second tap, or after the answer was replayed,
      proves recognition — not recall. Both still count as practice; neither
      buys a star on its own. On top of that a star needs the character to come
      back in DIFFERENT ways (skills) on DIFFERENT days, because that is what
      separates "remembers it right now" from "has it". */
  recomputeMastery(r){
    const skillsUsed = SKILLS.filter(s => r.skills[s] && r.skills[s].c > 0).length;
    const days = r.days.length;
    const solid = r.firstTry.c;                 // 一次就答对的次数
    const tries = r.firstTry.c + r.firstTry.i;
    const acc = tries ? r.firstTry.c / tries : 0;

    let m = 0;
    if (r.correct >= 1)                                            m = 1;
    if (solid >= 3  && skillsUsed >= 2 && acc >= 0.5)              m = 2;
    if (solid >= 6  && skillsUsed >= 3 && days >= 2 && acc >= 0.65) m = 3;
    if (solid >= 10 && skillsUsed >= 4 && days >= 3 && acc >= 0.75 && r.box >= 4) m = 4;

    const up = m > r.mastery;
    /* Levelling up used to be announced out loud, by name. Removed on
       request — the moment is still there, in the stars on the 字表 and in
       the end-of-lesson tally; it just no longer interrupts to say so.
       Callers still get `up`, so anything that wants to mark it visually
       still can. */
    r.mastery = m;
    return up;
  },

  /** How far a character has slipped since its review came due.

      Without this, mastery only ever climbs: a character last seen in
      September still shows ⭐⭐⭐ in November, and "容易忘记" cannot exist in
      the data at all. Note what this does NOT do — it never lowers the earned
      `r.mastery`. Time dims the stars; one correct retrieval brings them
      straight back. Nothing the child worked for is ever taken away. */
  fade(r){
    if (!r || !r.mastery || !r.nextReview) return 0;
    const over = Date.now() - r.nextReview;
    if (over <= 0) return 0;
    // measured in days at minimum: box 0 is eight minutes, and a character
    // should not look forgotten over a snack break
    const span = Math.max(BOX_MS[r.box] || DAY, DAY);
    return Math.min(2, Math.floor(over / span));
  },

  /** the mastery to SHOW him — earned, minus what time has taken back */
  level(chOrRec){
    const r = typeof chOrRec === 'string' ? Store.data.chars[chOrRec] : chOrRec;
    if (!r) return 0;
    return Math.max(0, r.mastery - this.fade(r));
  },

  stars(ch){ return MASTERY_STARS[this.level(ch)]; },

  /** true when time has dimmed a character he had actually earned */
  faded(ch){ const r = Store.data.chars[ch]; return !!r && this.fade(r) > 0; },

  accuracy(r){ return r.exposures ? r.correct / (r.correct + r.incorrect || 1) : 0; },

  /** skills where this character keeps going wrong */
  weakSkills(r){
    return SKILLS.filter(s => r.skills[s] && r.skills[s].i > r.skills[s].c);
  },

  /* ------------------------------------------------------------ selection -- */
  due(pool){
    const now = Date.now();
    return (pool || this.known())
      .filter(ch => { const r = Store.data.chars[ch]; return r && r.nextReview && r.nextReview <= now; })
      .sort((a,b) => Store.data.chars[a].nextReview - Store.data.chars[b].nextReview);
  },

  dueCount(){ return this.due().length; },

  /** Characters that need help — read four different ways on purpose, because
      "weak" has four different causes and only one of them is visible in the
      accuracy number:
        · 答错得多            — plain low accuracy
        · 一次答对率低        — he gets there, but only on the second tap
        · 曾经会、后来又错了  — a lapse, the most urgent kind
        · 时间太久没见        — faded; he has not been wrong, he has been away */
  weak(pool){
    return (pool || this.known())
      .map(ch => this.rec(ch))       // 走 rec() —— 它会顺手把老记录补齐
      .filter(r => {
        if (!r) return false;
        if (r.mastery >= 4 && this.fade(r) === 0) return false;   // 稳了
        const tries = r.firstTry.c + r.firstTry.i;
        const firstAcc = tries ? r.firstTry.c / tries : 1;
        const wrongOften = r.incorrect > 0 && (r.correct + r.incorrect) >= 2 &&
                           this.accuracy(r) < 0.7 && r.mastery < 3;
        const hesitant  = tries >= 3 && firstAcc < 0.6 && r.mastery < 3;
        const lapsed    = r.lapses > 0 && r.mastery < 4;
        const gone      = this.fade(r) > 0;
        return wrongOften || hesitant || lapsed || gone;
      })
      .sort((a, b) => this.urgency(b) - this.urgency(a))
      .map(r => r.ch);
  },

  /** how loudly a character is asking to be practised (higher = sooner) */
  urgency(r){
    if (!r) return 0;
    const tries = r.firstTry.c + r.firstTry.i;
    const firstAcc = tries ? r.firstTry.c / tries : 1;
    let u = (1 - this.accuracy(r)) * 2 + (1 - firstAcc) * 1.5;
    u += this.fade(r) * 1.2;
    u += Math.min(3, r.lapses) * 0.8;
    u -= r.mastery * 0.35;                      // 已经很牢的排后面
    if (r.nextReview && r.nextReview <= Date.now()) u += 1;
    return u;
  },

  fresh(pool){ return pool.filter(ch => !this.seen(ch)); },

  /**
   * Choose the characters a round should use.
   *  pool  candidate characters (a unit, a world, or everything known)
   *  n     how many
   *  mix   'learn'  new first, then due       (curriculum play)
   *        'review' due + weak only            (boss, weak mode)
   *        'any'    anything already met       (free play)
   */
  pick(pool, n, mix='learn'){
    const out = [];
    const push = arr => arr.forEach(c => { if (out.length < n && !out.includes(c)) out.push(c); });

    const dueP  = this.due(pool);
    const weakP = this.weak(pool);
    const newP  = this.fresh(pool);
    const metP  = pool.filter(c => this.seen(c));

    if (mix === 'review'){
      push(weakP); push(dueP); push(metP);
    } else if (mix === 'any'){
      push(dueP); push(weakP); push(shuffle(metP.slice()));
    } else {
      // learning: a couple of new faces, then whatever is asking to come back
      push(newP.slice(0, Math.max(1, Math.ceil(n/2))));
      push(dueP); push(weakP); push(shuffle(newP.slice()));
    }
    push(shuffle(pool.slice()));                       // last resort
    return out.slice(0, n);
  },

  /** distractors that look or sound close, falling back to the pool */
  distractors(ch, pool, n=3){
    const info = Data.char(ch) || {};
    const near = (info.near || []).filter(c => c !== ch && Data.char(c));
    const rest = shuffle((pool || Data.all()).filter(c => c !== ch && !near.includes(c)));
    return [...near, ...rest].slice(0, n);
  },

  /** everything the summary screen needs about one round */
  snapshot(chars){
    return chars.map(ch => {
      const r = Store.data.chars[ch];
      return {ch, mastery:this.level(r), earned:r ? r.mastery : 0,
              stars:MASTERY_STARS[this.level(r)], faded:this.fade(r) > 0};
    });
  },
};

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const rand = a => a[Math.floor(Math.random() * a.length)];


/* ===== 03b-coach.js ===== */
/* =============================================================================
   COACH — 「接下来练什么」

   Everything here is a QUERY over the memory records; it stores nothing of its
   own. The mini-games keep reporting to Memory exactly as before, and this
   module reads what has piled up and decides where the child should go next.

   That split is the point: adding a new game never means teaching the coach
   about it, and changing how recommendations work never risks a game.
   ========================================================================== */

const Coach = {

  /* ------------------------------------------------------------- queue --- */
  /** The review queue for a scope: characters asking to come back, most
      urgent first. Three sources, deduped —
        due    the schedule says now
        weak   he keeps missing it, whatever the clock says
        faded  he has been away long enough for it to dim
      A character missed twice this morning is weak NOW, not in six minutes
      when its Leitner timer happens to expire. */
  queue(pool, limit){
    const scope = pool && pool.length ? pool : Memory.known();
    const list = [...new Set([...Memory.due(scope), ...Memory.weak(scope)])]
      .filter(c => Data.char(c))
      .sort((a, b) => Memory.urgency(Store.data.chars[b]) -
                      Memory.urgency(Store.data.chars[a]));
    return limit ? list.slice(0, limit) : list;
  },

  /** the same thing for everything he has ever met */
  allDue(limit){ return this.queue(null, limit); },

  /** 课上到哪儿，就复习到哪儿 —— 已经开出来的每一课的字，一个不落。

      跟 weakBook 的区别是刻意的：weakBook 只挑快忘的十来个，那是"抢救"；
      这里是"从头到尾过一遍"，老师第二周讲新课，孩子仍然要把第一周的字
      再见一面。间隔复习管的是别忘，课时复习管的是别漏。

      顺序仍然按紧急度：快忘的排最前面，累的时候先做的那几张最值。
      也把他在别处认过、但还没排进课程的字捎上，免得图鉴里有、复习里没有。 */
  reviewAll(){
    /* 「学过的」= 他自己真的练到过的字，不是"课上讲过的字"。

       一开始我按"已开课文的全部字"来算，结果刚注册、一关没玩的孩子，
       首页就写着「复习学过的 11 个字」—— 那不是复习，是拿没见过的字考他。
       按练过来算，课时一推进他自然就多出几个，"根据课时进度"是自动的。

       顺序按课本，不按认识的先后 —— 孩子翻卡片时看到的是课文里的次序，
       跟他手上的课本对得上。 */
    const met = new Set(Memory.known().filter(c => Data.char(c)));
    const ordered = [];
    this.openUnits().forEach(id =>
      Data.unitChars(id).forEach(c => { if (met.has(c) && ordered.indexOf(c) < 0) ordered.push(c); }));
    // 课本之外认过的字（家长自己加的、别的册子里的）也捎上，排在后面
    met.forEach(c => { if (ordered.indexOf(c) < 0) ordered.push(c); });

    const urgent = this.queue(ordered, 0);               // 已按紧急度排好
    const first = new Set(urgent);
    return [...urgent, ...ordered.filter(c => !first.has(c))];
  },

  /* ------------------------------------------------------------- counts -- */
  /** The four numbers 我的汉字库 and the parent panel both need.
      Buckets are by DISPLAYED mastery, so a faded character correctly shows up
      as needing review rather than as mastered. */
  stats(pool){
    const scope = pool && pool.length ? pool : Memory.known();
    const out = {seen:0, learning:0, mastered:0, review:0};
    scope.forEach(ch => {
      const r = Store.data.chars[ch];
      if (!r) return;
      out.seen++;
      const lv = Memory.level(r);
      if (lv >= 3) out.mastered++;
      else out.learning++;
    });
    out.review = this.queue(scope).length;
    return out;
  },

  /** how a whole lesson is going */
  unitStat(unitId){
    const chars = Data.unitChars(unitId);
    const met = chars.filter(c => Memory.seen(c));
    const st = this.stats(chars);
    return {chars, met:met.length, total:chars.length,
            mastered:st.mastered, review:st.review,
            done: chars.length > 0 && met.length === chars.length,
            started: met.length > 0};
  },

  /* -------------------------------------------------- confusion pairs ---- */
  /** characters this one keeps getting mistaken for */
  confusedWith(ch, min = 1){
    const r = Store.data.chars[ch];
    if (!r || !r.confus) return [];
    return Object.entries(r.confus)
      .filter(([c, n]) => n >= min && Data.char(c))
      .sort((a, b) => b[1] - a[1])
      .map(([c]) => c);
  },

  /** Distractors that are actually confusing FOR THIS CHILD.

      Memory.distractors guesses from a hand-written `near` list. Once he has
      shown us which characters he really mixes up, those are better wrong
      answers than anything an adult predicted — and putting them side by side
      is exactly the practice that separates them. */
  hardDistractors(ch, pool, n = 3){
    const mine = this.confusedWith(ch).filter(c => c !== ch);
    if (!mine.length) return Memory.distractors(ch, pool, n);
    const rest = Memory.distractors(ch, pool, n).filter(c => !mine.includes(c));
    return [...mine, ...rest].slice(0, n);
  },

  /* ------------------------------------------------------ what's next ---- */
  /** The one thing to do now, as data. Screens render it; nothing here knows
      what a button looks like.
      Returns {kind, emoji, title, sub, chars, go} */
  next(){
    const known = Memory.known().length;

    // 1. nothing learned yet — the only sensible move is to start
    const firstOpen = this.firstUnstartedUnit();
    if (!known && firstOpen)
      return {kind:'start', emoji:'🚀', title:'开始第一课',
              sub:Data.unit(firstOpen).name, unitId:firstOpen};

    // 2. review comes before new material, always. Forgetting is what the
    //    schedule exists to catch, and new characters can wait a day.
    const due = this.allDue(8);
    if (due.length >= 3)
      return {kind:'review', emoji:'🧠', title:`${due.length} 个字想你了`,
              sub:'先复习一下，两分钟', chars:due};

    // 3. a lesson already opened but not finished
    const half = this.unfinishedUnit();
    if (half)
      return {kind:'continue', emoji:'⛳', title:'接着上次的冒险',
              sub:`${Data.unit(half).name}　还剩 ${this.unitStat(half).total -
                   this.unitStat(half).met} 个字`, unitId:half};

    // 4. a small pile of review, worth clearing before opening a new lesson
    if (due.length)
      return {kind:'review', emoji:'🧠', title:`${due.length} 个字想你了`,
              sub:'复习完就去新的一课', chars:due};

    // 5. otherwise: the next lesson
    if (firstOpen)
      return {kind:'start', emoji:'🚀', title:'去新的一课',
              sub:Data.unit(firstOpen).name, unitId:firstOpen};

    return {kind:'free', emoji:'🎮', title:'随便玩玩', sub:'从学过的字里出题'};
  },

  /** Characters whose review falls due inside the next `hours`.
      The end-of-session line 「明天有 3 个汉字会回来找你」 is a promise the
      schedule can actually keep, and it turns leaving into an appointment
      rather than an ending. */
  comingBack(hours = 36){
    const now = Date.now(), until = now + hours * 36e5;
    return Memory.known().filter(c => {
      const r = Store.data.chars[c];
      return r && r.nextReview && r.nextReview > now && r.nextReview <= until;
    });
  },

  /** 全课本的薄弱汉字 —— 把每一课里答错过、或者久没见的字收在一起。

      首页那一条固定讲这件事。范围是【所有学过的字】，不分课：忘字不按课
      发生，孩子上周在第一课漏掉的字，这周照样该复习。 */
  weakBook(limit = 12){
    return this.queue(null, limit);
  },

  /** 只要有该复习的字，就给出复习那一条。

      next() 里「接着上次」排在小量复习前面，那是对的 —— 但首页会把指向课本
      的推荐藏起来（下面就是目录，不重复说），复习那一条就跟着一起没了。
      首页需要能单独问一句"有没有要复习的"。 */
  reviewStep(){
    const due = this.allDue(8);
    if (!due.length) return null;
    return {kind:'review', emoji:'🧠', title:`${due.length} 个字想你了`,
            sub:due.length >= 3 ? '先复习一下，两分钟' : '复习完就去新的一课',
            chars:due};
  },

  /** The lesson to carry on with: started, not finished, and the one he was
      LAST actually working in.

      Curriculum order is the wrong tie-breaker here. Characters are shared
      between books — 马 appears in 姓氏歌 as well as in 仓颉造字 — so the
      first-in-order lesson containing a character he has met can easily be a
      lesson he has never opened, in a different book. Recency is what he
      means by 「接着上次」. */
  unfinishedUnit(){
    let best = null, bestAt = -1;
    this.openUnits().forEach(id => {
      const st = this.unitStat(id);
      if (!st.started || st.done) return;
      const at = st.chars.reduce((m, c) => {
        const r = Store.data.chars[c];
        return r && r.lastSeen > m ? r.lastSeen : m;
      }, 0);
      if (at > bestAt){ bestAt = at; best = id; }
    });
    return best;
  },

  firstUnstartedUnit(){
    return this.openUnits().find(id => !this.unitStat(id).started) || null;
  },

  /** every playable lesson, in teaching order */
  openUnits(){
    const out = [];
    Data.worlds().filter(w => w.open).forEach(w =>
      (w.units || []).forEach(id => {
        const u = Data.unit(id);
        if (u && !u.soon && !Data.isLocked(id) && (u.chars || []).length) out.push(id);
      }));
    return out;
  },
};


/* ===== 04-audio.js ===== */
/* =============================================================================
   AUDIO — Mandarin speech + arcade sounds.

   Speech goes through the browser synthesiser. Three things bite here and all
   three are handled below, because when this silently fails the whole game
   loses its voice:

   1. Chrome swallows an utterance queued in the same tick as cancel() — but
      deferring EVERY call with setTimeout breaks the user-activation chain and
      Chrome then rejects with `not-allowed`, which is worse: even tapping the
      speaker goes silent. So the call is synchronous unless something is
      actually mid-utterance and has to be cancelled first.
   2. getVoices() is empty until the engine warms up, so the voice is re-picked
      on voiceschanged AND lazily on every call.
   3. Chrome stops synthesising after ~15s unless resume() is poked.

   Failures are recorded on Say.log instead of being swallowed — the parent
   panel has a 语音自检 button that prints it.

   Every character record also has an `audioUrl` slot: drop real recordings in
   and Say.char() prefers them with no other change.
   ========================================================================== */

const AUDIO_URLS = {};        // ch -> url, filled in by the parent panel later

/* 烤进文件里的朗读。key 是 Say.speak 收到的原文，值是 data: 音频。

   为什么要有这个：Chrome 的朗读服务会在一个进程里整个死掉 —— speaking 变
   true，然后 onstart、onend、onerror 一个都不来。页面这边无论怎么重试、换
   语音、cancel 重开都救不回来（实测：同一台机器、同一时刻，新开的 Chrome
   一切正常，那个卡住的进程连英文都念不出来）。孩子那边看到的就是"没有声音"。

   所以能提前烤的句子一律不问浏览器要合成。生成：
       python3 tools/voicepack.py mz2
   没烤到的（家长后加的字、临时拼的句子）仍然走 speechSynthesis 兜底。 */
const VOICE_PACK = {};
/* 声音是拆开按需加载的（网站版一课一个小文件），还是整包内联在这个文件里
   （单文件版）。打包脚本出网站版时把它置成 true。 */
let VOICE_PACK_SPLIT = true;
/* 哪个声音烤的。没烤到的句子仍然走浏览器合成，挑同一个声音，
   否则同一关里两种音色来回换，比机械更出戏。 */
let VOICE_PACK_NAME = '';
let VOICE_PACK_SIG = '';   // 声音+风格，烘焙工具用它判断能不能沿用上一版

const Say = {
  voice: null, muted: false, log: [], spoke: 0, failed: 0, lastError: '',
  _timer: 0, _keepalive: 0,

  supported(){ return typeof window !== 'undefined' && 'speechSynthesis' in window; },

  note(m){ this.log.push(m); if (this.log.length > 40) this.log.shift(); },

  voices(){
    try{ return window.speechSynthesis.getVoices() || []; }catch(e){ return []; }
  },

  /* macOS ships a set of playful voices (Eddy, Flo, Grandma, Rocko …) in every
     language. In Mandarin they carry a distinct accent — fine for jokes, wrong
     for teaching a 7-year-old how a character is pronounced. Tingting is the
     plain, correct Mandarin voice, so it leads; the playful ones go last and
     are only reached if nothing else exists. */
  PLAYFUL: /Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Bells|Bubbles|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Albert|Bahh|Boing|Cellos/i,

  /** Preferred reading voices, best first.

      彬彬 is one of the neural voices macOS downloads on request; it is a
      generation ahead of 婷婷, which ships built in and is the compressed
      voice that sounded mechanical. Kept as an explicit list so changing the
      house voice is one line, not a rewrite of the ranking function. */
  PREFER: ['Binbin', '彬彬', 'Tingting', '婷婷', 'Google 普通话'],

  /** Chinese voices, clearest pronunciation first. */
  candidates(){
    const vs = this.voices();
    const chosen = vs.filter(v => v.name === Store.data.voiceName);   // 家长指定
    // 和内置录音同一个声音优先 —— 两种音色交替出现比单调更刺耳
    const baked = VOICE_PACK_NAME
      ? vs.filter(v => v.name.indexOf(VOICE_PACK_NAME) >= 0) : [];
    const cn  = vs.filter(v => /zh[-_]?(CN|Hans)/i.test(v.lang));
    const good = cn.filter(v => !this.PLAYFUL.test(v.name));
    const rank = v => {
      const k = this.PREFER.findIndex(n => v.name.indexOf(n) >= 0);
      return k >= 0 ? k : this.PREFER.length;
    };
    good.sort((a, b) => rank(a) - rank(b));
    const playful = cn.filter(v => this.PLAYFUL.test(v.name));
    const other   = vs.filter(v => /^zh/i.test(v.lang) && cn.indexOf(v) < 0);
    return chosen.concat(baked, good, other, playful)
                 .filter((v, i, a) => a.indexOf(v) === i);
  },

  pick(){ return this.candidates()[0] || null; },

  /** which candidate pump() is currently using; bumped when one goes quiet */
  vIndex: 0,

  init(){
    if (!this.supported()){ this.note('这个浏览器没有 speechSynthesis'); return; }
    const refresh = () => {
      const v = this.pick();
      if (v && v !== this.voice){ this.voice = v; this.note('找到中文语音：' + v.name + ' (' + v.lang + ')'); }
    };
    refresh();
    this.watchVisibility();
    try{ window.speechSynthesis.onvoiceschanged = refresh; }catch(e){}
    // voices can arrive late; poll briefly rather than give up
    let tries = 0;
    const t = setInterval(() => { refresh(); if (this.voice || ++tries > 20) clearInterval(t); }, 250);
  },

  /* ---- one queue, one utterance at a time ------------------------------

     Two rules, both learned from a real log of 23 calls that produced 22
     `canceled` errors and not one `onstart`:

     * cancel() on an idle engine wedges Chrome on macOS. Afterwards every
       utterance queues and none ever starts, so nothing is heard at all.
       Only cancel when something is genuinely speaking.
     * The game asks a question and reacts to the answer far faster than a
       sentence takes to say. Firing each one immediately means every line
       kills the one before it. So they wait their turn here; a new question
       clears the backlog rather than killing the engine.
     -------------------------------------------------------------------- */
  q: [], busy: false,

  speak(text, {rate = 0.8, pitch = 1.15, interrupt = false} = {}){
    if (this.muted || !this.supported() || !text) return;
    const synth = window.speechSynthesis;
    if (interrupt){
      this.q.length = 0;
      this.stopClip();
      if (synth.speaking || synth.pending){       // never on an idle engine
        try{ synth.cancel(); }catch(e){}
        this.busy = false;
      }
    }
    this.q.push({text:String(text), rate, pitch, tries:0});
    if (this.q.length > 2) this.q.splice(0, this.q.length - 2);   // no backlog
    this.pump();
  },

  /** True while an utterance is in flight, plus WHEN it started — without
      the timestamp there is no way to tell "speaking" from "stuck". */
  _busySince: 0,

  /** Chrome stops synthesising after roughly 15 seconds unless resume() is
      poked. This was described at the top of this file and then never
      written, which is why a long line — a whole story paragraph — could
      freeze the engine mid-sentence. */
  keepAlive(){
    clearInterval(this._keepalive);
    this._keepalive = setInterval(() => {
      try{
        const s = window.speechSynthesis;
        if (!this.busy){ this.stopKeepAlive(); return; }
        if (s.paused) s.resume();
        else if (s.speaking) s.resume();   // no-op when healthy, unfreezes when not
      }catch(e){}
    }, 6000);
  },
  stopKeepAlive(){ clearInterval(this._keepalive); this._keepalive = 0; },

  /** Put the engine back to a known-good state. Everything that can wedge is
      cleared here, so any recovery path is one call. */
  hardReset(why){
    if (why) this.note('重启朗读引擎：' + why);
    this.stopKeepAlive();
    this.stopClip();
    try{
      const s = window.speechSynthesis;
      s.cancel();
      if (s.paused) s.resume();
    }catch(e){}
    this.busy = false; this._busySince = 0; this._u = null;
  },

  /** roughly how long a line takes, so an utterance that never ends can be
      told apart from one that is simply long */
  budgetFor(text, rate){
    const chars = String(text).length;
    return Math.min(60000, Math.max(6000, (chars / (4.2 * (rate || 1))) * 1000 + 4000));
  },

  pump(){
    if (this.muted || !this.q.length) return;
    if (this.busy){
      /* The one failure that silences the game for good: onend never fires,
         busy stays true, and every later call returns right here. Anything
         still "speaking" a minute later is not speaking. */
      if (!this._busySince || Date.now() - this._busySince < 60000) return;
      this.hardReset('上一句超过 60 秒没有结束');
    }
    const synth = window.speechSynthesis;
    const job = this.q.shift();
    /* Number every attempt. The watchdogs used to live in one shared slot on
       Say, so a late callback from the PREVIOUS line cleared the CURRENT
       line's watchdog — and that line then hung forever with nothing left to
       rescue it. Timers are now local, and anything arriving from an older
       attempt is ignored outright. */
    /* Deliberately NOT guarded by an attempt id: that guard made a watchdog
       return silently once another pump had moved on, which left `busy` true
       with nothing scheduled to clear it — the exact freeze both watchdogs
       exist to prevent. The timers are locals now, one pair per attempt, and
       `settled` alone is enough because a finished attempt's handlers are
       already inert. */
    let watch = 0, endT = 0;
    this.busy = true;
    this._busySince = Date.now();
    let started = false;
    /* Per ATTEMPT, not per job. A retried line is the same job object, so a
       flag stored on it arrives already set and the retry's onend becomes a
       no-op — which leaves `busy` true forever and silences everything after
       it. A local is scoped to exactly one attempt, which is what this means. */
    let settled = false;

    const done = () => {
      if (settled) return;              // onend and the watchdog can both fire
      settled = true;
      clearTimeout(watch); clearTimeout(endT);
      this.stopKeepAlive();
      this.busy = false; this._busySince = 0;
      setTimeout(() => this.pump(), 60);
    };

    // A baked clip needs no synthesiser, no voice, and cannot be wedged.
    if (this.playClip(job, done)) return;

    try{
      // re-resolve each time: a voice cached from an earlier getVoices() can
      // go stale and Chrome then refuses the utterance
      const cands = this.candidates();
      // An utterance that never starts means this voice is producing nothing,
      // so step to the next candidate — but never past the plain-Mandarin
      // ones. The playful voices (Eddy, Rocko, Grandpa…) carry an accent that
      // is wrong for teaching, and drifting onto one is worse than silence.
      const plain = cands.filter(x => !this.PLAYFUL.test(x.name));
      const usable = Store.data.voiceName ? cands.slice(0, 1)
                   : (plain.length ? plain : cands);
      const v = usable[Math.min(this.vIndex, usable.length - 1)] || this.voice;
      this.voice = v;
      const u = new SpeechSynthesisUtterance(this.forSpeech(job.text));
      u.lang = (v && v.lang) || 'zh-CN';
      u.rate = job.rate; u.pitch = job.pitch; u.volume = 1;
      if (v) u.voice = v;
      /* Hold a hard reference. An utterance collected while still speaking
         takes its events with it — Chrome then never fires onend and the
         queue stalls behind it. */
      this._u = u;
      u.onstart = () => {
        started = true; this.spoke++; this.wedged = false;
        this.vIndex = 0;                     // recovered: back to the best voice
        this.keepAlive();
        /* A second watchdog, for the half that was never guarded: the line
           started and then stopped existing. Without this, one frozen
           utterance silences every question for the rest of the session. */
        clearTimeout(endT);
        endT = setTimeout(() => {
          if (settled) return;
          this.note('「' + job.text + '」念到一半就没声了，重启引擎');
          this.hardReset();
          done();
        }, this.budgetFor(job.text, job.rate));
      };
      u.onend   = done;
      u.onerror = e => {
        const kind = (e && e.error) || 'unknown';
        // `canceled`/`interrupted` mean a newer question replaced this line.
        // That is the queue working, not a failure.
        if (kind !== 'canceled' && kind !== 'interrupted'){
          this.failed++;
          this.lastError = kind;
          this.note('朗读失败：' + kind + '　「' + job.text + '」');
          if (kind === 'not-allowed') this._blocked = true;
        }
        done();
      };
      if (synth.paused){ try{ synth.resume(); }catch(e){} }
      synth.speak(u);
    }catch(err){
      this.failed++; this.lastError = err.message;
      this.note('speak() 抛错：' + err.message);
      return done();
    }

    // Trust `onstart`, never `synth.speaking`. A wedged Chrome reports
    // speaking=true while the OS produces no audio and no event ever fires;
    // believing it leaves `busy` stuck and silences the queue for good.
    watch = setTimeout(() => {
      if (settled || started) return;
      if (job.tries < 3){
        job.tries++;
        if (job.tries === 3){
          // both voices stayed silent — the engine itself is stuck, not the
          // voice. Restart it and give the best voice one more go.
          this.hardReset('换过语音仍然没有发声');
          this.vIndex = 0;
        } else {
          try{ synth.cancel(); synth.resume(); }catch(e){}
          this.vIndex++;                              // try the next voice
          this.note('「' + job.text + '」没启动，换第 ' + (this.vIndex + 1) + ' 个语音');
        }
        this.q.unshift(job);
      } else {
        try{ synth.cancel(); synth.resume(); }catch(e){}
        this.wedged = true;
        this.note('换了几个语音、重启过引擎都没发声 —— 浏览器的朗读服务卡死了');
        this.wedgedHint();
      }
      done();
    }, 1400);
  },

  /** Play the pre-baked recording of this line, if there is one.

      Baked at a teaching pace; the tone knobs the rest of the game asks for
      become playbackRate, so 汉字 still comes out slower than 表扬 does. */
  playClip(job, done){
    const src = VOICE_PACK[job.text];
    if (!src) return false;
    try{
      const a = new Audio(src);
      this._audio = a;
      /* One voice, one pace. The clips are baked plain, so stretching them at
         playback would be the only thing making one line sound unlike the
         next — which is exactly the complaint this is fixing. */
      a.playbackRate = 1;
      /* Same trap as the synthesiser: a clip that neither ends nor errors
         would hold the queue shut behind it. Nothing after it would ever be
         read out. Give it a ceiling too. */
      const cap = setTimeout(() => {
        this.note('内置录音没有结束，放行队列：' + job.text);
        this.stopClip(); done();
      }, this.budgetFor(job.text, job.rate));
      const fin = () => { clearTimeout(cap); done(); };
      a.onplaying = () => { this.spoke++; this.wedged = false; };
      a.onended   = fin;
      a.onerror   = () => { this.note('内置录音播放失败：' + job.text); fin(); };
      const pr = a.play();
      if (pr && pr.catch) pr.catch(err => {
        // no gesture yet — the next real tap replays it, same as for TTS
        this._blocked = true;
        this.note('内置录音被拦：' + (err && err.name || err));
        fin();
      });
      return true;
    }catch(e){ this.note('内置录音出错：' + e.message); return false; }
  },

  /** stop whatever clip is playing (an interrupt, or leaving the screen) */
  stopClip(){
    if (!this._audio) return;
    try{ this._audio.pause(); this._audio.src = ''; }catch(e){}
    this._audio = null;
  },

  /** Run `cb` once the queue has drained.

      Rounds used to advance on a fixed timer, so a long line ("清，三点水加
      青，和水有关") was still being read when the next character appeared and
      cut it off. Anything that both speaks and then moves on should wait here
      instead of guessing a duration. Falls through after `max` so a wedged or
      muted engine can never strand the game. */
  afterSpeech(cb, max = 5000, min = 350){
    const t0 = Date.now();
    const tick = () => {
      const idle = !this.busy && !this.q.length;
      const waited = Date.now() - t0;
      if ((idle && waited >= min) || waited > max) return cb();
      setTimeout(tick, 110);
    };
    setTimeout(tick, min);
  },

  /** Chrome's speech service can wedge for the life of the process: it keeps
      answering speaking=true while producing nothing. No amount of retrying
      inside the page fixes it — only relaunching the browser does. Say so
      plainly instead of letting the game look broken. */
  wedgedHint(){
    if (this._wedgeShown) return;
    this._wedgeShown = true;
    try{
      UI.toast({emoji:'🔄', text:'朗读卡了一下，已经重启',
                sub:'再点一次小喇叭；如果还是没声音，退出浏览器（⌘Q）再打开', ms:5000});
    }catch(e){}
  },

  /** The question on screen right now — what the 🔊 button repeats and what
      gets replayed if the browser blocked the first attempt. */
  current: '',

  /** read the question out when its page appears */
  announce(text, delay = 300){
    if (!text) return;
    this.current = text;
    clearTimeout(this._ann);
    // a long line is a story; a short one is a question. They want different
    // voices, and picking by length keeps every call site out of it.
    this._ann = setTimeout(() => {
      const t = text.length > 18 ? this.TONE.story : this.TONE.question;
      this.speak(text, {rate:t.rate, pitch:t.pitch, interrupt:true});
    }, delay);
  },

  /** A tab that goes to the background gets its speech suspended, and it
      often comes back reporting speaking=true with nothing playing. Clear it
      on the way back in rather than waiting for a child to notice. */
  watchVisibility(){
    if (typeof document === 'undefined') return;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      if (this.busy && this._busySince && Date.now() - this._busySince > 3000)
        this.hardReset('从后台切回来');
    });
  },

  /** Speech needs a user gesture. Rather than burn a silent utterance on the
      first tap, we simply retry the blocked question on the next real one — so
      the child hears the question instead of a mystery blip. */
  armOnGesture(){
    if (!this.supported()) return;
    window.addEventListener('pointerdown', () => {
      if (!this._blocked || !this.current) return;
      this._blocked = false;
      this.speak(this.current, {rate:0.85, interrupt:true});   // sync: keeps the gesture
    }, true);
  },


  /* ---- 语气 -----------------------------------------------------------

     Web Speech gives three knobs and no prosody control: rate, pitch, volume.
     There is no SSML worth relying on, so "with feeling" can only mean using
     those three differently depending on what is being said — a question lifted
     and quick, a story slowed down, praise bright and fast, comfort low and
     unhurried. It is a small trick but a child hears the difference at once,
     and the flat one-setting-for-everything readout was the mechanical part. */
  TONE: {
    question: {rate:0.78, pitch:1.20},
    line:     {rate:0.82, pitch:1.12},
    story:    {rate:0.64, pitch:1.06},
    char:     {rate:0.58, pitch:1.14},
    cheer:    {rate:0.98, pitch:1.45},
    comfort:  {rate:0.72, pitch:1.02},
  },

  /* ---- 鼓励 -----------------------------------------------------------

     Said out loud, not just shown, and deliberately rationed: a voice that
     praises every single tap stops meaning anything within a minute. Cheers
     fire on a streak or on a stumble after a good run, at most once every
     dozen seconds, and never the same sentence twice running. */
  CHEER: {
    streak: ['哇，连对三个啦！', '太厉害了！', '你今天状态真好！',
             '这几个字都难不倒你！', '越来越顺啦！'],
    praise: ['对啦！', '真棒！', '就是它！', '答得好！'],
    comfort:['没关系，再来一次。', '差一点点，不着急。',
             '这个有点难，我们再看看。', '不要紧，你已经很厉害了。'],
    start:  ['我们开始吧！', '今天也来玩一会儿。', '准备好了吗？出发！'],
    /* 「明天再来」「收工啦」was written for the end of a whole session, but
       this fires after a single three-minute drill too — telling a child to
       come back tomorrow when he is about to tap the next game is nonsense.
       These work either way. */
    finish: ['今天棒极啦！', '你又变强了！', '这一关，漂亮！'],
  },
  _lastCheer: {}, _cheerAt: 0,

  /** speak one encouragement, or stay quiet if it would be too soon */
  cheer(kind, force){
    const lines = this.CHEER[kind];
    if (!lines || this.muted) return;
    const now = Date.now();
    if (!force && now - this._cheerAt < 12000) return;
    this._cheerAt = now;
    let line = rand(lines);
    for (let k = 0; k < 4 && line === this._lastCheer[kind]; k++) line = rand(lines);
    this._lastCheer[kind] = line;
    const t = kind === 'comfort' ? this.TONE.comfort : this.TONE.cheer;
    this.speak(line, {rate:t.rate, pitch:t.pitch});   // queues, never interrupts
  },

  /** Drop anything queued and shut the engine up. Leaving a screen used to
      leave its last question still being read over the next one. */
  stop(){
    this.q.length = 0;
    this.busy = false;
    this.stopClip();
    clearTimeout(this._ann);
    try{ if (this.supported()) window.speechSynthesis.cancel(); }catch(e){}
  },

  /** an encouragement written on the spot, still rationed like the rest */
  cheerText(text, force){
    if (this.muted) return;
    const now = Date.now();
    if (!force && now - this._cheerAt < 12000) return;
    this._cheerAt = now;
    this.speak(text, this.TONE.cheer);
  },

  /* ---- 多音字 --------------------------------------------------------

     The engine picks the commonest reading and gets the rarer sense wrong:
     「长出」 wants zhǎng but Tingting says cháng. Nothing can be done about
     that from the page — Web Speech has no reliable way to force a reading.

     So the text on screen stays exactly as written, and only the copy handed
     to the synthesiser is patched: the offending character is swapped for one
     that SOUNDS the same and has only one reading (长 -> 掌, both zhǎng). The
     child hears the right syllable and never sees the substitution.

     Add a rule when you hear a wrong reading — and only then. Guessing at
     which words an engine will fumble produces worse output, not better. */
  homophones(t){
    // 长: zhǎng in these, but cháng in 长长/又长, so leave a doubled 长 alone
    t = t.replace(/长(出|大|高|满|在|得|成)/g, (m, tail, idx, str) =>
      (idx > 0 && str[idx - 1] === '长') ? m : '掌' + tail);
    /* 把: bǎ as a door handle, but the engine reads 门把 with the rarer bà,
       and a child taught 门把 as ménbà learns the wrong word. 靶 is bǎ and
       has no second reading.

       Only where it is actually read wrong. A blanket 把→靶 would also catch
       the preposition (我们把苹果分成两半), which the engine already reads
       correctly as a light bǎ — replacing it there would put a full stress on
       a word that should not carry one. Same policy as 长 above: a rule per
       wrong reading heard, not per character. */
    t = t.replace(/门把/g, '门靶')      // 门把、门把手
         .replace(/把手/g, '靶手')      // 把手
         .replace(/的把/g, '的靶');     // 「门把的把」 —— Say.inWord 造出来的

    /* 和: hé。引擎在「扌和丁合起来是打」这类句子里读成 huò —— 那是"和面"
       的读法，孩子跟着念就学错了。河 只有 hé 一个读音。

       这一条是全局替换，和上面 把 的定点规则不同：这套教材里 和 处处都是
       连词（女和马、太阳和月亮、小公鸡和小鸭子、扁担和大家），没有一处
       读 huó 或 hè。将来若真教到「和面」「附和」，这里要像 长 那样加上下文
       条件。 */
    t = t.replace(/和/g, '河');

    /* 教: jiāo（教人）。引擎在「儿子教爸爸」里读成 jiào —— 那是「教师、
       教室」的读法。交 只有 jiāo 一个音，声音一模一样。

       用否定式而不是全局替换：教 读 jiào 的场合全是固定词（教师 教室 教育
       教学 教练 教材 教授 教会 教堂 教科书），把这些挡在外面，其余一律按
       「教人」处理 —— 这套教材里的 教 都是这个意思。 */
    t = t.replace(/教(?!师|室|育|学|练|材|授|会|堂|科|徒|派|训)/g, '交');

    /* 传: chuán（传下来）。引擎把「一代又一代传了下来」读成 zhuàn —— 那是
       「传记、自传」的读法。船 只有 chuán 一个音。 */
    t = t.replace(/传(?!记)/g, '船');

    /* 什: shén（什么）。单独念这个字时引擎读成 shí —— 那是「什锦、家什」
       的读法，孩子跟着念就把「什么」的什记成 shí 了。神 只有 shén 一个音。

       只替换【后面不是「么」】的那些：「什么」这个词引擎本来就读对，替成
       「神么」反而把词读坏了。所以挨着「么」的放过，落单的（「什么的什」
       「只敲什么的什」「哪个是什么的什？」）才换。 */
    t = t.replace(/什(?!么)/g, '神');
    return t;
  },

  /** what actually gets handed to the synthesiser */
  forSpeech(text){ return this.homophones(String(text)); },

  /** 「粮食的粮」

      A character read out on its own is ambiguous — 粮 liáng sounds exactly
      like 良、凉、梁 and a child has no way to tell which one is meant. Naming
      it inside a word he already knows removes the guess without giving away
      the shape, which is what the question is testing. Falls back to the bare
      character when no multi-character word is on file. */
  inWord(ch){
    const info = (typeof Data !== 'undefined') && Data.char(ch);
    const w = info && (info.words || []).find(x => x.length > 1 && x.indexOf(ch) >= 0);
    return w ? `${w}的${ch}` : String(ch);
  },

  char(ch){
    const url = AUDIO_URLS[ch] || (Data.char(ch) && Data.char(ch).audioUrl);
    if (url){ try{ new Audio(url).play(); return; }catch(e){} }
    this.speak(this.inWord(ch), this.TONE.char);
  },
  word(w){ this.speak(w, {rate:0.74, pitch:1.10}); },
  line(t){ this.speak(t, this.TONE.line); },

  /** speak, and if nothing comes out say why — used by the 🔊 button so a
      silent failure reports itself instead of looking like a dead control */
  probe(text, rate){
    /* Tapping the speaker is what a child does WHEN it has gone quiet, so
       make that tap the recovery: clear a stalled engine first, then speak. */
    if (this.busy && this._busySince && Date.now() - this._busySince > 4000)
      this.hardReset('点小喇叭时上一句还卡着');
    const before = this.spoke, errBefore = this.failed;
    this.speak(text, {rate: rate || 0.85, interrupt:true});   // 点喇叭 = 现在就念
    clearTimeout(this._probe);
    this._probe = setTimeout(() => {
      if (this.spoke > before) return;                       // it spoke, all good
      const why = this.wedged ? '浏览器朗读服务卡死 —— 完全退出浏览器（⌘Q）再打开'
                : (this.failed > errBefore && this.lastError)
                || (this.voices().length ? 'no-start（浏览器没启动朗读）' : 'no-voices（系统里没有语音）');
      this.note('喇叭没出声：' + why);
      try{
        UI.toast({emoji:'🔇', text:'朗读没出声', sub:'原因：' + why + '　→ ⚙️ 语音自检', ms:3200});
      }catch(e){}
    }, 900);
  },

  /** how many lines are baked into this build */
  packSize(){ return Object.keys(VOICE_PACK).length; },

  /* ---------------------------------------------------- 按需加载的声音 ----

     整包十兆，孩子第一次打开要等十几秒，而他这节课只用得到其中一课。网站
     版把声音拆成一课一个小文件，点进哪一课才下哪一课；首屏只下骨架和通用
     语（半兆多）。

     用 <script> 标签装，不用 fetch —— 教室里那份是双击本地文件打开的
     （file://），fetch 会被同源策略挡掉，而 script 标签不会。这一条是
     "教室没网也要能玩"那个要求逼出来的。

     单文件版没有 voice/ 这个目录：声音本来就内联在文件里，loadPack 会立刻
     认定"已经有了"，一次网络请求都不发。 */
  packs: {},                      // name -> 'loading' | 'ready' | 'missing'
  packBase: 'voice/',

  /** 这一包已经装好了（拆出来的小文件末尾会调它） */
  packDone(name){ this.packs[name] = 'ready'; },

  /** 装一包声音。已经装过、或者压根没有拆包，都立刻返回。 */
  loadPack(name){
    if (!name) return Promise.resolve();
    const st = this.packs[name];
    if (st === 'ready' || st === 'missing') return Promise.resolve();
    if (st && st.then) return st;                     // 正在装，等同一个
    /* 单文件版：声音已经内联，没有 voice/ 目录，别去请求它 */
    if (!VOICE_PACK_SPLIT){ this.packs[name] = 'ready'; return Promise.resolve(); }

    const p = new Promise(done => {
      const s = document.createElement('script');
      s.src = this.packBase + encodeURIComponent(name) + '.js';
      s.async = true;
      s.onload  = () => { this.packs[name] = 'ready'; done(); };
      /* 装不上不能把游戏卡死：记一笔，走浏览器朗读。孩子那边顶多是这一课
         换了个声音，而不是整页点不动。 */
      s.onerror = () => { this.packs[name] = 'missing';
                          this.note('这一课的声音没装上：' + name); done(); };
      document.head.appendChild(s);
    });
    this.packs[name] = p;
    return p;
  },

  /** 这一课要用的声音都装上（通用语 + 这一课） */
  loadFor(unitId){
    return Promise.all([this.loadPack('common'), this.loadPack(unitId)]);
  },

  /** 闲下来的时候，把这一版教到的其它课也悄悄装上 —— 孩子翻到哪儿都有声。
      不教的课（比如"这学期从第六课起"里的前五课）一个字节都不下。 */
  warmRest(){
    if (!VOICE_PACK_SPLIT || this._warmed) return;
    this._warmed = true;
    const ids = (typeof Coach !== 'undefined' ? Coach.openUnits() : []);
    let i = 0;
    const next = () => {
      if (i >= ids.length) return;
      this.loadPack(ids[i++]).then(() => setTimeout(next, 400));
    };
    setTimeout(next, 3000);
  },


  hasChinese(){
    if (this.packSize()) return true;          // 内置录音，不靠系统语音
    if (!this.voice) this.voice = this.pick();
    return !!this.voice;
  },

  /** run a real utterance and report what actually happened */
  selfTest(onResult){
    const out = [];
    const push = m => { out.push(m); onResult(out.join('\n')); };
    push('浏览器支持 speechSynthesis：' + (this.supported() ? '是' : '否 ❌'));
    if (!this.supported()) return;
    const vs = this.voices();
    push('系统语音总数：' + vs.length + (vs.length ? '' : '  ❌ 一个都没有'));
    const zh = vs.filter(v => /^zh/i.test(v.lang));
    push('中文语音：' + (zh.length ? zh.map(v => v.name + '(' + v.lang + ')').join('、') : '没有 ❌'));
    push('当前选用：' + (this.voice ? this.voice.name : '无'));
    push('页面协议：' + location.protocol);
    push('');
    push('正在试着念「水」…');

    // synchronous on purpose: deferring loses the tap's user activation and
    // the test would report `not-allowed` no matter how healthy speech is
    try{
      const u = new SpeechSynthesisUtterance('水');
      u.lang = (this.voice && this.voice.lang) || 'zh-CN';
      if (this.voice) u.voice = this.voice;
      let started = false;
      u.onstart = () => { started = true; push('✅ 开始发声了（onstart）'); };
      u.onend   = () => push(started ? '✅ 念完了 —— 语音是好的' : '⚠️ 直接结束，没有发声');
      u.onerror = e => push('❌ 出错：' + ((e && e.error) || 'unknown'));
      window.speechSynthesis.speak(u);
      push('已交给浏览器，等待中…（speaking=' + window.speechSynthesis.speaking +
           ' pending=' + window.speechSynthesis.pending + '）');
      setTimeout(() => { if (!started) push('❌ 3 秒内没有发声'); }, 3000);
    }catch(e){ push('❌ 抛错：' + e.message); }
  },
};

/* ------------------------------------------------------------------- SFX -- */
const Sfx = {
  ctx: null, muted: false,

  ac(){
    if (!this.ctx){
      const C = window.AudioContext || window.webkitAudioContext;
      if (C) this.ctx = new C();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },

  tone(freq, dur=0.12, type='sine', gain=0.16, delay=0){
    const ac = this.ac(); if (!ac || this.muted) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },

  good(){ [523,659,784].forEach((f,i)=>this.tone(f,0.16,'sine',0.15,i*0.06)); },
  great(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,0.2,'triangle',0.15,i*0.07)); },
  soft(){ this.tone(320,0.16,'sine',0.10); this.tone(262,0.2,'sine',0.09,0.09); },
  tap(){ this.tone(660,0.06,'square',0.06); },
  pop(){ this.tone(880,0.08,'triangle',0.12); this.tone(1320,0.06,'triangle',0.08,0.05); },
  whoosh(){ this.tone(180,0.22,'sawtooth',0.05); },
  boom(){ this.tone(90,0.35,'sawtooth',0.16); this.tone(140,0.25,'square',0.10,0.02); },
  fanfare(){
    [523,587,659,784,1047].forEach((f,i)=>this.tone(f,0.26,'triangle',0.16,i*0.11));
  },
};

/* =============================================================================
   UI KIT — DOM helpers, the Eric sprite, world scenery, feedback effects.
   Every screen is built from these; no screen writes raw innerHTML for layout.
   ========================================================================== */

const $ = sel => document.querySelector(sel);
const APP = () => document.getElementById('app');
const FX  = () => document.getElementById('fx');

function el(tag, props = {}, ...kids){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'style') n.setAttribute('style', v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) n.append(c.nodeType ? c : String(c)); });
  return n;
}

const UI = {
  stack: [],

  /** replace the whole stage */
  mount(node){
    // Whatever was on screen is gone, so whatever it was running should be
    // gone too. Games start their loop AFTER mounting, so the incoming one
    // survives this.
    Loop.stopAll();
    /* Speech is deliberately NOT cancelled here. Several games build their
       question with UI.ask() — which announces it — and only mount the screen
       twenty lines later; cancelling on mount silently swallowed the very
       announcement the child was waiting for. Stopping the loop is what
       actually ends a game left running in the background. */
    const app = APP();
    app.innerHTML = '';
    app.append(node);
    return node;
  },

  /** a full screen: coloured sky + optional top bar */
  screen({sky='sky-day', title='', onBack=null, scenery=true, pal=false} = {}){
    // A dark sky used to swallow the title and the hints: dark text on a dark
    // ground, three screens in a row. Mark the screen instead of patching each
    // one, so any future dark background gets light text for free.
    const dark = /night|planet|space/.test(sky);
    const s = el('div', {class:'screen' + (dark ? ' on-dark' : '')});
    s.append(el('div', {class:'sky ' + sky}));
    if (scenery) s.append(this.scenery(sky));
    /* 答题关卡中间大片是空的，只有几个方块浮着 —— 像张表单，不像在冒险。
       让他站在角落里陪着。

       显式开关，不跟着 scenery 走：列表页（首页、课页）也有布景，但那里
       内容是铺满的，他会压在课文行上；而且首页本来就有一个大的他，会变成
       两个人。所以由每一关自己说要不要。 */
    if (pal){
      const buddy = el('div', {class:'pal'});
      buddy.append(this.hero(96));
      s.append(buddy);

        <ellipse cx="230" cy="165" rx="150" ry="80" fill="${p[1]}"/>

  /* ------------------------------------------------------------- sprite --- */
  /** Eric, matching the family's poster: bowl cut, red hoodie, red cape */
  /* 两个英雄：男孩和女孩。同一套骨架 —— 一样的披风、罩衫、身形和表情，
     只换头发和配色，所以站在一起看得出是同一伙人，不是两套画风。

     渐变的 id 必须每个实例都不一样：选性别那一页两个形象同屏，id 撞了的话
     后画的会套用前一个的颜色。 */
  _heroN: 0,

  /** 这个孩子选的是哪个形象 */
  heroKind(){

  hero(size = 96, opts = {}){

       块布的背光面，只改罩衫会让两件衣服看起来不是一套。头发不动。 */
    const C = kind === 'girl'
      ? {hair1:'#3a2140', hair2:'#241328', tunic1:'#f47ba6', tunic2:'#d94a7c',
         cape1:'#b0305f', cape2:'#75183c', tie:'#ffd166'}
      : {hair1:'#2b2118', hair2:'#160f0a', tunic1:'#4a95e0', tunic2:'#2266b4',
         cape1:'#194b83', cape2:'#0d2a4d', tie:'#ffd166'};

    /* 女孩的长发要分两层：一层在披风【后面】（垂到肩下），一层在脸【前面】
       （刘海和两侧）。中间夹着身体，头发才有前后关系，不是贴在脸上的一块。 */
    const backHair = kind === 'girl' ? `
      <path d="M80,20 C48,20 38,44 39,70 C40,92 36,116 34,132
               C46,128 56,126 62,125 C54,110 50,88 52,68
               C58,74 70,78 80,78 C90,78 102,74 108,68
               C110,88 106,110 98,125 C104,126 114,128 126,132
               C124,116 120,92 121,70 C122,44 112,20 80,20 Z" fill="url(#${u}a)"/>` : '';

    const frontHair = kind === 'girl' ? `
      <path d="M80,16 C54,16 42,34 43,58 C44,63 45,66 46,69
               C47,60 49,54 52,49 C60,56 71,59 80,59 C89,59 100,56 108,49
               C111,54 113,60 114,69 C115,66 116,63 117,58

  /** 一面画出来的小红旗。
