  /* --------------------------------------------------------------- bits --- */
  glyph(ch, size = 48, extra = ''){
    return el('span', {class:'glyph', style:`font-size:${size}px;${extra}`}, ch);
  },

  pill(icon, value, label, hot){
    return el('div', {class:'pill' + (hot ? ' hot' : '')}, icon, el('b', {}, String(value)),
                     label ? el('span', {style:'font-weight:600;opacity:.7'}, label) : null);
  },

  bigBtn(cls, icon, title, sub, onclick){
    return el('button', {class:`big-btn ${cls}`, onclick:() => { Sfx.tap(); onclick(); }},
      el('span', {class:'ico'}, icon),
      el('span', {}, title, sub ? el('small', {}, sub) : null));
  },

  speaker(text){
    return el('button', {class:'spk', onclick:e => { e.stopPropagation(); Sfx.tap(); Say.probe(text); }}, '🔊');
  },

  /** A question bar. It reads itself out when it appears, and the 🔊 button
      repeats exactly that — one line of text, one thing the child hears.
      Pass '' for sayText on a banner that isn't really a question. */
  ask(question, sayText){
    const bar = el('div', {class:'ask'});
    const q = el('div', {class:'q', html:question});
    bar.append(q);
    const text = sayText === undefined ? this.speakable(q) : sayText;
    if (text){
      bar.append(this.speaker(text));
      Say.announce(text);
    }
    return bar;
  },

  /** spoken form of a question node: no markup, no emoji, no double spaces */
  speakable(node){
    return (node.textContent || '')
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, ' ')
      .replace(/\s+/g, ' ').trim();
  },

  hearts(n, max){
    const h = el('div', {class:'hp'});
    for (let i = 0; i < max; i++) h.append(el('i', {}, i < n ? '❤️' : '🤍'));
    return h;
  },

  bar(pct){ return el('div', {class:'bar'}, el('i', {style:`width:${Math.max(0,Math.min(100,pct))}%`})); },

  /* ------------------------------------------------------------ feedback -- */
  toast({emoji='✨', text='', sub='', ms=1250} = {}){
    const t = el('div', {class:'toast'},
      el('span', {class:'em'}, emoji),
      el('div', {class:'tx'}, text),
      sub ? el('div', {class:'sub'}, sub) : null);
    FX().append(t);
    requestAnimationFrame(() => t.classList.add('on'));
    setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 260); }, ms);
    return t;
  },

  sparkle(x, y, n = 12, chars = ['✨','⭐','💫','🌟']){
    for (let i = 0; i < n; i++){
      const s = el('div', {class:'spark'}, rand(chars));
      const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
      s.style.left = x + 'px'; s.style.top = y + 'px';
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      s.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      FX().append(s);
      setTimeout(() => s.remove(), 950);
    }
  },

  sparkleAt(node, n = 14){
    const r = node.getBoundingClientRect();
    this.sparkle(r.left + r.width / 2, r.top + r.height / 2, n);
  },

  confetti(n = 60){
    const bits = ['🎉','🎊','⭐','✨','🌟','💛','💙','💚'];
    for (let i = 0; i < n; i++){
      const s = el('div', {class:'spark'}, rand(bits));
      s.style.left = (Math.random() * window.innerWidth) + 'px';
      s.style.top = '-30px';
      s.style.fontSize = (16 + Math.random() * 18) + 'px';
      s.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      s.style.setProperty('--dy', (window.innerHeight + 80) + 'px');
      s.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      s.style.animationDuration = (1.5 + Math.random() * 1.4) + 's';
      FX().append(s);
      setTimeout(() => s.remove(), 3200);
    }
  },

  /* praise / gentle nudge — never "wrong" */
  praise(){ return rand(['太棒了！','你想起来啦！','就是它！','厉害！','答对啦！','好眼力！']); },
  nudge(){  return rand(['差一点！','再找找～','没关系，再试一次','嗯……换一个看看']); },
};

/* a small helper used by nearly every mini-game */
function delay(ms){ return new Promise(r => setTimeout(r, ms)); }

/* -----------------------------------------------------------------------------
   Game loop with a fallback.

   requestAnimationFrame is the right call in a real browser, but it never fires
   in a headless render and some embedded webviews throttle it to nothing. If no
   frame has arrived shortly after starting, switch to a timer so the moving
   games keep working — and stay automatically testable.
   -------------------------------------------------------------------------- */
const Loop = {
  run(step){
    let stopped = false, raf = 0, timer = 0, watch = 0;
    let last = performance.now(), lastFrame = performance.now();

    const tick = now => {
      if (stopped) return;
      const dt = Math.min(50, now - last);
      last = now;
      step(dt);
    };
    const frame = now => {
      lastFrame = performance.now();
      tick(now);
      if (!stopped && !timer) raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);

    // rAF can fire a couple of times and then stall — a headless render does
    // exactly that, and so does a throttled webview. Watch for the stall
    // rather than for the absence of frames, or the game freezes mid-round.
    watch = setInterval(() => {
      if (stopped || timer) return;
      if (performance.now() - lastFrame > 260){
        cancelAnimationFrame(raf); raf = 0;
        last = performance.now();
        timer = setInterval(() => tick(performance.now()), 16);
      }
    }, 200);

    const handle = {
      stop(){
        stopped = true;
        if (raf) cancelAnimationFrame(raf);
        if (timer) clearInterval(timer);
        if (watch) clearInterval(watch);
        const k = Loop.live.indexOf(handle);
        if (k >= 0) Loop.live.splice(k, 1);
      },
    };
    Loop.live.push(handle);
    return handle;
  },

  /** every loop currently running */
  live: [],

  /** Stop them all.

      A game's loop was only stopped on the paths its author remembered —
      finishing, mostly. Backing out with the ← arrow left zombies walking and
      timers ticking against a screen nobody could see: the sound kept playing,
      the battery kept draining, and two of them could end up running at once.
      Leaving a screen is the real signal, so UI.mount pulls this. */
  stopAll(){
    [...this.live].forEach(h => h.stop());
    this.live.length = 0;
  },
};


/* ===== 06-challenges.js ===== */
/* =============================================================================
   RETRIEVAL LAYER — the questions, separated from the games that dress them up.

   A challenge is plain data. 汉字怪兽, Boss 战, 薄弱汉字 and 自由游戏 all render
   the same specs, which is why one character can come back in many disguises
   without any duplicated question logic.
   ========================================================================== */

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const Challenge = {

  /** which challenge kinds a character can actually support right now */
  kindsFor(ch, pool){
    const info = Data.char(ch); if (!info) return [];
    const k = ['audio', 'tell'];
    // a picture is only a fair cue when it depicts THIS character and nothing
    // else — see PICTURE_OK. Everything else is asked with a word.
    if (PICTURE_OK.has(ch)) k.push('image', 'meaning');
    if ((info.words || []).some(w => w.length >= 2 && w.indexOf(ch) >= 0)) k.push('word');
    if (info.sent)  k.push('context');
    return k;
  },

  /** prefer the skill this character is weakest at, but keep it varied */
  pickKind(ch, pool, avoid = []){
    const all = this.kindsFor(ch, pool).filter(k => !avoid.includes(k));
    if (!all.length) return 'audio';
    const r = Store.data.chars[ch];
    if (r && Math.random() < 0.55){
      const weak = Memory.weakSkills(r).filter(s => all.includes(s));
      if (weak.length) return rand(weak);
      const untried = all.filter(s => r.skills[s] && r.skills[s].c === 0);
      if (untried.length) return rand(untried);
    }
    return rand(all);
  },

  /**
   * Build one question.
   *   returns {skill, target, title, say, pic, options:[{label,ch,correct,kind}]}
   */
  make(kind, ch, pool, nOpts = 4){
    const info = Data.char(ch);
    /* Wrong answers come from what he ACTUALLY mixes this character up with,
       falling back to the hand-written `near` list until he has shown us.
       This is the adaptive loop closing: 马 gets tapped for 妈, and from then
       on 马 and 妈 keep appearing side by side — which is the only practice
       that ever separates them. */
    const others = Coach.hardDistractors(ch, pool, nOpts - 1);
    const chOpts = shuffle([ch, ...others]).map(c => ({label:c, ch:c, correct:c === ch, kind:'char'}));

    switch (kind){

      case 'word': {
        // 准⬜ -> 备. Exact for every character, and it is the 组词 step the
        // second year turns on, so the cue teaches something on its own.
        const ws = (info.words || []).filter(w => w.length >= 2 && w.indexOf(ch) >= 0);
        if (!ws.length) return this.make('audio', ch, pool, nOpts);
        const w = rand(ws);
        const gap = w.split(ch).join('＿');
        return {skill:'tell', target:ch, word:w, gap,
                title:`把词语补完整：<i>${esc(gap)}</i>`,
                say:`${w}，缺哪个字？`, options:chOpts};
      }

      case 'image': {
        // A gloss that contains the character itself ('肥' means '肥', 井 means
        // '水井') prints the answer on the question. Fall back to the picture
        // alone when that happens — the emoji is the real clue anyway.
        const clue = info.mean && info.mean.indexOf(ch) < 0 ? info.mean : '';
        // even the generic prompt can leak: for 看 and 字 the wording itself
        // contains the answer, so keep spare phrasings that use other words
        const asks = ['看看这个 icon，是哪个字？', 'icon 说的是哪一个？',
                      '猜猜它，选出来。', '这个小画儿说的是谁？'];
        const ask = asks.find(a => a.indexOf(ch) < 0) || asks[2];
        return {skill:'image', target:ch, pic:info.emoji,
                title: clue ? `哪个字是 <i>${esc(clue)}</i>？` : ask,
                say:   clue ? `${clue}，是哪个字？` : ask,
                options:chOpts};
      }

      case 'meaning': {
        // the ANSWER's picture has to be trustworthy too, not just the
        // distractors' — 极 was answered with 💯, which means nothing
        if (!PICTURE_OK.has(ch)) return this.make('word', ch, pool, nOpts);
        // every option is shown as a picture, so distractors must have one
        // distractor pictures must also be unambiguous, or two options can be
        // right at once (💭 was 想/思/梦/忘)
        const pics = (pool || Data.all()).filter(c =>
          c !== ch && PICTURE_OK.has(c) && Data.char(c).emoji);
        const alt = shuffle(pics).slice(0, nOpts - 1);
        if (alt.length < 2) return this.make('word', ch, pool, nOpts);
        const opts = shuffle([ch, ...alt]).map(c => ({
          label: Data.char(c).emoji, ch:c, correct:c === ch, kind:'emoji'}));
        return {skill:'meaning', target:ch, glyph:ch,
                title:`<i>${esc(ch)}</i> 是什么意思？`,
                say:`${Say.inWord(ch)}，是什么意思？`, options:opts};  // 字就在眼前，念出来是帮忙
      }

      case 'context': {
        const s = info.sent;
        if (!s) return this.make('audio', ch, pool, nOpts);   // no sentence on file
        const masked = s.text.split(ch).join('___');
        // 「把句子补完整」 contains 把 — when 把 is the answer the question
        // prints it. Keep spares that use other words.
        const asks = ['把句子补完整', '这句话缺一个字', '填一个字进去', '想想少了谁'];
        const title = asks.find(a => a.indexOf(ch) < 0) || asks[3];
        return {skill:'context', target:ch, pic:s.pic, sentence:masked,
                title, say:this.blankSay(masked),
                options:this.dodgeClash(chOpts, ch, pool)};
      }

      case 'tell': {
        const near = (info.near || []).filter(c => Data.char(c));
        const pool2 = near.length ? [ch, ...near].slice(0, nOpts) : [ch, ...others];
        const opts = shuffle(pool2).map(c => ({label:c, ch:c, correct:c === ch, kind:'char'}));
        return {skill:'tell', target:ch,
                title:`哪个是 <i>${esc(info.words[0])}</i> 的「${esc(ch)}」？`,
                say:`哪个是${info.words[0]}的${ch}？`, options:opts};
      }

      case 'audio':
      default:
        return {skill:'audio', target:ch, hideGlyph:true,
                title:'听一听，是哪个字？', say:`哪一个是${Say.inWord(ch)}？`, options:chOpts};
    }
  },

  /** How a gapped sentence is READ OUT.

      A reduplicated word (妈妈) is two occurrences of the character, so both
      get blanked — correctly, or the sentence would print half the answer.
      Read literally that becomes 「我的什么什么在厨房做饭」. Nobody talks like
      that, so collapse the run back to one 什么. */
  /** 把选项里「这个空它也填得进去」的字换掉。

      例句贴着课文写，难免有两个字都通的时候（「小羊＿吃花儿」想和要都
      对）。与其把课文改成不像课文，不如在出题时把那个字换成本课别的生字
      —— 孩子看到的句子还是课本上那句，选项里却只有一个答案。

      哪些字会撞，记在字表的 clash 里。 */
  dodgeClash(opts, ch, pool){
    const bad = (Data.char(ch) || {}).clash || [];
    if (!bad.length) return opts;
    const used = new Set(opts.map(o => o.ch));
    const spare = shuffle((pool || Data.all())
      .filter(c => c !== ch && bad.indexOf(c) < 0 && !used.has(c) && Data.char(c)));
    const out = [];
    opts.forEach(o => {
      if (bad.indexOf(o.ch) < 0) return out.push(o);
      const r = spare.shift();
      if (r) out.push({label:r, ch:r, correct:false, kind:'char'});
      // 换不出来（这一课字太少）就少一个选项 —— 总好过给两个正确答案
    });
    return out;
  },

  blankSay(masked){
    /* 空格念作「什么」。挖掉的正好是「什」或「么」时，念出来会黏成
       「你在做什么么？」「你在做什什么？」—— 第六课要学「什么」，不收掉
       的话那两个字的例句全是拗口的。 */
    return masked.split('___').join('什么')
                 .replace(/(什么)+/g, '什么')
                 .replace(/什么么/g, '什么')
                 .replace(/什什么/g, '什么');
  },

  /** a ready-made question for a character, kind chosen automatically */
  auto(ch, pool, avoid){ return this.make(this.pickKind(ch, pool, avoid), ch, pool); },

  /* -------------------------------------------------------------- render -- */
  /**
   * Standard prompt block for a spec (used by boss / weak / free-play).
   * Returns {node, options} — the caller decides how options are displayed.
   */
  /** The narrow question card the action games use.

      It has to render `pic`. An image question whose only clue IS the picture
      ("看看这幅图，是哪个字？") is unanswerable without it, and both action
      games were building this card by hand and dropping it. One place now. */
  compactHead(q){
    const h = el('div', {class:'pvz-qhead'});
    // the picture belongs right where the sentence points at it, not parked
    // at the end of the row
    const inline = q.pic && q.title.indexOf('icon') >= 0;
    const html = inline
      ? q.title.replace('icon', `icon <i class="qpic">${q.pic}</i>`)
      : q.title;
    h.append(el('div', {class:'pvz-qt', html}));
    if (q.pic && !inline) h.append(el('div', {class:'pvz-qpic'}, q.pic));
    h.append(UI.speaker(q.say));
    return h;
  },

  promptNode(spec){
    const wrap = el('div', {});
    if (spec.pic)      wrap.append(el('div', {class:'scene'},
                          el('div', {class:'pic'}, spec.pic),
                          spec.sentence ? this.sentenceNode(spec.sentence) : null));
    else if (spec.glyph) wrap.append(el('div', {class:'scene'},
                          el('div', {class:'pic', style:'font-size:82px;font-weight:600'}, spec.glyph)));
    wrap.append(UI.ask(spec.title, spec.say));   // UI.ask reads it out itself
    return wrap;
  },


  sentenceNode(text){
    const n = el('div', {class:'sent'});
    const [a, b] = text.split('___');
    n.append(a || '', el('span', {class:'blank'}, '？'), b || '');
    return n;
  },

  /** grid of answer buttons; calls back with (ok, optionNode) */
  optionsNode(spec, onPick, tileSize = 96){
    const g = el('div', {style:`display:grid;gap:12px;padding:0 16px;` +
                               `grid-template-columns:repeat(${spec.options.length > 3 ? 2 : spec.options.length},1fr)`});
    spec.options.forEach(o => {
      const b = el('button', {class:'tile', style:`height:${tileSize}px`},
        o.kind === 'emoji'
          ? el('span', {style:'font-size:44px'}, o.label)
          : UI.glyph(o.label, 46));
      b.addEventListener('click', () => {
        if (g.dataset.locked) return;
        g.dataset.locked = '1';
        onPick(o.correct, b, o);
      });
      g.append(b);
    });
    return g;
  },

  /** shared answer feedback: never a red X */
  feedback(ok, node, spec, after){
    if (ok){
      node.classList.add('good'); Sfx.good(); UI.sparkleAt(node);
      const info = Data.char(spec.target);
      UI.toast({emoji:'✨', text:UI.praise(),
                sub: info ? `${spec.target}　${info.py}　${info.words[0]}` : ''});
      Say.char(spec.target);
      setTimeout(after, 950);
    } else {
      node.classList.add('bad'); Sfx.soft();
      UI.toast({emoji:'🤔', text:UI.nudge(), sub:'再听一次'});
      setTimeout(() => Say.char(spec.target), 420);
      setTimeout(after, 1200);
    }
  },
};


/* ===== 07-art.js ===== */
/* =============================================================================
   ART — hand-drawn inline SVG for the plants, the zombies and the props.

   Emoji were a placeholder; they made a peashooter look like a leaf. Everything
   here is drawn so a 豌豆射手 actually reads as a pea-firing plant and a zombie
   reads as a zombie. No external files: the game stays one double-clickable
   HTML file, so every sprite is markup.

   Each sprite draws inside a 100x100 box and is returned as a string, so it can
   be dropped straight into innerHTML by the battle engine.
   ========================================================================== */

const Art = {

  svg(inner, extra = ''){
    return `<svg viewBox="0 0 100 100" width="100%" height="100%" ${extra}
      style="display:block;overflow:visible">${inner}</svg>`;
  },

  /* -------------------------------------------------------- shared bits -- */
  stem(x = 50, top = 52, w = 7, col = '#4e9c2c'){
    return `<rect x="${x - w / 2}" y="${top}" width="${w}" height="${96 - top}" rx="${w / 2}" fill="${col}"/>`;
  },
  leaves(y = 90, col = '#5cb636'){
    return `<ellipse cx="34" cy="${y}" rx="17" ry="7.5" fill="${col}" transform="rotate(-14 34 ${y})"/>
            <ellipse cx="66" cy="${y}" rx="17" ry="7.5" fill="${col}" transform="rotate(14 66 ${y})"/>
            <ellipse cx="34" cy="${y}" rx="17" ry="7.5" fill="#00000018" transform="rotate(-14 34 ${y})"/>`;
  },
  /** the bulb + barrel shared by pea / snow / repeater / threepeater */
  shooterHead(cx, cy, body, dark, mouth, r = 21){
    return `
      <ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r * 0.94}" fill="${body}"/>
      <ellipse cx="${cx - r * 0.28}" cy="${cy - r * 0.3}" rx="${r * 0.5}" ry="${r * 0.38}" fill="#ffffff2e"/>
      <path d="M${cx + r * 0.55},${cy - r * 0.46} h${r * 0.95} a${r * 0.3},${r * 0.46} 0 0 1 0,${r * 0.92}
               h-${r * 0.95} z" fill="${body}"/>
      <path d="M${cx + r * 0.55},${cy + r * 0.1} h${r * 0.95} a${r * 0.3},${r * 0.36} 0 0 0 0,-${r * 0.36} z"
            fill="#00000022"/>
      <ellipse cx="${cx + r * 1.5}" cy="${cy}" rx="${r * 0.22}" ry="${r * 0.44}" fill="${mouth}"/>
      <ellipse cx="${cx - r * 0.1}" cy="${cy - r * 0.08}" rx="${r * 0.15}" ry="${r * 0.2}" fill="${dark}"/>`;
  },
  nutFace(cx, cy, s = 1, angry){
    return `
      <ellipse cx="${cx - 9 * s}" cy="${cy}" rx="${4.4 * s}" ry="${5.4 * s}" fill="#3a2a18"/>
      <ellipse cx="${cx + 9 * s}" cy="${cy}" rx="${4.4 * s}" ry="${5.4 * s}" fill="#3a2a18"/>

        ? `<path d="M${cx - 14 * s},${cy - 8 * s} l${9 * s},${3 * s} M${cx + 14 * s},${cy - 8 * s} l-${9 * s},${3 * s}"
                 stroke="#3a2a18" stroke-width="${2.4 * s}" stroke-linecap="round" fill="none"/>
           <path d="M${cx - 7 * s},${cy + 12 * s} q${7 * s},-${5 * s} ${14 * s},0"
                 stroke="#3a2a18" stroke-width="${2.4 * s}" fill="none" stroke-linecap="round"/>`
        : `<path d="M${cx - 7 * s},${cy + 10 * s} q${7 * s},${5 * s} ${14 * s},0"
                 stroke="#3a2a18" stroke-width="${2.4 * s}" fill="none" stroke-linecap="round"/>`}`;

    lead: ['D4','F4','A4','F4', 'B4',null,'A4',null, 'G4','B4','D5','B4', 'A4',null,null,null],
    wave: 'triangle', leadWave: 'square', shaker: true,
  },
};

const Music = {
  ctx: null, gain: null, timer: null,
  track: null, step: 0, nextTime: 0, playing: false,
  muted: (() => { try{ return localStorage.getItem('eca.music') === 'off'; }catch(e){ return false; } })(),

  ac(){
    if (!this.ctx){
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      this.ctx = new C();
      this.gain = this.ctx.createGain();
      this.gain.gain.value = 0.0;
      this.gain.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },

  play(name){
    if (this.track === name && this.playing) return;
    const ac = this.ac(); if (!ac) return;
    this.track = name;
    this.step = 0;
    this.nextTime = ac.currentTime + 0.08;
    this.playing = true;
    this.gain.gain.cancelScheduledValues(ac.currentTime);
    this.gain.gain.setTargetAtTime(this.muted ? 0 : 0.16, ac.currentTime, 0.4);
    clearInterval(this.timer);
    this.timer = setInterval(() => this.schedule(), 26);
  },

  stop(){
    this.playing = false;
    clearInterval(this.timer); this.timer = null;
    if (this.gain && this.ctx) this.gain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.25);
  },

  toggle(){
    this.muted = !this.muted;
    try{ localStorage.setItem('eca.music', this.muted ? 'off' : 'on'); }catch(e){}
    if (this.ctx && this.gain)
      this.gain.gain.setTargetAtTime(this.muted ? 0 : 0.16, this.ctx.currentTime, 0.2);
    return !this.muted;
  },

  /** schedule a little ahead of the clock so timing survives a busy main thread */
  schedule(){
    const ac = this.ctx, t = TRACKS[this.track];
    if (!ac || !t || !this.playing) return;
    const stepDur = 60 / t.bpm / 2;                  // eighth notes
    const total = t.bars * t.beats;
    while (this.nextTime < ac.currentTime + 0.25){
      const i = this.step % total;
      const when = this.nextTime;

      const b = t.bass[i % t.bass.length];
      if (b) this.note(NOTE[b] / 2, when, stepDur * 1.7, t.wave, 0.22);

      const l = t.lead[i % t.lead.length];
      if (l) this.note(NOTE[l], when, stepDur * 1.25, t.leadWave, 0.12);

      if (t.shaker && i % 2 === 1) this.hat(when, 0.055);
      if (i % 8 === 0) this.note(NOTE[b ? b : 'C3'] / 4, when, stepDur * 2, 'sine', 0.16);

      this.step++;
      this.nextTime += stepDur;
    }
  },

  note(freq, when, dur, type, vol){
    const ac = this.ctx;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, when);
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0008, when + dur);
    o.connect(g).connect(this.gain);
    o.start(when); o.stop(when + dur + 0.03);
  },

  hat(when, dur){
    const ac = this.ctx;
    const n = ac.createBufferSource();
    const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    n.buffer = buf;
    const g = ac.createGain(); g.gain.value = 0.05;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
    n.connect(hp).connect(g).connect(this.gain);
    n.start(when);
  },
};


/* ===== 11-game-monster.js ===== */
/* =============================================================================
   汉字怪兽 — each monster carries one answer. Zap the right one.
   Uses the shared challenge layer, so the SAME character can be asked by
   sound, by picture, by meaning or inside a word on different rounds.
   ========================================================================== */

const MON_SKINS = [
  'linear-gradient(#ff9a9a,#e75454)','linear-gradient(#8ad6ff,#2f9fd0)',
  'linear-gradient(#b7f0a5,#4fb069)','linear-gradient(#d9b8ff,#8a5fe0)',
  'linear-gradient(#ffd98a,#eea72a)','linear-gradient(#ffb3d9,#e568a8)',
];

const GameMonster = {
  id:'monster', name:'汉字怪兽', icon:'👹', color:'b-coral',
  blurb:'找出正确的字，打跑小怪兽',

  start(ctx){
    const chars = ctx.chars.slice(0, 5);
    const pool = ctx.pool;
    let i = 0, got = 0, lastKind = null;

    const scr = UI.screen({sky:'sky-night', title:'👹 汉字怪兽', onBack:ctx.onQuit, pal:true});
    const head = el('div', {}); scr.append(head);
    const stage = el('div', {style:'flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px'});
    scr.append(stage);
    UI.mount(scr);

    function round(){
      if (i >= chars.length) return ctx.onDone({game:'monster', chars, correct:got, total:chars.length});
      const ch = chars[i];
      const spec = Challenge.auto(ch, pool, lastKind ? [lastKind] : []);
      lastKind = spec.skill;

      head.innerHTML = '';
      head.append(Challenge.promptNode(spec));

      stage.innerHTML = '';
      const grid = el('div', {class:'mons'});
      spec.options.forEach((o, k) => {
        // No monster face on the button. When the question is a picture one the
        // answer is itself an emoji, so a face above it gave the child two
        // images competing for attention and no way to tell which to read.
        // The coloured body is the monster; the thing on it is the answer.
        const m = el('button', {class:'mon' + (o.kind === 'emoji' ? ' pic' : ''),
                                style:`background:${MON_SKINS[k % MON_SKINS.length]};` +
                                      `animation-delay:${k * .25}s`},
          el('div', {class:'ch'}, o.label));
        m.addEventListener('click', () => {
          if (grid.dataset.locked) return;
          grid.dataset.locked = '1';
          answer(o.correct, m, spec, o.ch);
        });
        grid.append(m);
      });
      stage.append(grid);
    }

    function answer(ok, node, spec, chose){
      Memory.score(spec.target, spec.skill, ok, {chose});
      if (ok){
        got++;
        node.classList.add('zap'); Sfx.boom(); UI.sparkleAt(node, 20);
        const info = Data.char(spec.target);
        UI.toast({emoji:'💥', text:UI.praise(), sub:`${spec.target}　${info.py}　${info.words[0]}`});
        Say.char(spec.target);
        Store.award({stars:1, coins:12, xp:9});
        i++;
        // Say.char now reads 「喝水的水」, longer than the old bare character
        Say.afterSpeech(round, 4500, 700);
      } else {
        node.classList.add('miss'); Sfx.soft();
        UI.toast({emoji:'🤔', text:UI.nudge()});
        setTimeout(() => Say.char(spec.target), 400);
        setTimeout(() => {
          node.classList.remove('miss');
          delete node.parentElement.dataset.locked;
        }, 950);
      }
    }

    setTimeout(round, 220);
  },
};


/* ===== 12-game-origin.js ===== */
/* =============================================================================
   象形字魔法 — watch a picture turn into the character, then find the character.

   Only characters carrying an `origin` record appear here, and the note is
   framed as a memory aid ("像……"), the standard way these are taught in

   ========================================================================== */

const GameOrigin = {
  id:'origin', name:'象形字魔法', icon:'🪄', color:'b-grape',
  blurb:'看图变字，记住汉字为什么长这样',

  available(chars){ return Data.pictographs(chars).length >= 2; },

  start(ctx){

    const pool = ctx.pool;

      card.append(morph);

      stage.append(replay);

        }, 950);

      replay.onclick = () => { Sfx.tap(); animate(); };
      animate();

        stage.append(UI.ask(`哪个是 <i>${esc(o.emoji)}</i> 变来的字？`, '哪个是它变来的字？'));
        const grid = el('div', {style:'display:grid;gap:12px;padding:0 16px;grid-template-columns:repeat(4,1fr)'});
        opts.forEach(c => {
          const b = el('button', {class:'tile', style:'height:88px'}, UI.glyph(c, 42));
          b.onclick = () => {
            if (grid.dataset.locked) return;
            grid.dataset.locked = '1';
            const ok = c === ch;
            Memory.score(ch, 'image', ok);
            if (ok){
              got++; b.classList.add('good'); Sfx.great(); UI.sparkleAt(b, 16);
              UI.toast({emoji:'🪄', text:UI.praise(), sub:`${ch}　${info.py}`});
              Store.award({stars:1, coins:12, xp:10});
              i++; Say.afterSpeech(round, 5000, 750);
            } else {
              b.classList.add('bad'); Sfx.soft();
              UI.toast({emoji:'🤔', text:UI.nudge(), sub:'再看看那张图'});
              setTimeout(() => { b.classList.remove('bad'); delete grid.dataset.locked; }, 900);
            }
          };
          grid.append(b);
        });
        stage.append(grid);
      }, 2200);
    }

    setTimeout(round, 200);
  },
};


/* ===== 13-game-factory.js ===== */
/* =============================================================================
   汉字拼装工厂 — feed components into the machine and a new character pops out.
   Teaches structure, which is how children actually hold characters in memory.
   Recipes live in data (COMPOSE) and are all standard combinations.
   ========================================================================== */

const GameFactory = {
  id:'factory', name:'拼装工厂', icon:'🧩', color:'b-leaf',
  blurb:'把零件放进机器，造出新汉字',

  /* 这一课自己有合体字才开这一关。不看这个的话，一课没有合体字（比如
     第二课）也会开出来，考的却全是别课的字。 */
  available(chars){ return Data.recipesOwn(chars).length >= 1; },

  /** 「姑娘的娘」, not just 「姑娘」.

      The spoken prompt has to say WHICH character we are building. A word on
      its own ('姑娘') names a thing; it does not tell a six-year-old which of
      its two characters the machine is supposed to produce. Naming it inside
      a word he already knows does — the same trick Say.inWord uses everywhere
      else, which this game was simply not using. */
  nameOf(rec){
    const named = Say.inWord(rec.result);
    if (named !== rec.result) return named;                 // 字表里有词
    if (rec.mean && rec.mean.indexOf(rec.result) >= 0)      // 配方自带的词
      return `${rec.mean}的${rec.result}`;
    return rec.result;
  },

  start(ctx){
    /* 本课的合体字排前面，不够四道再拿通用配方凑 —— 孩子练的首先是
       这一课要学的那几个字。 */
    const own = shuffle(Data.recipesOwn(ctx.pool));
    /* 凑数的配方也得是这学期教的字。通用配方表里有娘、打、虹、卡这些，
       「这学期从第六课起」的班根本没学过 —— 让他拼一个没见过的字，既不是
       复习也不是预习，白白耗掉一关。 */
    const taught = c => {
      if (!EDITION.from) return true;
      const ids = (Data.worlds() || []).flatMap(w => w.units || []);
      return ids.some(id => !Data.isBeforeStart(id) &&
                            (Data.unitChars(id) || []).indexOf(c) >= 0);
    };
    const rest = shuffle(Data.recipesFor(ctx.pool)
      .filter(r => !own.includes(r) && taught(r.result)));
    const recipes = [...own, ...rest].slice(0, 4);
    let i = 0, got = 0;

    const scr = UI.screen({sky:'sky-day', title:'🧩 汉字拼装工厂', onBack:ctx.onQuit, pal:true});
    const head = el('div', {}); scr.append(head);
    const body = el('div', {style:'flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px'});
    scr.append(body);
    UI.mount(scr);

    function round(){
      if (i >= recipes.length)
        return ctx.onDone({game:'factory', chars:recipes.flatMap(r => r.parts.filter(p => Data.char(p))),
                           correct:got, total:recipes.length});

      const rec = recipes[i];
      const need = rec.parts.slice();
      const filled = [];

      head.innerHTML = '';
      head.append(UI.ask(`造一个新字：<i>${esc(rec.mean)}</i>`,
                         `我们来造一个字，${GameFactory.nameOf(rec)}`));

      body.innerHTML = '';
      const mach = el('div', {class:'mach'});
      const slots = el('div', {class:'slots'});
      const slotNodes = need.map((_, k) => {
        const s = el('div', {class:'slot'});
        if (k) slots.append(el('div', {class:'plus'}, '+'));
        slots.append(s);
        return s;
      });
      slots.append(el('div', {class:'plus'}, '='));
      const out = el('div', {class:'out'}, '？');
      mach.append(slots, out);
      body.append(mach);

      // parts tray: the needed pieces plus a couple of decoys
      const decoys = shuffle(ctx.pool.filter(c => !need.includes(c))).slice(0, 2);
      const tray = el('div', {class:'parts'});
      shuffle([...need, ...decoys]).forEach(p => {
        const label = p;
        const b = el('button', {class:'part'}, label);
        b.onclick = () => {
          if (tray.dataset.locked) return;
          const idx = need.indexOf(p);
          if (idx === -1 || filled.includes(p) && need.filter(x => x === p).length <= filled.filter(x => x === p).length){
            b.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},
                       {transform:'translateX(7px)'},{transform:'translateX(0)'}], 320);
            Sfx.soft();
            UI.toast({emoji:'🤔', text:'这个零件好像不对', ms:900});
            return;
          }
          const slot = slotNodes[filled.length];
          slot.textContent = p; slot.classList.add('filled');
          filled.push(p); b.classList.add('used');
          Sfx.tap(); Sfx.tone(520 + filled.length * 110, .1, 'triangle', .12);
          if (filled.length === need.length) run();
        };
        tray.append(b);
      });
      body.append(tray);

      function run(){
        tray.dataset.locked = '1';
        out.classList.add('run'); out.textContent = '⚙️';
        Sfx.whoosh();
        setTimeout(() => {
          out.classList.remove('run');
          out.textContent = rec.result;
          Sfx.great(); UI.sparkleAt(out, 22);
          got++;
          rec.parts.filter(p => Data.char(p)).forEach(p => Memory.score(p, 'build', true));
          UI.toast({emoji:'✨', text:`${rec.result}！`, sub:rec.hint, ms:1700});
          Say.line(`${rec.result}，${rec.hint}`);
          Store.award({stars:1, coins:15, gems:1, xp:12});
          i++;
          // the hint is a full sentence — let it finish before the next one
          Say.afterSpeech(round, 6000, 900);
        }, 1000);
      }
    }

    setTimeout(round, 200);
  },
};


/* ===== 14-game-repair.js ===== */
/* =============================================================================
   汉字修理厂 — a piece of the character has fallen off; put the right one back.

   This gives stroke awareness without any stroke-order dataset: the character
   is painted to a canvas, one cell of it is erased, and the candidate patches
   are the same cell cut out of other characters. The child has to look at the
   SHAPE of what is missing, which is exactly the skill copying is meant to
   build — but without copying.
   ========================================================================== */

const GameRepair = {
  id:'repair', name:'汉字修理厂', icon:'🔧', color:'b-gold',
  blurb:'汉字掉了一块，把它修好',

  start(ctx){
    const chars = ctx.chars.slice(0, 4);
    const pool = ctx.pool.length > 3 ? ctx.pool : Data.all();
    let i = 0, got = 0;

    const S = 280, CELL = S / 3;
    const scr = UI.screen({sky:'sky-island', title:'🔧 汉字修理厂', onBack:ctx.onQuit, pal:true});
    const head = el('div', {}); scr.append(head);
    const body = el('div', {style:'flex:1;display:flex;flex-direction:column;justify-content:center'});
    scr.append(body);
    UI.mount(scr);

    /** paint one character onto a fresh canvas */
    function paint(ch, size = S){
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, size, size);
      g.fillStyle = '#2f2a3d';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = `600 ${Math.round(size * 0.78)}px "PingFang SC","Hiragino Sans GB","Heiti SC",sans-serif`;
      g.fillText(ch, size / 2, size / 2 + size * 0.02);
      return c;
    }

    /** ink coverage of one cell, 0..1 */
    function inkOf(cv, cx, cy){
      const g = cv.getContext('2d');
      const d = g.getImageData(cx * CELL, cy * CELL, CELL, CELL).data;
      let n = 0;
      for (let p = 0; p < d.length; p += 4) if (d[p] < 160) n++;
      return n / (d.length / 4);
    }

    function round(){
      if (i >= chars.length) return ctx.onDone({game:'repair', chars, correct:got, total:chars.length});
      const ch = chars[i], info = Data.char(ch);

      const full = paint(ch);
      // choose a cell that holds a real piece of the character
      const cells = [];
      for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++){
        const ink = inkOf(full, x, y);
        if (ink > 0.06 && ink < 0.55) cells.push({x, y, ink});
      }
      if (!cells.length) cells.push({x:1, y:1});
      const hole = rand(cells);

      head.innerHTML = '';
      head.append(UI.ask(`帮 <i>${esc(ch)}</i> 修好！`, `帮${ch}，${info.words[0]}的${ch}，修好`));

      body.innerHTML = '';
      const wrap = el('div', {class:'repair-wrap'});
      const view = document.createElement('canvas');
      view.id = 'repairCv'; view.width = view.height = S;
      view.style.width = Math.min(280, window.innerWidth - 90) + 'px';
      view.style.height = view.style.width;
      const vg = view.getContext('2d');
      vg.drawImage(full, 0, 0);
      vg.fillStyle = '#f2eef8';
      vg.fillRect(hole.x * CELL, hole.y * CELL, CELL, CELL);
      vg.strokeStyle = '#c9bce4'; vg.lineWidth = 4; vg.setLineDash([10, 8]);
      vg.strokeRect(hole.x * CELL + 2, hole.y * CELL + 2, CELL - 4, CELL - 4);
      wrap.append(view);

      // candidate patches: the true cell, plus the same cell from other characters
      const decoyChars = shuffle(pool.filter(c => c !== ch && Data.char(c))).slice(0, 2);
      const cands = shuffle([{ch, correct:true}, ...decoyChars.map(c => ({ch:c, correct:false}))]);

      const row = el('div', {class:'patches'});
      cands.forEach(cand => {
        const src = cand.correct ? full : paint(cand.ch);
        const pc = document.createElement('canvas');
        pc.width = pc.height = CELL;
        pc.style.width = pc.style.height = '84px';
        const pg = pc.getContext('2d');
        pg.drawImage(src, hole.x * CELL, hole.y * CELL, CELL, CELL, 0, 0, CELL, CELL);
        const b = el('button', {class:'patch'});
        b.append(pc);
        b.onclick = () => {
          if (row.dataset.locked) return;
          row.dataset.locked = '1';
          const ok = cand.correct;
          Memory.score(ch, 'fix', ok);
          if (ok){
            got++;
            vg.drawImage(full, hole.x * CELL, hole.y * CELL, CELL, CELL,
                               hole.x * CELL, hole.y * CELL, CELL, CELL);
            Sfx.great(); UI.sparkleAt(view, 18);
            UI.toast({emoji:'🔧', text:'修好啦！', sub:`${ch}　${info.py}　${info.words[0]}`});
            Say.char(ch);
            Store.award({stars:1, coins:12, xp:11});
            i++; Say.afterSpeech(round, 5000, 800);
          } else {
            b.animate([{transform:'translateY(0)'},{transform:'translateY(-10px)'},
                       {transform:'translateY(0)'}], 340);
            Sfx.soft();
            UI.toast({emoji:'🤔', text:'这块好像不合适', sub:'看看缺口的形状'});
            setTimeout(() => { delete row.dataset.locked; }, 800);
          }
        };
        row.append(b);
      });
      wrap.append(row);
      body.append(wrap);
    }

    setTimeout(round, 200);
  },
};


/* ===== 15-game-match.js ===== */
/* =============================================================================
   记忆配对 — a memory grid where the pairs are never two identical characters.
   A card matches one of its words, so every match is a small act of retrieval
   instead of shape-spotting.

   以前还会配图（🐄 配 牛）。图去掉了 —— 一来图是猜的，🐄 既可以是牛也可以
   是「农场」「牛奶」；二来这一关本来就该练组词，配词语才算练到点子上。
   字表里没有双字词的字（极少）退回配拼音，不硬编。
   ========================================================================== */

const GameMatch = {
  id:'match', name:'记忆配对', icon:'🃏', color:'b-rose',
  blurb:'把汉字和它的词语配起来',

  start(ctx){
    const chars = ctx.chars.slice(0, 6);
    const pairKind = {};                       // ch -> which partner type
    const cards = [];

    /* 配词有两个坑，都是第六课炸出来的：
         · 两个字配同一个词 —— 「什」和「么」词表里都排着「什么」，桌上
           摆出两张一样的牌；
         · 词里含着本局【另一个】生字 —— 「什么」里有「么」，孩子把 么
           配到「什么」上，看着完全对，程序判错。
       所以挑的词必须：本局没用过，而且除了它自己不含别的生字。挑不出来
       （「什」在这一课就挑不出）就退回配拼音 —— 总好过给一个会判错的牌。 */
    const onBoard = new Set(chars);
    const usedWord = new Set();
    chars.forEach(ch => {
      const info = Data.char(ch);
      const clean = (info.words || []).filter(x =>
        x.length > 1 && x.indexOf(ch) >= 0 && !usedWord.has(x) &&
        ![...x].some(c => c !== ch && onBoard.has(c)));
      const w = clean[0] || null;
      if (w) usedWord.add(w);
      const kind = w ? 'word' : 'pinyin';
      pairKind[ch] = kind;
      cards.push({ch, face:ch, type:'char'});
      cards.push({ch, type:kind, face: w || info.py});
    });
    shuffle(cards);

    let open = [], done = 0, tries = 0, locked = false;

    const scr = UI.screen({sky:'sky-kingdom', title:'🃏 记忆配对', onBack:ctx.onQuit, pal:true});
    scr.append(UI.ask('翻开两张，把汉字和它的词语配起来', '把汉字和它的词语配起来'));
    const grid = el('div', {class:'grid-m'});
    scr.append(grid);
    scr.append(el('div', {class:'hint'}, '提示：每个汉字配一个它组成的词语'));
    UI.mount(scr);

    cards.forEach((c, idx) => {
      const b = el('button', {class:'mcard'},
        el('span', {class:'in' + (c.type === 'word' || c.type === 'pinyin' ? ' sm' : '')}, c.face));
      b.dataset.idx = idx;
      b.onclick = () => flip(c, b);
      grid.append(b);
      c.node = b;
    });

    function flip(c, b){
      if (locked || b.classList.contains('up') || b.classList.contains('done')) return;
      b.classList.add('up'); Sfx.tap();
      if (c.type === 'char') Say.char(c.ch); else if (c.type === 'word') Say.word(c.face);
      open.push(c);
      if (open.length < 2) return;

      locked = true; tries++;
      const [a, d] = open;
      const ok = a.ch === d.ch && a.type !== d.type;
      setTimeout(() => {
        if (ok){
          Memory.score(a.ch, 'meaning', true);
          a.node.classList.add('done'); d.node.classList.add('done');
          Sfx.good(); UI.sparkleAt(a.node, 10);
          done++;
          Store.award({stars:1, coins:8, xp:7});
          const info = Data.char(a.ch);
          UI.toast({emoji:'🃏', text:`${a.ch} ${info.py}`, sub:info.words[0], ms:900});
          if (done === chars.length) setTimeout(finish, 700);
        } else {
          if (a.ch !== d.ch) Memory.score(a.ch, 'meaning', false, {chose:d.ch});
          a.node.classList.remove('up'); d.node.classList.remove('up');
          Sfx.soft();
        }
        open = []; locked = false;
      }, ok ? 380 : 780);
    }

    function finish(){
      UI.confetti(40);
      ctx.onDone({game:'match', chars, correct:done, total:chars.length, tries});
    }
  },
};


/* ===== 16-game-speed.js ===== */
/* =============================================================================
   汉字快线 — the target character rides past on a belt; catch every copy.

   The first version floated characters up from the bottom with a random
   sideways drift. Eric could not catch them, and the reason was not speed:
   chasing a target that moves in two directions at once is a test of the hand,
   not of reading, and this stage is supposed to be the one where recognition
   becomes automatic.

   So the motion is now predictable — one lane, constant speed, right to left.
   The child can park a finger where the character is going to be. What stays
   hard is the only thing that should be hard here: deciding fast whether the
   character sliding towards you is the one you want.
   ========================================================================== */

const GameSpeed = {
  id:'speed', name:'汉字快线', icon:'⚡', color:'b-gold',
  blurb:'汉字排队走过来，抓住目标那个',

  start(ctx){
    const SPAN = 50, TILE = 84, GAP = 104;
    const pool = ctx.pool.length >= 4 ? ctx.pool : Data.all();
    const targets = ctx.chars.slice(0, 3);
    let ti = 0, target = targets[0];
    let time = SPAN, hits = 0, missed = 0, combo = 0, best = 0, score = 0;
    let running = true, loop = null;
    const live = [];

    const scr = UI.screen({sky:'sky-planet', title:'⚡ 汉字快线', onBack:ctx.onQuit, pal:true});
    const ask = UI.ask(`抓住所有的 <i>${esc(target)}</i>！`, `抓住${Say.inWord(target)}`);
    scr.append(ask);
    const bar = UI.bar(100); scr.append(bar);

    const belt = el('div', {class:'belt'});
    const lane = el('div', {class:'beltlane'});
    belt.append(el('div', {class:'beltedge'}), lane);
    scr.append(belt);

    const tally = el('div', {class:'tally'},
      el('div', {class:'pill'}, '✅', el('b', {}, '0')),
      el('div', {class:'pill'}, '🫥', el('b', {}, '0')),
      el('div', {class:'pill combopill'}, '🔥', el('b', {}, '0')));
    scr.append(tally);
    const hitN = tally.children[0].lastChild;
    const missN = tally.children[1].lastChild;
    const comboN = tally.children[2].lastChild;

    scr.append(el('div', {class:'hint'},
      '汉字会一直往左走 —— 把手指放在前面等它过来就行'));
    UI.mount(scr);

    // Predictable motion means this can be quick: the belt only ever moves one
    // way, so speed tests how fast he reads, not how well he tracks.
    const speed = () => 112 + (SPAN - time) * 1.7;      // 112 -> ~197 px/s

    function spawn(){
      const w = lane.clientWidth;
      if (w < 60) return;
      const isTarget = Math.random() < 0.45;
      const ch = isTarget ? target : (rand(pool.filter(c => c !== target)) || target);
      const b = el('button', {class:'beltcard'}, ch);
      const o = {node:b, x:w + 10, ch};
      b.style.left = o.x + 'px';
      b.onclick = () => grab(o);
      lane.append(b);
      live.push(o);
    }

    function grab(o){
      if (!running || o.dead) return;
      o.dead = true;
      if (o.ch === target){
        hits++; combo++; best = Math.max(best, combo);
        score += 10 * Math.min(5, combo);
        Memory.score(target, 'image', true);
        o.node.classList.add('good');
        Sfx.tone(600 + Math.min(8, combo) * 70, .09, 'triangle', .14);
        UI.sparkleAt(o.node, 8);
        hitN.textContent = String(hits);
      } else {
        combo = 0;
        o.node.classList.add('bad'); Sfx.soft();
      }
      comboN.textContent = String(combo);
      tally.children[2].classList.toggle('hot', combo >= 3);
      setTimeout(() => { o.node.remove(); }, 220);
    }

    function switchTarget(){
      ti = (ti + 1) % targets.length;
      target = targets[ti];
      ask.innerHTML = '';
      ask.append(el('div', {class:'q', html:`抓住所有的 <i>${esc(target)}</i>！`}),
                 UI.speaker(`抓住${Say.inWord(target)}`));
      Say.line(`现在抓${Say.inWord(target)}`);
      UI.toast({emoji:'🔄', text:`换成 ${target}！`, ms:1000});
    }

    function tick(dt){
      const s = dt / 1000;
      time -= s;
      bar.firstChild.style.width = Math.max(0, time / SPAN * 100) + '%';
      if (time <= 0) return finish();
      if (Math.floor(time) === SPAN - 17 && ti === 0) switchTarget();
      if (Math.floor(time) === SPAN - 34 && ti === 1) switchTarget();

      // keep exactly one comfortable gap between cards, so nothing ever
      // overlaps and the rhythm stays readable
      const last = live[live.length - 1];
      if (!last || last.x < lane.clientWidth - GAP) spawn();

      const v = speed() * s;
      for (let i = live.length - 1; i >= 0; i--){
        const o = live[i];
        o.x -= v;
        o.node.style.left = o.x + 'px';
        if (o.x < -TILE - 10){
          if (!o.dead && o.ch === target){
            missed++; missN.textContent = String(missed);
            combo = 0; comboN.textContent = '0';
            tally.children[2].classList.remove('hot');
            belt.classList.add('slip');
            setTimeout(() => belt.classList.remove('slip'), 260);
          }
          o.node.remove(); live.splice(i, 1);
        }
      }
    }

    function finish(){
      running = false;
      if (loop) loop.stop();
      live.forEach(o => o.node.remove());
      UI.confetti(30);
      Store.award({stars:Math.min(3, Math.floor(hits / 5)), coins:score,
                   xp:Math.floor(score / 4)});
      ctx.onDone({game:'speed', chars:targets, correct:hits, total:hits + missed,
                  score, best});
    }

    setTimeout(() => { loop = Loop.run(tick); }, 200);
  },
};


/* ===== 17-game-context.js ===== */
/* =============================================================================
   汉字生活城 — the character stops being a shape and becomes a word in a
   sentence about something real. This is the bridge from 认字 to 用字.
   ========================================================================== */

const GameContext = {
  id:'context', name:'汉字生活城', icon:'🏘️', color:'b-sky',
  blurb:'把汉字用到句子里',

  available(chars){ return chars.filter(c => Data.char(c) && Data.char(c).sent).length >= 2; },

  start(ctx){
    const chars = ctx.chars.filter(c => Data.char(c) && Data.char(c).sent).slice(0, 5);
    const pool = ctx.pool;
    let i = 0, got = 0;

    const scr = UI.screen({sky:'sky-day', title:'🏘️ 汉字生活城', onBack:ctx.onQuit, pal:true});
    const body = el('div', {style:'flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px'});
    scr.append(body);
    UI.mount(scr);

    function round(){
      if (i >= chars.length) return ctx.onDone({game:'context', chars, correct:got, total:chars.length});
      const ch = chars[i], info = Data.char(ch), s = info.sent;

      body.innerHTML = '';
      const scene = el('div', {class:'scene'});
      scene.append(el('div', {class:'pic'}, s.pic));
      const sent = el('div', {class:'sent'});
      // A sentence that still shows the character somewhere else hands over the
      // answer ('大家叫他朱___同志'), so blank every occurrence, not just the
      // one the author marked.
      const masked = s.text.split(ch).join('___');
      const blanks = [];
      masked.split('___').forEach((part, k, all) => {
        if (part) sent.append(part);
        if (k < all.length - 1){
          const b = el('span', {class:'blank'}, '？');
          blanks.push(b); sent.append(b);
        }
      });
      const blank = blanks[0];
      scene.append(sent);
      body.append(scene);
      body.append(UI.ask('这里应该填哪个字？', Challenge.blankSay(masked)));

      const opts = shuffle([ch, ...Memory.distractors(ch, pool, 2)]);
      const grid = el('div', {style:'display:grid;gap:12px;padding:0 16px;grid-template-columns:repeat(3,1fr)'});
      opts.forEach(c => {
        const btn = el('button', {class:'tile', style:'height:100px'}, UI.glyph(c, 48));
        btn.onclick = () => {
          if (grid.dataset.locked) return;
          grid.dataset.locked = '1';
          const ok = c === ch;
          Memory.score(ch, 'context', ok, {chose:c});
          if (ok){
            got++;
            btn.classList.add('good'); Sfx.great(); UI.sparkleAt(btn, 16);
            blanks.forEach(b => { b.textContent = ch; b.style.color = '#2f9d61';
                                  b.style.borderColor = '#2f9d61'; });
            Say.line(s.text.replace('___', ch));
            UI.toast({emoji:'📖', text:UI.praise(), sub:s.text.replace('___', ch)});
            Store.award({stars:1, coins:14, xp:12});
            i++;
            // the whole sentence is read back — don't cut it off
            Say.afterSpeech(round, 6500, 900);
          } else {
            btn.classList.add('bad'); Sfx.soft();
            UI.toast({emoji:'🤔', text:UI.nudge(), sub:'再读一遍句子'});
            setTimeout(() => { btn.classList.remove('bad'); delete grid.dataset.locked; }, 1000);
          }
        };
        grid.append(btn);
      });
      body.append(grid);
    }

    setTimeout(round, 200);
  },
};

/* ===== 19-game-pvz.js ===== */
/* =============================================================================
   汉字保卫战 — the battle engine, modelled on the real game.

   Authentic bits that matter for the feel: sun falls from the sky and has to be
   tapped, seed packets have cooldowns, every row has a lawnmower as a last
   line of defence, and the wave meter carries flags.

   Two hooks keep reading at the centre rather than bolted on:
     · answering the character question is the fastest source of 阳光
     · every zombie wears a character, and a correct answer fires 汉字闪电 at
       every zombie wearing THAT one — so reading clears lanes
   ========================================================================== */

const Pvz = {
  id:'pvz', name:'汉字保卫战', icon:'🧟', color:'b-leaf',

  /** opts: {level:1..10, pool, onDone?, onQuit?}
      onDone/onQuit are supplied when the battle runs as the last stage of a
      unit; without them it falls back to the standalone level map. */
  start(opts){
    const L = Data.pvzLevel(opts.level || 1) || Data.PVZ_LEVELS[0];
    const ROWS = L.rows, COLS = 8;   // 更长的草坪：僵尸要走更久，也放得下更多植物
    // Pace of the whole lawn. A普通僵尸 (speed 10) covers the 8-column lawn in
    // roughly ten seconds at 4.2 — slow enough to read the character on its
    // chest, plant something, and still have a moment to think.
    const WALK = 4.2;
    /* How fast a zombie chews through a plant, in HP per second.

       Was 30, which ate a 480-HP 坚果墙 in sixteen seconds — and the child is
       supposed to be READING a character and choosing an answer in that time,
       not watching a clock. The nut exists to buy thinking time, so it has to
       actually buy some. */
    const EAT_DPS = 22;                         // 坚果墙 480 血 ≈ 22 秒
    const pool = (opts.pool && opts.pool.length >= 4) ? opts.pool
               : (Memory.known().length >= 4 ? Memory.known() : Data.unitChars('g1a-u1'));

    /* ------------------------------------------------------------ state -- */
    let sun = L.sun, wave = 0, killed = 0, quota = 0, lastKind = null;
    const recentQ = [];          // characters just asked about
    let running = true, loop = null, selected = null, shovel = false;
    let cellW = 0, cellH = 0, SPRITE = 40, spawnT = 3000, question = null, qAge = 0, bigWaveShown = false;
    const plants = [], zombies = [], shots = [], suns = [], mowers = [];
    const owned = Data.PLANTS.filter(p => Store.owns(p.id));
    if (!owned.length) owned.push(Data.plant('sunflower'));
    const cds = {};                                  // plantId -> seconds left
    const totalZ = L.waves * L.per;

    /* ------------------------------------------------------------ build -- */
    const scr = UI.screen({sky: L.night ? 'sky-night' : 'sky-day',
                           title:`🧟 ${L.name}`, onBack:quit, scenery:false});
    scr.querySelector('.sky').style.background = L.night
      ? 'linear-gradient(#1d1840,#33285e 60%,#4a3a70)'
      : 'linear-gradient(#8fdcff,#bdeeff 45%,#dff3c9)';

    const bar = el('div', {class:'pvz-bar'});
    const sunN = el('div', {class:'sunbank'}, '☀️', el('b', {}, String(sun)));
    const meter = el('div', {class:'meter'});
    const meterFill = el('i', {});
    meter.append(meterFill);
    for (let f = 1; f <= L.waves; f++){
      const flag = el('span', {class:'flag'}, '🚩');
      flag.style.left = (f / L.waves * 100) + '%';
      meter.append(flag);
    }
    // The lawnmowers ARE the lives now, so show how many are left instead of
    // an abstract heart count — the child can see exactly which row is naked.
    const mowN = el('div', {class:'pill mowpill'}, '🚜', el('b', {}, String(L.rows)));
    bar.append(sunN, meter, mowN);
    scr.append(bar);

    const tray = el('div', {class:'seedbar'});
    scr.append(tray);

    const qCard = el('div', {class:'pvz-q'});
    scr.append(qCard);

    const yard = el('div', {class:'yard'});
    const mowStrip = el('div', {class:'mowers'});
    const lawn = el('div', {class:'lawn'});
    yard.append(mowStrip, lawn);
    scr.append(yard);
    UI.mount(scr);

    lawn.style.gridTemplateColumns = `repeat(${COLS},1fr)`;
    lawn.style.gridTemplateRows = `repeat(${ROWS},1fr)`;
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++){
        const cell = el('div', {class:'cell' + ((r + c) % 2 ? ' alt' : '')});
        cell.onclick = () => cellTap(r, c);
        lawn.append(cell);
      }
    for (let r = 0; r < ROWS; r++){
      const m = el('div', {class:'mower', html:Art.mower()});
      mowStrip.append(m);
      mowers.push({row:r, node:m, alive:true, running:false, x:0});
    }

    /* ------------------------------------------------------- seed packets */
    owned.forEach(p => {
      const b = el('button', {class:'packet'},
        el('div', {class:'pe', html:Art.plant(p.id)}),
        el('div', {class:'pn'}, p.name),
        el('div', {class:'pc'}, '☀' + p.sun),
        el('div', {class:'cool'}));
      b.onclick = () => {
        if (!running) return;
        Sfx.tap(); shovel = false; shovelBtn.classList.remove('on');
        if ((cds[p.id] || 0) > 0) return UI.toast({emoji:'⏳', text:'还在长，等一下', ms:800});
        if (sun < p.sun) return UI.toast({emoji:'☀️', text:'阳光不够', sub:'答对汉字题 +50 阳光', ms:1100});
        selected = (selected && selected.id === p.id) ? null : p;
        paintTray();
      };
      tray.append(b);
      p._b = b;
    });
    const shovelBtn = el('button', {class:'packet shovel'},
      el('div', {class:'pe'}, '🔨'), el('div', {class:'pn'}, '铲子'));
    shovelBtn.onclick = () => {
      Sfx.tap(); selected = null; shovel = !shovel;
      shovelBtn.classList.toggle('on', shovel); paintTray();
    };
    tray.append(shovelBtn);

    function paintTray(){
      owned.forEach(p => {
        p._b.classList.toggle('on', selected === p);
        p._b.classList.toggle('poor', sun < p.sun);
        const cd = cds[p.id] || 0;
        p._b.querySelector('.cool').style.height = cd > 0 ? (cd / cdOf(p) * 100) + '%' : '0';
      });
    }
    function cdOf(p){ return Math.min(22, 4 + p.sun / 18); }
    function paintSun(){ sunN.lastChild.textContent = String(Math.floor(sun)); paintTray(); }

    /* ------------------------------------------------------------ layout */
    /* Keep the cells close to square. Left to stretch, a 5-wide lawn on a tall
       phone gives 85x191 cells and every plant looks like a speck. */
    function measure(){
      const box = yard.getBoundingClientRect();
      const w = box.width - 34;                       // minus the mower strip
      const wanted = Math.min(box.height, (w / COLS) * ROWS * 1.38);
      lawn.style.height = Math.round(wanted) + 'px';
      const r = lawn.getBoundingClientRect();
      cellW = r.width / COLS; cellH = r.height / ROWS;
      SPRITE = Math.min(cellW, cellH) * 1.18;
      mowStrip.style.height = r.height + 'px';
      mowers.forEach(m => { m.node.style.height = cellH + 'px'; });
    }
    /** centre a sprite-sized square inside its cell */
    function box(node, row, col){
      node.style.width = SPRITE + 'px';
      node.style.height = SPRITE + 'px';
      node.style.left = (col * cellW + (cellW - SPRITE) / 2) + 'px';
      node.style.top = (row * cellH + (cellH - SPRITE) / 2) + 'px';
    }

    /* ---------------------------------------------------------- planting */
    function cellTap(r, c){
      if (!running) return;
      const here = plants.find(p => p.row === r && p.col === c);
      if (shovel){
        if (here){ removePlant(here); Sfx.pop(); }
        shovel = false; shovelBtn.classList.remove('on');
        return;
      }
      if (!selected) return UI.toast({emoji:'👆', text:'先在上面选一株植物', ms:900});
      if (here) return UI.toast({emoji:'🌱', text:'这里已经有啦', ms:800});
      if (sun < selected.sun) return UI.toast({emoji:'☀️', text:'阳光不够', ms:900});

      const def = selected;
      sun -= def.sun;
      cds[def.id] = cdOf(def);
      const node = el('div', {class:'plant' + (def.kind === 'spike' ? ' flat' : ''),
                              html:Art.plant(def.id)});
      lawn.append(node);
      const p = {row:r, col:c, def, hp:def.hp, node, t:0, armed:def.kind !== 'mine', busy:0};
      if (def.kind === 'mine'){ node.classList.add('arming'); }
      plants.push(p);
      place(p);
      Sfx.pop();
      selected = null; paintSun();
      if (def.kind === 'bomb') setTimeout(() => explode(p, 1.4), 380);
      if (def.kind === 'lane') setTimeout(() => burnLane(p), 380);
    }

    function place(p){ box(p.node, p.row, p.col); }
    function removePlant(p){ p.node.remove(); plants.splice(plants.indexOf(p), 1); }

    function explode(p, radius){
      UI.sparkleAt(p.node, 24, ['💥','🔥','✨']); Sfx.boom();
      zombies.slice().forEach(z => {
        if (Math.abs(z.row - p.row) <= radius && Math.abs(z.x / cellW - p.col) <= radius + 0.4)
          hurt(z, p.def.dmg, true);
      });
      removePlant(p);
    }
    function burnLane(p){
      UI.sparkleAt(p.node, 26, ['🔥','💥']); Sfx.boom();
      zombies.slice().forEach(z => { if (z.row === p.row) hurt(z, p.def.dmg, true); });
      removePlant(p);
    }

    /* ------------------------------------------------------------- sun --- */
    function dropSun(x, y, amount){
      const s = el('button', {class:'sunorb', html:Art.sun()});
      lawn.append(s);
      const o = {node:s, x, y, ty:y + 60 + Math.random() * 40, life:11, amount};
      s.style.left = x + 'px'; s.style.top = y + 'px';
      s.onclick = e => {
        e.stopPropagation();
        sun += o.amount; paintSun();
        Sfx.tone(880, .09, 'triangle', .12);
        s.classList.add('taken');
        setTimeout(() => s.remove(), 200);
        suns.splice(suns.indexOf(o), 1);
      };
      suns.push(o);
    }
    function skySun(){
      const r = lawn.getBoundingClientRect();
      dropSun(30 + Math.random() * (r.width - 90), -30, 25);
    }

    /* -------------------------------------------------------- questions -- */
    function newQuestion(){
      // Memory.pick returns the weakest character, and answering it once does
      // not stop it being the weakest — so it came back again and again and the
      // child read that as the game being stuck. Keep the last few out of the
      // draw. And go through Challenge.auto, not a hand-picked kind: picking
      // 'meaning' directly handed 极 the answer 💯, which is also 全's picture.
      const ch = Memory.nextAsk(pool, recentQ);
      question = Challenge.auto(ch, pool, [lastKind]);
      lastKind = question.skill;
      qCard.innerHTML = '';
      qCard.append(Challenge.compactHead(question));
      const row = el('div', {class:'pvz-opts'});
      question.options.forEach(o => {
        const b = el('button', {class:'pvz-opt'},
          o.kind === 'emoji' ? el('span', {style:'font-size:26px'}, o.label) : o.label);
        b.onclick = () => answer(o, b);
        row.append(b);
      });
      qCard.append(row);
      Say.announce(question.say, 120);
      qAge = 0;
    }

    function answer(o, btn){
      if (!running || qCard.dataset.lock) return;
      qCard.dataset.lock = '1';
      const ok = o.correct;
      Memory.score(question.target, question.skill, ok, {chose:o.ch});
      if (ok){
        btn.classList.add('good'); Sfx.great();
        sun += 50; paintSun();
        UI.toast({emoji:'☀️', text:'+50 阳光', sub:`${question.target}　${Data.char(question.target).py}`, ms:900});
        Say.char(question.target);
        const zapped = zombies.filter(z => z.ch === question.target);
        zapped.forEach(z => { z.node.classList.add('zap'); setTimeout(() => z.node.classList.remove('zap'), 300); hurt(z, 180, true); });
        if (zapped.length) UI.toast({emoji:'⚡', text:`汉字闪电！劈中 ${zapped.length} 个`, ms:1100});
      } else {
        btn.classList.add('bad'); Sfx.soft();
        UI.toast({emoji:'🤔', text:UI.nudge(), ms:900});
        setTimeout(() => Say.char(question.target), 350);
      }
      setTimeout(() => { delete qCard.dataset.lock; newQuestion(); }, ok ? 850 : 1050);
    }

    /* ---------------------------------------------------------- zombies -- */
    function spawn(){
      const def = Data.zombie(rand(L.mix)) || Data.ZOMBIES[0];
      const row = Math.floor(Math.random() * ROWS);
      const ch = rand(pool);
      const node = el('div', {class:'zomb'});
      const body = el('div', {class:'zb', html:Art.zombie(def.id)});
      node.append(body, el('div', {class:'zc'}, ch));
      lawn.append(node);
      const r = lawn.getBoundingClientRect();
      const z = {row, x:r.width + 20, hp:def.hp, armor:def.armor || 0, node, body, ch, def,
                 speed:def.speed, slowT:0, jumped:!def.jump, summoned:!def.summon, eat:0};
      if (def.fly) node.classList.add('fly');
      zombies.push(z);
      quota++;
    }

    function hurt(z, dmg, ignoreArmor){
      if (z.armor > 0 && !ignoreArmor){
        z.armor -= dmg;
        if (z.armor <= 0){
          z.body.innerHTML = Art.zombie('basic');    // the hat comes off
          if (z.def.rage) z.speed *= 1.9;
        }
      } else z.hp -= dmg;
      z.node.style.filter = 'brightness(2)';
      setTimeout(() => { if (z.node) z.node.style.filter = ''; }, 80);
      if (z.hp <= 0) kill(z);
    }

    function kill(z){
      UI.sparkleAt(z.node, 8, ['💀','✨']);
      z.node.classList.add('die');
      const n = z.node; setTimeout(() => n.remove(), 380);
      const i = zombies.indexOf(z); if (i >= 0) zombies.splice(i, 1);
      killed++;
      meterFill.style.width = Math.min(100, killed / totalZ * 100) + '%';
      Sfx.tone(170, .16, 'sawtooth', .08);
    }

    /* ------------------------------------------------------------- loop -- */
    let sunT = 6;
    function tick(dt){
      if (!running) return;
      const s = dt / 1000;
      measure();

      Object.keys(cds).forEach(k => { if (cds[k] > 0){ cds[k] = Math.max(0, cds[k] - s); } });
      paintTray();

      qAge += s;
      if (qAge > 16) newQuestion();

      sunT -= s;
      if (sunT <= 0){ skySun(); sunT = L.night ? 99 : 7 + Math.random() * 4; }

      // falling sun
      for (let i = suns.length - 1; i >= 0; i--){
        const o = suns[i];
        if (o.y < o.ty){ o.y = Math.min(o.ty, o.y + 90 * s); o.node.style.top = o.y + 'px'; }
        else { o.life -= s; if (o.life < 2) o.node.style.opacity = Math.max(0, o.life / 2); }
        if (o.life <= 0){ o.node.remove(); suns.splice(i, 1); }
      }

      // plants
      plants.slice().forEach(p => {
        p.t += s;
        const d = p.def;
        if (d.kind === 'sun' && p.t >= d.rate){
          p.t = 0;
          dropSun(p.col * cellW + cellW * 0.2, p.row * cellH + cellH * 0.15, d.yield);
        }
        if (d.kind === 'mine' && !p.armed && p.t >= d.arm){
          p.armed = true; p.node.classList.remove('arming');
        }
        if (d.kind === 'shoot' && p.t >= d.rate){
          const rows = d.lanes === 3
            ? [p.row - 1, p.row, p.row + 1].filter(r => r >= 0 && r < ROWS) : [p.row];
          const any = rows.some(r => zombies.some(z => z.row === r && z.x > p.col * cellW));
          if (any){
            p.t = 0;
            rows.forEach(r => {
              fire(p, r);
              if (d.twin) setTimeout(() => running && fire(p, r), 150);
            });
          }
        }
        if (d.kind === 'chomp'){
          if (p.busy > 0){ p.busy -= s; p.node.classList.toggle('chewing', p.busy > 0); return; }
          const prey = zombies.find(z => z.row === p.row &&
            z.x > p.col * cellW && z.x < (p.col + 1.6) * cellW);
          if (prey){ kill(prey); p.busy = d.rate; p.node.classList.add('chewing'); Sfx.pop(); }
        }
        if (d.kind === 'squash'){
          const prey = zombies.find(z => z.row === p.row &&
            Math.abs(z.x - (p.col + 0.5) * cellW) < cellW * 1.1);
          if (prey){
            p.node.classList.add('squash-jump');
            hurt(prey, d.dmg, true); Sfx.boom();
            setTimeout(() => removePlant(p), 320);
          }
        }
        if (d.kind === 'magnet' && p.t >= d.rate){
          const target = zombies.find(z => z.armor > 0 && Math.abs(z.row - p.row) <= 1 &&
                                            Math.abs(z.x / cellW - p.col) < 3.5);
          if (target){
            p.t = 0; target.armor = 0;
            const g = target.body.querySelector('.gear'); if (g) g.remove();
            UI.sparkleAt(p.node, 8, ['🧲']); Sfx.pop();
          }
        }
      });

      function fire(p, row){
        const b = el('div', {class:'pea', html:Art.pea(p.def.slow)});
        lawn.append(b);
        b.style.top = (row * cellH + cellH * 0.5 - 8) + 'px';
        shots.push({row, x:p.col * cellW + cellW * 0.65, dmg:p.def.dmg, node:b, slow:!!p.def.slow});
      }

      // bullets
      const lw = lawn.getBoundingClientRect().width;
      for (let i = shots.length - 1; i >= 0; i--){
        const b = shots[i];
        b.x += 330 * s;
        b.node.style.left = b.x + 'px';
        const z = zombies.find(z => z.row === b.row && !z.def.fly &&
                                    Math.abs(z.x - b.x) < cellW * 0.45);
        if (z){
          hurt(z, b.dmg);
          if (b.slow) z.slowT = 3;
          b.node.remove(); shots.splice(i, 1); continue;
        }
        if (b.x > lw + 30){ b.node.remove(); shots.splice(i, 1); }
      }

      // zombies
      for (let i = zombies.length - 1; i >= 0; i--){
        const z = zombies[i];
        if (z.slowT > 0){ z.slowT -= s; z.node.classList.add('slow'); }
        else z.node.classList.remove('slow');

        if (!z.summoned && z.x < lw * 0.7){
          z.summoned = true;
          for (let k = 0; k < 2; k++){
            const def = Data.zombie('basic');
            const n2 = el('div', {class:'zomb'});
            n2.append(el('div', {class:'zb', html:Art.zombie('basic')}),
                      el('div', {class:'zc'}, rand(pool)));
            lawn.append(n2);
            zombies.push({row:Math.max(0, Math.min(ROWS - 1, z.row + (k ? 1 : -1))),
                          x:z.x + 30, hp:def.hp, armor:0, node:n2,
                          body:n2.firstChild, ch:n2.lastChild.textContent, def,
                          speed:def.speed, slowT:0, jumped:true, summoned:true, eat:0});
          }
          UI.toast({emoji:'🕺', text:'舞王叫来了帮手！', ms:900});
        }

        const col = Math.floor(z.x / cellW);
        const front = z.def.fly ? null : plants.find(p => p.row === z.row && p.col === col);

        if (front && front.def.kind === 'spike'){
          front.t2 = (front.t2 || 0) + s;
          if (front.t2 > 0.5){ front.t2 = 0; hurt(z, front.def.dmg); }
          z.x -= z.speed * (z.slowT > 0 ? .45 : 1) * s * WALK;
        } else if (front && front.def.kind === 'mine' && front.armed){
          explode(front, 0.6);
        } else if (front && !z.jumped && !front.def.tall){
          z.jumped = true;
          z.node.classList.add('hop');
          z.x -= cellW * 1.1;
          setTimeout(() => z.node.classList.remove('hop'), 420);
        } else if (front){
          front.hp -= EAT_DPS * s;
          front.node.classList.add('bitten');
          z.eat += s;
          if (z.eat > .35){ z.eat = 0; Sfx.tone(120, .05, 'square', .04); }
          if (front.hp <= 0) removePlant(front);
        } else {
          z.x -= z.speed * (z.slowT > 0 ? .45 : 1) * s * WALK;
        }

        z.node.style.left = (z.x - SPRITE * .5) + 'px';
        z.node.style.width = SPRITE + 'px';
        z.node.style.top = (z.row * cellH + (cellH - SPRITE) / 2) + 'px';
        z.node.style.height = SPRITE + 'px';

        if (z.x < 6){
          const m = mowers.find(m => m.row === z.row && m.alive && !m.running);
          if (m){
            m.running = true; m.node.classList.add('go'); Sfx.whoosh();
            refreshMowers();
            UI.toast({emoji:'🚜', text:'割草机出动了！', sub:'这一行没有第二台了', ms:1200});
          } else if (!mowers.some(m => m.row === z.row && m.running)){
            // walked the whole lawn with nothing left to stop it — that is the game
            Sfx.boom();
            return lose(z.row);
          }
        }
      }

      // lawnmowers
      mowers.forEach(m => {
        if (!m.running) return;
        m.x += 420 * s;
        m.node.style.transform = `translateX(${m.x}px)`;
        zombies.slice().forEach(z => {
          if (z.row === m.row && z.x < m.x + cellW * .6) kill(z);
        });
        if (m.x > lw + 60){ m.running = false; m.alive = false;
                            m.node.style.display = 'none'; refreshMowers(); }
      });

      // waves
      if (quota < L.per * (wave + 1) && wave < L.waves){
        spawnT -= dt;
        if (spawnT <= 0){ spawn(); spawnT = Math.max(1200, 3400 - L.n * 130 - wave * 380); }
      } else if (!zombies.length){
        if (wave + 1 >= L.waves) return win();
        wave++;
        if (wave === L.waves - 1 && !bigWaveShown){
          bigWaveShown = true;
          banner('一大波僵尸正在接近！');
        } else banner(`第 ${wave + 1} 波`);
        Sfx.whoosh();
      }
    }

    function banner(text){
      const b = el('div', {class:'bigwave'}, text);
      FX().append(b);
      setTimeout(() => b.remove(), 1800);
    }

    function refreshMowers(){
      const left = mowers.filter(m => m.alive && !m.running).length;
      const b = bar.querySelector('.mowpill b');
      if (b) b.textContent = String(left);
      const pill = bar.querySelector('.mowpill');
      if (pill) pill.classList.toggle('hot', left === 0);
    }

    /* -------------------------------------------------------------- end -- */
    function stop(){ running = false; if (loop) loop.stop(); }

    function win(){
      stop(); UI.confetti(80); Sfx.fanfare();
      const first = !Store.data.pvzWins;      // first clear ever pays more
      Store.data.pvzWins = (Store.data.pvzWins || 0) + 1;
      Store.award({stars:first ? 5 : 2, coins:60, xp:40});
      Store.giveBadge('pvz' + L.n, `通关 第${L.n}关`);
      Store.save();
      Say.line('太厉害了，僵尸全被打跑啦');
      over('🏆', '这一关守住了！', first ? '⭐ +5　解锁下一关' : '⭐ +2', true);
    }
    function lose(row){
      stop(); Sfx.soft();
      Say.line('僵尸走到头了，我们再来一次');
      over('🧟', '僵尸走完了草坪',
           (row === undefined ? '' : `第 ${row + 1} 行被冲破了 —— `) +
           '把豌豆射手往前排一点，再试一次', false);
    }
    function over(emoji, title, sub, won){
      const wrap = el('div', {class:'center', style:'position:absolute;inset:0;z-index:40;background:#0009'});
      const card = el('div', {class:'card', style:'margin:0 20px;text-align:center;max-width:360px'});
      card.append(el('div', {style:'font-size:56px'}, emoji));
      card.append(el('div', {style:'font-size:22px;font-weight:900;margin:6px 0'}, title));
      card.append(el('div', {class:'hint'}, sub));
      card.append(UI.bigBtn('b-leaf', '🔁', '再玩一次', '', () => { wrap.remove(); Pvz.start(opts); }));
      if (opts.onDone){
        // running inside a unit: hand control back to the adventure
        card.append(UI.bigBtn('b-gold', '✅', '完成这一关', '',
          () => { wrap.remove(); opts.onDone({game:'battle', chars:pool.slice(0, 6),
                                              correct:killed, total:quota || killed}); }));
      } else {
        card.append(UI.bigBtn('b-slate', '🗺️', '回去选别的玩', '', () => Screens.pvzMap()));
      }
      wrap.append(card);
      scr.append(wrap);
    }
    function quit(){ stop(); Music.play('menu');
                     if (opts.onQuit) opts.onQuit(); else Screens.pvzMap(); }

    /* -------------------------------------------------- nothing to fight with --
       A first-time player owns only 向日葵, which makes sun and cannot hurt
       anything — so the lawn is unwinnable and he has no way to know why.
       Say it before the wave starts, and put the shop one tap away. */
    function armed(){
      return (Store.data.plants || []).some(id => {
        const pl = Data.plant(id);
        return pl && pl.kind !== 'sun';
      });
    }

    function noWeaponsCard(after){
      const wrap = el('div', {class:'center', style:'position:absolute;inset:0;z-index:45;background:#0009'});
      const card = el('div', {class:'card', style:'margin:0 20px;text-align:center;max-width:350px'});
      card.append(el('div', {style:'font-size:52px'}, '🌻'));
      card.append(el('div', {style:'font-size:20px;font-weight:900;margin:6px 0'},
                     '你现在只有向日葵'));
      card.append(el('div', {class:'hint'},
        '向日葵只会产阳光，打不动僵尸。先去商店买一株会打的植物 —— ' +
        `⭐ 星星是答对汉字题赚来的，你现在有 ${Store.data.stars} 颗。`));
      card.append(UI.bigBtn('b-rose', '🛒', '去商店买植物', `⭐ ${Store.data.stars}`,
        () => { wrap.remove(); stop();
                Screens.shop({back:{go:() => Pvz.start(opts)}}); }));
      card.append(UI.bigBtn('b-slate', '👀', '先看看这一关', '不买也可以逛逛',
        () => { wrap.remove(); after(); }));
      wrap.append(card);
      scr.append(wrap);
    }

    /* ------------------------------------------------------------- boot -- */
    setTimeout(() => {
      measure(); newQuestion(); paintTray();
      Music.play(L.night ? 'night' : 'lawn');
      banner(L.name);
      UI.toast({emoji:'☀️', text:'点掉下来的阳光收集它', sub:'答对汉字题 = +50 阳光 + 汉字闪电', ms:2400});
      const go = () => { loop = Loop.run(tick); };
      // the wave does not start until he has dismissed the notice
      if (armed()) go(); else noWeaponsCard(go);
    }, 140);
  },
};


/* -----------------------------------------------------------------------------
   汉字保卫战 as the last stage of a unit.

   The battle used to live only on its own map, which meant the characters it
   threw at you had nothing to do with what you had just studied. Run at the end
   of a unit it becomes the payoff for that unit: the zombies wear those
   characters, and the level number climbs as the units do, so the reward gets
   harder alongside the reading.
   -------------------------------------------------------------------------- */
const GameBattle = {
  id:'battle', name:'汉字保卫战', icon:'🧟', color:'b-leaf',
  blurb:'用这一关的字打僵尸',

  /** needs enough characters to label zombies and fill the question options */
  available(chars){ return (chars || []).length >= 4; },

  /** one lawn; the characters are what change between chapters */
  levelFor(unitId){
    return 1;                      // there is only one lawn now
  },

  start(ctx){
    Pvz.start({level:this.levelFor(ctx.unitId), pool:ctx.pool,
               onDone:ctx.onDone, onQuit:ctx.onQuit});

/* ===== 1a-pvz-mini.js ===== */
/* =============================================================================
   小游戏模式 — the three side modes, each with reading built into its core rule
   rather than bolted on as a quiz between rounds.
   ========================================================================== */

const PvzMini = {

  open(id, pool){
    pool = (pool && pool.length >= 4) ? pool
         : (Memory.known().length >= 4 ? Memory.known() : Data.unitChars('g1a-u1'));
    if (id === 'whack')   return this.whack(pool);
    if (id === 'bowling') return this.bowling(pool);
    return this.wall(pool);
  },

  /* ---------------------------------------------- 🔨 打地鼠僵尸 ---------- */
  /* Zombies pop out of graves. Only the ones wearing the target character
     may be whacked — so the child must read every head before swinging.   */
  /** 题面：「只敲 牛」，后面小字补一句「牛肉 的 牛」。

      光写一个孤零零的字，孩子认的是字形；放回词里，认的才是这个字在词里
      长什么样 —— 温故要复习的本来就是「生字 + 组词」两样。字表里没给词的
      字就只报那个字，不硬编。 */
  askLine(ch){
    const w = ((Data.char(ch) || {}).words || [])
      .find(x => x.length > 1 && x.indexOf(ch) >= 0);
    return `只敲 <i>${esc(ch)}</i>！`
         + (w ? `<small class="wd-hint">${esc(w)} 的 ${esc(ch)}</small>` : '');
  },

  /** opts（都可不给）: {title, secs, cover, onDone, onQuit}

      不给就是原来那套小游戏：自己弹结算、退出回小游戏地图。给了 onDone /
      onQuit 就变成冒险路线上的一关，收尾交给外面 —— 温故关就是这么接进去
      的，玩法一行没改。

      cover:true 是复习模式：把这一摞字洗开，一个一个发，敲中了才换下一个，
      发完才算完。小游戏那套是按时间随机换字（整局只换两次），十一个字里
      只考得到三个 —— 复习要的是「每个字都回忆一遍」，所以不能靠随机。

      rounds 是发几轮（默认 2）。每轮单独洗牌，所以同一个字两次之间隔着
      别的字 —— 隔一会儿再想起来才算回忆，连敲两下只是手快。两轮发完，
      敲错过的字再补一轮：错过的多练，没错的不陪着耗。 */
  whack(pool, opts){
    opts = opts || {};
