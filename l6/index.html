        slots[picked.length - 1].textContent = pic;
        slots[picked.length - 1].classList.add('on');
        if (picked.length < 2) return;
        setTimeout(() => {
          if (onDone(picked.join('')) !== false) return;
          // 点错了：摇一摇，重来，不说重话
          Sfx.soft();
          shown.animate([{transform:'translateX(0)'}, {transform:'translateX(-8px)'},
                         {transform:'translateX(8px)'}, {transform:'translateX(0)'}], 340);
          UI.toast({emoji:'🤔', text:'不是这两个哦', sub:'再想想你选的图案', ms:1500});
          picked = [];
          slots.forEach(n => { n.textContent = '？'; n.classList.remove('on'); });
        }, 260);
      };
      grid.append(b);
    });
    scroll.append(grid);

    const back = el('button', {class:'mini', style:'margin-top:16px'}, '← 回名单');
    back.onclick = () => { Sfx.tap(); onGiveUp(); };
    scroll.append(back);

    s.append(scroll);
    UI.mount(s);
    Say.announce(say, 320);
  },

  /** shown at boot, and whenever someone taps 换人 */
  open(){
    Music.play('menu');
    // an empty placeholder from an older build is not a classmate
    const roster = Store.roster().filter(n =>
      n !== EDITION.player || Store.cardOf(n).known > 0 || Store.cardOf(n).stars > 0);
    const s = UI.screen({sky:'sky-day', scenery:true});

    // 小标题是大标题的上款，紧贴着它（首页也是这么排的）
    s.append(el('div', {style:'padding:16px 16px 6px'},
      el('div', {style:'font-size:12.5px;font-weight:800;letter-spacing:2.4px;' +
                       'opacity:.62;line-height:1.2;margin-bottom:1px'}, EDITION.kicker),
      el('div', {style:'font-size:29px;font-weight:900;letter-spacing:2px;text-shadow:0 3px 0 #fff8'},
         EDITION.title)));

    const scroll = el('div', {class:'scroll'});
    scroll.append(el('div', {style:'font-size:19px;font-weight:900;margin:6px 2px 2px'}, '你是谁？'));
    scroll.append(el('div', {class:'hint', style:'text-align:left;padding:2px 2px 12px'},
      roster.length ? '点你的名字，接着上次继续' : '第一次来？写下你的名字就可以开始'));

    if (roster.length){
      const grid = el('div', {class:'whogrid'});
      roster.forEach(name => {
        const c = Store.cardOf(name);
        const b = el('button', {class:'whocard'},
          el('span', {class:'av'}, name.slice(0, 1)),
          el('span', {class:'nm'}, name),
          el('span', {class:'st'}, `⭐ ${c.stars}　认识 ${c.known} 字`));
        if (Store.lockOf(name)) b.append(el('span', {class:'lk'}, '🔒'));
        b.onclick = () => {
          Sfx.tap();
          if (!Store.lockOf(name)) return this.enter(name);
          // 锁必须在换存档之前验 —— 验在之后就等于没锁
          this.askPics({
            title:`${name}，点你的两个小图案`,
            say:'点你的两个小图案',
            onDone:pics => {
              if (Store.unlocks(name, pics)) return this.enter(name);
              return false;                       // 让 askPics 自己摇一摇再来
            },
            onGiveUp:() => this.open(),
          });
        };
        grid.append(b);
      });
      scroll.append(grid);
    }

    /* ---------------------------------------------------------- new one -- */
    const card = el('div', {class:'card', style:'margin-top:14px'});
    card.append(el('div', {style:'font-weight:800;margin-bottom:6px'},
      roster.length ? '新同学' : '写下你的名字'));
    const row = el('div', {style:'display:flex;gap:8px'});
    const input = el('input', {type:'text', maxlength:'12', placeholder:'比如：小明',
      style:'flex:1;font-family:var(--font);font-size:17px;padding:11px 13px;' +
            'border-radius:13px;border:2px solid #ded4f0;background:#fff'});
    const go = el('button', {class:'mini', style:'font-size:15px;padding:11px 16px'}, '开始 →');
    const enter = () => {
      const name = input.value.trim();
      if (!name){
        Sfx.soft();
        UI.toast({emoji:'✍️', text:'先写个名字吧', sub:'写你自己的名字就行', ms:1400});
        return;
      }
      if (Store.roster().includes(name)){
        Sfx.soft();
        UI.toast({emoji:'👀', text:'这个名字已经有人用了', sub:'上面点一下就能继续', ms:1800});
        return;
      }
      Sfx.great();
      // 先挑英雄，再设小锁 —— 挑形象是件开心事，放在前面，孩子就是带着自己
      // 的英雄去设锁，而不是先做一道"手续"。
      this.askHero(name, kind => this.askPics({
        title:`${name}，选两个只有你知道的小图案`,
        say:'选两个只有你知道的小图案，别人就打不开你的游戏了',
        confirm:true,
        onDone:pics => {
          Store.use(name);
          Store.setHero(kind);
          Store.setLock(pics);
          this.enter(name, true);
          return true;
        },
        onGiveUp:() => this.open(),
      }));
    };
    go.onclick = enter;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
    row.append(input, go);
    card.append(row);
    scroll.append(card);

    if (EDITION.credit) scroll.append(el('div', {class:'credit'}, EDITION.credit));

    s.append(scroll);
    UI.mount(s);
    setTimeout(() => { if (!roster.length) input.focus(); }, 300);
  },
};


/* ===== 28-game-dictate.js ===== */
/* =============================================================================
   📝 汉字默写 — 路线的最后一关，也是唯一一关不给看范字的。

   前面每一关都在帮他：象形字给图，描摹给淡淡的底稿，读故事把字放在句子里。
   帮到最后总得撒手一次 —— 「看着范字能描下来」和「听见这个词能自己写出来」
   是两回事，而后者才是家长和老师想知道的那件事。

   判对错交给孩子自己（和旁边的大人）：写完把范字叠上去让他比对，他按
   「写对了 / 没写对」。理由和「跟我读」那一关一样 —— 机器给七岁小孩的
   手写打分不可靠，一个写对了却被判错的孩子，下次就不肯动笔了。
   报告里这一项标着「自评」，不假装是考试成绩。

   写出来的结果记在 recall 这个技能下 —— 记忆模型里它本来就是「凭空想起来」
   的那一格，别的关卡都填不了它。
   ========================================================================== */

const GameDictate = {
  id:'dictate', name:'汉字默写', icon:'📝', color:'b-grape',
  blurb:'听词写字，这次不给看范字',

  /** 只考课本要求会写的字 */
  available(chars){
    return (chars || []).filter(c => (Data.char(c) || {}).learn === '认写').length >= 1;
  },

  /** 题面：把词里的目标字挖掉。「牛肉」→「＿肉」，只给线索不给答案。 */
  clue(ch){
    const info = Data.char(ch) || {};
    const w = (info.words || []).find(x => x.length > 1 && x.indexOf(ch) >= 0);
    return w ? w.split(ch).join('＿') : (info.mean || '');
  },

  start(ctx){
    const SIZE = 320;
    const chars = (ctx.chars || []).filter(c => (Data.char(c) || {}).learn === '认写');
    if (!chars.length) return ctx.onDone({game:'dictate', chars:[], correct:0, total:0});

    const list = shuffle(chars.slice());
    let i = 0, got = 0, asked = 0;

    const scr = UI.screen({sky:'sky-kingdom', title:'📝 汉字默写', onBack:ctx.onQuit});
    const body = el('div', {class:'scroll'});
    scr.append(body);
    UI.mount(scr);

    function round(){
      if (i >= list.length){
        UI.confetti(40);
        return ctx.onDone({game:'dictate', chars:list, correct:got, total:asked});
      }
      const ch = list[i], info = Data.char(ch) || {};
      body.innerHTML = '';

      const dots = el('div', {class:'wdots'});
      list.forEach((_, k) => dots.append(el('i', {class:k < i ? 'on' : k === i ? 'now' : ''})));
      body.append(el('div', {class:'write-head'},
        el('div', {}, el('b', {}, `默写 ${i + 1} / ${list.length}`),
           el('small', {}, '听一听，然后自己写出来'), dots),
        UI.speaker(`${Say.inWord(ch)}`)));

      /* 线索：读音 + 挖了空的词 + 图。字本身一个都不能露 —— 露了就不是默写。 */
      const clue = el('div', {class:'card dict-clue'});
      clue.append(el('div', {class:'dc-e'}, info.emoji || '📝'));
      clue.append(el('div', {class:'dc-t'},
        el('b', {}, GameDictate.clue(ch)),
        el('span', {}, info.py || '')));
      body.append(clue);

      const card = el('div', {class:'card write-card'});
      const box = el('div', {class:'gridbox', style:`width:${SIZE}px;height:${SIZE}px`});

      // 空的米字格：只有格线，没有底稿
      const bg = document.createElement('canvas');
      bg.width = bg.height = SIZE * 2; bg.style.width = bg.style.height = SIZE + 'px';
      const bgg = bg.getContext('2d'); bgg.scale(2, 2);
      bgg.strokeStyle = '#e6ddf2'; bgg.lineWidth = 1.5; bgg.setLineDash([7, 6]);
      [[SIZE/2, 0, SIZE/2, SIZE], [0, SIZE/2, SIZE, SIZE/2],
       [0, 0, SIZE, SIZE], [SIZE, 0, 0, SIZE]].forEach(([x1, y1, x2, y2]) => {
        bgg.beginPath(); bgg.moveTo(x1, y1); bgg.lineTo(x2, y2); bgg.stroke();
      });

      const ink = document.createElement('canvas');
      ink.width = ink.height = SIZE * 2; ink.style.width = ink.style.height = SIZE + 'px';
      ink.className = 'inklayer';
      const ig = ink.getContext('2d'); ig.scale(2, 2);
      ig.lineWidth = SIZE * 0.075; ig.lineCap = 'round'; ig.lineJoin = 'round';
      ig.strokeStyle = '#2f2a3d';

      box.append(bg, ink);
      card.append(box);
      body.append(card);

      let drawing = false, strokes = 0, last = null;
      const at = e => {
        const r = ink.getBoundingClientRect();
        return {x:(e.clientX - r.left) * (SIZE / r.width),
                y:(e.clientY - r.top) * (SIZE / r.height)};
      };
      ink.addEventListener('pointerdown', e => {
        e.preventDefault();
        ink.setPointerCapture(e.pointerId);
        drawing = true; strokes++; last = at(e);
        ig.beginPath(); ig.moveTo(last.x, last.y); ig.lineTo(last.x + 0.1, last.y); ig.stroke();
      });
      ink.addEventListener('pointermove', e => {
        if (!drawing) return;
        const p = at(e);
        ig.beginPath(); ig.moveTo(last.x, last.y); ig.lineTo(p.x, p.y); ig.stroke();
        last = p;
      });
      const stop = () => { drawing = false; };
      ink.addEventListener('pointerup', stop);
      ink.addEventListener('pointercancel', stop);

      const bar = el('div', {class:'story-bar'});
      const again = el('button', {class:'mini'}, '🔊 再听一遍');
      again.onclick = () => { Sfx.tap(); Say.speak(Say.inWord(ch), {rate:0.72, interrupt:true}); };
      const clear = el('button', {class:'mini'}, '↩️ 擦掉重写');
      clear.onclick = () => { Sfx.tap(); ig.clearRect(0, 0, SIZE, SIZE); strokes = 0; };
      bar.append(again, clear);
      body.append(bar);

      /* 「想不起来」不是失败，是"这个字要补课" —— 给他一条不用瞎猜的出路，
         按下去照样记一次没写出来，下次复习会先安排它。 */
      const help = el('button', {class:'mini'}, '🤔 想不起来');
      help.onclick = () => { Sfx.soft(); reveal(false, true); };
      bar.append(help);

      body.append(UI.bigBtn('b-gold', '✅', '写好了', '',
        () => { if (!strokes){ Sfx.soft();
                  UI.toast({emoji:'📝', text:'还没写呢', sub:'用手指在格子里写一写', ms:1100});
                  return; }
                reveal(true, false); }));

      Say.announce(`我们来写${Say.inWord(ch)}`, 320);

      /* ------------------------------------------------ 对答案 --------- */
      function reveal(wrote, gaveUp){
        // 把范字叠在他写的字上面，让他自己看差在哪儿
        bgg.globalAlpha = 0.32; GameWrite.paint(bgg, ch, SIZE, 'fill'); bgg.globalAlpha = 1;
        Say.char(ch);

        body.querySelectorAll('.big-btn, .story-bar').forEach(n => n.remove());
        const ask = el('div', {class:'card dict-check'});
        ask.append(el('div', {class:'dc-q'},
          gaveUp ? `这个字是「${ch}」，看一看，记住它` : `对一对 —— 你写的和「${ch}」像吗？`));

        if (gaveUp){
          ask.append(UI.bigBtn('b-slate', '👀', '记住了，下一个', '', () => done(false)));
        } else {
          const row = el('div', {class:'dc-row'});
          row.append(UI.bigBtn('b-leaf', '✅', '写对了', '', () => done(true)));
          row.append(UI.bigBtn('b-rose', '✍️', '没写对', '再看一眼范字', () => done(false)));
          ask.append(row);
          /* 机器给的相似度只当一句悄悄话，不做判决 —— 判决权在孩子和大人手里 */
          const g = GameWrite.grade(ch, ink);
          ask.append(el('div', {class:'hint', style:'margin-top:6px'},
            g.stars >= 2 ? '（看着挺像的）' : '（形状差得有点多，仔细比比看）'));
        }
        body.append(ask);
      }

      function done(ok){
        asked++;
        if (ok) got++;
        Memory.score(ch, 'recall', ok);
        Store.noteDay('seen'); Store.noteDay(ok ? 'right' : 'wrong');
        if (ok){
          Sfx.great(); UI.sparkleAt(body, 12);
          Store.award({stars:1, coins:10, xp:10});
          Say.cheer('praise', true);
        } else {
          Sfx.soft();
          Store.award({coins:4, xp:4});
        }
        i++;
        setTimeout(round, 700);
      }
    }

    setTimeout(round, 200);
  },
};


/* ===== 29-game-review.js ===== */
/* =============================================================================
   🔨 温故打地鼠 —— 一课之始的第一关
   ========================================================================== */

/* 新课一上来就学新字，上一课的字就只能等着被忘。开头两分钟过一遍旧字，
   正好卡在「快要忘」那个点上。

   为什么用打地鼠：复习要的是「一眼认出来」，不是慢慢想。地鼠三秒就缩回去，
   逼的正是这个。题面带组词（「只敲 牛」底下补一句「牛肉 的 牛」），因为
   复习的本来就是生字和组词两样 —— 光认字形，词里换个位置他又不认得了。

   只在【一课的开头】出现：第一课（下）是同一课的后半，中间插一关复习刚学完
   的字，就又变成「反复写同一个字」了，要的是隔一课再回忆。 */
const GameReview = {
  id:'review', name:'温故打地鼠', icon:'🔨', color:'b-coral',
  blurb:'先把上一课学过的字敲一遍',

  /** 这一课是不是「一课之始」（同一课号里最靠前的那半课）。 */
  isLessonStart(unitId){
    const u = Data.unit(unitId);
    if (!u) return false;
    let first = null;
    (Data.worlds() || []).forEach(w => (w.units || []).forEach(id => {
      const v = Data.unit(id);
      if (v && v.world === u.world && v.n === u.n && (first === null || id < first))
        first = id;
    }));
    return first === unitId;
  },

  /** 前面几课学过的字，整课整课地算（不含本课）。快忘的排前面。 */
  pool(chars, unitId){
    const u = Data.unit(unitId);
    if (!u) return [];
    const older = [];
    (Data.worlds() || []).forEach(w => (w.units || []).forEach(id => {
      const v = Data.unit(id);
      if (!v || v.world !== u.world || v.n >= u.n) return;    // 只要课号更小的
      (v.chars || []).forEach(c => { if (Data.char(c) && older.indexOf(c) < 0) older.push(c); });
    }));
    if (!older.length) return [];
    /* 练过的按「快忘的在前」排，没练过的排后面 —— 两种都要敲到：
       上一课的字这一课都该复习，不管他之前练到哪一步。 */
    const met = older.filter(c => Memory.known().indexOf(c) >= 0);
    const urgent = met.length ? Coach.queue(met, 0) : [];
    const out = urgent.slice();
    older.forEach(c => { if (out.indexOf(c) < 0) out.push(c); });
    return out;
  },

  available(chars, unitId){
    /* 这学期从第 N 课教起的那一版：前面几课在课表里是灰的，根本没学过，
       「温故」就无故可温 —— 这一关不出现。 */
    if (EDITION.from) return false;
    if (!this.isLessonStart(unitId)) return false;
    return this.pool(chars, unitId).length >= 4;
  },

  start(ctx){
    const pool = this.pool(ctx.chars, ctx.unitId);
    if (pool.length < 4) return ctx.onDone({game:'review', chars:[], correct:0, total:0});
    /* 整课整课地复习：上一课的字一个都不落下，所以不截断，而且用发牌模式
       （cover）—— 每个字都当一次目标，敲中了才换下一个。时间给宽一点，它
       是兜底，不是节奏：十一个字敲完就结束，不会干等。 */
    PvzMini.whack(pool, {
      title:'🔨 温故 · 敲一敲上一课的字',
      cover:true,
      rounds:2,                      // 每个字至少敲两遍，中间隔着别的字
      secs:Math.max(90, pool.length * 2 * 7),
      onDone:res => ctx.onDone({game:'review', chars:pool,
                                correct:res.correct, total:res.total}),
      onQuit:ctx.onQuit,
    });
  },
};
/* ===== 30-screens.js ===== */
/* =============================================================================
   SCREENS — home, adventure map, unit page, session runner, 图鉴, weak mode,
   free play and the end-of-session summary.
   ========================================================================== */

/* The practice chain, in a fixed teaching order so no step is ever skipped:
   meet it → recognise it → take it apart → mend it → recall it many ways →
   use it in a sentence → say it fast. 汉字寻宝 was dropped after playtesting
   (Eric: "不好玩，老是卡住"); 汉字保卫战 is the action game now. */
/* 顺序就是教学顺序：先认识，再拆解，再用起来，最后动笔 ——
   默写压在保卫战之后当最后一关，因为它是唯一一关不给看范字的，
   前面所有的帮助都撤掉，考的才是他自己记住了多少。 */
const GAMES = [GameReview, GameOrigin, GameMonster, GamePolish, GameFactory, GameRepair,
               GameMatch, GamePinyin, GameContext, GameSpeed, GameWrite,
               GameRead, GameBattle, GameDictate];
const STAGE_NOTE = {
  review:'先敲一遍旧字', origin:'认识它', monster:'认出它', polish:'擦出来认', factory:'拆开看',
  repair:'补好它', match:'换个方式想起它', context:'用起来', speed:'一眼认出',
  pinyin:'读出它的音', write:'动手写一写', read:'在故事里读到它', battle:'用它打僵尸',
  dictate:'不看范字写出来',
};
/* Extra practice = games that are NOT stages of the route.

   Empty on purpose. 加练 used to hold [擦亮汉字, 描摹, 记忆配对, 汉字快线,
   拼音小站] — four of those five were already stages of the chain, and the
   chain's tiles have been individually tappable since playtesting, so it was
   a second door into the same rooms. 擦亮汉字 was the one thing left in it,
   and it is now a stage too, right after 汉字怪兽: both are "recognise it",
   and letting the shape emerge under the cloth is the gentler of the two.

   The grid still renders anything put here as unnumbered ＋ tiles. Whatever
   goes in must not be in GAMES; the test enforces that. */
const EXTRA_GAMES = [];

const GAME_BY_ID = Object.fromEntries(
  GAMES.concat(EXTRA_GAMES).map(g => [g.id, g]));

const Screens = {

  /* ------------------------------------------------------------- home ---- */
  home(){
    Music.play('menu');
    const d = Store.data;
    const known = Memory.known().length;
    const due = Memory.dueCount();
    const s = UI.screen({sky:'sky-day', scenery:true});

    /* 小标题不再挤在按钮那一行 —— 那一行有自己的内边距，隔出来的空白让
       「CHINESE CHARACTER ADVENTURE」和「汉字大冒险」看着像两回事。它是
       大标题的上款，就该紧贴着它。 */
    const head = el('div', {class:'top', style:'padding-bottom:2px'});
    head.append(el('span', {style:'flex:1'}));   // 占位，按钮照旧靠右
    const musBtn = el('button', {class:'mus' + (Music.muted ? ' off' : '')}, '🎵');
    musBtn.onclick = () => {
      const on = Music.toggle();
      musBtn.classList.toggle('off', !on);
      UI.toast({emoji:on ? '🎵' : '🔇', text:on ? '音乐开' : '音乐关', ms:800});
      if (on) Music.play('menu');
    };
    head.append(musBtn);
    if (!Say.hasChinese()){
      const warn = el('button', {class:'mus', style:'background:#ffd7d7'}, '🔈');
      warn.onclick = () => { Sfx.tap(); Parent.voiceCheck(); };
      head.append(warn);
    }
    const swap = el('button', {class:'mus', style:'font-size:15px;font-weight:900'}, '换人');
    swap.onclick = () => { Sfx.tap(); SignIn.open(); };
    head.append(swap);
    head.append(el('button', {class:'back', style:'font-size:18px',
      onclick:() => { Sfx.tap(); Parent.open(); }}, '⚙️'));
    s.append(head);
    /* 标题贴着按钮那一行往上走。原来这一行是 align-items:flex-end，文字被
       122px 高的小人拽到了行底，上面白白空出一大块 —— 看着挤，是因为字被压
       到了下半截。改成顶部对齐，小人从旁边垂下去。 */
    const head2 = el('div', {style:'display:flex;align-items:flex-start;gap:8px;' +
                                  'padding:0 16px 2px;margin-top:-10px'});
    head2.append(el('div', {style:'flex:1;min-width:0'},
      el('div', {style:'font-size:12.5px;font-weight:800;letter-spacing:2.4px;' +
                       'opacity:.62;line-height:1.2;margin-bottom:1px'}, EDITION.kicker),
      el('div', {style:'font-size:31px;font-weight:900;letter-spacing:2px;text-shadow:0 3px 0 #fff8'},
         EDITION.title),
      /* 问候语和标题之间留一口气。上款贴着标题是因为它们是一件事（一个是
         另一个的注脚）；问候语是另一件事，贴太紧就成了三行挤在一起。 */
      el('div', {style:'font-size:15px;font-weight:700;color:#6b6480;margin-top:11px'},
         `欢迎回来，${Store.who || d.name}！`)));   // the name he registered with
    head2.append(UI.hero(122));
    s.append(head2);

    const stats = el('div', {class:'stats'});
    stats.append(UI.pill('⭐', d.stars, '汉字星'));
    stats.append(UI.pill('🔥', d.streak, '天连续'));
    stats.append(UI.pill('🏆', d.level, '级冒险家'));
    stats.append(UI.pill('🧠', due, '个想复习', due > 0));
    // 经验条原本挂在已经去掉的那块里，挪到这里，不然升级看不出进展
    stats.append(UI.pill('✨', `${d.xp}/${Store.xpNeeded(d.level)}`, '经验'));
    s.append(stats);

    const scroll = el('div', {class:'scroll'});
    /* 两条并排的横条，汉字库在上、接下来在下。它们是一对：一个是"你已经
       收下了什么"，一个是"接着做什么"，同样的形状让人一眼看出这是一组，
       颜色的差别负责说明哪一条是要动手的。 */
    scroll.append(this.libraryBtn());
    scroll.append(this.weakBar(() => this.home()));

    // One book in this build? Then the book IS the home screen — a grid of
    // one card is a menu that asks a question with only one answer.
    const only = Data.worlds().filter(w => w.open);
    if (only.length === 1){
      this.unitList(scroll, only[0]);
      if (EDITION.credit)
        scroll.append(el('div', {class:'credit'}, EDITION.credit));
      s.append(scroll);
      UI.mount(s);
      return;
    }

    // The grades ARE the home screen now. A menu whose first item was
    // 「教材冒险」 and whose other five were side doors made the child pick a
    // category before picking a book; the books are what he actually came for,
    // and everything else belongs inside the book it applies to.
    this.gradeList(scroll);
    if (EDITION.credit) scroll.append(el('div', {class:'credit'}, EDITION.credit));
    s.append(scroll);
    UI.mount(s);
  },

  /** THE recommendation — one card, one thing to do next.

      The child should never have to work out what to practise; the memory
      records already know. Review outranks new material, because forgetting is
      what the schedule exists to catch. Everything below this card is the free
      path — he can still go anywhere he likes, and often should. */
  /** 首页那一条：全课本的薄弱汉字，用闪卡复习。

      以前这里放的是「接下来做什么」的推荐，于是会出现两种没用的形态 ——
      指向某一课（下面目录里就有，说了两遍），或者兜底的「随便玩玩」（等于
      没说）。改成固定讲一件目录里讲不了的事：哪些字快忘了。 */
  /** 复习条：把学过的字全部用闪卡过一遍。

      原来这里只放「快忘了的十来个字」—— 那是抢救，不是复习。老师第二周
      讲新课，孩子还得把第一周的字再见一面，而那些字未必"快忘了"。所以
      这一条改成按【课时进度】走：已经开出来的每一课的字，一个不落。

      顺序照旧按紧急度，快忘的排最前面 —— 孩子中途不想做了，先做掉的
      也正是最该做的那几张。快忘的有几个仍然写在副标题上，那是老师和
      家长真正要看的数字。 */
  weakBar(back){
    const chars = Coach.reviewAll();
    const weak = Coach.weakBook(999).length;
    const b = el('button', {class:'libbar k-' + (chars.length ? 'review' : 'calm')});
    b.append(el('span', {class:'ic'}, chars.length ? '🧠' : '🌈'));
    b.append(el('span', {class:'tx'},
      el('b', {}, chars.length ? `复习学过的 ${chars.length} 个字` : '还没有学过的字'),
      /* 一行写完。写长了会折成两行，这一条就比上面的汉字库高出一截，
         两条并排的"一组"感觉全没了 —— 它们本来就该一样高。 */
      el('small', {}, !chars.length ? '玩一关，字就会收进这里'
                    : weak ? `闪卡过一遍　${weak} 个快忘了`
                           : '闪卡过一遍　巩固一下')));
    if (chars.length){
      /* 只摆三个字。这一条是四列网格（图标｜文字｜字块｜箭头），字块占的是
         固定宽度 —— 摆四个就把文字那一列挤到折行，这一条比上面的汉字库高
         出一截，两条"一组"的样子就散了。 */
      const chips = el('span', {class:'nums chs'});
      chars.slice(0, 3).forEach(c => chips.append(el('i', {}, c)));
      if (chars.length > 3) chips.append(el('i', {class:'more'}, `+${chars.length - 3}`));
      b.append(chips);
      b.append(el('span', {class:'go'}, '›'));
      b.onclick = () => { Sfx.tap();
        Flash.start({chars, back:{go:back}, label:'学过的字'}); };
    } else {
      b.append(el('span', {class:'go'}, ''));
      b.disabled = true;
    }
    return b;
  },

  /** 我的汉字库 — the long-term collection, growing across every book.

      Deliberately NOT another full-height bigBtn: it sits directly under
      「接下来」, and two shouting cards in a row means neither is the primary
      one. A compact bar with the four live numbers on it is prominent because
      it is high up and it changes, not because it is loud. */
  libraryBtn(){
    const st = Coach.stats();
    const b = el('button', {class:'libbar'});
    b.append(el('span', {class:'ic'}, '📚'));
    b.append(el('span', {class:'tx'},
      el('b', {}, '我的汉字库'),
      el('small', {}, st.seen ? `收下了 ${st.seen} 个字` : '玩过的字都会住进来')));
    if (st.seen){
      const nums = el('span', {class:'nums'});
      nums.append(el('i', {class:'g'}, `🏆 ${st.mastered}`));
      nums.append(el('i', {class:'l'}, `🌱 ${st.learning}`));
      if (st.review) nums.append(el('i', {class:'r'}, `🧠 ${st.review}`));
      b.append(nums);
    }
    b.append(el('span', {class:'go'}, '›'));
    b.onclick = () => { Sfx.tap(); Library.open('book', () => this.home()); };
    return b;
  },

  /** 四本教材，每本一张卡片 */
  gradeList(scroll){
    const grid = el('div', {class:'worlds'});
    Data.worlds().forEach(w => {
      const chars = Data.worldChars(w.id);
      const learned = chars.filter(c => Memory.seen(c)).length;
      const pct = chars.length ? learned / chars.length * 100 : 0;
      const b = el('button', {class:'world' + (w.open ? '' : ' locked')});
      b.append(el('div', {class:'art', style:this.worldArt(w.theme)}));
      b.append(el('div', {class:'tag'}, w.open ? `${learned}/${chars.length} 字` : '敬请期待'));
      b.append(el('div', {class:'lbl'},
        el('b', {}, `${w.emoji} ${w.name}`),
        el('span', {}, w.grade + (w.demo ? '　· 演示内容' : w.verify ? '　· 字表待核对' : ''))));
      if (w.open) b.append(el('div', {class:'prog'}, el('i', {style:`width:${pct}%`})));
      b.onclick = () => {
        Sfx.tap();
        if (!w.open) return UI.toast({emoji:'🔒', text:'这本还在做',
                                      sub:'先玩已经开的那几本吧'});
        this.world(w.id);
      };
      grid.append(b);
    });
    scroll.append(grid);
    scroll.append(el('div', {class:'card', style:'margin-top:14px'},
      el('div', {style:'font-weight:800;margin-bottom:6px'}, '更多年级'),
      el('div', {style:'display:flex;gap:8px;flex-wrap:wrap'},
        ...Data.FUTURE_GRADES.map(g =>
          el('span', {class:'word', style:'opacity:.55;font-size:13px'}, g)))));
  },

  /** kept so older call sites still work — the home screen is the map now */
  map(){ this.home(); },

  worldArt(theme){
    const m = {
      forest : 'background:linear-gradient(160deg,#8fe0ff,#c8f0c0 55%,#79c46a)',
      island : 'background:linear-gradient(160deg,#7fd8f7,#ffeec2 55%,#f6c66a)',
      kingdom: 'background:linear-gradient(160deg,#c3a9f7,#ffd7ea 60%,#f4a6c8)',
      planet : 'background:linear-gradient(160deg,#3b3070,#7a5aa8 60%,#c58bb8)',
    };
    return m[theme] || m.forest;
  },

  /** the chapters of one book, as rows */
  unitList(scroll, w){
    scroll.append(el('div', {class:'hint', style:'text-align:left;padding:0 2px 10px'},
      `${w.grade}　`,
      w.demo ? el('span', {class:'demo-tag'}, 'DEMO 演示内容')
             : w.verify ? el('span', {class:'demo-tag'}, '单元结构按教材 · 字表待核对')
             : null));
    w.units.forEach(uid => {
      const u = Data.unit(uid);
      // A lesson with no character list yet is listed but not enterable — a
      // table of contents should be honest about what is coming, and an empty
      // unit page teaches the child that the menu lies.
      const locked = Data.isLocked(uid);
      const ready = (u.chars || []).length > 0 && !u.soon && !locked;
      const learned = (u.chars || []).filter(c => Memory.seen(c)).length;
      const beaten = Store.data.bossBeaten[uid] || 0;
      const b = el('button', {class:'unit' + (ready ? '' : ' soon')});
      b.onclick = () => { Sfx.tap();
        if (locked) return Data.isBeforeStart(uid)
          ? UI.toast({emoji:'📘', text:'这一课这学期不学',
                      sub:'我们从第 ' + EDITION.from + ' 课开始', ms:2000})
          : UI.toast({emoji:'🔒', text:'这半课还没到时候',
                      sub:'把上半课练熟了，老师就放出来', ms:2000});
        if (!ready) return UI.toast({emoji:'🚧', text:'这一课还在做',
                                     sub:'先玩已经开的那几课吧', ms:1600});
        this.unit(uid); };
      b.append(el('div', {class:'n'}, ready ? u.n : Data.isBeforeStart(uid) ? '📘' : '🔒'));
      if (locked) b.classList.add('later');
      b.append(el('div', {class:'t'},
        el('b', {}, u.name, beaten ? ' 🏆' : ''),
        el('span', {}, ready ? `${u.sub}　·　${learned}/${u.chars.length} 个汉字`
                     : locked ? (Data.isBeforeStart(uid)
                                   ? `${u.sub}　·　这学期不学`
                                   : `${u.sub}　·　${u.chars.length} 个字，还没解锁`)
                              : `${u.sub}　·　敬请期待`)));
      b.append(el('div', {class:'chars'}, ready ? u.chars.slice(0, 4).join('') : ''));
      scroll.append(b);
    });
  },

  /** 从一课退出来该回哪儿。

      只有一本书的时候，「汉字岛」那一页和首页装的是同一份课目录 —— 首页
      在 only.length === 1 时就把 unitList 直接铺出来了。于是退出一课先撞见
      一页一模一样的目录，还得再点一次返回才到首页，白挡一层。多本书时它
      才有事可做（那一层是"这本书的目录"），所以按书的数量决定。 */
  bookBack(worldId){
    return Data.worlds().filter(w => w.open).length <= 1
         ? this.home() : this.world(worldId);
  },

  /* ------------------------------------------------------------- world --- */
  world(worldId){
    const w = Data.world(worldId);
    const s = UI.screen({sky:'sky-forest', title:`${w.emoji} ${w.name}`, onBack:() => this.home()});
    const scroll = el('div', {class:'scroll'});
    // The side modes used to live here. They belong one level down: they only
    // mean anything against a particular chapter's characters.
    this.unitList(scroll, w);

    s.append(scroll);
    UI.mount(s);
  },


  /** The side modes, aimed at one chapter's characters and gated on what has
      actually been done with them. An entry that opens an empty 图鉴 or a Boss
      he cannot fight teaches him the menu lies, so each one reports its real
      state and says what would unlock it. */
  toolsFor(chars, back, label, unitId0){
    const met = chars.filter(c => Memory.seen(c));
    const buyable = (typeof PLANTS !== 'undefined' ? PLANTS : [])
      .filter(pl => !Store.owns(pl.id) && Store.data.stars >= pl.star);

    const card = el('div', {class:'card', style:'margin-top:14px'});
    card.append(el('div', {style:'font-weight:800;margin-bottom:4px'}, '更多玩法'));

    const entries = [
      {ready:met.length >= PVZ_MIN_CHARS, color:'b-leaf', ic:'🧟', name:'植物大战僵尸',
       sub:met.length >= PVZ_MIN_CHARS ? '僵尸戴这一关的字　还有 3 个小游戏'
                           : `还差 ${PVZ_MIN_CHARS - met.length} 个字`,
       hint:`僵尸身上要戴你认识的字，至少先学 ${PVZ_MIN_CHARS} 个`,
       go:() => this.pvzMap({chars, back, label})},

      {ready:true, color:'b-sky', ic:'📋', name:'通关报告',
       sub:'这一课学到哪一步了',
       go:() => this.report(unitId0, back && back.go)},

      {ready:true, color:'b-rose', ic:'🛒', name:'商店',
       sub:buyable.length ? `⭐ ${Store.data.stars}　能买 ${buyable.length} 种`
                          : `⭐ ${Store.data.stars}`,
       go:() => this.shop({back})},
    ];
    entries.sort((a, b) => (b.ready ? 1 : 0) - (a.ready ? 1 : 0));

    const grid = el('div', {class:'drills'});
    entries.forEach(e => {
      const b = el('button', {class:`drill ${e.color}` + (e.ready ? '' : ' locked')},
        el('span', {class:'ic'}, e.ready ? e.ic : '🔒'),
        el('b', {}, e.name), el('small', {}, e.sub));
      b.onclick = () => {
        Sfx.tap();
        if (!e.ready) return UI.toast({emoji:'🔒', text:'还没解锁', sub:e.hint, ms:2200});
        e.go();
      };
      grid.append(b);
    });
    card.append(grid);
    return card;
  },

  /** 冒险线路图。课页用它当目录，冒险途中用它当进度条。

      opts:
        stops    这一课的关卡（按顺序）
        unitId   随机布局的种子，同一课每次长得一样
        onPick   点某一关的回调（不传就只看不点）
        showStart 是否画起点那颗大箭头
        onStart  点起点的回调
        current  走到第几关了（0 起）—— 那一关插小红旗，走过的变淡
        scale    整体缩放，冒险途中用小一号的
      返回的元素上挂着 redraw()，上屏之后要调一次（宽度得先量出来）。 */
  roadmap(opts){
    const stops = opts.stops, unitId = opts.unitId || 'x';
    /* 关卡线路图 —— 照 Eric 画的草图。

       前四版都是"在格子里放点，再小幅推开"，抖动加到列宽的四成还是一眼看得
       出三条竖列 —— 因为骨架本来就是网格，抖动只是把格子涂糊了。

       手绘的地图不是那么来的：它是一条路一步步走出来的，每一步朝哪、迈多远
       都不一样。所以这里改成走路：从左上角出发，每一步在"大致朝前"的扇形里
       挑一个方向和步长，撞到边就掉头往下继续走。间距在挑的时候就查，挑不到
       合适的位置才退而求其次 —— 不撞是走出来的，不是事后推开的。

       走法是算死的（种子取自单元 id），所以同一课每次打开长得一模一样；
       会乱跳的地图没法记路。 */
    /* 净空是个椭圆，不是圆：圆点才六十来宽，关卡名有七八十 —— 两点圆心
       差 98 但高度相近时，字照样撞在一起（量出来撞了九处）。 */
    /* CLR_Y 必须大于节点本身的高度（圆点 62 + 文字 16 ≈ 86），否则上下两个
       节点通过了检查却仍然叠在一起 —— 80 的时候 6 和 8 就是这么撞的。 */
    const CLR_X = 104, CLR_Y = 78;
    const tooNear = (P, c) => P.some(q =>
      Math.abs(q.x - c.x) < CLR_X && Math.abs(q.y - c.y) < CLR_Y);
    /* 纵向要压，就得让相邻两关横向拉得更开 —— 净空只要一个方向达标即可。
       所以相位增量从 0.72–1.22 提到 1.0–1.7（更常摆到对面去），纵向步长
       才敢从 52 收到 40。摆不开的那几处由下面的下推兜底。 */
    const PAD_T = 52, STEP_Y = 34;
    const map = el('div', {class:'roadmap' + (opts.scale ? ' small' : '')});

    const wob = (k, salt) => {
      let h = 0;
      const src = unitId + '|' + k + '|' + salt;
      for (let i = 0; i < src.length; i++) h = (h * 31 + src.charCodeAt(i)) | 0;
      const x = Math.sin(h) * 43758.5453;
      return x - Math.floor(x);                        // 0 ~ 1
    };

    /* 缓坡蜿蜒 —— 对比页里的 C。

       x 跟着一条正弦走，每一步的相位增量都不一样，所以左右摆动的节奏不匀；
       y 匀速往下加一点抖动。整条路是绕过去的，没有硬折角 —— 之字形是折出来
       的，这个是绕出来的。

       走的是圆心，不是节点框：文字在圆点上方还是下方每关不同，两个框中心差
       98px，圆点可能只差 67px。净空判定用矩形不用椭圆 —— 标签是方的，椭圆
       会允许"斜着靠近"，两个方框照样叠。

       摆法是算死的（种子取自单元 id），同一课每次打开长得一模一样。 */
    const walk = (w, off) => {
      const amp = w / 2 - 78;                 // 左右摆多远
      const P = [];
      // 从左边出发。初相位为 0 的话第一个点落在右上角，一条路从右上角起步
      // 读起来是别扭的。
      let t = Math.PI * 0.92;
      for (let k = 0; k < pts.length; k++){        // 不是 stops.length+1：起点可有可无
        t += 1.0 + wob(k, 'p') * 0.7;         // 相位增量不匀，摆动才不规则
        P.push({x:w / 2 + Math.sin(t) * amp + (wob(k, 'c') - 0.5) * 30,
                y:PAD_T + k * STEP_Y + (wob(k, 'y') - 0.5) * 18});
      }
      /* 起点和第一关并排站在同一条水平线上 —— 「从这儿出发，第一站就在旁边」
         比"起点在上、第一关在下"更像一条路的开头。横向拉开 120px（两个节点
         的半宽加起来约 88），并排才不挤；下面的数值校正会认这个距离。 */
      if (opts.showStart && P.length > 1){
        P[1].y = P[0].y;
        P[1].x = Math.min(w - 78, P[0].x + 152);
      }
      /* 终点再往下坐一点：它比别人大一圈、旁边还插着旗，跟前一关平着排会显得
         挤，落下去一截才像"走到头了"。 */
      P[P.length - 1].y += 34;
      /* 正弦走到波峰附近时，相邻两关横向几乎不动，就会挤在一起。挤了就把
         后面的往下推 —— 判定用矩形，标签是方的。 */
      for (let k = 1; k < P.length; k++)
        for (let n = 0; n < 60 && tooNear(P.slice(0, k), P[k]); n++) P[k].y += 10;
      return P;
    };

    /* 圆点大小、倾角也不一律 —— 一律就又整齐了 */
    const pts = (opts.showStart ? [{start:true, k:-1}] : [])
      .concat(stops.map((g, k) => ({g, k})))
      .map((p, i) => Object.assign(p, {
        tilt:(wob(i, 't') - 0.5) * 24,
        /* 最后一关大一圈：它是终点，和起点那颗大箭头一头一尾呼应。
           数值校正量的是渲染出来的真实尺寸，所以放大不会撞上别人。 */
        size:p.k === stops.length - 1 ? 80 : 56 + Math.round(wob(i, 'z') * 14),
      }));

    // 先画路，再放点 —— 路要在下面
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'road');
    const road = document.createElementNS(ns, 'path');
    road.setAttribute('class', 'roadline');
    svg.append(road);
    map.append(svg);

    map.redraw = () => {
      // 第一帧宽度可能还没算出来；给个名义宽度先走一遍，免得退回成一条直线
      const w = map.clientWidth || 400;
      const nodes = [...map.querySelectorAll('.stop')];
      const off = nodes.map(n => {
        const a = n.getBoundingClientRect();
        const b = n.querySelector('.dot').getBoundingClientRect();
        return (b.top + b.height / 2) - (a.top + a.height / 2);
      });
      const P = walk(w, off);
      const h = Math.max(...P.map(q => q.y)) + 92;
      map.style.height = h + 'px';
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      /* 字放圆点上面还是下面，看哪边空着 —— 原来是掷骰子决定的，于是有的
         关卡把字甩进了下面那一关的怀里。下面有邻居就往上放，反之往下。 */
      nodes.forEach((n, k) => {
        // 起点的字永远在下面：它是第一个，上面没有关卡要避让，翻上去只会
        // 顶到卡片边上。
        const below = k > 0 && P.some((q, j) => j !== k && q.y > P[k].y &&
                             q.y - P[k].y < 96 && Math.abs(q.x - P[k].x) < 96);
        n.classList.toggle('up', below);
      });
      // 换了边，偏移量得重新量一次
      const off2 = nodes.map(n => {
        const a = n.getBoundingClientRect();
        const b = n.querySelector('.dot').getBoundingClientRect();
        return (b.top + b.height / 2) - (a.top + a.height / 2);
      });
      off.length = 0; off2.forEach(v => off.push(v));

      // 位置在收尾校正算完之后统一写回（见下）
      /* 收尾校正 —— 纯数值算，循环里不碰 DOM。

         上一版是"改一下 style.top，再 getBoundingClientRect 量一下"。看着
         天经地义，实际不成立：同一对（6 和 8）被判定重叠十二次、推了十二次，
         最终位置纹丝不动 —— 边写边量在这里拿不到刚写进去的结果。

         所以改成：每个节点的【尺寸】量一次（尺寸和位置无关，量一次就够），
         之后全在数字上算，算完统一写回。 */
      const sizeOf = n => {
        const d = n.querySelector('.dot').getBoundingClientRect();
        let l = n.querySelector('.lbl').getBoundingClientRect();
        /* 标签被藏起来时（冒险途中的进度图就不写关卡名）它的矩形是全零，
           直接拿来算会把"顶部"当成屏幕原点，节点被推到一千七百像素开外。
           没有标签就只按圆点算。 */
        if (!l.width || !l.height) l = d;
        const cy = d.top + d.height / 2;
        return {hw:Math.max(d.width, l.width) / 2 + 5,   // 半宽（含一点余量）
                up:cy - Math.min(d.top, l.top) + 4,      // 圆心往上占多少
                dn:Math.max(d.bottom, l.bottom) - cy + 4};
      };
      const box = nodes.map(sizeOf);
      const MIN_C = 80;                       // 圆心之间至少这么远
      for (let sweep = 0; sweep < 40; sweep++){
        let moved = false;
        for (let a = 0; a < P.length; a++) for (let b = a + 1; b < P.length; b++){
          const dx = Math.abs(P[a].x - P[b].x);
          const overlapX = dx < box[a].hw + box[b].hw;
          const aTop = P[a].y - box[a].up, aBot = P[a].y + box[a].dn;
          const bTop = P[b].y - box[b].up, bBot = P[b].y + box[b].dn;
          const boxHit = overlapX && Math.min(aBot, bBot) > Math.max(aTop, bTop);

          /* 「方框不叠」还不够 —— 两关可以不重叠却明显挤在一起（量到过 70px，
             看着就是黏在一块）。所以再要一条最小圆心间距。 */
          const gap = Math.hypot(P[a].x - P[b].x, P[a].y - P[b].y);
          const needY = dx < MIN_C ? Math.sqrt(MIN_C * MIN_C - dx * dx) : 0;
          const tooClose = gap < MIN_C;
          if (!boxHit && !tooClose) continue;

          // 谁在上面谁不动，下面那个让开
          const lo = P[a].y <= P[b].y ? b : a, hi = lo === b ? a : b;
          let push = 0;
          if (boxHit) push = (P[hi].y + box[hi].dn) - (P[lo].y - box[lo].up) + 4;
          if (tooClose) push = Math.max(push, needY - Math.abs(P[a].y - P[b].y) + 2);
          P[lo].y += push;
          moved = true;
        }
        if (!moved) break;
      }
      nodes.forEach((n, k) => {
        n.style.left = P[k].x + 'px';
        n.style.top  = (P[k].y - off[k]) + 'px';
      });

      // 挪完了高度可能不够，重算一次
      const h2 = Math.max(...P.map(q => q.y)) + 92;
      map.style.height = h2 + 'px';
      svg.setAttribute('viewBox', `0 0 ${w} ${h2}`);
      /* 路用 Catmull-Rom 穿过每个点：一笔画下来的连贯感，比一段段贝塞尔
         接起来更像手画的。 */
      let d = `M ${P[0].x} ${P[0].y}`;
      for (let i = 0; i < P.length - 1; i++){
        const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || P[i + 1];
        d += ` C ${p1.x + (p2.x - p0.x) / 6} ${p1.y + (p2.y - p0.y) / 6},` +
             ` ${p2.x - (p3.x - p1.x) / 6} ${p2.y - (p3.y - p1.y) / 6},` +
             ` ${p2.x} ${p2.y}`;
      }
      road.setAttribute('d', d);
    };

    pts.forEach(({g, k, start, tilt, above, size}) => {
      if (start){
        const go = el('button', {class:'stop startdot' + (above ? ' up' : ''),
                                 style:'width:132px'});
        go.append(el('span', {class:'dot'}, el('i', {}, '▶')));
        // 只写「开始冒险」。「0/5」那个进度上面的字表已经在用星星表示了，
        // 摆在起点下面只是把这颗按钮说小了。
        go.append(el('span', {class:'lbl'}, el('b', {}, opts.startLabel || '开始冒险')));
        go.onclick = () => { Sfx.fanfare(); if (opts.onStart) opts.onStart(); };
        map.append(go);
        return;
      }
      const extra = !!(opts.extras && opts.extras.includes(g));
      /* 横向抖动直接写进 calc() 里。以前只在 redraw() 里应用，万一那一帧
         宽度还没算出来，整张图就退回成一板一眼的网格 —— 而且看不出哪儿错了。
         写在这里，乱是默认状态，不依赖任何时机。 */
      const node = el('button', {class:'stop' + (extra ? ' extra' : '') +
                                        (above ? ' up' : ''),
                                 style:'width:132px'});
      node.append(el('span', {class:'dot ' + (g.color || 'b-slate'),
                              style:`transform:rotate(${tilt.toFixed(1)}deg);` +
                                    `width:${size}px;height:${size}px`},
        el('i', {}, g.icon),
        el('b', {}, extra ? '＋' : String(k + 1))));
      /* 地图上只写关卡名。带上「认出它」那行说明的话，标签就有两行三十几像素
         高，在手机宽度上和"打散"直接冲突 —— 补了六轮几何都还剩几处压字。
         草图上圈里也只有名字。说明进关卡里再说，那时候他正需要。 */
      node.append(el('span', {class:'lbl'}, el('b', {}, g.name)));
      /* 旗子：没在冒险时插在终点（一条路得有个终点）；冒险途中插在正在
         玩的那一关上，走过的关卡变淡 —— 一眼看得出走到哪儿了。 */
      const cur = opts.current;
      if (cur == null){
        if (k === stops.length - 1) node.append(UI.flag());
      } else {
        if (k === cur){
          node.append(UI.flag());
          node.classList.add('here');       // 光圈 + 旗子，一眼看得出"我在这儿"
        }
        if (k < cur)  node.classList.add('walked');
        if (k > cur)  node.classList.add('ahead');
      }
      if (opts.onPick) node.onclick = () => { Sfx.tap(); opts.onPick(g, k); };
      else node.disabled = true;
      map.append(node);
    });


    return map;
  },

  /* -------------------------------------------------------------- unit --- */
  unit(unitId){
    /* 点进一课就把这一课的声音装上。孩子还在看课页、还没点「开始冒险」，
       这几秒正好用来下载 —— 等他进第一关时已经装好了。 */
    Say.loadFor(unitId);
    Say.warmRest();
    const u = Data.unit(unitId);
    const s = UI.screen({sky:'sky-forest', title:`第${u.n}单元 · ${u.name}`, onBack:() => this.bookBack(u.world)});
    const scroll = el('div', {class:'scroll'});

    const card = el('div', {class:'card'});
    card.append(el('div', {style:'font-weight:800;margin-bottom:8px'}, '这一关的汉字'));
    const row = el('div', {style:'display:flex;gap:8px;flex-wrap:wrap'});
    u.chars.forEach(c => {
      const r = Store.data.chars[c];
      const t = el('button', {class:'tile', style:'min-width:46px;width:62px;height:70px;flex-direction:column;gap:0'},
        UI.glyph(c, 32),
        el('span', {style:'font-size:10px;color:#6b6480'}, Memory.stars(c)));
      t.onclick = () => { Sfx.tap(); Say.char(c); Dex.card(c, () => this.unit(unitId)); };
      row.append(t);
    });
    card.append(row);
    scroll.append(card);

    /* "Weak" is read two ways on purpose: characters the schedule says are due,
       AND characters he keeps getting wrong regardless of the clock. A
       character missed twice this morning is weak now, not in six minutes when
       its review timer expires. */
    const weakNow = Coach.queue(u.chars);

    /* One slot, always in the same place: directly above 开始冒险. Two states
       that look nothing alike, because they mean opposite things — a ticket
       with a torn edge and a 先做这个 ribbon when something is slipping, a flat
       grey line when nothing is. Same position either way, so he learns where
       to look instead of hunting for a banner that moves. */
    const wk = el('div', {class:'weakslot' + (weakNow.length ? '' : ' calm')});
    if (weakNow.length){
      wk.append(el('div', {class:'ribbon'}, '先做这个'));
      wk.append(el('div', {class:'wc-head'},
        el('span', {class:'ic'}, '🧠'),
        el('span', {},
          el('b', {}, `${weakNow.length} 个字快忘了`),
          el('small', {}, '答错过、或者好久没见的字'))));
      const chips = el('div', {class:'wc-chips'});
      weakNow.slice(0, 8).forEach(c => chips.append(el('i', {}, c)));
      if (weakNow.length > 8) chips.append(el('i', {class:'more'}, `+${weakNow.length - 8}`));
      wk.append(chips);
      const go = el('button', {class:'wc-go'}, '🃏 用字卡复习一遍', el('small', {}, '两分钟就好'));
      go.onclick = () => { Sfx.tap();
        Flash.start({chars:weakNow, back:{go:() => this.unit(unitId)}, label:'这一关'}); };
      wk.append(go);
    } else {
      wk.append(el('div', {class:'wc-head'},
        el('span', {class:'ic'}, '🌈'),
        el('span', {},
          el('b', {}, '暂时没有薄弱汉字'),
          el('small', {}, '多玩几关，答错或忘掉的字会出现在这里'))));
    }
    scroll.append(wk);

    const stages = GAMES.filter(g => !g.available || g.available(u.chars, unitId));

    const path = el('div', {class:'card'});
    // Ten full-width rows pushed everything below off the screen. Two columns
    // of compact tiles say the same thing in half the height, and the stage
    // note moves into the tile as one small line.
    /* 关卡线路图 —— 照 Eric 画的草图：一条横着走的波浪，圆点一上一下。

       第一版做成了竖向蛇形（左右交替往下滚），方向反了，而且十二关拉了一千
       多像素。改成横向：一行走 4 关，上下上下地起伏，走到头折回来接下一行，
       线是连着的。十二关三行，四百多像素就够。 */
    const stops = stages.concat(
      EXTRA_GAMES.filter(g => !stages.includes(g))
                 .filter(g => !g.available || g.available(u.chars, unitId)));
    const map = this.roadmap({
      stops, unitId, showStart:true,
      onStart:() => Session.start({unitId, pool:u.chars}),
      onPick:(g) => Session.single(g, {unitId, pool:u.chars}),
    });
    path.append(map);
    scroll.append(path);

    scroll.append(this.toolsFor(u.chars,
      {unitId, go:() => this.unit(unitId)}, `这一关`, unitId));

    s.append(scroll);
    UI.mount(s);
    /* 量宽度必须在上屏之后，而且上屏那一瞬间 clientWidth 可能还是 0
       （布局还没算）。所以排一次、下一帧再排一次 —— 第一次白跑也没关系，
       第二次一定拿得到宽度。 */
    map.redraw();
    requestAnimationFrame(() => { map.redraw(); requestAnimationFrame(() => map.redraw()); });
    if (!Screens._roadResize){
      Screens._roadResize = true;
      window.addEventListener('resize', () => {
        document.querySelectorAll('.roadmap').forEach(m => m.redraw && m.redraw());
      });
    }
  },

  /* ---------------------------------------------------------- free play -- */
  freePlay(){
    const known = Memory.known();
    const pool = known.length >= 4 ? known : Data.unitChars('g1a-u1');
    const s = UI.screen({sky:'sky-island', title:'🎮 自由游戏', onBack:() => this.home()});
    const scroll = el('div', {class:'scroll'});
    scroll.append(el('div', {class:'hint', style:'padding-top:0'},
      '想玩什么就玩什么 —— 出现的汉字会自动挑该复习的那些'));
    const menu = el('div', {class:'menu'});
    GAMES.filter(g => !g.available || g.available(pool, null)).forEach(g =>
      menu.append(UI.bigBtn(g.color, g.icon, g.name, g.blurb,
        () => Session.single(g, {pool, mix:'any'}))));
    scroll.append(menu);
    s.append(scroll);
    UI.mount(s);
  },

  /* --------------------------------------------------------- weak mode --- */
  /** opts: {chars, back:{go}, label} — or nothing for the whole collection */
  weak(opts){
    const scope = opts && opts.chars ? new Set(opts.chars) : null;
    const list = [...new Set([...Memory.due(), ...Memory.weak()])]
                 .filter(c => !scope || scope.has(c)).slice(0, 8);
    const back = (opts && opts.back && opts.back.go) || (() => this.home());
    const s = UI.screen({sky:'sky-kingdom',
      title:'🧠 薄弱汉字' + (opts && opts.label ? `　${opts.label}` : ''), onBack:back});
    const scroll = el('div', {class:'scroll'});

    if (!list.length){
      scroll.append(el('div', {class:'card', style:'text-align:center'},
        el('div', {style:'font-size:48px'}, '🌈'),
        el('div', {style:'font-size:19px;font-weight:800;margin:8px 0'}, '现在一个都没有！'),
        el('div', {class:'hint'}, '再去冒险几次，这里就会出现想找你玩的汉字')));
      scroll.append(UI.bigBtn('b-gold', '🗺️', '去冒险', '', () => this.map()));
    } else {
      scroll.append(el('div', {class:'card'},
        el('div', {style:'font-size:18px;font-weight:800'},
           `这些汉字想和${Store.who || Store.data.name}再玩一次！`),
        el('div', {class:'hint', style:'text-align:left;padding:6px 0 10px'},
          '它们有点想不起来了，一起去帮帮它们吧'),
        el('div', {style:'display:flex;gap:8px;flex-wrap:wrap'},
          ...list.map(c => {
            const r = Store.data.chars[c];
            return el('button', {class:'tile', style:'width:64px;height:74px;flex-direction:column',
              onclick:() => { Sfx.tap(); Dex.card(c, () => this.weak()); }},
              UI.glyph(c, 32),
              el('span', {style:'font-size:10px;color:#6b6480'}, Memory.stars(c)));
          }))));
      // Flash cards first: review is about fetching a character cold, and the
      // mini-games all give him options to choose between.
      scroll.append(UI.bigBtn('b-gold', '🃏', '闪字卡复习',
        `${list.length} 张 —— 先自己说，再翻过来对`,
        () => Flash.start({chars:list, back:{go:() => this.weak(opts)},
                           label:(opts && opts.label) || ''})));
      scroll.append(UI.bigBtn('b-grape', '🎮', '换成小游戏', '混着几种玩法来复习',
        () => Session.start({pool:list, mix:'review', rounds:3, title:'薄弱汉字挑战'})));
    }
    s.append(scroll);
    UI.mount(s);
  },

  /* -------------------------------------------------------- boss picker -- */
  bossPick(worldId){
    const back = worldId && Data.world(worldId)
               ? () => this.bookBack(worldId) : () => this.home();
    const s = UI.screen({sky:'sky-night', title:'👹 Boss挑战', onBack:back});
    const scroll = el('div', {class:'scroll'});
    scroll.append(el('div', {class:'card', style:'text-align:center'},
      el('div', {style:'font-size:56px'}, '👹'),
      el('div', {style:'font-size:18px;font-weight:800'}, '遗忘怪兽'),
      el('div', {class:'hint'}, '它专门偷走你记住的汉字。只考学过的字，五招，五种不同的想法。')));

    const anyKnown = Memory.known().length >= 3;
    Data.WORLDS.filter(w => w.open && (!worldId || w.id === worldId))
      .forEach(w => w.units.forEach(uid => {
      const u = Data.unit(uid);
      const met = u.chars.filter(c => Memory.seen(c)).length;
      scroll.append(UI.bigBtn(met >= 3 ? 'b-grape' : 'b-slate', '⚔️',
        `第${u.n}单元 · ${u.name}`, met >= 3 ? `已认识 ${met} 个字` : '先去学几个字再来',
        () => met >= 3 ? Session.boss({unitId:uid, pool:u.chars})
                       : UI.toast({emoji:'🔒', text:'先去冒险认识几个字', sub:'认识 3 个就能挑战'})));
    }));
    if (anyKnown){
      scroll.append(UI.bigBtn('b-coral', '🔥', '全部汉字大乱斗', '从所有学过的字里出题',
        () => Session.boss({pool:Memory.known()})));
    }
    s.append(scroll);
    UI.mount(s);
  },

  /* ----------------------------------------------------------- summary --- */
  summary(res){
    const s = UI.screen({sky:'sky-day', scenery:true});
    const scroll = el('div', {class:'scroll', style:'padding-top:26px'});
    UI.confetti(50); Sfx.fanfare();
    const who = Store.who || Store.data.name;
    const u = res.unitId && Data.unit(res.unitId);

    const card = el('div', {class:'card', style:'text-align:center'});
    card.append(el('div', {style:'font-size:52px'}, '🎉'));
    card.append(el('div', {style:'font-size:24px;font-weight:900;margin:4px 0 2px'},
                   u ? `${u.name} 完成！` : `${who} 今天变强了！`));
    card.append(el('div', {class:'hint'},
                   `今天认识：${res.met.length} 个汉字`));

    /* Three buckets, by the mastery actually shown right now. Naming the
       bottom one 「需要救援」 rather than 「不会」 matters: it is a job to do,
       not a verdict on him. */
    const lv = ch => Memory.level(ch);
    const good = res.met.filter(c => lv(c) >= 3);
    const mid  = res.met.filter(c => lv(c) === 2);
    const low  = res.met.filter(c => lv(c) <= 1);
    if (res.met.length){
      const tally = el('div', {class:'tally'});
      [['🏆', good, '已掌握', 'g'], ['⭐⭐', mid, '继续加油', 'm'],
       ['⭐', low, '需要救援', 'l']].forEach(([ic, list, lbl, k]) => {
        if (!list.length) return;
        const t = el('div', {class:'ty t-' + k},
          el('span', {class:'i'}, ic), el('b', {}, String(list.length)),
          el('small', {}, lbl));
        tally.append(t);
      });
      card.append(tally);

      card.append(el('div', {style:'font-weight:800;margin-top:12px'}, '今天遇到了'));
      const row = el('div', {class:'sum-ch'});
      res.met.forEach(c => row.append(el('b', {class:lv(c) >= 3 ? 'sm-good' : ''}, c)));
      card.append(row);
    }

    const loot = el('div', {class:'loot'});
    loot.append(el('span', {}, `⭐ +${res.stars}`));
    loot.append(el('span', {}, `🪙 +${res.coins}`));
    loot.append(el('span', {}, `🏆 ${Store.data.level} 级`));
    card.append(loot);

    // A badge earned in THIS session, if any — shown once, big.
    if (res.badge) card.append(el('div', {class:'badge-win'},
      el('div', {style:'font-size:40px'}, '🎖️'),
      el('div', {}, el('small', {}, '获得徽章'), el('b', {}, res.badge.label))));

    /* Streak, framed as a gift and never as something at risk. A child who
       misses two days should come back to a welcome, not to a broken counter,
       so nothing here mentions losing it. */
    if (Store.data.streak >= 2)
      card.append(el('div', {class:'hint', style:'margin-top:10px'},
        `🔥 连续学习 ${Store.data.streak} 天`));

    scroll.append(card);

    // The appointment for next time. This is the spaced-repetition schedule
    // speaking to the child in his own terms.
    const back = Coach.comingBack(36);
    if (back.length){
      const nx = el('div', {class:'card comeback'});
      nx.append(el('div', {class:'cb-h'}, '📅 明天见'));
      nx.append(el('div', {class:'cb-t'},
        `有 ${back.length} 个汉字会回来找你！`));
      const chips = el('div', {class:'cb-chips'});
      back.slice(0, 8).forEach(c => chips.append(el('i', {}, c)));
      nx.append(chips);
      scroll.append(nx);
    }

    // Back to the unit first. Coming out of one drill the child almost always
    // wants another go at the same unit, and bouncing him to the top menu made
    // him re-navigate three screens to get there.
    if (u){
      /* 报告放在最上面：一整轮走完，最想看的就是"到底学到什么程度了"。
         小结那张卡是说给孩子听的，报告是给大人看的，分开两页。 */
      scroll.append(UI.bigBtn('b-sky', '📋', '通关报告',
        '这一课每个字学到哪一步　可截图给老师', () => this.report(u.id)));
      scroll.append(UI.bigBtn('b-gold', '↩️', '回到这一节',
        `${u.name}　还能再练一关`, () => this.unit(u.id)));
      scroll.append(UI.bigBtn('b-slate', '🏠', '回到冒险地图', '', () => this.home()));
    } else {
      scroll.append(UI.bigBtn('b-gold', '🏠', '回到冒险地图', '', () => this.home()));
    }
    s.append(scroll);
    UI.mount(s);
    Say.cheer('finish', true);
  },
};


/* ===== 31-dex.js ===== */
/* =============================================================================
   汉字图鉴 — a collection book, not a progress report. Every character Eric has
   met gets a card; the ones he has not met yet are visible but greyed, so the
   book itself is an invitation.
   ========================================================================== */

const Dex = {

  /** bottom sheet for one character */
  card(ch, back){
    const info = Data.char(ch);
    if (!info) return;
    const r = Store.data.chars[ch];
    /* 看一眼字卡不算练过。

       原来这里 Memory.expose(ch) —— 它会给这个字建一条记录。于是孩子在
       课页上点一下「妈」听个读音，这个字立刻算"学过了"，进了首页的复习
       列表，而他一关都还没玩。复习列表里冒出没见过的字，孩子翻到就懵。

       字进不进复习，由游戏说了算：答对答错、描红、读故事，那些地方才调
       expose / score。这里只是个字典条目，什么都不该改。 */

    const old = document.querySelector('.sheet');
    if (old) old.remove();

    const sh = el('div', {class:'sheet'});
    sh.append(el('div', {style:'display:flex;justify-content:flex-end'},
      el('button', {class:'mini', onclick:() => { Sfx.tap(); sh.remove(); }}, '关闭 ✕')));
    sh.append(el('div', {class:'hero-g'}, ch));
    sh.append(el('div', {class:'py'}, info.py, el('span', {style:'opacity:.6;font-size:15px'},
      `　${info.mean}　${info.en}`)));
    sh.append(el('div', {style:'text-align:center;margin-top:6px'},
      el('span', {class:'word', style:'background:#fff3d6'},
         info.learn === '认写' ? '会认 + 会写' : '会认')));

    const words = el('div', {class:'words'});
    info.words.forEach(w => {
      const b = el('button', {class:'word', style:'border:none;cursor:pointer;font-family:inherit'}, w);
      b.onclick = () => { Sfx.tap(); Say.word(w); };
      words.append(b);
    });
    sh.append(words);

    if (info.origin) sh.append(el('div', {class:'card', style:'margin-top:14px;text-align:center'},
      el('div', {style:'font-size:38px'}, info.origin.emoji),
      el('div', {style:'font-size:14px;font-weight:700;color:#6b6480;margin-top:4px'},
         `${info.origin.kind}字 · ${info.origin.note}`)));

    if (r){
      const box = el('div', {style:'margin-top:14px'});
      box.append(el('div', {class:'kv'}, el('span', {}, '见过'), el('b', {}, `${r.exposures} 次`)));
      box.append(el('div', {class:'kv'}, el('span', {}, '答对'), el('b', {}, `${r.correct} 次`)));
      box.append(el('div', {class:'kv'}, el('span', {}, '熟练度'), el('b', {}, MASTERY_LABEL[r.mastery])));
      const weak = Memory.weakSkills(r);
      if (weak.length) box.append(el('div', {class:'kv'},
        el('span', {}, '还需要练'), el('b', {}, weak.map(s => SKILL_CN[s]).join('、'))));
      if (r.nextReview) box.append(el('div', {class:'kv'},
        el('span', {}, '下次复习'), el('b', {}, this.when(r.nextReview))));
      sh.append(box);
    } else {
      sh.append(el('div', {class:'hint', style:'margin-top:12px'}, '还没在冒险里遇到过它'));
    }

    const row = el('div', {class:'row'});
    row.append(UI.bigBtn('b-sky',  '🔊', '听一听', '', () => Say.char(ch)));
    row.append(UI.bigBtn('b-coral','🎮', '玩这个字', '', () => {
      sh.remove();
      Session.start({pool:[ch, ...Memory.distractors(ch, Data.all(), 5)],
                     mix:'any', rounds:2, title:`和「${ch}」玩`, focus:[ch]});
    }));
    sh.append(row);

    FX().append(sh);
    sh.style.pointerEvents = 'auto';
    Say.char(ch);
  },

  when(ts){
    const d = ts - Date.now();
    if (d <= 0) return '现在就想玩！';
    const m = Math.round(d / 60000);
    if (m < 60) return `${m} 分钟后`;
    const h = Math.round(m / 60);
    if (h < 24) return `${h} 小时后`;
    return `${Math.round(h / 24)} 天后`;
  },
};

/** opts: {chars, back:{go}, label} — or nothing for the whole collection */
Screens.dex = function(opts){
  const back = (opts && opts.back && opts.back.go) || (() => this.home());
  const s = UI.screen({sky:'sky-island',
    title:'📖 汉字图鉴' + (opts && opts.label ? `　${opts.label}` : ''), onBack:back});
  // scoped when opened from a chapter — a 图鉴 of everything is a wall
  const all = (opts && opts.chars) || Data.all();
  const known = all.filter(c => Memory.seen(c));
  const scroll = el('div', {class:'scroll'});
  scroll.append(el('div', {class:'hint', style:'padding-top:0'},
    `已收集 ${known.length} / ${all.length} 个汉字`));

  const grid = el('div', {class:'dex'});
  all.forEach(c => {
    const info = Data.char(c);
    const r = Store.data.chars[c];
    const b = el('button', {class:'dexc' + (r ? '' : ' dim')});
    b.append(el('span', {class:'g'}, c));
    b.append(el('span', {class:'p'}, r ? info.py : '？'));
    b.append(el('span', {class:'s'}, Memory.stars(c)));
    b.onclick = () => { Sfx.tap(); Dex.card(c, () => this.dex()); };
    grid.append(b);
  });
  scroll.append(grid);

  const badges = Store.data.badges;
  if (badges.length) scroll.append(el('div', {class:'card', style:'margin-top:16px'},
    el('div', {style:'font-weight:800;margin-bottom:8px'}, '🏅 徽章'),
    el('div', {style:'display:flex;gap:8px;flex-wrap:wrap'},
      ...badges.map(b => el('span', {class:'word'}, '🏅 ' + b.label)))));

  s.append(scroll);
  UI.mount(s);
};
