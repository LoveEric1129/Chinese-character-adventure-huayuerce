/* ===== 34-library.js ===== */
/* =============================================================================
   我的汉字库 — everything he has ever met, in one place.

   This is deliberately NOT a progress report. The four numbers at the top are
   the whole of the statistics; below them it is a wall of characters he can
   tap, which is the part a seven-year-old actually comes back for. Anything
   more analytical belongs in 家长中心.
   ========================================================================== */

const Library = {

  /** by:'book' | 'star' */
  open(by, back){
    by = by || 'book';
    const go = back || (() => Screens.home());
    const s = UI.screen({sky:'sky-kingdom', title:'📚 我的汉字库', onBack:go});
    const scroll = el('div', {class:'scroll'});

    const st = Coach.stats();
    const box = el('div', {class:'libstat'});
    [['👀', st.seen, '见过'], ['🌱', st.learning, '正在学'],
     ['🏆', st.mastered, '已掌握'], ['🧠', st.review, '要复习']]
      .forEach(([ic, n, lbl]) => box.append(el('div', {class:'ls'},
        el('span', {class:'i'}, ic), el('b', {}, String(n)), el('small', {}, lbl))));
    scroll.append(box);

    if (!st.seen){
      scroll.append(el('div', {class:'card', style:'text-align:center'},
        el('div', {style:'font-size:46px'}, '🌱'),
        el('div', {style:'font-size:18px;font-weight:800;margin:8px 0 2px'}, '还是空的'),
        el('div', {class:'hint'}, '去玩一关，认识过的字就会住进来')));
      scroll.append(UI.bigBtn('b-gold', '🚀', '去冒险', '', go));
      s.append(scroll); UI.mount(s); return;
    }

    const tabs = el('div', {class:'libtabs'});
    [['book', '按课本'], ['star', '按熟练度']].forEach(([id, lbl]) => {
      const b = el('button', {class:'lt' + (by === id ? ' on' : '')}, lbl);
      b.onclick = () => { Sfx.tap(); this.open(id, go); };
      tabs.append(b);
    });
    scroll.append(tabs);

    (by === 'star' ? this.byStar() : this.byBook())
      .forEach(g => { if (g.chars.length) scroll.append(this.group(g, by, go)); });

    s.append(scroll);
    UI.mount(s);
  },

  /** grouped by the book and lesson he met them in */
  byBook(){
    const out = [];
    Data.worlds().forEach(w => {
      const chars = Data.worldChars(w.id).filter(c => Memory.seen(c));
      if (chars.length) out.push({title:`${w.emoji} ${w.grade}`, chars});
    });
    // characters added by a parent, or met somewhere no longer listed
    const placed = new Set(out.flatMap(g => g.chars));
    const rest = Memory.known().filter(c => Data.char(c) && !placed.has(c));
    if (rest.length) out.push({title:'✨ 其他', chars:rest});
    return out;
  },

  /** grouped by how well he actually knows them right now */
  byStar(){
    const buckets = [
      {title:'🏆 已掌握', min:3, chars:[]},
      {title:'⭐⭐ 快会了', min:2, chars:[]},
      {title:'⭐ 还需要练', min:1, chars:[]},
      {title:'🌱 刚见过', min:0, chars:[]},
    ];
    Memory.known().filter(c => Data.char(c)).forEach(c => {
      const lv = Memory.level(c);
      (buckets.find(b => lv >= b.min) || buckets[3]).chars.push(c);
    });
    return buckets;
  },

  group(g, by, go){
    const card = el('div', {class:'card'});
    card.append(el('div', {style:'font-weight:800;margin-bottom:8px'},
      g.title, el('span', {style:'font-weight:700;color:#6b6480;font-size:13px'},
                  `　${g.chars.length} 个`)));
    const wrap = el('div', {class:'libgrid'});
    g.chars.forEach(c => {
      const faded = Memory.faded(c);
      const b = el('button', {class:'libc' + (faded ? ' fade' : '')});
      b.append(el('span', {class:'g'}, c));
      b.append(el('span', {class:'s'}, Memory.stars(c)));
      b.onclick = () => { Sfx.tap(); Say.char(c); Dex.card(c, () => this.open(by, go)); };
      wrap.append(b);
    });
    card.append(wrap);
    return card;
  },
};


/* ===== 35-report.js ===== */
/* =============================================================================
   📋 通关报告 — 一屏说清「这一课学到什么程度了」，截图就能交给老师。

   为什么单独做一页，而不是把数字塞进通关小结：小结是给孩子看的（撒花、
   拿到几颗星、明天见），说的是"你真棒"；报告是给大人看的，说的是"哪几个
   字还没过关"。两种话写在一张纸上，谁都读不痛快。

   每一项都注明来源，不把两种不同硬度的证据混着说：
     · 认读 / 掌握  —— 游戏判的对错，客观
     · 默写        —— 孩子自己按的「写对了 / 没写对」，标着「自评」
   一份看得出水分在哪儿的报告，比一份漂亮但不知道怎么来的有用。
   ========================================================================== */

const Report = {

  /** 这一课每个字的一行数据 */
  rows(unitId){
    return Data.unitChars(unitId).map(ch => {
      const r = Store.data.chars[ch] || null;
      const sk = (r && r.skills) || {};
      const rec = sk.recall || {c:0, i:0};
      const right = r ? (r.correct || 0) : 0;
      const wrong = r ? (r.incorrect || 0) : 0;
      return {
        ch,
        met:    !!r,
        level:  r ? Memory.level(ch) : 0,          // 0–3
        right, wrong,
        acc:    right + wrong ? right / (right + wrong) : 0,
        // 默写：写对过就算过；只错过就是没过；没考过是 null
        dict:   rec.c > 0 ? true : (rec.i > 0 ? false : null),
        skills: SKILLS.filter(s => (sk[s] || {}).c > 0).length,
      };
    });
  },

  sum(unitId){
    const rs = this.rows(unitId);
    const d = rs.filter(r => r.dict !== null);
    return {
      rows: rs,
      total: rs.length,
      met: rs.filter(r => r.met).length,
      mastered: rs.filter(r => r.level >= 3).length,
      dictDone: d.length,
      dictOK: d.filter(r => r.dict).length,
      right: rs.reduce((a, r) => a + r.right, 0),
      wrong: rs.reduce((a, r) => a + r.wrong, 0),
    };
  },

  today(){
    const t = new Date();
    return `${t.getFullYear()}年${t.getMonth() + 1}月${t.getDate()}日`;
  },
};

/** opts: {unitId, back} */
Screens.report = function(unitId, back){
  const u = Data.unit(unitId);
  if (!u) return this.home();
  const S = Report.sum(unitId);
  const who = Store.who || Store.data.name;

  const s = UI.screen({sky:'sky-day', title:'📋 通关报告',
                       onBack: back || (() => this.unit(unitId)), scenery:false});
  const scroll = el('div', {class:'scroll'});

  /* 抬头：谁、哪一课、哪一天 —— 截图交上去，这三样缺一不可 */
  const head = el('div', {class:'card rep-head'});
  head.append(el('div', {class:'rp-name'}, who));
  head.append(el('div', {class:'rp-sub'}, `${EDITION.grade || u.grade || ''}　${u.name}`));
  head.append(el('div', {class:'rp-sub'}, Report.today()));
  scroll.append(head);

  /* 四个大数字 */
  const big = el('div', {class:'rep-big'});
  const cell = (n, of, lbl, cls) => el('div', {class:'rb ' + (cls || '')},
    el('b', {}, of == null ? String(n) : `${n}/${of}`), el('small', {}, lbl));
  big.append(cell(S.met, S.total, '认过的字'));
  big.append(cell(S.mastered, S.total, '已掌握', S.mastered === S.total ? 'ok' : ''));
  big.append(cell(S.dictOK, S.total, '默写写对', S.dictOK === S.total ? 'ok' : ''));
  big.append(cell(S.right + S.wrong ? Math.round(S.right / (S.right + S.wrong) * 100) + '%' : '—',
                  null, '答题正确率'));
  scroll.append(big);

  /* 逐字明细。一行一个字，老师一眼看得出哪个还没过。 */
  const tb = el('div', {class:'card rep-tab'});
  tb.append(el('div', {class:'rt-h'},
    el('span', {}, '汉字'), el('span', {}, '掌握'),
    el('span', {}, '答对/答错'), el('span', {}, '默写')));
  S.rows.forEach(r => {
    const row = el('div', {class:'rt-r' + (r.met ? '' : ' none')});
    row.append(el('span', {class:'rt-c'}, r.ch));
    row.append(el('span', {}, r.met ? '★'.repeat(r.level) + '☆'.repeat(3 - r.level) : '—'));
    row.append(el('span', {}, r.met ? `${r.right} / ${r.wrong}` : '—'));
    row.append(el('span', {class:r.dict === true ? 'ok' : r.dict === false ? 'no' : ''},
                  r.dict === true ? '✅' : r.dict === false ? '✍️ 待加强' : '—'));
    tb.append(row);
  });
  scroll.append(tb);

  /* 默写这一项是孩子自己判的，报告里必须说清楚，不然老师会当成考试成绩 */
  scroll.append(el('div', {class:'hint', style:'text-align:left;padding:2px 4px 10px'},
    S.dictDone
      ? `默写由孩子对照范字自评（已默 ${S.dictDone} 个字）。「掌握」和「答对/答错」是游戏判的。`
      : '还没做过默写 —— 走完一整轮冒险，最后一关就是默写。'));

  /* 累计：这个孩子在这个游戏里一共走了多远 */
  const all = el('div', {class:'card'});
  all.append(el('div', {style:'font-weight:800;margin-bottom:8px'}, '累计'));
  const g = el('div', {class:'rep-sm'});
  [[`${Memory.known().length}`, '认过的字'],
   [`${(Store.data.daysPlayed || []).length}`, '学习天数'],
   [`${Store.data.streak}`, '连续天数'],
   [`${Store.data.stars}`, '汉字星']].forEach(([n, l]) =>
    g.append(el('div', {}, el('b', {}, n), el('small', {}, l))));
  all.append(g);
  scroll.append(all);

  scroll.append(el('div', {class:'hint'}, '截图这一页，就可以交给老师了'));
  scroll.append(UI.bigBtn('b-slate', '↩️', '回到这一课', '', () => Screens.unit(unitId)));

  s.append(scroll);
  UI.mount(s);
};


/* ===== 40-parent.js ===== */
/* =============================================================================
   家长面板 — content editing and progress export. Reached from the ⚙️ on the
   home screen. Deliberately not password-protected; it is a family device.
   ========================================================================== */

const Parent = {

  /** 语音自检 —— 直接在屏幕上打印结果，不用开控制台 */
  voiceCheck(){
    const old = document.querySelector('.sheet'); if (old) old.remove();
    const sh = el('div', {class:'sheet'});
    sh.append(el('div', {style:'display:flex;justify-content:space-between;align-items:center'},
      el('div', {style:'font-weight:900;font-size:19px'}, '🔈 语音自检'),
      el('button', {class:'mini', onclick:() => sh.remove()}, '关闭 ✕')));
    const pre = el('pre', {style:'white-space:pre-wrap;font:13px/1.6 ui-monospace,monospace;' +
                                 'background:#fff;border-radius:14px;padding:12px;margin:12px 0'},
                   '检测中…');
    sh.append(pre);

    /* Which voice reads to the child matters: the playful macOS voices carry a
       noticeable accent in Mandarin. Auto-pick leads with Tingting, but let a
       grown-up audition the alternatives and lock one in. */
    const chooser = el('div', {class:'card', style:'background:#fff'});
    chooser.append(el('div', {style:'font-weight:800;margin-bottom:8px'}, '朗读用哪个声音'));
    const sel = el('select', {style:'width:100%;padding:9px;border-radius:10px;' +
                                    'border:2px solid #ddd;font-size:15px'});
    const fill = () => {
      sel.innerHTML = '';
      const auto = el('option', {value:''}, '自动挑选（推荐：婷婷）');
      sel.append(auto);
      Say.candidates().forEach(v => {
        const o = el('option', {value:v.name},
          v.name + (Say.PLAYFUL.test(v.name) ? '　（趣味音，有口音）' : ''));
        sel.append(o);
      });
      sel.value = Store.data.voiceName || '';
    };
    fill();
    sel.onchange = () => {
      Store.data.voiceName = sel.value;
      Store.save();
      Say.vIndex = 0; Say.voice = Say.pick();
      Say.speak('小鸟在天上飞，鱼儿在水里游', {rate:0.85, interrupt:true});
    };
    chooser.append(sel);
    chooser.append(el('div', {class:'hint', style:'margin-top:8px'},
      '选完会立刻念一句给你听。觉得有口音就换一个。'));
    sh.append(chooser);

    const tip = el('div', {class:'card', style:'background:#fff5d8'});
    tip.append(el('div', {style:'font-weight:800;margin-bottom:6px'}, '如果没有中文语音'));
    tip.append(el('div', {style:'font-size:13.5px;line-height:1.7'},
      'Mac：系统设置 → 辅助功能 → 朗读内容 → 系统声音 旁边的 ⓘ → 管理声音 → ',
      el('b', {}, '中文（中国大陆）'), ' → 下载「婷婷」或「美佳」，下载完刷新页面即可。', el('br'),
      'iPad：设置 → 辅助功能 → 朗读内容 → 声音 → 中文 → 下载。', el('br'),
      el('b', {}, '换个浏览器试试也行'), ' —— Safari 通常自带中文语音，Chrome 用的是同一套系统声音。'));
    sh.append(tip);

    sh.append(el('div', {style:'display:flex;gap:8px;flex-wrap:wrap'},
      el('button', {class:'mini', onclick:() => Say.selfTest(t => pre.textContent = t)}, '↻ 再测一次'),
      el('button', {class:'mini', onclick:() => Say.char('水')}, '念「水」'),   // 会念成「喝水的水」
      el('button', {class:'mini', onclick:() => Say.line('小鸟在天上飞')}, '念一句话'),
      el('div', {class:'hint', style:'width:100%'},
        '版本 ' + BUILD + (EDITION.credit ? '　·　' + EDITION.credit : '')),
      el('button', {class:'mini', onclick:() => {
        pre.textContent = (Say.log.join('\n') || '（没有记录）') +
          '\n\n成功 ' + Say.spoke + ' 次，失败 ' + Say.failed + ' 次';
      }}, '看日志')));

    FX().append(sh);
    sh.style.pointerEvents = 'auto';
    Say.selfTest(t => pre.textContent = t);
  },

  open(){
    const s = UI.screen({sky:'sky-day', title:'⚙️ 家长面板', onBack:() => Screens.home(), scenery:false});
    s.querySelector('.sky').className = 'sky';
    s.querySelector('.sky').style.background = '#eef1f7';
    const scroll = el('div', {class:'scroll'});

    /* ---------------------------------------------------------- summary -- */
    const d = Store.data;
    const known = Memory.known();
    const mastered = known.filter(c => Store.data.chars[c].mastery >= 3).length;
    scroll.append(el('div', {class:'card'},
      el('div', {style:'font-weight:800;margin-bottom:8px'}, '📊 学习概况'),
      el('div', {class:'kv'}, el('span', {}, '认识的汉字'), el('b', {}, `${known.length} 个`)),
      el('div', {class:'kv'}, el('span', {}, '掌握牢固（⭐⭐⭐ 以上）'), el('b', {}, `${mastered} 个`)),
      el('div', {class:'kv'}, el('span', {}, '今天该复习'), el('b', {}, `${Memory.dueCount()} 个`)),
      el('div', {class:'kv'}, el('span', {}, '连续天数 / 游戏次数'), el('b', {}, `${d.streak} / ${d.sessionCount}`)),
      el('div', {class:'kv'}, el('span', {}, '中文语音'),
        el('b', {}, Say.hasChinese() ? '可用 ✓' : '没找到 ❌')),
      el('button', {class:'mini', style:'margin-top:10px', onclick:() => Parent.voiceCheck()},
        '🔈 语音自检')));

    /* ---------------------------------------------------------- 班级 ---- */
    /* Whoever set this up needs to see, in one place, who has actually played
       and how far they got — and to be told plainly that this list only covers
       children who played on THIS device. */
    const roster = Store.roster();
    const cls = el('div', {class:'card'});
    cls.append(el('div', {style:'font-weight:800;margin-bottom:2px'},
      `班级名单（${roster.length} 人）`));
    cls.append(el('div', {class:'hint', style:'text-align:left;padding:2px 0 8px'},
      '只包含在这台设备上玩过的孩子 —— 换设备的进度不会出现在这里'));
    if (!roster.length){
      cls.append(el('div', {class:'hint', style:'text-align:left;padding:0'},
        '还没有人开始。让孩子打开这个文件，写下名字就行。'));
    } else {
      const tbl = el('table', {class:'tbl'});
      tbl.append(el('tr', {}, el('th', {}, '名字'), el('th', {}, '认识'),
                              el('th', {}, '⭐'), el('th', {}, '最近'), el('th', {}, '')));
      roster.forEach(n => {
        const c = Store.cardOf(n);
        const here = n === Store.who;
        /* A seven-year-old will forget which two pictures they chose, and the
           answer to that must not be "lose everything you learned". */
        const unlock = el('button', {class:'mini', style:'padding:5px 9px;font-size:11px'},
                          Store.lockOf(n) ? '重置小锁' : '没设锁');
        unlock.disabled = !Store.lockOf(n);
        unlock.onclick = () => {
          if (!confirm(`清掉「${n}」的两个小图案？下次他进去就不用点图案了，` +
                       `进去以后可以重新选。`)) return;
          Store.clearLock(n);
          Parent.open();
        };
        const del = el('button', {class:'mini', style:'padding:5px 9px;font-size:11px'}, '删除');
        del.onclick = () => {
          if (!confirm(`删除「${n}」的全部进度？这个不能撤销。`)) return;
          Store.forget(n);
          if (here){ Store.who = null; SignIn.open(); } else Parent.open();
        };
        tbl.append(el('tr', {style: here ? 'background:#f3edff' : ''},
          el('td', {}, n + (here ? '　（当前）' : '')),
          el('td', {}, `${c.known} 字`),
          el('td', {}, String(c.stars)),
          el('td', {}, c.last || '—'),
          el('td', {}, unlock, del)));
      });
      cls.append(tbl);
      cls.append(el('button', {class:'mini', style:'margin-top:10px',
        onclick:() => { Sfx.tap(); SignIn.open(); }}, '🔄 换一个孩子'));
    }
    scroll.append(cls);

    /* ------------------------------------------------------ difficulties -- */
    const weak = Memory.weak();
    const tbl = el('table', {class:'tbl'});
    tbl.append(el('tr', {}, el('th', {}, '字'), el('th', {}, '对/错'),
                            el('th', {}, '熟练'), el('th', {}, '薄弱环节')));
    (weak.length ? weak : known).slice(0, 20).forEach(c => {
      const r = Store.data.chars[c];
      tbl.append(el('tr', {},
        el('td', {style:'font-size:20px'}, c),
        el('td', {}, `${r.correct}/${r.incorrect}`),
        el('td', {}, Memory.stars(r.ch)),
        el('td', {}, Memory.weakSkills(r).map(s => SKILL_CN[s]).join('、') || '—')));
    });
    scroll.append(el('div', {class:'card'},
      el('div', {style:'font-weight:800;margin-bottom:8px'}, '🧠 需要多练的字'),
      known.length ? tbl : el('div', {class:'hint'}, '还没有学习记录')));

    /* ---- 放课 -----------------------------------------------------------
       下周要开下半课时，老师自己点一下就行，不用等我改代码重发文件。 */
    const lockable = [];
    Data.worlds().filter(w => w.open).forEach(w => (w.units || []).forEach(id => {
      const u = Data.unit(id);
      if (u && u.locked) lockable.push(u);
    }));
    if (lockable.length){
      const gate = el('div', {class:'card'});
      gate.append(el('div', {style:'font-weight:800;margin-bottom:4px'}, '🔓 放课'));
      gate.append(el('div', {class:'hint', style:'text-align:left;padding:0 0 8px'},
        '孩子看得见这些课是灰的，点不开。到了该学的那一周，在这里放出来。'));
      lockable.forEach(u => {
        const on = !Data.isLocked(u.id);
        const row = el('div', {class:'gaterow'});
        row.append(el('span', {},
          el('b', {}, u.name),
          el('small', {}, `${(u.chars || []).join('')}　${(u.chars || []).length} 个字`)));
        const btn = el('button', {class:'mini'}, on ? '收回去' : '放出来');
        btn.onclick = () => {
          Store.data.unlocked = Store.data.unlocked || {};
          if (on) delete Store.data.unlocked[u.id];
          else Store.data.unlocked[u.id] = true;
          Store.save();
          Parent.open();
        };
        row.append(btn);
        gate.append(row);
      });
      scroll.append(gate);
    }

    /* ---- 本周 ---------------------------------------------------------
       One line per day is all the save keeps, which is enough to answer the
       only question a parent actually asks: is this week going anywhere. */
    const wk = Store.since(7);
    const week = el('div', {class:'card'});
    week.append(el('div', {style:'font-weight:800;margin-bottom:8px'}, '📅 最近七天'));
    week.append(el('div', {class:'pstat'},
      el('div', {}, el('b', {}, String(wk.fresh)),  el('small', {}, '新学的字')),
      el('div', {}, el('b', {}, String(wk.seen)),   el('small', {}, '答题次数')),
      el('div', {}, el('b', {}, wk.seen ? Math.round(wk.right / wk.seen * 100) + '%' : '—'),
                    el('small', {}, '正确率'))));
    scroll.append(week);

    /* ---- 易混字 -------------------------------------------------------
       Built from what he actually tapped when he was wrong, not from a list
       of characters adults think look alike. These same pairs are now fed
       back in as distractors, so the game puts them side by side on purpose. */
    const pairs = Store.confusionPairs(2).slice(0, 8);
    const conf = el('div', {class:'card'});
    conf.append(el('div', {style:'font-weight:800;margin-bottom:4px'}, '👀 最容易混淆'));
    conf.append(el('div', {class:'hint', style:'text-align:left;padding:0 0 8px'},
      pairs.length ? '这些字他答错时选成了对方 —— 出题时已经在把它们放到一起了'
                   : '还没有看到固定认混的字（同一对错 2 次以上才会出现在这里）'));
    if (pairs.length){
      const row = el('div', {style:'display:flex;gap:8px;flex-wrap:wrap'});
      pairs.forEach(pr => row.append(el('span', {class:'confp'},
        pr.a, el('i', {}, '↔'), pr.b, el('small', {}, `${pr.n} 次`))));
      conf.append(row);
    }
    scroll.append(conf);

    /* ----------------------------------------------------- add character -- */
    const f = {};
    const mk = (key, label, ph, tag='input') => {
      const row = el('div', {class:'field-row'});
      row.append(el('label', {}, label));
      const inp = el(tag, {placeholder:ph});
      f[key] = inp; row.append(inp);
      return row;
    };
    const form = el('div', {class:'card'});
    form.append(el('div', {style:'font-weight:800;margin-bottom:8px'}, '➕ 添加 / 修改汉字'));
    form.append(el('div', {class:'hint', style:'text-align:left;padding:0 0 8px'},
      '把核实过的人教版字表按这里的格式加进来即可，游戏逻辑不用改。'));
    form.append(mk('ch',    '汉字',       '例如：目'));
    form.append(mk('py',    '拼音',       '例如：mù'));
    form.append(mk('mean',  '意思（中文）', '例如：眼睛'));
    form.append(mk('en',    '英文（可选）', 'eye'));
    form.append(mk('emoji', '图片提示 emoji', '👁️'));
    form.append(mk('words', '词语（顿号或逗号分隔）', '目light、耳目'));
    form.append(mk('sent',  '句子（用 ___ 表示空格）', '我用眼___看书。'));
    form.append(mk('pic',   '句子配图 emoji', '👁️'));

    const learnRow = el('div', {class:'field-row'});
    learnRow.append(el('label', {}, '类型'));
    const sel = el('select', {});
    sel.append(el('option', {value:'认写'}, '会认 + 会写'));
    sel.append(el('option', {value:'认'}, '只要求会认'));
    learnRow.append(sel); form.append(learnRow);

    const unitRow = el('div', {class:'field-row'});
    unitRow.append(el('label', {}, '归入单元'));
    const usel = el('select', {});
    Object.values(Data.UNITS).forEach(u =>
      usel.append(el('option', {value:u.id}, `${Data.world(u.world).grade} 第${u.n}单元 ${u.name}`)));
    unitRow.append(usel); form.append(unitRow);

    form.append(el('button', {class:'mini', style:'background:#ffd45e', onclick:() => {
      const ch = f.ch.value.trim();
      if (!ch) return alert('请填汉字');
      const rec = {
        ch, py:f.py.value.trim() || '', mean:f.mean.value.trim() || '', en:f.en.value.trim() || '',
        emoji:f.emoji.value.trim() || '❓', learn:sel.value,
        words:(f.words.value.split(/[、,，]/).map(s => s.trim()).filter(Boolean)) || [ch],
        near:[],
      };
      if (!rec.words.length) rec.words = [ch];
      if (f.sent.value.includes('___'))
        rec.sent = {text:f.sent.value.trim(), pic:f.pic.value.trim() || rec.emoji};
      Data.addChar(rec);
      const u = Data.unit(usel.value);
      if (u && !u.chars.includes(ch)) u.chars.push(ch);
      Store.data.addedChars = Store.data.addedChars.filter(r => r.ch !== ch);
      Store.data.addedChars.push(rec);
      Store.save();
      Sfx.good();
      UI.toast({emoji:'✅', text:`已加入「${ch}」`, sub:`${Data.world(u.world).grade} 第${u.n}单元`});
      Object.values(f).forEach(i => i.value = '');
    }}, '保存这个字'));
    scroll.append(form);

    /* --------------------------------------------------- bulk 字表 import -- */
    const bulk = el('div', {class:'card'});
    bulk.append(el('div', {style:'font-weight:800;margin-bottom:6px'}, '📋 批量导入字表'));
    bulk.append(el('div', {class:'hint', style:'text-align:left;padding:0 0 8px'},
      '一行一个字，用空格分开：', el('br'),
      el('code', {style:'font-size:12px'}, '春 chūn 春天,春风,春雨'), el('br'),
      '拼音和词语都可以省略 —— 只贴汉字也能立刻玩（读音用系统语音，不靠拼音）。'));

    const bTarget = el('select', {});
    Object.values(Data.UNITS).forEach(u =>
      bTarget.append(el('option', {value:u.id},
        `${Data.world(u.world).grade} ${u.name}`)));
    const bRow = el('div', {class:'field-row'});
    bRow.append(el('label', {}, '导入到哪个单元'), bTarget);
    bulk.append(bRow);

    const bMode = el('div', {class:'field-row'});
    const bReplace = el('select', {});
    bReplace.append(el('option', {value:'add'}, '追加到这个单元'));
    bReplace.append(el('option', {value:'replace'}, '替换这个单元的全部字'));
    bMode.append(el('label', {}, '方式'), bReplace);
    bulk.append(bMode);

    const bTa = el('textarea', {rows:'6', placeholder:'春 chūn 春天,春风\n夏 xià 夏天\n秋\n冬',
      style:'width:100%;font-size:13px;font-family:monospace'});
    bulk.append(bTa);

    bulk.append(el('button', {class:'mini', style:'background:#ffd45e;margin-top:8px', onclick:() => {
      const u = Data.unit(bTarget.value);
      if (!u) return;
      const lines = bTa.value.split('\n').map(l => l.trim()).filter(Boolean);
      const added = [];
      lines.forEach(line => {
        const parts = line.split(/\s+/);
        const ch = parts[0];
        if (!ch || ch.length > 2) return;               // one character per line
        const py = parts[1] && /[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/.test(parts[1]) ? parts[1] : '';
        const wordsRaw = parts.slice(py ? 2 : 1).join(' ');
        const words = wordsRaw.split(/[、,，]/).map(w => w.trim()).filter(Boolean);
        const existing = Data.char(ch);
        const rec = Object.assign({near:[], learn:'认'}, existing || {}, {
          ch, py: py || (existing && existing.py) || '',
          words: words.length ? words : (existing && existing.words) || [ch],
          mean: (existing && existing.mean) || '',
          en: (existing && existing.en) || '',
        });
        Data.addChar(rec);
        Store.data.addedChars = Store.data.addedChars.filter(r => r.ch !== ch);
        Store.data.addedChars.push(rec);
        added.push(ch);
      });
      if (!added.length) return alert('没读出任何汉字，检查一下格式');
      if (bReplace.value === 'replace') u.chars = added.slice();
      else added.forEach(c => { if (!u.chars.includes(c)) u.chars.push(c); });
      Store.data.unitOverrides = Store.data.unitOverrides || {};
      Store.data.unitOverrides[u.id] = u.chars.slice();
      Store.save();
      Sfx.great();
      UI.toast({emoji:'📋', text:`导入 ${added.length} 个字`,
                sub:`${u.name} 现在有 ${u.chars.length} 个`, ms:1800});
      bTa.value = '';
    }}, '导入'));
    scroll.append(bulk);

    /* ------------------------------------------------------ save / load -- */
    const io = el('div', {class:'card'});
    io.append(el('div', {style:'font-weight:800;margin-bottom:8px'}, '💾 存档'));
    const ta = el('textarea', {rows:'5', style:'width:100%;font-size:12px;font-family:monospace'});
    io.append(ta);
    const btns = el('div', {style:'display:flex;gap:8px;flex-wrap:wrap;margin-top:8px'});
    btns.append(el('button', {class:'mini', onclick:() => {
      ta.value = Store.exportJSON();
      ta.select();
      UI.toast({emoji:'📤', text:'已导出到下面的框', sub:'全选复制保存即可'});
    }}, '导出进度'));
    btns.append(el('button', {class:'mini', onclick:() => {
      try{ Store.importJSON(ta.value); UI.toast({emoji:'📥', text:'导入成功'}); setTimeout(() => Screens.home(), 800); }
      catch(e){ alert('导入失败：' + e.message); }
    }}, '导入进度'));
    btns.append(el('button', {class:'mini', style:'background:#ffd0d0', onclick:() => {
      if (confirm('确定要清空 Eric 的全部进度吗？此操作不可撤销。')){
        Store.reset(); UI.toast({emoji:'🧹', text:'已清空'}); setTimeout(() => Screens.home(), 700);
      }
    }}, '清空进度'));
    io.append(btns);
    scroll.append(io);

    scroll.append(el('div', {class:'hint'},
      '演示字表仅用于让原型跑起来，不是任何官方教材的字表。'));
    s.append(scroll);
    UI.mount(s);
  },
};


/* ===== 99-app.js ===== */
/* =============================================================================
   SESSION RUNNER + BOOT

   A session is a short chain of mini-games over one set of characters. The
   child picks WHERE to go; the memory model quietly picks WHICH characters
   travel with him.
   ========================================================================== */

const Session = {

  /** walk the whole practice chain, in teaching order, nothing skipped */
  start(opts){
    Store.touchDay();
    const pool = opts.pool && opts.pool.length ? opts.pool : Data.unitChars('g1a-u1');
    let order = GAMES.filter(g => !g.available || g.available(pool, opts.unitId));
    if (!order.length) order = [GameMonster];
    if (opts.rounds) order = order.slice(0, opts.rounds);
    this.run(order, {...opts, pool});
  },

  /** One mini-game on its own. It ends by dropping straight back where it was
      started from — a single drill is a detour, not an occasion, and making the
      child watch a celebration and then pick a destination just to have another
      go at the same unit is friction he pays every single time. */
  single(game, opts){
    Store.touchDay();
    this.run([game], {...opts, brief:true});
  },

  boss(opts){
    Store.touchDay();
    this.run([Boss], {...opts, mix:'review'});
  },

  run(order, opts){
    const pool = opts.pool;
    const before = {stars:Store.data.stars, coins:Store.data.coins};
    const met = new Set();       // 已经真正被某一关练到的字（游戏报回来的）
    const handed = {};           // 每个字被派给过几关
    let i = 0;

    // Leaving mid-way should land where he came from, not at the top level —
    // one mini-game is a detour inside a unit, not the end of the visit.
    const quit = () => {
      if (met.size) this.finish(met, before, opts);
      else if (opts.unitId && Data.unit(opts.unitId)) Screens.unit(opts.unitId);
      else Screens.home();
    };

    const next = () => {
      if (i >= order.length) return this.finish(met, before, opts);
      const game = order[i++];
      /* 描摹练字要把这一课的字全写一遍 —— 它是这条路线上唯一动笔的一关，
         漏掉的字就等于这一课没写过。别的关卡是抽查，四个足够。

         但小课例外：一课只有五六个字时，抽四个意味着每关都漏掉一两个，而
         「发到」还不等于「问到」—— 实测第六课（下）五个字，「入」只被发到
         十一关里的五关，玩下来很可能一次都没考到。字少就别抽了，整课发。 */
      const n = game.id === 'write' ? pool.length
              : pool.length <= 6    ? pool.length
              : game.id === 'match' ? 4
              : game.id === 'speed' ? 3 : 4;
      const chars = opts.focus && opts.focus.length
        ? [...opts.focus, ...Memory.pick(pool.filter(c => !opts.focus.includes(c)), n - opts.focus.length, opts.mix || 'learn')]
        : this.nextChars(pool, n, met, handed, opts.mix || 'learn');

      /* 一关只能有一个结局。上报两次就等于往前走两格 —— 孩子会看见刚打开
         的那一关被下一关顶掉。过场卡穿透是已知的一条触发路径（已修），但
         这道闸和它无关：任何一关重复上报都不该让路线乱跳。 */
      let reported = false;
      const go = () => game.start({
        chars, pool, unitId:opts.unitId,
        onDone: res => {
          if (reported) return;
          reported = true;
          (res.chars || []).forEach(c => met.add(c));
          setTimeout(next, 300);
        },
        onQuit: () => { if (reported) return; reported = true; quit(); },
      });
      if (i === 1) Say.cheer('start', true);
      if (order.length > 1) this.stageCard(game, i - 1, order, go, opts); else go();
    };
    next();
  },

  /** Which characters the next stage gets.

      「开始冒险」 used to hand each stage four characters straight from
      Memory.pick. Over eleven stages that USUALLY covered a unit — but
      「usually」 is not a promise, and a child can finish the whole chain
      having never once been asked about 名. The unit page says 「一关接一关，
      不会漏掉哪个环节」; the characters deserve the same guarantee.

      So the choice now has feedback in it: characters no game has reported
      practising yet come first, and among those, the ones handed out least.
      `handed` matters because a character can be offered to a stage that then
      refuses it (描摹 only takes 认写 characters, 象形字魔法 only pictographs)
      — without it, an unusable character would monopolise every stage forever.
      Whatever is left of the slot is filled by the memory model as before, so
      spacing and weakness still steer the rest. */
  nextChars(pool, n, met, handed, mix){
    const unmet = pool.filter(c => !met.has(c))
                      .sort((a, b) => (handed[a] || 0) - (handed[b] || 0));
    const out = unmet.slice(0, n);
    if (out.length < n)
      Memory.pick(pool.filter(c => !out.includes(c)), n - out.length, mix)
            .forEach(c => { if (out.length < n) out.push(c); });
    out.forEach(c => { handed[c] = (handed[c] || 0) + 1; });
    return out;
  },

  /** 每过一关之间的一口气 —— 让他看见自己走到哪儿了。

      原来只有一排小圆点。改成整张冒险线路图，正在玩的那一关插着小红旗，
      走过的关卡变淡：一排点只说"第 5 / 12 关"，地图说的是"你在这儿"。 */
  stageCard(game, idx, order, go, opts){
    const card = el('div', {class:'stage-card'});
    const inner = el('div', {class:'stage-in with-map'});
    inner.append(el('div', {class:'ic'}, game.icon));
    inner.append(el('div', {class:'nm'}, game.name));
    inner.append(el('div', {class:'st'}, `第 ${idx + 1} 关 / 共 ${order.length} 关`));

    /* 地图整张有六百多像素高，过场卡放不下也不该放下 —— 缩到六成，
       只求"看见自己在哪儿"，不求看清每个字。 */
    const wrap = el('div', {class:'stage-map'});
    const map = Screens.roadmap({
      stops:order, unitId:(opts && opts.unitId) || 'x', current:idx,
    });
    wrap.append(map);
    inner.append(wrap);
    card.append(inner);
    FX().append(card);
    map.redraw();
    requestAnimationFrame(() => {
      map.redraw();
      /* getBoundingClientRect 返回的已经是缩放【之后】的高度，再乘一次
         比例就把地图裁掉了一半（十二关只看得见八关）。直接用它。 */
      wrap.style.height = Math.ceil(map.getBoundingClientRect().height) + 'px';
    });

    Sfx.tap();
    setTimeout(() => { card.remove(); go(); }, 2200);
  },

  finish(met, before, opts){
    const chars = [...met].filter(c => Data.char(c));
    const snapshot = Memory.snapshot(chars);
    if (opts.unitId && chars.length >= 3) Store.data.unitsCleared[opts.unitId] = true;

    /* Badges are announced on the summary page, so remember which one was won
       just now — giveBadge returns false once it is already owned, which is
       exactly the "don't celebrate it twice" test. */
    let badge = null;
    const win = (id, label) => { if (Store.giveBadge(id, label)) badge = {id, label}; };
    if (Memory.known().length >= 8) win('collect8', '收集 8 个汉字');
    if (Store.data.streak >= 3)     win('streak3', '连续 3 天冒险');
    // finishing a whole lesson — every character in it met at least once
    if (opts.unitId){
      const st = Coach.unitStat(opts.unitId);
      if (st.done) win('unit-' + opts.unitId, `${Data.unit(opts.unitId).name} 全部认过`);
      if (st.total && st.mastered >= st.total)
        win('master-' + opts.unitId, `${Data.unit(opts.unitId).name} 全部掌握`);
    }
    Store.save();
    const stars = Store.data.stars - before.stars;
    const coins = Store.data.coins - before.coins;

    if (opts.brief && opts.unitId && Data.unit(opts.unitId)){
      Screens.unit(opts.unitId);
      UI.toast({emoji:'✨', text:`⭐ +${stars}　🪙 +${coins}`,
                sub: chars.length ? `练了 ${chars.join('')}` : '再来一关吧', ms:2000});
      Say.cheer('finish', true);
      return;
    }
    Say.cheer('finish', true);
    Screens.summary({met:chars, unitId:opts.unitId, snapshot, stars, coins, badge});
  },
};

/* --------------------------------------------------------------- boot ----- */
let booted = false;
function boot(){
  if (booted) return;
  booted = true;
  Say.init(); Say.armOnGesture();
  /* 先把通用语（表扬、菜单、提示）装上 —— 哪一课都要用。各课的声音等孩子
     点进那一课再装，首屏就不用等十几兆。 */
  Say.loadPack('common');

  // browsers need a gesture before any sound; grab the first one
  const unlock = () => { Sfx.ac(); Music.play(Music.track || 'menu');
                       window.removeEventListener('pointerdown', unlock); };
  window.addEventListener('pointerdown', unlock);

  /* Who is playing decides which save to load, so it has to be settled before
     anything reads Store.data. One child on their own device is let straight
     back in; a class device asks every time, because the wrong name silently
     writes one child's practice into another child's record. */
  /* 存不下的话先说一声。放在最前面：孩子还没开始玩，家长还来得及换个开法。 */
  if (!Store.canSave()) return storageWarning();   // return：不然下面的流程立刻把它盖掉

  const roster = Store.roster();
  const last = Store.lastUsed();
  /* A class shares one device, so it must be asked every time. Skipping the
     question when only one name has been registered is what made this build
     look like it could only ever open 小名's game — and worse, it quietly
     wrote the next child's practice into 小名's record. */
  if (EDITION.classroom){
    if (roster.length) SignIn.open();
    else { Store.useQuietly(EDITION.player); welcome(); }
  } else if (roster.length === 1 && last && roster[0] === last){
    Store.use(last);
    Screens.home();
  } else if (!roster.length && localStorage.getItem('eric-hanzi-adventure.v1')){
    Store.use(EDITION.player);        // an old single-player save — keep it
    Screens.home();
  } else if (!roster.length){
    // Nothing typed yet: hold a placeholder in memory only, so it never turns
    // into a phantom classmate on the sign-in screen.
    Store.useQuietly(EDITION.player);
    welcome();
  } else {
    SignIn.open();
  }
}

/** 这台设备存不下进度时的说明页。

    最常见的情形：在平板上从「文件」App 直接打开这个 HTML。Safari 把
    file:// 当成临时来源，localStorage 写不进去 —— 玩多久都不会留下。
    解决办法是用网址打开（同一个 Wi-Fi 下从电脑上开一个地址即可）。 */
function storageWarning(){
  const s = UI.screen({sky:'sky-day', scenery:true});
  const wrap = el('div', {class:'center'});
  const card = el('div', {class:'card', style:'max-width:440px;margin:0 18px'});
  card.append(el('div', {style:'font-size:46px;text-align:center'}, '⚠️'));
  card.append(el('div', {style:'font-size:20px;font-weight:900;text-align:center;margin:6px 0 8px'},
    '这样打开，进度存不下来'));
  card.append(el('div', {style:'font-size:14.5px;line-height:1.75;color:#4a4459'},
    '这个浏览器不让这份文件保存数据。现在还能玩，但一关掉页面，' +
    '认识的字、星星、小锁全都会没有。'));
  card.append(el('div', {class:'hint', style:'text-align:left;padding:12px 0 0'},
    '多半是在平板上从「文件」App 直接打开的。改成用网址打开就好 —— ' +
    '在电脑上把这个文件用一个地址发出来，平板上访问那个地址。'));
  const go = UI.bigBtn('b-slate', '👉', '我知道了，先玩玩看', '',
    () => { booted = false; Store._canSave = true; boot(); });
  card.append(go);
  wrap.append(card);
  s.append(wrap);
  UI.mount(s);
}

function welcome(){
  const s = UI.screen({sky:'sky-forest'});
  const wrap = el('div', {class:'center'});
  const card = el('div', {class:'card', style:'max-width:420px;margin:0 18px;text-align:center'});
  card.append(el('div', {style:'font-size:13px;letter-spacing:3px;opacity:.6;font-weight:800'},
                 EDITION.kicker));
  card.append(el('div', {style:'font-size:32px;font-weight:900;letter-spacing:2px;margin:4px 0 10px'},
                 EDITION.title));
  const h = UI.hero(120); h.style.margin = '0 auto';
  card.append(h);
  const firstBook = Data.worlds().find(w => w.open);
  card.append(el('div', {style:'font-size:16px;font-weight:700;margin-top:10px'},
                 `嗨，${Store.data.name}！我们去${firstBook ? firstBook.name : '汉字森林'}找宝藏吧`));
  card.append(el('div', {class:'hint'},
                 '一边玩，一边把汉字收进你的图鉴。'));
  card.append(UI.bigBtn('b-gold', '🚀', '出发！', '',
    () => { Sfx.fanfare(); SignIn.open(); }));
  wrap.append(card);
  if (EDITION.credit) wrap.append(el('div', {class:'credit'}, EDITION.credit));
  s.append(wrap);
  UI.mount(s);
}

document.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();
</script>
