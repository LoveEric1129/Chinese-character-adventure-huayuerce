    const COLS = 3, ROWS = 4, TOTAL = opts.secs || 60;
    const cover = !!opts.cover;
    /* 复习模式：一摞牌，发完为止。deck[0] 是当前这个字。
       每轮各洗各的，拼起来之后再把「上一轮最后一个」和「下一轮第一个」
       撞上的那种情况错开，免得同一个字连着出现两次。 */
    const deck = cover ? (() => {
      const n = Math.max(1, opts.rounds || 2), d = [];
      for (let i = 0; i < n; i++){
        const r = shuffle(pool.slice());
        if (d.length && r[0] === d[d.length - 1] && r.length > 1){
          const k = 1 + Math.floor(Math.random() * (r.length - 1));
          [r[0], r[k]] = [r[k], r[0]];
        }
        d.push(...r);
      }
      return d;
    })() : null;
    /* 这一轮里敲错过的字，最后补一遍 */
    const redo = [];
    let missedHere = false, redoDone = false;
    let target = cover ? deck.shift() : rand(pool);
    let score = 0, hits = 0, misses = 0, time = TOTAL;
    let running = true, loop = null, popT = 0;
    /* 小游戏模式：整局换两次字，各算一次，不受帧率影响 */
    const CHANGE_AT = [TOTAL * 0.66, TOTAL * 0.33];
    let changed = 0;
    const holes = [], live = [];

    const scr = UI.screen({sky:'sky-night', title:opts.title || '🔨 打地鼠僵尸', onBack:quit, scenery:false});
    const ask = UI.ask(PvzMini.askLine(target), `只敲${Say.inWord(target)}`);
    scr.append(ask);
    const barN = UI.bar(100); scr.append(barN);
    /* 计数牌各留一个引用。原来是按 firstChild / lastChild 找的 —— 复习模式
       在后面多挂了一块「字 n/N」，误敲就被写进那块牌里了（实测截图上「字 0」）。 */
    const hitB = el('b', {}, '0'), missB = el('b', {}, '0');
    const info = el('div', {class:'whack-info'},
      el('span', {}, '🔨 ', hitB), el('span', {}, '误敲 ', missB));
    /* 复习模式多一个「第几个字」—— 孩子看得见还剩几个，老师也看得见这一局
       到底过了几个字。 */
    const donePill = cover ? el('span', {}, '字 ', el('b', {}, `1/${deck.length + 1}`)) : null;
    if (donePill) info.append(donePill);
    scr.append(info);
    const yard = el('div', {class:'graves'});
    yard.style.gridTemplateColumns = `repeat(${COLS},1fr)`;
    scr.append(yard);
    UI.mount(scr);

    for (let i = 0; i < COLS * ROWS; i++){
      const h = el('div', {class:'grave'}, el('div', {class:'stone', html:Art.grave()}));
      const z = el('button', {class:'popz'});
      h.append(z);
      z.onclick = () => whackIt(i);
      yard.append(h);
      holes.push({node:h, z, up:false, ch:null, t:0});
    }

    let cardsDone = 0;
    function nextCard(){
      /* 复习模式：发下一张。两轮发完，再把敲错过的字补一轮；都过完了就
         收摊 —— 时间没到也结束，该回忆的都回忆过了，不用干等。 */
      if (missedHere && redo.indexOf(target) < 0) redo.push(target);
      missedHere = false;
      cardsDone++;
      /* 错题补一轮 —— 只补这一轮。补了还错就不再补了：一直补到全对，
         对一个老敲错的孩子就是没完没了，最后只能被计时器掐断。 */
      if (!deck.length && redo.length && !redoDone){
        redoDone = true;
        deck.push(...shuffle(redo.splice(0, redo.length)));
      }
      if (!deck.length) return finish();
      /* 换词的那一下，地里可能刚冒出一只旧字。留着它就是个陷阱 —— 收回去。 */
      const was = target;
      holes.forEach(h => { if (h.up && h.ch === was) down(h); });
      target = deck.shift();
      if (donePill)
        donePill.lastChild.textContent = `${cardsDone + 1}/${cardsDone + 1 + deck.length + redo.length}`;
      showTarget();
    }

    function newTarget(){
      /* 换一个不一样的字。rand(pool) 可能抽中当前这个 —— 屏幕上闪一下
         「换成牛」，字却没变，孩子会以为自己听错了。 */
      const other = pool.filter(c => c !== target);
      target = other.length ? rand(other) : rand(pool);
      showTarget();
    }

    function showTarget(){
      ask.innerHTML = '';
      ask.append(el('div', {class:'q', html:PvzMini.askLine(target)}), UI.speaker(`只敲${Say.inWord(target)}`));
      Say.line(`现在敲${Say.inWord(target)}`);
      UI.toast({emoji:'🔄', text:`换成 ${target}`, ms:900});
    }

    function pop(){
      const free = holes.filter(h => !h.up);
      if (!free.length) return;
      const h = rand(free);
      /* 同一个字最多同时站两只。复习模式要把这个字全敲掉才换下一张，再多就
         变成「一个字敲五下」的体力活了；两只也够他挨个看清楚再下手。 */
      const upNow = holes.filter(x => x.up && x.ch === target).length;
      const isTarget = Math.random() < 0.45 && (!cover || upNow < 2);
      h.ch = isTarget ? target : (rand(pool.filter(c => c !== target)) || target);
      h.z.textContent = '';
      h.z.append(el('span', {class:'zh', html:Art.zombie(rand(['basic','cone','bucket']))}),
                 el('span', {class:'zt'}, h.ch));
      h.up = true; h.t = 1.7 + Math.random() * 1.2;
      h.z.classList.add('up');
    }

    function down(h){ h.up = false; h.z.classList.remove('up'); }

    function whackIt(i){
      const h = holes[i];
      if (!running || !h.up) return;
      if (h.ch === target){
        score += 10; hits++;
        h.z.classList.add('bonk'); Sfx.pop(); UI.sparkleAt(h.z, 10, ['💥','⭐']);
        Memory.score(target, 'image', true);
        h.ch = null;                       // 这一只算清掉了，别再算进"还剩几个"
        setTimeout(() => { h.z.classList.remove('bonk'); down(h); }, 220);
        /* 复习模式：同一个字可能同时冒出好几只。敲掉一只就换词的话，剩下
           那几只忽然变成"不该敲的"—— 孩子照着刚才看见的去敲，反而被判错。
           所以屏幕上这个字全敲干净了才换下一张。 */
        if (cover && !holes.some(x => x.up && x.ch === target))
          setTimeout(() => { if (running) nextCard(); }, 320);
      } else {
        misses++; missedHere = true;
        h.z.classList.add('wrongz'); Sfx.soft();
        UI.toast({emoji:'🤔', text:`那个是「${h.ch}」`, sub:`要敲的是「${target}」`, ms:900});
        Memory.score(target, 'image', false);
        setTimeout(() => h.z.classList.remove('wrongz'), 400);
      }
      hitB.textContent = String(hits);
      missB.textContent = String(misses);
    }

    function tick(dt){
      const s = dt / 1000;
      let done = false;
      time -= s;
      barN.firstChild.style.width = Math.max(0, time / TOTAL * 100) + '%';
      if (time <= 0) return finish();
      /* 换字的时刻按"过了没有"判断，不按"离得近不近"。

         原来写的是 |time - 39.6| < s（s 是这一帧的秒数）—— 那个窗口宽 2s，
         而 time 每帧正好走 s，于是【连续两帧都命中】：换两次字，连说两句
         「现在敲X」「现在敲Y」，中间只隔十几毫秒。孩子听见两个字挨在一起，
         根本分不清要敲哪个，而真正算数的是后说的那个。 */
      if (!cover){
        while (changed < CHANGE_AT.length && time <= CHANGE_AT[changed]){
          changed++;
          newTarget();
        }
      }
      popT -= s;
      if (popT <= 0){ pop(); popT = Math.max(0.45, 1.5 - (TOTAL - time) / 60); }
      holes.forEach(h => { if (h.up){ h.t -= s; if (h.t <= 0) down(h); } });
    }

    function finish(){
      running = false; if (loop) loop.stop();
      UI.confetti(40);
      Store.award({stars:Math.min(4, Math.floor(hits / 5)), coins:score, xp:Math.floor(score / 3)});
      if (opts.onDone) return opts.onDone({game:'whack', chars:pool,
                                           correct:hits, total:hits + misses});
      PvzMini.report('🔨', '打地鼠结束！', `敲中 ${hits} 个　误敲 ${misses} 个`, () => PvzMini.whack(pool));
    }
    function quit(){ running = false; if (loop) loop.stop(); Music.play('menu'); Screens.pvzMap(); }
    Music.play('mini');
    setTimeout(() => { loop = Loop.run(tick); }, 200);
  },

  /* ------------------------------------------- 🎳 坚果保龄球 ------------- */
  /* Three nuts wait at the left, each with a character painted on it. Only
     the nut whose character matches the call may be rolled — reading is the
     gate. WHERE it rolls is then the child's call: he drags it onto the lane
     that has zombies in it.

     认字决定「能不能扔」，瞄准决定「扔得中不中」—— 两件事分开，认对了字还
     要自己看清僵尸在哪一行。原来滚哪一行是随机的，孩子认对了也可能空滚一
     趟，那一下的成就感就被掷骰子拿走了。 */
  bowling(pool){
    const ROWS = 4;
    let running = true, loop = null, score = 0, sent = 0, gone = 0;
    /* 僵尸总数会因为"还有字没练到"而往后延，所以它是变量不是常量 */
    let total = Math.max(14, pool.length * 3);
    let target = null, nuts = [], rolling = [], zs = [], spawnT = 900, cellH = 0, laneW = 0;
    let carry = null;          // 手里正拿着的那颗坚果
    const lanes = [];          // 四条草坪，拖的时候高亮，让他看得见自己瞄哪儿

    /* ---- 这一课的字，一个都不能漏 ------------------------------------

       原来每一轮 target = rand(pool) —— 随机意味着一局打下来可能从头到尾
       没考过「名」，孩子照样通关。改成发牌：把本课的字洗成一摞，一张一张
       发，发完再洗。前 pool.length 轮必定把每个字都点到一次。
       而且不练完不收摊：僵尸清光时若还有字没练到，就再放僵尸出来。 */
    let deck = [];
    const practised = new Set();
    function drawTarget(){
      if (!deck.length){
        deck = shuffle(pool.slice());
        /* 洗完别让新一摞的头一张跟刚考过的那张是同一个 */
        if (deck.length > 1 && deck[0] === target) deck.push(deck.shift());
      }
      return deck.shift();
    }

    const scr = UI.screen({sky:'sky-day', title:'🎳 坚果保龄球', onBack:quit, scenery:false});
    /* 整块背景就是草地 —— 原来上半截是天蓝色，跟一片绿草坪拼在一起，
       像两张图硬接上的。 */
    scr.querySelector('.sky').style.background =
      'linear-gradient(#c3e8a0,#a9db80 40%,#8ccb6b)';
    const ask = UI.ask('准备…', '');
    scr.append(ask);
    const tip = el('div', {class:'hint', style:'padding:0 14px 6px'},
                   '把坚果拖到有僵尸的那一行');
    scr.append(tip);
    const dex = el('div', {class:'bowl-dex'});
    const dexCell = {};
    pool.forEach(c => { const b = el('b', {}, c); dexCell[c] = b; dex.append(b); });
    scr.append(dex);
    const alley = el('div', {class:'alley'});
    for (let i = 0; i < ROWS; i++){
      const ln = el('div', {class:'blane' + (i % 2 ? ' alt' : '')});
      alley.append(ln);
      lanes.push(ln);
    }
    scr.append(alley);
    const rack = el('div', {class:'rack'});
    scr.append(rack);
    UI.mount(scr);

    function measure(){
      const r = alley.getBoundingClientRect();
      cellH = r.height / ROWS; laneW = r.width;
      lanes.forEach((ln, i) => {
        ln.style.top = (i * cellH) + 'px';
        ln.style.height = cellH + 'px';
      });
    }

    /* 手指落在第几行草坪上（落在外面就返回 -1） */
    function rowAt(x, y){
      const r = alley.getBoundingClientRect();
      if (x < r.left || x > r.right || y < r.top || y > r.bottom) return -1;
      return Math.max(0, Math.min(ROWS - 1, Math.floor((y - r.top) / (r.height / ROWS))));
    }

    function lightLane(row){
      lanes.forEach((ln, i) => ln.classList.toggle('hot', i === row));
    }

    function newCall(){
      target = drawTarget();
      ask.innerHTML = '';
      ask.append(el('div', {class:'q', html:`把写着 <i>${esc(target)}</i> 的坚果滚出去！`}),
                 UI.speaker(`把写着${target}的坚果滚出去`));
      Say.char(target);
      /* 三选一太好蒙了 —— 四个里挑一个，蒙中的概率从 33% 掉到 25%，
         而且多一个字要读。字不够的时候 distractors 自己会少给。 */
      const opts = shuffle([target, ...Memory.distractors(target, pool, 3)]);
      rack.innerHTML = '';
      tip.textContent = '把坚果拖到有僵尸的那一行';
      nuts = opts.map(ch => {
        const b = el('button', {class:'nut'},
          el('span', {class:'ne', html:Art.plant('wallnut')}), el('span', {class:'nc'}, ch));
        b.addEventListener('pointerdown', e => pick(ch, b, e));
        rack.append(b);
        return b;
      });
    }

    /* ------------------------------------------------------- 拿起坚果 ----

       认字这一关还在最前面：拿错了当场算错，根本拿不起来。拿对了才轮到
       「扔哪儿」，那是他自己的判断。

       拖和点两种都认。七岁的手指在平板上常常是"点一下"而不是"拖一段"，
       只认拖的话，点了没反应会让他以为游戏坏了：所以松手时如果没怎么移动，
       坚果就留在手里，接着点哪一行就滚哪一行。 */
    function pick(ch, btn, e){
      if (!running || rack.dataset.lock || carry) return;
      if (ch !== target){
        rack.dataset.lock = '1';
        Memory.score(target, 'tell', false, {chose:ch});
        btn.classList.add('bad'); Sfx.soft();
        UI.toast({emoji:'🤔', text:`那个是「${ch}」`, sub:`要找的是「${target}」`, ms:1000});
        setTimeout(() => { btn.classList.remove('bad'); delete rack.dataset.lock; }, 800);
        return;
      }
      e.preventDefault();      // 别让这一下变成选中文字或滑动页面
      Sfx.tap();
      btn.classList.add('held');
      const ghost = el('div', {class:'dragnut'},
        el('span', {class:'rn', html:Art.plant('wallnut')}), el('span', {class:'rc'}, ch));
      FX().append(ghost);
      carry = {ch, btn, ghost, x:e.clientX, y:e.clientY, moved:0, stuck:false};
      moveGhost(e.clientX, e.clientY);
      tip.textContent = '拖到有僵尸的那一行，松手就滚出去';
      if (btn.setPointerCapture && e.pointerId != null){
        try{ btn.setPointerCapture(e.pointerId); }catch(err){}
      }
    }

    function moveGhost(x, y){
      if (!carry) return;
      carry.ghost.style.left = x + 'px';
      carry.ghost.style.top  = y + 'px';
      lightLane(rowAt(x, y));
    }

    function onMove(e){
      if (!carry) return;
      carry.moved += Math.abs(e.clientX - carry.x) + Math.abs(e.clientY - carry.y);
      carry.x = e.clientX; carry.y = e.clientY;
      moveGhost(e.clientX, e.clientY);
    }

    function onUp(e){
      if (!carry) return;
      const row = rowAt(e.clientX, e.clientY);
      if (row >= 0) return launch(row);
      /* 只是点了一下、没拖动 —— 坚果留在手里，等他点一行草坪 */
      if (carry.moved < 12 && !carry.stuck){
        carry.stuck = true;
        carry.ghost.classList.add('parked');
        tip.textContent = '现在点一行有僵尸的草坪';
        return;
      }
      if (carry.stuck) return;      // 手里拿着的时候在别处点一下，不算扔掉
      drop();
    }

    /* 手里拿着坚果时点草坪：那一行就是他选的 */
    alley.addEventListener('pointerdown', e => {
      if (!carry || !carry.stuck) return;
      const row = rowAt(e.clientX, e.clientY);
      if (row >= 0) launch(row);
    });

    function drop(){
      if (!carry) return;
      carry.btn.classList.remove('held');
      carry.ghost.remove();
      lightLane(-1);
      carry = null;
      tip.textContent = '把坚果拖到有僵尸的那一行';
    }

    function launch(row){
      if (!carry) return;
      const ch = carry.ch, btn = carry.btn;
      drop();
      rack.dataset.lock = '1';
      /* 认对了才走到这儿，记一次对 —— 瞄得准不准不算进识字成绩，
         那是手上的功夫，不是认字的功夫。 */
      Memory.score(target, 'tell', true);
      practised.add(target);
      if (dexCell[target]) dexCell[target].classList.add('got');
      btn.classList.add('good'); Sfx.pop();
      const n = el('div', {class:'rollnut'},
        el('span', {class:'rn', html:Art.plant('wallnut')}), el('span', {class:'rc'}, ch));
      alley.append(n);
      /* 一颗坚果打穿 2 个僵尸就碎 —— 原来是 3，随便扔一颗能横扫一整行 */
      rolling.push({row, x:-40, node:n, hp:2});
      sent++;
      setTimeout(() => { delete rack.dataset.lock; if (running) newCall(); }, 500);
    }

    /* 打到后面越来越难：僵尸变硬、走得快、来得密。用"已经过去几个"当进度，
       孩子打得越好推进越快 —— 难度跟着他的本事走，不是跟着秒表走。 */
    function heat(){ return Math.min(1, gone / Math.max(1, total * 0.8)); }

    function spawn(){
      const h = heat();
      const mix = h < 0.3 ? ['basic','basic','cone']
                : h < 0.65 ? ['basic','cone','cone','bucket']
                           : ['cone','bucket','bucket'];
      const def = Data.zombie(rand(mix));
      const row = Math.floor(Math.random() * ROWS);
      const n = el('div', {class:'zomb'});
      n.append(el('div', {class:'zb', html:Art.zombie(def.id)}));
      alley.append(n);
      zs.push({row, x:laneW + 20, hp:def.hp, node:n, speed:def.speed * (0.85 + h * 0.45)});
    }

    function tick(dt){
      const s = dt / 1000;
      let done = false; measure();
      spawnT -= dt;
      /* 还有字没练到就别停 —— 继续放僵尸，直到这一课的字全走过一遍 */
      const owed = pool.length - practised.size;
      if (owed > 0 && gone >= total - 1) total = gone + owed + 1;
      if (spawnT <= 0 && gone + zs.length < total){
        spawn();
        spawnT = 2000 - heat() * 1100;                       // 2.0 秒 → 0.9 秒
        if (heat() > 0.5 && Math.random() < 0.35) spawn();   // 偶尔两个一起来
      }

      for (let i = rolling.length - 1; i >= 0; i--){
        const b = rolling[i];
        b.x += 300 * s;
        b.node.style.left = b.x + 'px';
        b.node.style.top = (b.row * cellH + cellH * .18) + 'px';
        const hit = zs.find(z => z.row === b.row && Math.abs(z.x - b.x) < 40);
        if (hit){
          UI.sparkleAt(hit.node, 10, ['💥','⭐']); Sfx.boom();
          hit.node.classList.add('die');
          const nn = hit.node; setTimeout(() => nn.remove(), 350);
          zs.splice(zs.indexOf(hit), 1);
          gone++; score += 15;
          b.hp--; b.row = Math.max(0, Math.min(ROWS - 1, b.row + (Math.random() < .5 ? -1 : 1)));
          if (b.hp <= 0){ b.node.remove(); rolling.splice(i, 1); continue; }
        }
        if (b.x > laneW + 40){ b.node.remove(); rolling.splice(i, 1); }
      }

      for (let i = zs.length - 1; i >= 0; i--){
        const z = zs[i];
        z.x -= z.speed * s * 6;
        z.node.style.left = z.x + 'px';
        z.node.style.top = (z.row * cellH) + 'px';
        z.node.style.height = cellH + 'px';
        if (z.x < 0){ z.node.remove(); zs.splice(i, 1); gone++; score = Math.max(0, score - 5); }
      }
      if (gone >= total && practised.size >= pool.length) finish();
    }

    /* 手指在屏幕上乱走时也要跟得住，所以挂在 window 上。走的时候必须摘掉 ——
       挂在 window 上的监听不会随着换页自己消失。 */
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', drop);
    function unhook(){
      drop();
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', drop);
    }

    function finish(){
      running = false; if (loop) loop.stop(); unhook();
      UI.confetti(40);
      Store.award({stars:Math.min(4, Math.floor(score / 40)), coins:score, xp:Math.floor(score / 3)});
      PvzMini.report('🎳', '保龄球结束！',
        `得分 ${score}　·　这一课的 ${pool.length} 个字都练过了`,
        () => PvzMini.bowling(pool));
    }
    function quit(){ running = false; if (loop) loop.stop(); unhook();
                     Music.play('menu'); Screens.pvzMap(); }

    Music.play('mini');
    setTimeout(() => { measure(); newCall(); loop = Loop.run(tick); }, 200);
  },

  /* ---------------------------------------------- 🧱 字词砌墙 ------------ */
  /* Reading is the mechanic, not a toll booth: a word is shown with one
     character missing, and the character you pick is the only thing keeping
     the zombies out.

     The first build of this was too easy and there was nothing to chase — you
     answered three-option questions until a fixed win. So: no win condition.
     It is endless and it escalates, and the only thing to beat is your own
     record. Four dials move together each wave —

       · the answer clock shortens          7.0s → 3.0s
       · the options multiply               3 → 5
       · zombies arrive faster and walk faster
       · later zombies bite 2 or 3 bricks instead of 1

     A streak of five lays a bonus brick, so knowing the words cold is worth
     more than merely getting them right, and a wrong answer only costs ground,
     never a brick — a child who is behind can still climb back.             */
  wall(pool){
    const CAP = 14;
    let running = true, loop = null, elapsed = 0, wave = 0;
    let bricks = 5, laid = 0, streak = 0, bestStreak = 0;   // start with a little more wall
    let spawnT = 0.15, question = null, qLeft = 0, qMax = 7;   // one is on its way at once
    const recentQ = [];          // characters just asked about
    const zombies = [];

    const scr = UI.screen({sky:'sky-day', title:'🧱 字词砌墙', onBack:quit, scenery:false});
    const head = el('div', {class:'pvz-bar'},
      el('div', {class:'pill brickpill'}, '🧱', el('b', {}, String(bricks))),
      el('div', {class:'pill wavepill'}, '🌊', el('b', {}, '1')),
      el('div', {class:'pill combopill'}, '🔥', el('b', {}, '0')),
      el('div', {class:'pill bestpill'}, '🏆', el('b', {}, String(Store.data.wallBest || 0))));
    scr.append(head);
    const brickN = head.children[0].lastChild, waveN = head.children[1].lastChild;
    const comboN = head.children[2].lastChild;

    const qCard = el('div', {class:'pvz-q'}); scr.append(qCard);
    const clock = el('div', {class:'qclock'}, el('i', {}));
    qCard.append(clock);
    const clockFill = clock.firstChild;

    const lane = el('div', {class:'field lane'}); scr.append(lane);
    const house = el('div', {class:'house'}, '🏠');
    const wallN = el('div', {class:'brickwall'});
    lane.append(house, wallN);
    scr.append(el('div', {class:'hint'},
      '答对砌一块砖 · 僵尸会啃墙 · 砖没了就结束 —— 看你能撑到第几波'));
    UI.mount(scr);

    /* ------------------------------------------------ escalating dials -- */
    // Late waves were unplayable: three zombies chewing every 0.85s took the
    // wall down faster than any child can answer, so the ending was decided by
    // the clock rather than by reading. The eating rate now has a real floor
    // and climbs far more slowly; the pressure comes from the answer clock and
    // the number of options instead, which are things he can actually beat.
    const optCount = () => Math.min(5, 3 + Math.floor(wave / 3));
    const answerTime = () => Math.max(3.6, 7 - wave * 0.4);
    // Walking slowly and eating slowly are not the same lever, and slowing
    // both made the opening dead — half a minute of empty lawn before the
    // first zombie was even in range. Zombies now arrive briskly (that is the
    // part that looks like a game) and still chew slowly (that is the part
    // that decides whether he loses).
    const spawnGap = () => Math.max(2.2, 3.0 - wave * 0.14);
    const walkSpeed = () => 36 + wave * 2.0;
    const MAX_ON_LAWN = 6;
    // Balance point: one correct answer lays one brick, so the eating interval
    // IS the answering speed the child must beat. At 2.4s he had to answer
    // every 2.4s just to break even, which is not a seven-year-old's pace.
    // Starting at 4.2s means a comfortable four-second rhythm holds the wall,
    // and the ramp is what eventually takes it away from him.
    const eatGap = () => Math.max(2.2, 4.2 - wave * 0.22);
    const kinds = () => wave >= 5 ? ['basic','basic','cone','cone','bucket']
                      : wave >= 3 ? ['basic','basic','basic','cone'] : ['basic'];
    const BITE = {basic:1, cone:1, bucket:2};   // 铁桶原来一口三块，太狠

    function drawWall(){
      wallN.innerHTML = '';
      for (let i = 0; i < Math.min(bricks, CAP); i++) wallN.append(el('i', {class:'bk'}));
      brickN.textContent = String(bricks);
      head.children[0].classList.toggle('low', bricks <= 3);
      wallN.style.opacity = bricks ? 1 : 0;
    }
    drawWall();

    function setCombo(n){
      streak = n; bestStreak = Math.max(bestStreak, n);
      comboN.textContent = String(streak);
      head.children[2].classList.toggle('hot', streak >= 3);
    }

    /* --------------------------------------------------- 组词填空 ------- */
    function newQ(){
      let ch = null, word = null, tries = 0;
      while (tries++ < 24 && !word){
        ch = Memory.nextAsk(pool, recentQ);
        const info = Data.char(ch);
        const ws = (info && info.words || []).filter(w => w.length >= 2 && w.indexOf(ch) >= 0);
        if (ws.length) word = rand(ws);
      }
      if (!word){ ch = rand(pool); word = (Data.char(ch).words || [ch])[0]; }

      question = {ch, word};
      qMax = answerTime(); qLeft = qMax;
      qCard.querySelectorAll('.pvz-qhead,.pvz-opts').forEach(n => n.remove());

      const h = el('div', {class:'pvz-qhead'});
      const shown = el('div', {class:'wordgap'});
      Array.from(word).forEach(c => shown.append(
        c === ch ? el('i', {class:'gap'}, '⬜') : el('i', {}, c)));
      h.append(el('div', {class:'pvz-qt'}, '补成一个词'), shown,
               UI.speaker(`${word}，缺哪个字？`));
      qCard.append(h);

      const row = el('div', {class:'pvz-opts'});
      row.style.gridTemplateColumns = `repeat(${optCount()},1fr)`;
      shuffle([ch, ...Memory.distractors(ch, pool, optCount() - 1)]).forEach(c => {
        const b = el('button', {class:'pvz-opt'}, c);
        b.onclick = () => answer(c === ch, b, c);
        row.append(b);
      });
      qCard.append(row);
      Say.announce(`${word}，缺哪个字？`, 120);
    }

    function answer(ok, btn, chose){
      if (qCard.dataset.lock) return;
      qCard.dataset.lock = '1';
      Memory.score(question.ch, 'tell', ok, {chose});
      if (ok){
        if (btn) btn.classList.add('good');
        Sfx.great();
        bricks = Math.min(CAP, bricks + 1); laid++;
        setCombo(streak + 1);
        if (streak % 5 === 0){                       // a streak is worth extra
          bricks = Math.min(CAP, bricks + 1); laid++;
          Sfx.fanfare();
          UI.toast({emoji:'🔥', text:`${streak} 连击！`, sub:'多砌一块砖', ms:950});
        } else {
          UI.toast({emoji:'🧱', text:'砌上一块砖', sub:question.word, ms:750});
        }
        drawWall();
      } else {
        if (btn) btn.classList.add('bad');
        Sfx.soft(); setCombo(0);
        zombies.forEach(z => { z.x -= 22; });        // costs ground, never a brick
      }
      setTimeout(() => { delete qCard.dataset.lock; if (running) newQ(); }, ok ? 520 : 800);
    }

    /* ------------------------------------------------------ zombies ----- */
    let first = true;
    function spawn(){
      const box = lane.getBoundingClientRect();
      if (box.width < 60) return;
      const kind = rand(kinds());
      const n = el('div', {class:'lanez ' + kind, html:Art.zombie(kind)});
      // the very first one starts partway down the lawn, so the game begins
      // instead of making him watch an empty strip for ten seconds
      const z = {node:n, kind, x:(first ? box.width * 0.55 : box.width + 20), eat:0};
      first = false;
      n.style.bottom = (4 + Math.random() * 6) + 'px';
      lane.append(n); zombies.push(z);
    }

    function tick(dt){
      const s = dt / 1000;
      let done = false;
      elapsed += s;
      const w = Math.floor(elapsed / 22);
      if (w !== wave){ wave = w; waveN.textContent = String(wave + 1);
                       UI.toast({emoji:'🌊', text:`第 ${wave + 1} 波`,
                                 sub:'更快、更多、选项更多', ms:1100}); }

      // the answer clock: hesitating is what actually kills you
      if (!qCard.dataset.lock && question){
        qLeft -= s;
        clockFill.style.width = Math.max(0, qLeft / qMax * 100) + '%';
        clock.classList.toggle('urgent', qLeft < qMax * 0.34);
        if (qLeft <= 0){ Say.speak('太慢啦', {rate:0.9, interrupt:true}); answer(false, null); }
      }

      spawnT -= s;
      if (spawnT <= 0 && zombies.length < MAX_ON_LAWN){ spawn(); spawnT = spawnGap(); }
      else if (spawnT <= 0) spawnT = 1.0;

      /* They queue. Letting every zombie that reached the wall chew at once
         multiplied the damage by however many had piled up — five of them took
         three bricks a second, which no seven-year-old can out-answer, and the
         ending stopped being about reading. Only the one in front eats; the
         rest line up behind it. The crowd is the pressure you SEE, the front
         one is the pressure that counts. */
      const queue = zombies.slice().sort((a, b) => a.x - b.x);
      const front = queue[0];
      queue.forEach((z, rank) => {
        const stop = 96 + (bricks ? 10 : -30) + rank * 46;
        if (z.x > stop){ z.x -= walkSpeed() * s; z.node.classList.remove('eating'); }
        else if (z === front){
          if (bricks > 0){
            z.node.classList.add('eating');
            z.eat -= s;
            if (z.eat <= 0){
              z.eat = eatGap();
              bricks = Math.max(0, bricks - BITE[z.kind]); drawWall(); Sfx.boom();
              if (!bricks) UI.toast({emoji:'⚠️', text:'墙没了！', sub:'快答对一题', ms:1100});
            }
          } else { done = true; }
        } else z.node.classList.remove('eating');
        z.node.style.left = z.x + 'px';
      });
      if (done) return finish();
    }

    function finish(){
      running = false; if (loop) loop.stop();
      const score = laid * 10 + Math.floor(elapsed);
      const prev = Store.data.wallBest || 0;
      const rec = score > prev;
      if (rec){ Store.data.wallBest = score; Store.save(); }
      Sfx.soft();
      Store.award({stars:Math.min(5, Math.floor(laid / 5)), coins:score, xp:Math.floor(score / 3)});
      Say.line(rec ? '新纪录！' : '僵尸进屋了，再来一次');
      PvzMini.report(rec ? '🏆' : '🧟', rec ? '新纪录！' : '僵尸进屋了',
        `撑到第 ${wave + 1} 波　砌了 ${laid} 块砖　最高连击 ${bestStreak}` +
        `\n得分 ${score}` + (rec ? '（打破纪录！）' : `　纪录 ${prev}`),
        () => PvzMini.wall(pool));
    }

    function quit(){ running = false; if (loop) loop.stop(); Music.play('menu'); Screens.pvzMap(); }
    Music.play('night');
    setTimeout(() => { newQ(); loop = Loop.run(tick); }, 200);
  },

  /* -------------------------------------------------------------- shared */
  report(emoji, title, sub, again){
    const wrap = el('div', {class:'center', style:'position:absolute;inset:0;z-index:40;background:#0009'});
    const card = el('div', {class:'card', style:'margin:0 20px;text-align:center;max-width:340px'});
    card.append(el('div', {style:'font-size:54px'}, emoji));
    card.append(el('div', {style:'font-size:21px;font-weight:900;margin:6px 0'}, title));
    card.append(el('div', {class:'hint', style:'white-space:pre-line'}, sub));
    card.append(UI.bigBtn('b-leaf', '🔁', '再玩一次', '', again));
    card.append(UI.bigBtn('b-slate', '🗺️', '回关卡地图', '', () => Screens.pvzMap()));
    wrap.append(card);
    document.querySelector('.screen').append(wrap);
    Sfx.fanfare();
  },
};


/* ===== 20-boss.js ===== */
/* =============================================================================
   遗忘怪兽 BOSS — five hit points, five DIFFERENT ways of remembering.

   The boss only ever asks about characters Eric has already met. Nothing new
   is introduced here; the fight is the review, dressed up as a fight.
   ========================================================================== */

const Boss = {
  id:'boss', name:'Boss挑战', icon:'👹', color:'b-grape',

  start(ctx){
    const pool = ctx.pool.filter(c => Memory.seen(c));
    const chars = (pool.length >= 3 ? pool : ctx.pool);
    let hp = 5, step = 0, used = [];
    const strengthened = new Set();

    const scr = UI.screen({sky:'sky-night', title:'👹 遗忘怪兽', onBack:ctx.onQuit, pal:true});
    const stage = el('div', {class:'boss-stage'});
    const bossN = el('div', {class:'boss'}, '👹');
    const hpN = UI.hearts(hp, 5);
    const nameN = el('div', {class:'boss-name'}, '遗忘怪兽');
    stage.append(bossN, nameN, hpN);
    scr.append(stage);
    const arena = el('div', {style:'flex:1.4;display:flex;flex-direction:column;justify-content:center;gap:6px'});
    scr.append(arena);
    UI.mount(scr);

    setTimeout(() => { Sfx.boom(); Say.line('我是遗忘怪兽，你还记得这些字吗'); }, 250);

    /* five attacks, each a different retrieval route -------------------- */
    const ATTACKS = [
      {label:'听音辨字', build:c => pickAttack(Challenge.make('audio',   c, chars))},
      {label:'看图找字', build:c => pickAttack(Challenge.make('image',   c, chars))},
      {label:'拼装汉字', build:buildAttack},
      {label:'补好笔画', build:fixAttack},
      {label:'完成句子', build:c => pickAttack(Challenge.make('context', c, chars))},
    ];

    function nextChar(kind){
      let cand = chars.filter(c => !used.includes(c));
      if (kind === 'context') cand = cand.filter(c => Data.char(c) && Data.char(c).sent);
      if (!cand.length) cand = chars.filter(c => kind !== 'context' || (Data.char(c) && Data.char(c).sent));
      if (!cand.length) cand = chars;
      const c = Memory.pick(cand, 1, 'review')[0] || rand(cand);
      used.push(c);
      return c;
    }

    /* ---- attack renderers; each calls resolve(ok, targetChars) --------- */
    function pickAttack(spec){
      return (host, resolve) => {
        host.append(Challenge.promptNode(spec));
        const g = Challenge.optionsNode(spec, (ok, node, o) => {
          Memory.score(spec.target, spec.skill, ok, {chose:o && o.ch});
          Challenge.feedback(ok, node, spec, () => resolve(ok, [spec.target]));
        }, 88);
        host.append(g);
      };
    }

    function buildAttack(){
      const recipes = Data.recipesFor(chars);
      if (!recipes.length) return pickAttack(Challenge.make('meaning', nextChar(), chars));
      const rec = rand(recipes);
      const wrong = shuffle(Data.COMPOSE.filter(r => r.result !== rec.result)).slice(0, 2);
      const opts = shuffle([rec, ...wrong]);
      return (host, resolve) => {
        host.append(el('div', {class:'scene'},
          el('div', {style:'font-size:52px;font-weight:600;letter-spacing:6px'},
             rec.parts.join(' + ') + ' = ?')));
        host.append(UI.ask('这些零件能拼成哪个字？', '这些零件能拼成哪个字'));
        const g = el('div', {style:'display:grid;gap:12px;padding:0 16px;grid-template-columns:repeat(3,1fr)'});
        opts.forEach(o => {
          const b = el('button', {class:'tile', style:'height:96px'}, UI.glyph(o.result, 46));
          b.onclick = () => {
            if (g.dataset.locked) return; g.dataset.locked = '1';
            const ok = o.result === rec.result;
            rec.parts.filter(p => Data.char(p)).forEach(p => Memory.score(p, 'build', ok));
            if (ok){ b.classList.add('good'); Sfx.great(); UI.sparkleAt(b, 16);
                     UI.toast({emoji:'🧩', text:`${rec.result}！`, sub:rec.hint}); Say.line(rec.hint); }
            else   { b.classList.add('bad'); Sfx.soft(); UI.toast({emoji:'🤔', text:UI.nudge(), sub:rec.hint}); }
            setTimeout(() => resolve(ok, rec.parts.filter(p => Data.char(p))), 1250);
          };
          g.append(b);
        });
        host.append(g);
      };
    }

    function fixAttack(){
      const ch = nextChar();
      return (host, resolve) => {
        const S = 240, CELL = S / 3;
        const paint = c => {
          const cv = document.createElement('canvas'); cv.width = cv.height = S;
          const g = cv.getContext('2d');
          g.fillStyle = '#fff'; g.fillRect(0, 0, S, S);
          g.fillStyle = '#2f2a3d'; g.textAlign = 'center'; g.textBaseline = 'middle';
          g.font = `600 ${Math.round(S * .78)}px "PingFang SC","Hiragino Sans GB",sans-serif`;
          g.fillText(c, S / 2, S / 2 + S * .02);
          return cv;
        };
        const full = paint(ch);
        const cells = [];
        for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++){
          const d = full.getContext('2d').getImageData(x * CELL, y * CELL, CELL, CELL).data;
          let n = 0; for (let p = 0; p < d.length; p += 4) if (d[p] < 160) n++;
          const ink = n / (d.length / 4);
          if (ink > .06 && ink < .55) cells.push({x, y});
        }
        const hole = cells.length ? rand(cells) : {x:1, y:1};

        host.append(UI.ask(`帮 <i>${esc(ch)}</i> 补好缺的一块！`, `帮${ch}补好`));
        const wrap = el('div', {class:'repair-wrap'});
        const view = document.createElement('canvas');
        view.id = 'repairCv'; view.width = view.height = S;
        view.style.width = view.style.height = Math.min(220, window.innerWidth - 120) + 'px';
        const vg = view.getContext('2d');
        vg.drawImage(full, 0, 0);
        vg.fillStyle = '#f2eef8'; vg.fillRect(hole.x * CELL, hole.y * CELL, CELL, CELL);
        vg.strokeStyle = '#c9bce4'; vg.lineWidth = 4; vg.setLineDash([9, 7]);
        vg.strokeRect(hole.x * CELL + 2, hole.y * CELL + 2, CELL - 4, CELL - 4);
        wrap.append(view);

        const decoys = shuffle(chars.filter(c => c !== ch)).slice(0, 2);
        const row = el('div', {class:'patches'});
        shuffle([{c:ch, ok:true}, ...decoys.map(c => ({c, ok:false}))]).forEach(cand => {
          const src = cand.ok ? full : paint(cand.c);
          const pc = document.createElement('canvas');
          pc.width = pc.height = CELL; pc.style.width = pc.style.height = '76px';
          pc.getContext('2d').drawImage(src, hole.x * CELL, hole.y * CELL, CELL, CELL, 0, 0, CELL, CELL);
          const b = el('button', {class:'patch'}); b.append(pc);
          b.onclick = () => {
            if (row.dataset.locked) return; row.dataset.locked = '1';
            Memory.score(ch, 'fix', cand.ok);
            if (cand.ok){
              vg.drawImage(full, hole.x * CELL, hole.y * CELL, CELL, CELL,
                                 hole.x * CELL, hole.y * CELL, CELL, CELL);
              Sfx.great(); UI.sparkleAt(view, 14);
              UI.toast({emoji:'🔧', text:'补好啦！', sub:ch});
            } else { Sfx.soft(); UI.toast({emoji:'🤔', text:UI.nudge()}); }
            setTimeout(() => resolve(cand.ok, [ch]), 1150);
          };
          row.append(b);
        });
        wrap.append(row);
        host.append(wrap);
      };
    }

    /* --------------------------------------------------------- sequence -- */
    function turn(){
      if (hp <= 0) return win();
      const atk = ATTACKS[step % ATTACKS.length];
      const kind = ['audio','image','build','fix','context'][step % 5];
      const ch = (kind === 'build' || kind === 'fix') ? null : nextChar(kind);
      const render = (kind === 'build') ? buildAttack()
                   : (kind === 'fix')   ? fixAttack()
                   : atk.build(ch);

      arena.innerHTML = '';
      arena.append(el('div', {class:'hint', style:'color:#fff;font-weight:800;font-size:14px'},
                     `第 ${step + 1} 招 · ${atk.label}`));
      render(arena, (ok, targets) => {
        (targets || []).forEach(t => strengthened.add(t));
        if (ok){
          hp--;
          bossN.classList.add('hit'); Sfx.boom();
          setTimeout(() => bossN.classList.remove('hit'), 460);
          refreshHp();
        }
        step++;
        setTimeout(turn, 520);
      });
    }

    function refreshHp(){
      const old = stage.querySelector('.hp');
      const neu = UI.hearts(hp, 5);
      if (old) old.replaceWith(neu); else stage.append(neu);
    }

    function win(){
      bossN.classList.add('dead');
      Sfx.fanfare(); UI.confetti(80);
      arena.innerHTML = '';
      const list = [...strengthened].filter(c => Data.char(c));
      const card = el('div', {class:'card', style:'margin:0 16px;text-align:center'});
      card.append(el('div', {style:'font-size:44px'}, '🎉'));
      card.append(el('div', {style:'font-size:22px;font-weight:900;margin:6px 0'}, 'BOSS 被打败啦！'));
      card.append(el('div', {class:'hint'}, '这一战里变结实的汉字：'));
      const row = el('div', {class:'sum-ch'});
      list.forEach(c => row.append(el('b', {}, c)));
      card.append(row);
      card.append(UI.bigBtn('b-leaf', '🏠', '回到冒险', '', () => ctx.onDone({
        game:'boss', chars:list, correct:5, total:5, win:true})));
      arena.append(card);
      Store.award({stars:5, coins:60, gems:3, xp:50});
      Store.data.bossBeaten[ctx.unitId || 'free'] = (Store.data.bossBeaten[ctx.unitId || 'free'] || 0) + 1;
      Store.giveBadge('boss-' + (ctx.unitId || 'free'), '打败遗忘怪兽');
      Store.save();
      Say.line('太厉害了，你把遗忘怪兽打败了');
    }

    setTimeout(turn, 900);
  },
};


/* ===== 21-game-read.js ===== */
/* =============================================================================
   读故事 — the last stage of a unit, and the one that does the consolidating.

   Everything before this asks about a character on its own. Here the same
   characters turn up inside connected prose, which is the context that actually
   matters: recognising 春 on a flashcard is not the same skill as reading past
   it in a sentence without stopping. It is also the only stage that grows
   reading volume rather than drilling.

   Two kinds of question follow the story, and the difference is deliberate:
     · 读懂了吗 — did you follow the story (authored per story)
     · 故事里的字 — a line from the story with one taught character blanked out,
       generated from the text itself, so the character is retrieved from a
       sentence the child has just read rather than from a bare prompt.
   Only the second kind is scored into the memory model, under the `read` skill.
   ========================================================================== */

const GameRead = {
  id:'read', name:'读故事', icon:'📖', color:'b-sky',
  blurb:'读一段故事，把这一关学过的字用起来',

  /** a unit only reaches this stage if a story was written for it */
  available(chars, unitId){ return !!Story.get(unitId); },

  start(ctx){
    const story = Story.get(ctx.unitId) || Story.any(ctx.pool);
    if (!story) return ctx.onDone({game:'read', chars:[], correct:0, total:0});

    const targets = Story.targets(story, ctx.pool);
    const quiz = Story.blanks(story, targets, 3);
    let page = 0, got = 0, asked = 0;

    const scr = UI.screen({sky:'sky-day', title:'📖 读故事', onBack:ctx.onQuit});
    const body = el('div', {class:'scroll'});
    scr.append(body);
    UI.mount(scr);

    /* ---------------------------------------------------------- reading -- */
    function readPage(){
      body.innerHTML = '';
      body.append(el('div', {class:'story-head'},
        el('span', {class:'em'}, story.emoji),
        el('div', {}, el('b', {}, story.title),
           el('small', {}, `第 ${page + 1} 段 / 共 ${story.lines.length} 段`))));

      const card = el('div', {class:'card story'});
      card.append(Story.render(story.lines[page], targets, Store.data.pinyin));
      body.append(card);

      const bar = el('div', {class:'story-bar'});
      const again = el('button', {class:'mini'}, '🔊 再念一遍');
      again.onclick = () => { Sfx.tap(); Say.speak(story.lines[page], {rate:0.62, interrupt:true}); };
      const echo = el('button', {class:'mini hot'}, '🎤 跟我读');
      echo.onclick = () => { Sfx.tap(); followAlong(story.lines[page]); };
      const py = el('button', {class:'mini'}, Store.data.pinyin ? '拼音 开' : '拼音 关');
      py.onclick = () => {
        Sfx.tap();
        Store.data.pinyin = !Store.data.pinyin;
        Store.save();
        readPage();
      };
      bar.append(again, echo, py);
      body.append(bar);

      body.append(el('div', {class:'hint'}, '点故事里深色的字，可以听它怎么念'));

      const last = page === story.lines.length - 1;
      /* 平板上一次点击很容易变成两次（手抖、双击）。没有这道闸，第二下会用
         同一个按钮的旧闭包再翻一页：孩子一下跳过两段，还能翻到第 5 段 / 共
         4 段 —— 那一段是空的，而且「读完了」再也不会出现。
         判断依据用 page 本身：翻过页了就说明这一下是多余的。 */
      const at = page;
      body.append(UI.bigBtn(last ? 'b-gold' : 'b-sky', last ? '✅' : '👉',
        last ? '读完了' : '下一段', last ? '来回答几个问题' : '',
        () => {
          if (page !== at) return;
          page++;
          last ? askComprehension(0) : readPage();
        }));

      Say.announce(story.lines[page], 260);
      targets.forEach(c => Memory.expose(c));
    }

    /* ---------------------------------------------------- 跟读 ---------

       Sentence by sentence: hear it with the characters lighting up one at a
       time, then read it back yourself.

       Deliberately NOT using speech recognition. It is unavailable on file://
       where this game actually runs, and even where it works it mishears a
       seven-year-old often enough that the game would keep telling a child who
       read correctly that he got it wrong — worse than not checking at all.
       So the child judges himself, which is also what a parent sitting beside
       him would do. */
    function followAlong(line){
      const parts = Story.sentences(line);
      let k = 0;

      function step(){
        if (k >= parts.length){
          Sfx.fanfare(); UI.confetti(26);
          Store.award({stars:1, coins:10, xp:8});
          Say.cheerText('读得真好听！', true);
          return readPage();
        }
        const text = parts[k];

        body.innerHTML = '';
        body.append(el('div', {class:'story-head'},
          el('span', {class:'em'}, '🎤'),
          el('div', {}, el('b', {}, '跟我读'),
             el('small', {}, `第 ${k + 1} 句 / 共 ${parts.length} 句`))));

        const card = el('div', {class:'card story echo'});
        const cells = Story.render(text, targets, true);
        card.append(cells);
        body.append(card);

        const hint = el('div', {class:'hint'}, '先听一遍，字会一个一个亮起来');
        body.append(hint);

        const bar2 = el('div', {class:'story-bar'});
        const listen = el('div', {class:'mini'}, '🔊 正在念…');
        bar2.append(listen);
        body.append(bar2);

        const mine = UI.bigBtn('b-gold', '👦', '该我读了', '照着上面读一遍', () => {});
        mine.disabled = true; mine.style.opacity = .5;
        body.append(mine);

        /* light each character roughly in time with the voice. Boundary events
           are not reliable for Chinese, so pace it off the utterance length. */
        const boxes = [...cells.querySelectorAll('.ru')];
        const per = Math.max(180, 2600 / Math.max(4, boxes.length)) * 1.15;
        let lit = 0, timer = 0;
        function glow(){
          boxes.forEach((b, i) => b.classList.toggle('lit', i === lit));
          if (++lit <= boxes.length) timer = setTimeout(glow, per);
          else { boxes.forEach(b => b.classList.remove('lit')); done(); }
        }
        function done(){
          clearTimeout(timer);
          listen.textContent = '🔊 再听一遍';
          listen.onclick = () => { Sfx.tap(); Say.speak(text, {rate:0.6, interrupt:true}); };
          hint.textContent = '现在轮到你 —— 大声读一遍给自己听';
          mine.disabled = false; mine.style.opacity = 1;
          mine.onclick = () => { Sfx.great(); k++; step(); };
          mine.querySelector('small') &&
            (mine.querySelector('small').textContent = '读完了就点这里');
        }

        Say.speak(text, {rate:0.58, interrupt:true});
        setTimeout(glow, 320);
      }
      step();
    }

    /* ------------------------------------------------- did you follow it -- */
    function askComprehension(k){
      const list = story.ask || [];
      if (k >= list.length) return askBlanks(0);
      const q = list[k];

      body.innerHTML = '';
      body.append(UI.ask(q.q, q.q));
      const grid = el('div', {class:'opts'});
      shuffle(q.options.map((t, i) => ({t, ok:i === q.a}))).forEach(o => {
        const b = el('button', {class:'opt'}, o.t);
        b.onclick = () => {
          if (grid.dataset.lock) return;
          grid.dataset.lock = '1';
          if (o.ok){
            b.classList.add('good'); Sfx.great();
            UI.toast({emoji:'📖', text:'读懂啦！'});
            Store.award({stars:1, coins:8, xp:8});
            setTimeout(() => askComprehension(k + 1), 900);
          } else {
            b.classList.add('bad'); Sfx.soft();
            UI.toast({emoji:'🤔', text:'再想想', sub:'可以回去看看故事'});
            setTimeout(() => { b.classList.remove('bad'); delete grid.dataset.lock; }, 900);
          }
        };
        grid.append(b);
      });
      body.append(grid);
      body.append(el('div', {class:'hint'}, `读懂了吗 · 第 ${k + 1} / ${list.length} 题`));
    }

    /* -------------------------------------------- the characters, in situ -- */
    function askBlanks(k){
      if (k >= quiz.length){
        UI.confetti(36);
        return ctx.onDone({game:'read', chars:targets, correct:got, total:asked,
                           words: story.lines.join('').length});
      }
      const item = quiz[k];
      asked++;

      body.innerHTML = '';
      body.append(el('div', {class:'card story'},
                    Story.render(item.masked, [], Store.data.pinyin)));
      body.append(UI.ask('这里是哪个字？', item.say));

      const grid = el('div', {style:'display:grid;gap:12px;padding:0 16px;' +
                                    'grid-template-columns:repeat(4,1fr)'});
      /* 故事里的填空也一样：那句话里还填得进去的字，不能当选项。
         「我想吃」挖掉想，选项里不能有要。 */
      const bad = (Data.char(item.ch) || {}).clash || [];
      const picks = [item.ch, ...Memory.distractors(item.ch, ctx.pool, 3)]
        .filter(c => c === item.ch || bad.indexOf(c) < 0);
      shuffle(picks).forEach(c => {
        const b = el('button', {class:'tile', style:'height:84px'}, UI.glyph(c, 40));
        b.onclick = () => {
          if (grid.dataset.lock) return;
          grid.dataset.lock = '1';
          const ok = c === item.ch;
          Memory.score(item.ch, 'read', ok);
          if (ok){
            got++; b.classList.add('good'); Sfx.great(); UI.sparkleAt(b, 14);
            const info = Data.char(item.ch);
            UI.toast({emoji:'📖', text:UI.praise(), sub:`${item.ch}　${info.py}`});
            Store.award({stars:1, coins:10, xp:9});
            setTimeout(() => askBlanks(k + 1), 950);
          } else {
            b.classList.add('bad'); Sfx.soft();
            UI.toast({emoji:'🤔', text:'再读一遍那句话'});
            setTimeout(() => { b.classList.remove('bad'); delete grid.dataset.lock; }, 900);
          }
        };
        grid.append(b);
      });
      body.append(grid);
      body.append(el('div', {class:'hint'}, `故事里的字 · 第 ${k + 1} / ${quiz.length} 题`));
    }

    setTimeout(readPage, 200);
  },
};


/* ===== 22-game-write.js ===== */
/* =============================================================================
   描摹练字 — trace the character, then write it again with the model hidden.

   Two decisions worth stating, because both were tempting to get wrong:

   1. NO STROKE ORDER. A proper 笔顺 dataset is not in this project, and
      inventing one would teach a child to write characters wrongly — worse
      than not teaching it at all. What the font gives us is the SHAPE, so the
      shape is what this practises. Drop in real stroke data later and an
      animated guide can be added without touching anything else.

   2. This game is now TRACING ONLY. It used to end with 临写 — the model
      hidden, write it from memory — and that was the only part that counted
      as a retrieval, so it was the only part scored into the memory model.
      That stage was removed on request.

      The consequence is deliberate and worth knowing: copying a shape you can
      see is practice, not recall, so nothing here feeds mastery any more. The
      character is marked as MET (Memory.expose) and no more. Retrieval still
      happens in the other ten stages; this one settles the shape into the
      hand. Mastery must not be earned by copying — that is the one rule this
      whole project is built on.

   Scoring compares two bitmaps — how much of the model the child's ink covers,
   and how much of their ink strayed outside a tolerance band around it. Neither
   number alone is honest: covering everything by scribbling over the whole box
   scores nothing, and a neat stroke in the wrong place scores nothing either.
   ========================================================================== */

const GameWrite = {
  id:'write', name:'描摹练字', icon:'✍️', color:'b-rose',
  blurb:'一笔一笔描三遍',

  /** only characters the curriculum marks 认写 (recognise AND write) */
  available(chars){
    return (chars || []).filter(c => (Data.char(c) || {}).learn === '认写').length >= 1;
  },

  GRAIN: 200,                              // analysis resolution

  /** paint `ch` at `size`; mode 'zone' adds the tolerance band around it */
  paint(g, ch, size, mode){
    g.save();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `600 ${Math.round(size * 0.76)}px "PingFang SC","Hiragino Sans GB",` +
             `"Heiti SC","Songti SC",serif`;
    if (mode === 'zone'){
      g.lineWidth = size * 0.085; g.lineJoin = 'round'; g.strokeStyle = '#000';
      g.strokeText(ch, size / 2, size / 2 + size * 0.02);
    }
    g.fillStyle = '#000';
    g.fillText(ch, size / 2, size / 2 + size * 0.02);
    g.restore();
  },

  mask(ch, mode){
    const G = this.GRAIN;
    const c = document.createElement('canvas'); c.width = c.height = G;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, G, G);
    this.paint(g, ch, G, mode);
    const d = g.getImageData(0, 0, G, G).data;
    const m = new Uint8Array(G * G);
    for (let p = 0, k = 0; p < d.length; p += 4, k++) m[k] = d[p] < 150 ? 1 : 0;
    return m;
  },

  /** Compare what was drawn against the model. Pure, so it can be tested:
      a perfect trace must score high and a stray scribble must not. */
  grade(ch, inkCanvas){
    const G = this.GRAIN;
    const small = document.createElement('canvas'); small.width = small.height = G;
    const sg = small.getContext('2d');
    sg.fillStyle = '#fff'; sg.fillRect(0, 0, G, G);
    sg.drawImage(inkCanvas, 0, 0, G, G);
    const d = sg.getImageData(0, 0, G, G).data;

    const tmpl = this.mask(ch, 'fill'), zone = this.mask(ch, 'zone');
    let total = 0, covered = 0, drawn = 0, outside = 0;
    for (let p = 0, k = 0; p < d.length; p += 4, k++){
      const c = d[p] < 150 ? 1 : 0;
      if (tmpl[k]){ total++; if (c) covered++; }
      if (c){ drawn++; if (!zone[k]) outside++; }
    }
    const coverage = total ? covered / total : 0;
    const accuracy = drawn ? 1 - outside / drawn : 0;
    // both matter: scribbling over everything covers the model but is not
    // writing, and a tidy stroke in the wrong place is not writing either
    const score = coverage * (0.3 + 0.7 * accuracy);
    return {coverage, accuracy, score,
            stars: score > 0.62 ? 3 : score > 0.44 ? 2 : score > 0.26 ? 1 : 0};
  },

  TRACES: 2,        // how many times each character is copied
  RETRIES: 2,       // extra traces a shaky character earns

  /** 这一组字的描红清单：每个字描 TRACES 遍，顺序打乱。

      为什么要打乱：连着把「牛」描三遍，手是在照着上一格抄，脑子不用再去
      回忆这个字长什么样 —— 第二遍第三遍便宜得很。中间隔一个别的字，再回到
      「牛」时就得重新调出它的样子，那一下才是真的在记。

      打乱之后还要尽量不让同一个字挨着（wants 里剩得多的先出），否则
      两个字四遍很容易又摇成「牛牛马马」，等于没打乱。 */
  plan(chars){
    const list = (chars || []).filter(Boolean);
    const want = {};
    list.forEach(ch => { want[ch] = this.TRACES; });

    const jobs = [];
    let last = null;
    for (let total = list.length * this.TRACES; total > 0; total--){
      // 还欠得最多的字优先；同样多就随机挑一个，别老是同一个开头
      let pool = shuffle(list.filter(c => want[c] > 0 && c !== last));
      if (!pool.length) pool = shuffle(list.filter(c => want[c] > 0));  // 只剩它了
      if (!pool.length) break;
      const ch = pool.reduce((a, b) => (want[b] > want[a] ? b : a));
      want[ch]--;
      last = ch;
      jobs.push({ch, kind:'trace'});
    }
    // 编号按它实际出现的次序来 —— 打乱之后还标「2 / 2」在前面会让孩子发懵
    const seen = {};
    jobs.forEach(j => {
      seen[j.ch] = (seen[j.ch] || 0) + 1;
      j.n = seen[j.ch];
      j.of = this.TRACES;
    });
    return jobs;
  },

  /** what a badly traced character adds back into the list */
  remedy(ch){
    return [{ch, kind:'trace', n:1, of:1, extra:true}];
  },

  start(ctx){
    const SIZE = 320, GRAIN = this.GRAIN;   // display px, and analysis resolution
    /* 这一课要写的字，一个都不少。

       原来这里 .slice(0, 2) —— 一课五个字，动笔只写两个，另外三个整条路线
       走完都没落过笔。「认得」和「写得出」是两回事，写这一关漏掉谁，谁就
       是没练过。（'认读' 的字本来就不要求会写，那类才该滤掉。） */
    const chars = (ctx.chars || []).filter(c => (Data.char(c) || {}).learn === '认写');
    if (!chars.length) return ctx.onDone({game:'write', chars:[], correct:0, total:0});

    /* A worklist rather than a fixed count: two traces settle the shape into
       the hand, and a character traced badly earns another go right here.
       Sending him on and hoping the review queue catches it weeks later is how
       a wrong shape becomes a habit. */
    const jobs = GameWrite.plan(chars);
    const retries = {};
    let j = 0, got = 0, asked = 0;

    const scr = UI.screen({sky:'sky-island', title:'✍️ 描摹练字', onBack:ctx.onQuit});
    const body = el('div', {class:'scroll'});
    scr.append(body);
    UI.mount(scr);

    /* ------------------------------------------------------------ round -- */
    function round(){
      if (j >= jobs.length){
        UI.confetti(40);
        return ctx.onDone({game:'write', chars, correct:got, total:asked});
      }
      const job = jobs[j];
      const ch = job.ch, info = Data.char(ch);

      const title = job.extra ? '再描一遍' : `描红 ${job.n} / ${job.of}`;
      const note = job.extra ? '刚才那笔有点偏 —— 慢慢再描一遍'
                             : '沿着淡淡的字描，记住每一笔在哪儿';

      body.innerHTML = '';
      const dots = el('div', {class:'wdots'});
      jobs.filter(x => x.ch === ch).forEach((x, k) => {
        const idx = jobs.indexOf(x);
        dots.append(el('i', {class:idx < j ? 'on' : idx === j ? 'now' : ''}));
      });
      body.append(el('div', {class:'write-head'},
        el('div', {}, el('b', {}, title), el('small', {}, note), dots),
        UI.speaker(`${Say.inWord(ch)}`)));

      const card = el('div', {class:'card write-card'});
      const box = el('div', {class:'gridbox', style:`width:${SIZE}px;height:${SIZE}px`});

      const bg = document.createElement('canvas');
      bg.width = bg.height = SIZE * 2; bg.style.width = bg.style.height = SIZE + 'px';
      const bgg = bg.getContext('2d');
      bgg.scale(2, 2);
      // 米字格: the cross and the diagonals, the grid Chinese children practise
      // in — they give the eye a reference for where each stroke starts
      bgg.strokeStyle = '#e6ddf2'; bgg.lineWidth = 1.5; bgg.setLineDash([7, 6]);
      [[SIZE/2, 0, SIZE/2, SIZE], [0, SIZE/2, SIZE, SIZE/2],
       [0, 0, SIZE, SIZE], [SIZE, 0, 0, SIZE]].forEach(([x1, y1, x2, y2]) => {
        bgg.beginPath(); bgg.moveTo(x1, y1); bgg.lineTo(x2, y2); bgg.stroke();
      });
      bgg.setLineDash([]);
      bgg.globalAlpha = 0.3; GameWrite.paint(bgg, ch, SIZE, 'fill');
      bgg.globalAlpha = 1;

      const ink = document.createElement('canvas');
      ink.width = ink.height = SIZE * 2; ink.style.width = ink.style.height = SIZE + 'px';
      ink.className = 'inklayer';
      const ig = ink.getContext('2d');
      ig.scale(2, 2);
      ig.lineWidth = SIZE * 0.075; ig.lineCap = 'round'; ig.lineJoin = 'round';
      ig.strokeStyle = '#2f2a3d';

      box.append(bg, ink);
      card.append(box);
      body.append(card);

      /* ---------------------------------------------------- drawing ----- */
      let drawing = false, strokes = 0, last = null;
      const at = e => {
        const r = ink.getBoundingClientRect();
        return {x:(e.clientX - r.left) * (SIZE / r.width),
                y:(e.clientY - r.top) * (SIZE / r.height)};
      };
      ink.addEventListener('pointerdown', e => {
        e.preventDefault();
        ink.setPointerCapture(e.pointerId);
        drawing = true; strokes++; last = at(e);
        ig.beginPath(); ig.moveTo(last.x, last.y); ig.lineTo(last.x + 0.1, last.y);
        ig.stroke();
      });
      ink.addEventListener('pointermove', e => {
        if (!drawing) return;
        const p = at(e);
        ig.beginPath(); ig.moveTo(last.x, last.y); ig.lineTo(p.x, p.y); ig.stroke();
        last = p;
      });
      const stop = () => { drawing = false; };
      ink.addEventListener('pointerup', stop);
      ink.addEventListener('pointercancel', stop);

      /* ------------------------------------------------------ buttons --- */
      const bar = el('div', {class:'story-bar'});
      const clear = el('button', {class:'mini'}, '↩️ 擦掉重写');
      clear.onclick = () => { Sfx.tap(); ig.clearRect(0, 0, SIZE, SIZE); strokes = 0; };
      bar.append(clear);
      body.append(bar);

      body.append(UI.bigBtn('b-gold', '✅', '写好了', '',
        () => { if (!strokes){ Sfx.soft();
                  UI.toast({emoji:'✍️', text:'还没写呢', sub:'用手指在格子里写一写', ms:1100});
                  return; }
                judge(); }));

      body.append(el('div', {class:'hint'},
        `${ch}　${info.py}　${info.words[0] || info.mean}`));

      Say.announce(`我们来写${Say.inWord(ch)}`, 320);

      /* -------------------------------------------------------- judge --- */
      function judge(){
        const stars = GameWrite.grade(ch, ink).stars;
        const last = !jobs.slice(j + 1).some(x => x.ch === ch);   // 这个字的最后一遍

        asked++;
        if (stars >= 2) got++;
        let remediated = false;
        if (stars < 2 && (retries[ch] || 0) < GameWrite.RETRIES){
          retries[ch] = (retries[ch] || 0) + 1;
          jobs.splice(j + 1, 0, ...GameWrite.remedy(ch));
          remediated = true;
        }
        /* Met, not mastered. Copying a shape that is showing on the page is
           not a retrieval, so it must not buy stars in the memory model — see
           the note at the top of this file. */
        Memory.expose(ch);

        const say = remediated ? '还不太像 —— 我们再描一遍'
                  : stars >= 3 ? '写得真像！' : stars === 2 ? '不错，再工整一点'
                  : stars === 1 ? '有点歪，再来一次也行' : '差得有点远，再试试';
        Sfx[stars >= 2 ? 'great' : 'soft']();
        if (stars >= 2) UI.sparkleAt(box, 16);

        // The payout lands on the LAST trace of a character, not on every one:
        // three separate little rewards for the same character teach him that
        // repetition is what pays.
        if (!last || stars < 2){
          UI.toast({emoji:'✍️', text:say, sub:`描红 ${job.n} / ${job.of}`, ms:1300});
          Store.award({coins:5 + stars * 3, xp:4 + stars * 2});
        } else if (stars >= 2){
          UI.confetti(30); Sfx.fanfare();
          UI.toast({emoji:'🌟', text:'⭐'.repeat(stars),
                    sub:`「${ch}」写得真好`, ms:1900});
          Store.award({stars, coins:12 + stars * 6, xp:9 + stars * 5});
          /* 只喊「太棒啦」。原来还要念「你获得三颗小星星」—— 星星画面上
             已经有了，念一遍反而把夸奖拖长，一课十遍描红就听十遍。 */
          Say.cheerText('太棒啦', true);
        } else {
          UI.toast({emoji:'✍️', text:say, sub:'再来一次就好', ms:1500});
          Store.award({coins:5, xp:4});
        }

        setTimeout(() => { j++; round(); }, remediated ? 1700 : 1400);
      }
    }

    setTimeout(round, 200);
  },
};


/* ===== 23-game-pinyin.js ===== */
/* =============================================================================
   拼音小站 — see the character, pick how it is read.

   This was the biggest hole in the whole game: ten stages and not one of them
   touched 拼音, which is half of what the first two years of 语文 actually
   drill. Every character already carries a `py`, so the data was there all
   along — only the practice was missing.

   The distractors are the point. Three random pinyin from other characters
   would be trivially easy, so most rounds offer the SAME syllable in a
   different tone (shuǐ / shuī / shuì). Tone is where children actually slip,
   and it is invisible unless you make them choose.
   ========================================================================== */

/** tone marks, and how to move a syllable between them */
const Pinyin = {
  ROWS: {a:'āáǎà', o:'ōóǒò', e:'ēéěè', i:'īíǐì', u:'ūúǔù', 'ü':'ǖǘǚǜ'},

  /** 'shuǐ' -> {plain:'shui', at:2, base:'i', tone:3}; tone 0 = neutral */
  split(py){
    const s = String(py || '');
    for (let k = 0; k < s.length; k++){
      for (const base in this.ROWS){
        const t = this.ROWS[base].indexOf(s[k]);
        if (t >= 0) return {plain:s.slice(0, k) + base + s.slice(k + 1),
                            at:k, base, tone:t + 1};
      }
    }
    // no mark: pick the vowel a tone would land on (a > o > e > last vowel)
    const order = ['a', 'o', 'e'];
    for (const v of order){ const k = s.indexOf(v); if (k >= 0) return {plain:s, at:k, base:v, tone:0}; }
    for (let k = s.length - 1; k >= 0; k--)
      if ('aoeiuü'.indexOf(s[k]) >= 0) return {plain:s, at:k, base:s[k], tone:0};
    return null;
  },

  /** same syllable, different tone */
  withTone(py, tone){
    const p = this.split(py);
    if (!p) return py;
    const mark = tone ? this.ROWS[p.base][tone - 1] : p.base;
    return p.plain.slice(0, p.at) + mark + p.plain.slice(p.at + 1);
  },

  /** the other three tones of the same syllable */
  otherTones(py){
    const p = this.split(py);
    if (!p) return [];
    return [1, 2, 3, 4].filter(t => t !== p.tone).map(t => this.withTone(py, t));
  },
};

const GamePinyin = {
  id:'pinyin', name:'拼音小站', icon:'🔤', color:'b-sky',
  blurb:'看着字，选出它怎么念',

  available(chars){ return (chars || []).filter(c => (Data.char(c) || {}).py).length >= 2; },

  start(ctx){
    const chars = (ctx.chars || []).filter(c => (Data.char(c) || {}).py).slice(0, 5);
    if (!chars.length) return ctx.onDone({game:'pinyin', chars:[], correct:0, total:0});
    const pool = ctx.pool || Data.all();
    let i = 0, got = 0;

    const scr = UI.screen({sky:'sky-day', title:'🔤 拼音小站', onBack:ctx.onQuit, pal:true});
    const body = el('div', {class:'scroll'});
    scr.append(body);
    UI.mount(scr);

    function options(ch){
      const right = Data.char(ch).py;
      // two thirds of the time make him choose the TONE, which is the part
      // that actually goes wrong; otherwise offer other characters' readings
      const tones = shuffle(Pinyin.otherTones(right)).slice(0, 2);
      const others = shuffle(pool.filter(c => c !== ch && Data.char(c) &&
                                              Data.char(c).py !== right))
                     .slice(0, 3).map(c => Data.char(c).py);
      const wrong = shuffle([...tones, ...others]).slice(0, 3);
      return shuffle([{py:right, ok:true}, ...wrong.map(p => ({py:p, ok:false}))]);
    }

    function round(){
      if (i >= chars.length)
        return ctx.onDone({game:'pinyin', chars, correct:got, total:chars.length});
      const ch = chars[i], info = Data.char(ch);

      body.innerHTML = '';
      body.append(el('div', {class:'card', style:'text-align:center;padding:26px 16px'},
        el('div', {style:'font-size:94px;font-weight:600;line-height:1.1'}, ch)));
      body.append(UI.ask('它念什么？', '它念什么？'));

      const grid = el('div', {class:'opts', style:'grid-template-columns:1fr 1fr'});
      options(ch).forEach(o => {
        const b = el('button', {class:'opt pyopt'}, o.py);
        b.onclick = () => {
          if (grid.dataset.lock) return;
          grid.dataset.lock = '1';
          Memory.score(ch, 'pinyin', o.ok);
          if (o.ok){
            got++; b.classList.add('good'); Sfx.great(); UI.sparkleAt(b, 14);
            UI.toast({emoji:'🔤', text:UI.praise(), sub:`${ch}　${info.py}　${info.words[0]}`});
            Store.award({stars:1, coins:11, xp:9});
            Say.speak(Say.inWord(ch), {rate:0.6, interrupt:true});
            i++; Say.afterSpeech(round, 4500, 800);
          } else {
            b.classList.add('bad'); Sfx.soft();
            UI.toast({emoji:'🤔', text:'再听一听声调', sub:'注意上面那个小符号'});
            Say.speak(Say.inWord(ch), {rate:0.55, interrupt:true});
            setTimeout(() => { b.classList.remove('bad'); delete grid.dataset.lock; }, 1100);
          }
        };
        grid.append(b);
      });
      body.append(grid);
      body.append(el('div', {class:'hint'}, `第 ${i + 1} / ${chars.length} 个字`));
      Say.announce(`${Say.inWord(ch)}，它念什么？`, 300);
    }

    setTimeout(round, 200);
  },
};


/* ===== 25-game-polish.js ===== */
/* =============================================================================
   擦亮汉字 — the character is buried under dust; rub it off with a finger.

   Two reasons this earns a place rather than being a gimmick.

   First, it is recognition under partial information. Every other stage shows
   the whole character and asks which one it is; here the child names it from
   a fragment, and the sooner he commits the more it is worth. Reading a
   half-covered character is closer to reading in the wild than reading a
   flashcard is.

   Second, it belongs on a tablet. The finger does something physical, and the
   character emerging under it is its own reward — this is the stage a tired
   child will still agree to do.
   ========================================================================== */

const GamePolish = {
  id:'polish', name:'擦亮汉字', icon:'🧽', color:'b-gold',
  blurb:'擦掉灰尘，越早认出越值钱',

  available(chars){ return (chars || []).filter(c => Data.char(c)).length >= 3; },

  start(ctx){
    const SIZE = 300, GRAIN = 120, BRUSH = 34;
    const chars = shuffle((ctx.chars || []).filter(c => Data.char(c))).slice(0, 4);
    if (!chars.length) return ctx.onDone({game:'polish', chars:[], correct:0, total:0});
    const pool = ctx.pool || Data.all();
    let i = 0, got = 0;

    const scr = UI.screen({sky:'sky-island', title:'🧽 擦亮汉字', onBack:ctx.onQuit, pal:true});
    const body = el('div', {class:'scroll'});
    scr.append(body);
    UI.mount(scr);

    function round(){
      if (i >= chars.length){
        UI.confetti(36);
        return ctx.onDone({game:'polish', chars, correct:got, total:chars.length});
      }
      const ch = chars[i], info = Data.char(ch);

      body.innerHTML = '';
      body.append(el('div', {class:'write-head'},
        el('div', {}, el('b', {}, '擦一擦，看看是哪个字'),
          el('small', {}, '擦得越少就认出来，星星越多')),
        UI.speaker('擦一擦，看看是哪个字')));

      const card = el('div', {class:'card write-card'});
      const box = el('div', {class:'gridbox dusty', style:`width:${SIZE}px;height:${SIZE}px`});

      // the character underneath
      const glyph = document.createElement('canvas');
      glyph.width = glyph.height = SIZE * 2;
      glyph.style.width = glyph.style.height = SIZE + 'px';
      const gg = glyph.getContext('2d'); gg.scale(2, 2);
      gg.fillStyle = '#2f2a3d';
      gg.textAlign = 'center'; gg.textBaseline = 'middle';
      gg.font = `600 ${Math.round(SIZE * 0.74)}px "PingFang SC","Hiragino Sans GB",serif`;
      gg.fillText(ch, SIZE / 2, SIZE / 2 + SIZE * 0.02);

      // the dust on top; rubbing punches holes in it
      const dust = document.createElement('canvas');
      dust.width = dust.height = SIZE * 2;
      dust.style.width = dust.style.height = SIZE + 'px';
      dust.className = 'inklayer';
      const dg = dust.getContext('2d'); dg.scale(2, 2);
      const grad = dg.createLinearGradient(0, 0, SIZE, SIZE);
      grad.addColorStop(0, '#b9ab97'); grad.addColorStop(1, '#8f8069');
      dg.fillStyle = grad; dg.fillRect(0, 0, SIZE, SIZE);
      dg.fillStyle = '#00000018';
      for (let k = 0; k < 90; k++)
        dg.fillRect(Math.random() * SIZE, Math.random() * SIZE, 12, 6);
      dg.globalCompositeOperation = 'destination-out';
      dg.lineWidth = BRUSH; dg.lineCap = dg.lineJoin = 'round';

      box.append(glyph, dust);
      card.append(box);
      body.append(card);

      /* ------------------------------------------------------- rubbing -- */
      let rubbing = false, last = null, cleared = 0;
      const meter = el('div', {class:'bar'}, el('i', {style:'width:0%'}));
      body.append(meter);
      const meterFill = meter.firstChild;

      const at = e => {
        const r = dust.getBoundingClientRect();
        return {x:(e.clientX - r.left) * (SIZE / r.width),
                y:(e.clientY - r.top) * (SIZE / r.height)};
      };
      function stroke(p){
        dg.beginPath(); dg.moveTo(last.x, last.y); dg.lineTo(p.x, p.y); dg.stroke();
        last = p;
      }
      dust.addEventListener('pointerdown', e => {
        e.preventDefault(); dust.setPointerCapture(e.pointerId);
        rubbing = true; last = at(e); stroke({x:last.x + 0.1, y:last.y});
      });
      dust.addEventListener('pointermove', e => { if (rubbing) stroke(at(e)); });
      const stopRub = () => { if (!rubbing) return; rubbing = false; measure(); };
      dust.addEventListener('pointerup', stopRub);
      dust.addEventListener('pointercancel', stopRub);

      function measure(){
        const c = document.createElement('canvas');
        c.width = c.height = GRAIN;
        const g = c.getContext('2d');
        g.drawImage(dust, 0, 0, GRAIN, GRAIN);
        const d = g.getImageData(0, 0, GRAIN, GRAIN).data;
        let clear = 0;
        for (let p = 3; p < d.length; p += 4) if (d[p] < 40) clear++;
        cleared = clear / (GRAIN * GRAIN);
        meterFill.style.width = Math.round(cleared * 100) + '%';
      }

      /* ------------------------------------------------------- guessing -- */
      body.append(el('div', {class:'hint'}, '想好了就直接选 —— 不用全擦完'));
      const grid = el('div', {style:'display:grid;gap:12px;padding:0 16px;' +
                                    'grid-template-columns:repeat(4,1fr)'});
      shuffle([ch, ...Memory.distractors(ch, pool, 3)]).forEach(c => {
        const b = el('button', {class:'tile', style:'height:84px'}, UI.glyph(c, 40));
        b.onclick = () => {
          if (grid.dataset.lock) return;
          grid.dataset.lock = '1';
          const ok = c === ch;
          Memory.score(ch, 'image', ok, {chose:c});
          if (ok){
            got++;
            dg.globalCompositeOperation = 'destination-out';
            dg.fillStyle = '#000'; dg.fillRect(0, 0, SIZE, SIZE);   // wipe it clean
            b.classList.add('good'); Sfx.great(); UI.sparkleAt(box, 18);
            const stars = cleared < 0.3 ? 3 : cleared < 0.55 ? 2 : 1;
            UI.toast({emoji:'🧽', text:'⭐'.repeat(stars),
                      sub:`${ch}　${info.py}　擦了 ${Math.round(cleared * 100)}%`});
            Store.award({stars, coins:8 + stars * 5, xp:6 + stars * 4});
            Say.speak(Say.inWord(ch), {rate:0.6, interrupt:true});
            i++; Say.afterSpeech(round, 4500, 900);
          } else {
            b.classList.add('bad'); Sfx.soft();
            UI.toast({emoji:'🤔', text:'再擦一点看看', ms:1100});
            setTimeout(() => { b.classList.remove('bad'); delete grid.dataset.lock; }, 900);
          }
        };
        grid.append(b);
      });
      body.append(grid);
      Say.announce('擦一擦，看看是哪个字', 300);
    }

    setTimeout(round, 200);
  },
};


/* ===== 26-flashcards.js ===== */
/* =============================================================================
   闪字卡 — the review mode for characters that are slipping.

   Everything else in the game asks him to recognise a character among options.
   A flash card asks for it cold: the character is there, nothing else is, and
   he has to produce the reading himself before turning it over. That is free
   recall, the hardest and most durable kind of retrieval, and it is the right
   shape for review specifically — these are characters he has already met, so
   there is nothing to teach, only something to fetch.

   He grades himself. That is how flash cards work and it is fine here: the
   card is turned over immediately, so a wrong guess is corrected on the spot,
   and the memory model only needs to know whether to bring it back soon.
   ========================================================================== */

const Flash = {

  /** opts: {chars, back:{go}, label} */
  start(opts){
    const back = (opts && opts.back && opts.back.go) || (() => Screens.home());
    const queue = (opts && opts.chars ? opts.chars.slice() : []).filter(c => Data.char(c));
    if (!queue.length) return back();

    let i = 0, got = 0, again = [];
    const total = queue.length;

    const scr = UI.screen({sky:'sky-kingdom',
      title:'🃏 闪字卡' + (opts && opts.label ? `　${opts.label}` : ''), onBack:back});
    const body = el('div', {class:'scroll'});
    scr.append(body);
    UI.mount(scr);

    function card(){
      if (i >= queue.length){
        // a character he could not fetch comes round once more before the end
        if (again.length){ queue.push(...again); again = []; return card(); }
        return finish();
      }
      const ch = queue[i], info = Data.char(ch);
      const n = i + 1;

      body.innerHTML = '';
      body.append(el('div', {class:'flash-top'},
        el('b', {}, `第 ${n} 张 / 共 ${queue.length} 张`),
        el('small', {}, '先自己说出来，再翻过来对一对')));

      const face = el('div', {class:'flashcard'});
      face.append(el('div', {class:'fc-ch'}, ch));
      body.append(face);

      const bar = el('div', {class:'story-bar'});
      const hear = el('button', {class:'mini'}, '🔊 听一听');
      hear.onclick = () => { Sfx.tap(); Say.speak(Say.inWord(ch), {rate:0.55, interrupt:true}); };
      bar.append(hear);
      body.append(bar);

      body.append(UI.bigBtn('b-gold', '🔄', '翻过来看看', '', () => flip(ch, info, face)));
      Say.announce('这个字，你还记得吗？', 260);
    }

    function flip(ch, info, face){
      face.classList.add('turned');
      face.innerHTML = '';
      face.append(el('div', {class:'fc-ch small'}, ch));
      face.append(el('div', {class:'fc-py'}, info.py));
      face.append(el('div', {class:'fc-mean'}, info.mean));
      if (info.words && info.words.length)
        face.append(el('div', {class:'fc-words'}, info.words.slice(0, 3).join('　')));
      if (info.sent)
        face.append(el('div', {class:'fc-sent'}, info.sent.text.split(ch).join(ch)));
      Say.speak(Say.inWord(ch), {rate:0.55, interrupt:true});

      body.querySelectorAll('.big-btn, .story-bar').forEach(n => n.remove());
      const row = el('div', {class:'judgerow'});
      const yes = el('button', {class:'judgebtn yes'},
        el('span', {class:'em'}, '✅'), el('span', {}, '想起来了'));
      const no = el('button', {class:'judgebtn no'},
        el('span', {class:'em'}, '🤔'), el('span', {}, '没想起来'));
      yes.onclick = () => grade(ch, true);
      no.onclick  = () => grade(ch, false);
      row.append(yes, no);
      body.append(row);
      body.append(el('div', {class:'hint'}, '说对了就点「想起来了」—— 说错了没关系，它会再来一次'));
    }

    function grade(ch, ok){
      Memory.score(ch, 'recall', ok);
      if (ok){ got++; Sfx.great(); Store.award({stars:1, coins:8, xp:7}); }
      else { Sfx.soft(); again.push(ch); }
      i++;
      Say.afterSpeech(card, 3500, 450);
    }

    function finish(){
      UI.confetti(40);
      body.innerHTML = '';
      body.append(el('div', {class:'card', style:'text-align:center'},
        el('div', {style:'font-size:52px'}, '🃏'),
        el('div', {style:'font-size:21px;font-weight:900;margin:6px 0'}, '这一轮复习完啦！'),
        el('div', {class:'hint'}, `${total} 个字，一次就想起来 ${got} 个`)));
      body.append(UI.bigBtn('b-gold', '🔁', '再来一轮', '',
        () => Flash.start(opts)));
      body.append(UI.bigBtn('b-slate', '↩️', '回去', '', back));
      Say.cheer('finish', true);
    }

    setTimeout(card, 200);
  },
};


/* ===== 27-signin.js ===== */
/* =============================================================================
   谁在玩 — the name screen a class lands on.

   Every child opens the same file, types a name once, and from then on taps
   their own card. Their save is keyed by that name in this browser, so several
   children can share one tablet without stepping on each other.

   What this is NOT: an account. There is no server, so a name typed on the
   classroom iPad means nothing on the child's iPad at home, and the teacher
   can only see the children who played on the device in front of them. That
   limit is stated on the screen itself rather than left to be discovered.
   ========================================================================== */

const SignIn = {

  /** 挑一个自己的小英雄。

      两个形象是同一套骨架画的 —— 一样的披风、罩衫和表情，只换头发和配色，
      所以并排放着看得出是同一伙人，孩子挑的是"哪个是我"，不是"哪种画风"。

      图 底下原来写着"男孩英雄""女孩英雄"。去掉了：五六岁的孩子挑的
      是那张画，不是那两个词，而印着标签反而把"你是哪一类"摆到了台面上。 */
  askHero(name, onPick){
    const s = UI.screen({sky:'sky-day', title:'', onBack:() => this.open()});
    const scroll = el('div', {class:'scroll'});
    scroll.append(el('div', {style:'font-size:20px;font-weight:900;margin:4px 2px 2px'},
      `${name}，选择你的小英雄形象`));
    scroll.append(el('div', {class:'hint', style:'text-align:left;padding:2px 2px 14px'},
      '选好以后，他就一路陪着你'));

    const row = el('div', {class:'herorow'});
    ['boy', 'girl'].forEach(kind => {
      const b = el('button', {class:'herocard', 'aria-label':'小英雄 ' + kind});
      b.append(UI.hero(132, {kind}));
      b.onclick = () => { Sfx.great(); onPick(kind); };
      row.append(b);
    });
    scroll.append(row);

    const back = el('button', {class:'mini', style:'margin-top:18px'}, '← 回名单');
    back.onclick = () => { Sfx.tap(); this.open(); };
    scroll.append(back);

    s.append(scroll);
    UI.mount(s);
    Say.announce('选择你的小英雄形象', 320);
  },

  /** actually start playing as this child */
  enter(name, isNew){
    Store.use(name);
    Say.cheer('start', true);
    Screens.home();
    if (isNew) UI.toast({emoji:'🔒', text:'记住你的两个小图案',
                         sub:'下次要点它们才能进来', ms:2600});
  },

  /** The picture keypad. Used both to CHOOSE a lock and to open one, because
      a child should meet the same twelve pictures in the same places both
      times — recognising where 🐼 sits is half of how they remember it. */
  askPics({title, say, onDone, onGiveUp, confirm}){
    const s = UI.screen({sky:'sky-day', title:'', onBack:onGiveUp});
    const scroll = el('div', {class:'scroll'});
    scroll.append(el('div', {style:'font-size:20px;font-weight:900;margin:4px 2px 2px'}, title));
    const hint = el('div', {class:'hint', style:'text-align:left;padding:2px 2px 10px'},
      confirm ? '选两个，按顺序记住它们' : '按当时选的顺序点两个');
    scroll.append(hint);

    const shown = el('div', {class:'pickrow'});
    const slots = [el('i', {}, '？'), el('i', {}, '？')];
    slots.forEach(n => shown.append(n));
    scroll.append(shown);

    let picked = [];
    const grid = el('div', {class:'picgrid'});
    Store.LOCK_PICS.forEach(pic => {
      const b = el('button', {class:'picb'}, pic);
      b.onclick = () => {
        if (picked.length >= 2) return;
        Sfx.tap();
        picked.push(pic);
