<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>汉字大冒险</title>
<style>/* ---------------------------------------------------------------- tokens -- */
:root{
  --ink:#2f2a3d; --ink-soft:#6b6480;
  --cream:#fff7ec; --paper:#ffffff;
  --gold:#ffc93c; --gold-d:#e8a51c;
  --coral:#ff6b6b; --coral-d:#e04a4a;
  --leaf:#4fc281; --leaf-d:#2f9d61;
  --sky:#69cdf2; --sky-d:#3ba8d4;
  --grape:#8a6be2; --grape-d:#6a49c6;
  --rose:#ff9ec4;
  --shadow:0 8px 0 rgba(0,0,0,.12);
  --r:22px;
  --font:"PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei",
         "Noto Sans CJK SC",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:var(--font); color:var(--ink); background:#1d1a2b;
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
#app{position:fixed;inset:0;overflow:hidden}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}

/* ----------------------------------------------------------------- stage -- */
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  overflow:hidden;animation:screenIn .28s ease both;
}
@keyframes screenIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 28px}

/* skies -------------------------------------------------------------------- */
.sky{position:absolute;inset:0;z-index:-2}
.sky-day    {background:linear-gradient(#8fdcff 0%,#bdeeff 42%,#e8f8e4 68%,#cbecb4 100%)}
.sky-forest {background:linear-gradient(#a8e6ff 0%,#d6f2ff 40%,#e6f7d8 66%,#bfe6a4 100%)}
.sky-island {background:linear-gradient(#7fd8f7 0%,#c9f0ff 45%,#ffeec2 72%,#ffd9a0 100%)}
.sky-kingdom{background:linear-gradient(#b6a0f5 0%,#d7c9ff 44%,#ffe3f0 72%,#ffc9dd 100%)}
.sky-planet {background:linear-gradient(#2b2450 0%,#4a3a83 46%,#7a5aa8 76%,#c58bb8 100%)}
.sky-night  {background:linear-gradient(#241d47 0%,#3b2f6b 48%,#5a3f7e 100%)}
.hills{position:absolute;left:0;right:0;bottom:0;height:46%;z-index:-1}

/* --------------------------------------------------------------- topbar --- */
.top{
  display:flex;align-items:center;gap:10px;padding:10px 16px 4px;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.top h1{font-size:19px;margin:0;flex:1;letter-spacing:.5px;text-shadow:0 2px 0 #fff8}
.back{
  width:46px;height:46px;border-radius:50%;border:none;flex:none;
  background:var(--paper);color:var(--ink);font-size:22px;font-weight:700;
  box-shadow:0 4px 0 rgba(0,0,0,.14);cursor:pointer
}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}

/* stat pills */
.stats{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px}
.pill{
  background:#fffffff0;border-radius:999px;padding:8px 14px;font-size:14px;
  font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.10);display:flex;gap:6px;align-items:center
}
.pill b{font-size:17px}
.pill.hot{background:#fff0d8}

/* ---------------------------------------------------------------- cards --- */
.card{
  background:var(--paper);border-radius:var(--r);padding:16px;
  box-shadow:0 6px 0 rgba(0,0,0,.12);margin-bottom:14px
}
.menu{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:560px){.menu{grid-template-columns:1fr 1fr}}

.big-btn{
  display:flex;align-items:center;gap:14px;width:100%;border:none;cursor:pointer;
  border-radius:var(--r);padding:16px 18px;font-family:var(--font);
  font-size:19px;font-weight:800;color:#fff;text-align:left;
  box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .06s,box-shadow .06s
}
.big-btn .ico{font-size:30px;flex:none;filter:drop-shadow(0 2px 2px #0003)}
.big-btn small{display:block;font-size:12.5px;font-weight:600;opacity:.9;margin-top:2px}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.b-gold  {background:linear-gradient(#ffd45e,#f5a623)}
.b-coral {background:linear-gradient(#ff8a8a,#ea4b4b)}
.b-leaf  {background:linear-gradient(#6ad79a,#33a869)}
.b-sky   {background:linear-gradient(#7fd9f8,#2f9fd0)}
.b-grape {background:linear-gradient(#a58bee,#6f4dcc)}
.b-rose  {background:linear-gradient(#ffb0d0,#f06fa2)}
.b-slate {background:linear-gradient(#9aa3b8,#6b7590)}

/* world cards -------------------------------------------------------------- */
.worlds{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:620px){.worlds{grid-template-columns:1fr 1fr}}
.world{
  position:relative;border:none;cursor:pointer;font-family:var(--font);
  border-radius:26px;overflow:hidden;height:150px;padding:0;text-align:left;
  box-shadow:0 7px 0 rgba(0,0,0,.16);color:#fff
}
.world:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.16)}
.world .art{position:absolute;inset:0}
.world .lbl{position:absolute;left:18px;bottom:14px;text-shadow:0 2px 6px #0006}
.world .lbl b{display:block;font-size:24px;letter-spacing:1px}
.world .lbl span{font-size:13.5px;opacity:.95}
.world .tag{
  position:absolute;right:14px;top:14px;background:#fffffff0;color:var(--ink);
  border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:800
}
.world.locked{filter:grayscale(.55) brightness(.9)}
.world .prog{
  position:absolute;left:18px;right:18px;bottom:6px;height:7px;
  background:#ffffff5c;border-radius:99px;overflow:hidden
}
.world .prog i{display:block;height:100%;background:var(--gold);border-radius:99px}

/* unit list ---------------------------------------------------------------- */
.unit{
  display:flex;align-items:center;gap:12px;width:100%;border:none;cursor:pointer;
  font-family:var(--font);background:var(--paper);border-radius:20px;padding:14px;
  box-shadow:0 5px 0 rgba(0,0,0,.12);margin-bottom:12px;text-align:left
}
.unit:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.unit .n{
  width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;
  font-size:22px;background:linear-gradient(#ffd970,#f2a81e);color:#fff;font-weight:900
}
.unit .t{flex:1}
.unit .t b{font-size:17px;display:block}
.unit .t span{font-size:12.5px;color:var(--ink-soft)}
.unit .chars{font-size:19px;letter-spacing:2px;color:var(--ink-soft)}

/* --------------------------------------------------------------- glyphs --- */
.glyph{
  font-family:var(--font);font-weight:600;line-height:1;
  display:inline-block;text-shadow:0 2px 0 #0000000d
}
.tile{
  border:none;cursor:pointer;font-family:var(--font);background:var(--paper);
  border-radius:20px;box-shadow:0 5px 0 rgba(0,0,0,.14);
  display:grid;place-items:center;transition:transform .08s
}
.tile:active{transform:translateY(3px)}
.tile.good{background:#d8f8e4;box-shadow:0 5px 0 #46b57a;animation:pop .34s}
.tile.bad {background:#fff0d6;box-shadow:0 5px 0 #e5a83c;animation:wob .34s}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* prompt bar --------------------------------------------------------------- */
.ask{
  margin:0 16px 12px;background:#fffffff2;border-radius:20px;padding:13px 16px;
  box-shadow:0 5px 0 rgba(0,0,0,.10);display:flex;align-items:center;gap:12px
}
.ask .q{flex:1;font-size:19px;font-weight:800}
.ask .q i{font-style:normal;color:var(--coral-d)}
.spk{
  width:48px;height:48px;border-radius:50%;border:none;flex:none;cursor:pointer;
  background:linear-gradient(#7fd9f8,#2f9fd0);color:#fff;font-size:22px;
  box-shadow:0 4px 0 #1e7ba6
}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #1e7ba6}

/* hp / progress ------------------------------------------------------------ */
.hp{display:flex;gap:6px}
.hp i{width:26px;height:26px;font-style:normal;font-size:22px;line-height:1}
.bar{height:12px;background:#00000018;border-radius:99px;overflow:hidden;margin:0 16px 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd45e,#f5a623);border-radius:99px;transition:width .3s}

/* toast / banner ----------------------------------------------------------- */
.toast{
  position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.8);
  background:#fffffff5;border-radius:24px;padding:18px 26px;text-align:center;
  box-shadow:0 10px 30px #0004;z-index:95;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .28s cubic-bezier(.2,1.6,.4,1)
}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast .em{font-size:44px;display:block;line-height:1}
.toast .tx{font-size:20px;font-weight:800;margin-top:6px}
.toast .sub{font-size:14px;color:var(--ink-soft);margin-top:3px}

/* sparkles ----------------------------------------------------------------- */
.spark{position:absolute;font-size:22px;animation:fly .9s ease-out forwards;pointer-events:none}
@keyframes fly{
  0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot))}
}

/* --------------------------------------------------------------- hunt ----- */
/* The play field used to be `position:absolute; inset:0`, which covered the
   whole screen — including the question card and the ask bar sitting above it
   in the DOM. Those cards became untappable, and falling suns could also hide
   behind them. It now fills the space that is actually left below, so nothing
   overlaps and nothing is swallowed. */
.field{position:relative;flex:1;min-height:120px;overflow:hidden}
.hero{position:absolute;width:88px;height:104px;transition:transform .12s;z-index:5}
.hero.walk{animation:bob .38s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.gem{
  position:absolute;width:92px;height:92px;border-radius:26px;background:#fffffff0;
  box-shadow:0 6px 0 rgba(0,0,0,.16);display:grid;place-items:center;
  font-size:46px;font-weight:600;z-index:4
}
.gem.got{animation:pop .4s;background:#d8f8e4;box-shadow:0 6px 0 #46b57a}

/* --------------------------------------------------------------- monster -- */
.mons{display:grid;gap:14px;grid-template-columns:1fr 1fr;padding:0 16px}
@media(min-width:560px){.mons{grid-template-columns:repeat(4,1fr)}}
.mon{
  position:relative;border:none;cursor:pointer;font-family:var(--font);
  border-radius:26px;padding:22px 8px;box-shadow:0 6px 0 rgba(0,0,0,.16);
  display:grid;place-items:center;min-height:112px;
  animation:hover 2.4s ease-in-out infinite
}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.mon .ch{font-size:52px;font-weight:600;color:#fff;text-shadow:0 3px 0 #0003;line-height:1.1}
/* a picture answer sits on a light plate so the emoji reads on any monster */
.mon.pic .ch{font-size:46px;background:#ffffffe8;border-radius:18px;
             padding:6px 14px;text-shadow:none}
.mon.zap{animation:zap .5s forwards}
@keyframes zap{
  0%{transform:scale(1)}30%{transform:scale(1.2) rotate(6deg)}
  100%{transform:scale(0) rotate(90deg);opacity:0}
}
.mon.miss{animation:wob .4s}

/* --------------------------------------------------------------- factory -- */
.mach{
  margin:0 16px 14px;background:linear-gradient(#cfd8ea,#a8b6d0);border-radius:26px;
  padding:16px;box-shadow:0 6px 0 #7a89a6;position:relative;overflow:hidden
}
.slots{display:flex;gap:12px;justify-content:center;align-items:center}
.slot{
  width:84px;height:84px;border-radius:20px;background:#ffffffcc;border:4px dashed #8794b0;
  display:grid;place-items:center;font-size:40px;font-weight:600
}
.slot.filled{border-style:solid;border-color:var(--leaf);background:#eaffef}
.plus{font-size:30px;font-weight:900;color:#5b6884}
.out{
  margin-top:14px;height:104px;border-radius:20px;background:#ffffffee;
  display:grid;place-items:center;font-size:62px;font-weight:600
}
.out.run{animation:shakeM .5s infinite}
@keyframes shakeM{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.parts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.part{
  width:82px;height:82px;border-radius:20px;border:none;cursor:pointer;
  background:var(--paper);box-shadow:0 5px 0 rgba(0,0,0,.14);
  font-family:var(--font);font-size:40px;font-weight:600
}
.part:active{transform:translateY(3px)}
.part.used{opacity:.35;pointer-events:none}

/* --------------------------------------------------------------- repair --- */
.repair-wrap{display:grid;place-items:center;padding:0 16px}
#repairCv{background:#fff;border-radius:24px;box-shadow:0 6px 0 rgba(0,0,0,.14);touch-action:none}
.patches{display:flex;gap:14px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.patch{
  border:none;cursor:pointer;background:var(--paper);border-radius:18px;padding:6px;
  box-shadow:0 5px 0 rgba(0,0,0,.14)
}
.patch:active{transform:translateY(3px)}
.patch canvas{display:block;border-radius:12px}

/* --------------------------------------------------------------- match ---- */
.grid-m{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);padding:0 16px}
.mcard{
  aspect-ratio:1;border:none;cursor:pointer;border-radius:18px;font-family:var(--font);
  background:linear-gradient(#8a6be2,#6a49c6);color:#fff;font-size:13px;
  box-shadow:0 5px 0 #4f34a0;display:grid;place-items:center;position:relative
}
.mcard .in{font-size:34px;font-weight:600;opacity:0;transition:opacity .12s}
.mcard.up{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.14)}
.mcard.up .in{opacity:1}
.mcard.done{background:#d8f8e4;box-shadow:0 5px 0 #46b57a;pointer-events:none}
.mcard .in.sm{font-size:15px;font-weight:800;padding:4px;text-align:center;line-height:1.2}

/* --------------------------------------------------------------- speed ---- */
.floaty{
  position:absolute;border:none;cursor:pointer;font-family:var(--font);
  width:92px;height:92px;border-radius:24px;font-size:46px;font-weight:600;
  background:#fffffff2;box-shadow:0 5px 0 rgba(0,0,0,.16)
}
.combo{
  position:absolute;right:18px;top:96px;font-size:30px;font-weight:900;color:#fff;
  text-shadow:0 3px 0 #0004;transition:transform .15s
}
.combo.bump{transform:scale(1.3)}

/* --------------------------------------------------------------- context -- */
.scene{
  margin:0 16px 14px;background:#fffffff2;border-radius:24px;padding:18px;
  box-shadow:0 6px 0 rgba(0,0,0,.12);text-align:center
}
.scene .pic{font-size:64px;line-height:1.1}
.sent{font-size:26px;font-weight:800;margin-top:10px;letter-spacing:2px}
.sent .blank{
  display:inline-block;min-width:56px;border-bottom:5px solid var(--coral);
  color:var(--coral-d)
}

/* ---------------------------------------------------------------- boss ---- */
.boss-stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
.boss{font-size:92px;line-height:1;animation:hover 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 10px #0005)}
.boss.hit{animation:bhit .45s}
@keyframes bhit{0%{transform:scale(1)}30%{transform:scale(1.15) rotate(-8deg);filter:brightness(2.4)}100%{transform:scale(1)}}
.boss.dead{animation:bdead .9s forwards}
@keyframes bdead{to{transform:scale(0) rotate(220deg);opacity:0}}
.boss-name{color:#fff;font-weight:900;font-size:20px;text-shadow:0 3px 0 #0005}

/* --------------------------------------------------------------- dex ------ */
.dex{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));padding:0 4px}
.dexc{
  aspect-ratio:.86;border:none;cursor:pointer;font-family:var(--font);
  border-radius:18px;background:var(--paper);box-shadow:0 5px 0 rgba(0,0,0,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px
}
.dexc .g{font-size:34px;font-weight:600}
.dexc .p{font-size:11px;color:var(--ink-soft)}
.dexc .s{font-size:11px;letter-spacing:-1px}
.dexc.dim{background:#e9e5f0;color:#b3aac4;box-shadow:0 5px 0 #cdc6da}
.dexc.dim .g{opacity:.45}

.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:96;background:var(--cream);
  border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px #0004;animation:up .26s cubic-bezier(.2,1.2,.3,1) both;
  max-height:86%;overflow-y:auto
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .hero-g{font-size:96px;text-align:center;font-weight:600;line-height:1.05}
.sheet .py{text-align:center;font-size:20px;color:var(--ink-soft);font-weight:700}
.words{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.word{background:#fff;border-radius:14px;padding:8px 14px;font-size:17px;font-weight:700;
      box-shadow:0 3px 0 rgba(0,0,0,.10)}
.kv{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-soft);
    padding:7px 2px;border-bottom:1px dashed #0001}
.row{display:flex;gap:10px;margin-top:14px}
.row .big-btn{font-size:16px;padding:13px}

/* --------------------------------------------------------------- summary -- */
.sum-ch{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0 4px}
.sum-ch b{font-size:34px;font-weight:600}

/* --------------------------------------------------------------- parent --- */
.field-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field-row label{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.field-row input,.field-row select,.field-row textarea{
  font-family:var(--font);font-size:15px;padding:10px 12px;border-radius:12px;
  border:2px solid #0000001a;background:#fff
}
.mini{font-size:13px;padding:9px 14px;border-radius:12px;border:none;cursor:pointer;
      font-family:var(--font);font-weight:700;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.mini:active{transform:translateY(2px)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid #0001;text-align:left}

.center{display:grid;place-items:center;height:100%}
.hint{font-size:13px;color:var(--ink-soft);text-align:center;padding:8px 20px}
.demo-tag{
  display:inline-block;background:#ffe9b8;color:#8a6412;border-radius:99px;
  padding:3px 10px;font-size:11.5px;font-weight:800;margin-left:6px;vertical-align:middle
}

/* ------------------------------------------------------------------ shop -- */
.shop-item{
  display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:20px;
  padding:12px 14px;box-shadow:0 5px 0 rgba(0,0,0,.12);margin-bottom:12px
}
.shop-item.owned{background:#eafaf0;box-shadow:0 5px 0 #8fd7ab}
.si-e{font-size:40px;flex:none;width:52px;text-align:center}
.si-t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.si-t b{font-size:17px}
.si-py{font-size:12px;color:var(--ink-soft);font-weight:600}
.si-t span{font-size:12.5px;color:var(--ink-soft)}
.si-stat{font-size:11.5px!important;opacity:.8}
.si-buy{
  border:none;cursor:pointer;font-family:var(--font);font-weight:800;font-size:15px;
  padding:11px 15px;border-radius:15px;color:#fff;flex:none;
  background:linear-gradient(#ffd45e,#f5a623);box-shadow:0 4px 0 #c9820f
}
.si-buy:active{transform:translateY(3px);box-shadow:0 1px 0 #c9820f}
.si-buy.no{background:linear-gradient(#c3c8d2,#98a0ae);box-shadow:0 4px 0 #7d8593}
.si-buy.got{background:linear-gradient(#7bd7a2,#3faa71);box-shadow:0 4px 0 #2d8154;cursor:default}

/* ------------------------------------------------------------------- pvz -- */
.pvz-hud{
  display:flex;align-items:center;gap:10px;padding:0 16px 8px;color:#fff
}
.pvz-sun{
  background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;
  font-size:15px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.18)
}
.pvz-wave{flex:1;font-weight:800;font-size:14px;text-shadow:0 2px 0 #0005}
.pvz-q{
  margin:0 16px 8px;background:#fffffff2;border-radius:18px;padding:10px 12px;
  box-shadow:0 5px 0 rgba(0,0,0,.14)
}
.pvz-qhead{display:flex;align-items:center;gap:10px}
.pvz-qt{flex:1;font-size:16px;font-weight:800}
.pvz-qt i{font-style:normal;color:var(--coral-d)}
.pvz-qhead .spk{width:40px;height:40px;font-size:19px}
.pvz-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pvz-opt{
  border:none;cursor:pointer;font-family:var(--font);font-size:30px;font-weight:600;
  height:58px;border-radius:14px;background:#f4f1fa;box-shadow:0 4px 0 rgba(0,0,0,.13)
}
.pvz-opt:active{transform:translateY(3px)}
.pvz-opt.good{background:#d8f8e4;box-shadow:0 4px 0 #46b57a}
.pvz-opt.bad{background:#fff0d6;box-shadow:0 4px 0 #e5a83c;animation:wob .34s}

.lawn{
  position:relative;flex:1;margin:0 8px;display:grid;overflow:hidden;
  border-radius:18px;background:linear-gradient(#7fc46a,#5da84e);
  box-shadow:inset 0 0 0 3px #4b8f42
}
.cell{border-right:1px solid #ffffff14;border-bottom:1px solid #00000010}
.cell.alt{background:#ffffff0e}
.plant{
  position:absolute;display:grid;place-items:center;font-size:31px;
  pointer-events:none;transition:filter .1s
}
.plant.bitten{animation:wob .4s}
.zomb{
  position:absolute;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none;transition:filter .09s
}
.zomb .zb{font-size:28px;line-height:1}
.zomb .zc{
  font-size:17px;font-weight:700;color:#fff;background:#00000066;
  border-radius:8px;padding:0 6px;margin-top:1px
}
.zomb.slow .zb{filter:hue-rotate(150deg) brightness(1.2)}
.zomb.zap{animation:zapz .3s}
@keyframes zapz{0%{filter:brightness(4)}100%{filter:none}}
.zomb.die{animation:zdie .4s forwards}
@keyframes zdie{to{transform:scale(.2) rotate(70deg);opacity:0}}
.pea{
  position:absolute;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#d8ff9b,#67c22e);
  box-shadow:0 0 6px #9bff5a80;pointer-events:none
}

.tray{
  display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  overflow-x:auto
}
.seed{
  flex:none;width:74px;border:none;cursor:pointer;font-family:var(--font);
  background:var(--paper);border-radius:14px;padding:7px 4px;
  box-shadow:0 4px 0 rgba(0,0,0,.16);display:flex;flex-direction:column;
  align-items:center;gap:1px
}
.seed .e{font-size:26px;line-height:1}
.seed .n{font-size:11px;font-weight:800}
.seed .c{font-size:11px;color:var(--ink-soft);font-weight:700}
.seed.on{background:#fff3cf;box-shadow:0 4px 0 #e0a92a;transform:translateY(2px)}
.seed.poor{opacity:.45}

/* ------------------------------------------------------------- stage card -- */
.stage-card{
  position:absolute;inset:0;z-index:30;display:grid;place-items:center;
  background:#0000006e;animation:screenIn .2s both;
  /* 这张卡挂在 #fx 里，而 #fx 是 pointer-events:none（飘字和彩纸不能挡路）。
     卡片必须自己把触摸接住 —— 否则这 2.2 秒里孩子点屏幕，手指是穿过去点在
     下面那一关上的：上一关被多打完一次，再上报一次「完成」，关卡指针就多走
     一格，刚上屏的这一关立刻被下一关顶掉。 */
  pointer-events:auto
}
.stage-in{
  background:var(--paper);border-radius:26px;padding:22px 28px;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.2);min-width:250px
}
.stage-in .ic{font-size:52px;line-height:1}
.stage-in .nm{font-size:22px;font-weight:900;margin-top:6px}
.stage-in .st{font-size:13px;color:var(--ink-soft);margin-top:3px}
.stage-dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.stage-dots i{width:10px;height:10px;border-radius:50%;background:#0000001f;font-style:normal}
.stage-dots i.on{background:var(--gold)}
.stage-dots i.now{background:var(--coral);transform:scale(1.35)}

/* the unit page's stage path */
.path{display:flex;flex-direction:column;gap:0}
.path-row{display:flex;align-items:center;gap:12px;padding:7px 0}
.path-row .pi{
  width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-size:19px;background:#f2eef8
}
.path-row .pt{flex:1;font-size:14.5px;font-weight:700}
.path-row .pt small{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:600}

/* ============================================================ PvZ v2 ====== */
.pvz-bar{display:flex;align-items:center;gap:10px;padding:0 14px 6px}
.sunbank{
  background:linear-gradient(#fff6cf,#ffe28a);border-radius:999px;padding:6px 13px;
  font-size:15px;font-weight:900;color:#7a5a10;box-shadow:0 3px 0 #d9a92c;
  display:flex;gap:5px;align-items:center;flex:none
}
.meter{
  flex:1;height:16px;border-radius:99px;background:#00000038;position:relative;
  overflow:visible;box-shadow:inset 0 2px 4px #0004
}
.meter i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#ff9d5c,#ff5c5c);transition:width .3s}
.meter .flag{position:absolute;top:-7px;transform:translateX(-50%);font-size:15px}

.seedbar{display:flex;gap:6px;padding:0 12px 6px;overflow-x:auto}
.packet{
  position:relative;flex:none;width:62px;border:none;cursor:pointer;font-family:var(--font);
  background:linear-gradient(#f7f1df,#e6dcc0);border-radius:10px;padding:5px 3px 4px;
  box-shadow:0 3px 0 #b3a681;display:flex;flex-direction:column;align-items:center;
  overflow:hidden;border:2px solid #b3a681
}
.packet .pe{font-size:22px;line-height:1}
.packet .pn{font-size:9.5px;font-weight:800;color:#4a4231;white-space:nowrap}
.packet .pc{font-size:10px;font-weight:800;color:#8a6a12}
.packet .cool{
  position:absolute;left:0;right:0;top:0;background:#0b1a3799;height:0;
  transition:height .18s linear;pointer-events:none
}
.packet.on{box-shadow:0 3px 0 #d9a92c;border-color:#ffc93c;transform:translateY(2px)}
.packet.poor{filter:grayscale(.7);opacity:.6}
.packet.shovel{background:linear-gradient(#dfe6f2,#c2cddf);border-color:#8e9cb4;box-shadow:0 3px 0 #8e9cb4}

.yard{flex:1;display:flex;align-items:center;margin:0 8px 8px;min-height:0}
.mowers{display:flex;flex-direction:column;flex:none;width:34px}
.mower{
  display:grid;place-items:center;font-size:21px;transition:transform .1s linear
}
.mower.go{filter:drop-shadow(0 0 6px #ffd166)}
.lawn{
  position:relative;flex:1;display:grid;overflow:hidden;border-radius:14px;
  background:linear-gradient(#86c96f,#5da84e);box-shadow:inset 0 0 0 3px #4b8f42
}
.cell{border-right:1px solid #ffffff12;border-bottom:1px solid #00000010}
.cell.alt{background:#ffffff10}
.plant{position:absolute;display:grid;place-items:center;font-size:30px;pointer-events:none}
.plant.flat{font-size:22px;align-items:end;padding-bottom:2px;opacity:.95}
.plant.arming{opacity:.5}
.plant.bitten{animation:wob .4s}
.plant.chewing{filter:hue-rotate(-25deg)}
.plant.squash-jump{animation:sq .3s forwards}
@keyframes sq{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-26px) scale(1.2)}
              100%{transform:translateY(6px) scale(1.3);opacity:0}}
.zomb{position:absolute;display:flex;flex-direction:column;align-items:center;
      justify-content:center;pointer-events:none;transition:filter .08s}
.zomb .zb{font-size:26px;line-height:1;position:relative}
.zomb .zb .gear{position:absolute;left:50%;top:-11px;transform:translateX(-50%);font-size:15px}
.zomb .zc{font-size:15px;font-weight:800;color:#fff;background:#00000070;
          border-radius:7px;padding:0 5px;margin-top:1px}
.zomb.fly{filter:drop-shadow(0 4px 3px #0006)}
.zomb.slow .zb{filter:hue-rotate(160deg) brightness(1.25)}
.zomb.hop{transition:none;animation:hop .42s}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-30px)}100%{transform:translateY(0)}}
.zomb.zap{animation:zapz .3s}
@keyframes zapz{0%{filter:brightness(5)}100%{filter:none}}
.zomb.die{animation:zdie .38s forwards}
@keyframes zdie{to{transform:scale(.2) rotate(75deg);opacity:0}}
.pea{position:absolute;width:13px;height:13px;border-radius:50%;pointer-events:none;
     background:radial-gradient(circle at 35% 35%,#dcff9e,#67c22e);box-shadow:0 0 6px #9bff5a80}
.pea.ice{background:radial-gradient(circle at 35% 35%,#dff6ff,#4fb8e8);box-shadow:0 0 7px #8fdcff}
.sunorb{
  position:absolute;width:44px;height:44px;border:none;cursor:pointer;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#fff6c4,#ffd23f);font-size:22px;
  box-shadow:0 0 14px #ffd23f99;animation:spin 3.4s linear infinite;z-index:6
}
@keyframes spin{to{transform:rotate(360deg)}}
.sunorb.taken{animation:none;transform:scale(1.6);opacity:0;transition:.2s}

.bigwave{
  position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);
  font-size:27px;font-weight:900;color:#ffde5c;text-shadow:0 3px 0 #7a2b2b,0 0 20px #ff6b6b;
  z-index:95;pointer-events:none;animation:bw 1.8s ease-out forwards;white-space:nowrap
}
@keyframes bw{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
              18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
              80%{opacity:1}100%{opacity:0}}

/* ---------------------------------------------------------- level map --- */
.lv-grid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:560px){.lv-grid{grid-template-columns:1fr 1fr}}
.lv{
  display:flex;align-items:center;gap:12px;border:none;cursor:pointer;text-align:left;
  font-family:var(--font);background:var(--paper);border-radius:18px;padding:11px 13px;
  box-shadow:0 5px 0 rgba(0,0,0,.14)
}
.lv:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.lv-n{
  width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-size:19px;font-weight:900;color:#fff;background:linear-gradient(#6ad79a,#33a869)
}
.lv-t{flex:1;min-width:0}
.lv-t b{display:block;font-size:15.5px}
.lv-t span{font-size:11.5px;color:var(--ink-soft)}
.lv-ok{font-size:18px}
.lv.lock{filter:grayscale(.7);opacity:.62}
.lv.lock .lv-n{background:linear-gradient(#b9c0cd,#8b93a3)}
.lv.done .lv-n{background:linear-gradient(#ffd45e,#f5a623)}

/* ------------------------------------------------------------- minis ---- */
.whack-info{display:flex;gap:14px;justify-content:center;color:#fff;font-weight:800;
            font-size:14px;padding-bottom:6px;text-shadow:0 2px 0 #0005}
.graves{flex:1;display:grid;gap:8px;padding:0 14px 16px;min-height:0}
.grave{position:relative;display:grid;place-items:end center;overflow:hidden;
       border-radius:14px;background:#ffffff12}
.grave .stone{font-size:30px;opacity:.9;pointer-events:none}
.popz{
  position:absolute;left:50%;bottom:6px;transform:translate(-50%,120%);
  border:none;cursor:pointer;background:none;font-family:var(--font);
  display:flex;flex-direction:column;align-items:center;transition:transform .16s
}
.popz.up{transform:translate(-50%,0)}
/* 僵尸身上的字才是题目。The child has to READ every head before deciding
   whether to swing, and at 15px against a dark yard he was swinging at the
   shape of a zombie instead. The character leads now; the zombie is scenery
   behind it, which is the same call we made in 汉字怪兽. */
.popz .zh{font-size:22px;line-height:1;opacity:.85}
.popz .zt{font-size:30px;font-weight:800;color:#2a2140;background:#fff;
          border-radius:10px;padding:1px 11px;margin-top:-8px;line-height:1.25;
          box-shadow:0 3px 0 #00000033;border:2px solid #ffffffcc}
.popz.bonk{animation:zdie .25s forwards}
.popz.wrongz{animation:wob .35s}

/* 底色一片草绿，分行交给 .blane 自己染 —— 原来这里铺的是固定 34px 的
   条纹，跟真正的四行对不上：看着像八行，孩子瞄准的时候数不清自己在第几行。 */
.alley{position:relative;flex:1;margin:0 10px;border-radius:14px;overflow:hidden;
       background:#8ccb6b}
/* 四条草坪画出来 —— 要孩子瞄准哪一行，就得让他看得见行在哪儿。
   原来的背景条纹是固定 34px，跟真正的行高对不上，等于在骗他。 */
/* 拖坚果的时候，浏览器默认会把这一下当成"滑页面"，半路发 pointercancel
   把手势抢走 —— 表现就是拖到一半坚果没了、哪一行都没滚。touch-action:none
   等于告诉浏览器"这块地方的触摸我自己管"。 */
.alley, .nut{touch-action:none}

/* 叫 blane 不叫 lane：字词砌墙已经有一个 .lane（深蓝夜间草坪），
   重名会让保龄球的四条草地直接套上人家的样子，变成一片深蓝。 */
.blane{position:absolute;left:0;right:0;pointer-events:none;
       background:#8ccb6b;box-shadow:inset 0 -2px 0 #ffffff3d;transition:background .08s}
.blane.alt{background:#7cbf5c}
.blane.hot{background:#ffffff4d;box-shadow:inset 0 0 0 3px #ffffffb0}

/* 本课的字都在这儿，练过一个亮一个 —— 让孩子（和老师）看得见还差谁 */
.bowl-dex{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 14px 6px}
.bowl-dex b{font-size:15px;font-weight:800;min-width:26px;text-align:center;
            border-radius:8px;padding:1px 5px;background:#0000000f;color:#8b8598}
.bowl-dex b.got{background:var(--gold);color:#5a3b1c;box-shadow:0 2px 0 #0002}

/* 手里拿着的那颗，跟着手指走 */
.dragnut{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%);
         display:flex;flex-direction:column;align-items:center;font-size:0;
         filter:drop-shadow(0 6px 6px #0003)}
.dragnut .rn{width:52px;height:52px;display:block}
.dragnut .rc{font-size:15px;font-weight:800;color:#5a3b1c;background:#ffe9b8;
             border-radius:7px;padding:1px 7px;margin-top:-4px}
.dragnut.parked{animation:bob .9s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,calc(-50% - 7px))}}
.nut.held{opacity:.4}

.rollnut{position:absolute;display:flex;flex-direction:column;align-items:center;
         pointer-events:none;font-size:26px}
.rollnut .rc{font-size:13px;font-weight:800;color:#5a3b1c;background:#ffe9b8;
             border-radius:6px;padding:0 5px;margin-top:-4px}
.rack{display:flex;gap:12px;justify-content:center;padding:12px 14px
      calc(14px + env(safe-area-inset-bottom))}
.nut{
  border:none;cursor:pointer;font-family:var(--font);background:var(--paper);
  border-radius:16px;padding:8px 12px;box-shadow:0 5px 0 rgba(0,0,0,.16);
  display:flex;flex-direction:column;align-items:center
}
.nut:active{transform:translateY(3px)}
.nut .ne{font-size:30px;line-height:1}
.nut .nc{font-size:19px;font-weight:800;margin-top:-2px}
.nut.good{background:#d8f8e4;box-shadow:0 5px 0 #46b57a}
.nut.bad{background:#fff0d6;box-shadow:0 5px 0 #e5a83c;animation:wob .34s}

/* ---------------------------------------------------- sprite containers -- */
.plant svg, .zomb .zb svg, .packet .pe svg, .si-e svg,
.mower svg, .sunorb svg, .pea svg, .nut .ne svg, .rollnut .rn svg,
.grave .stone svg, .popz .zh svg{width:100%;height:100%;display:block}
.plant{display:block!important;padding:2%}
.plant.flat{padding:0}
.zomb .zb{width:88%;height:80%}
.packet .pe{width:30px;height:30px}
.si-e{width:52px;height:52px}
.mower{padding:2px}
.sunorb{background:none!important;box-shadow:none!important;padding:0;
        filter:drop-shadow(0 0 10px #ffd23fcc)}
.pea{background:none!important;box-shadow:none!important;width:16px;height:16px}
.pea svg{filter:drop-shadow(0 0 5px #9bff5a66)}
.nut .ne{width:46px;height:46px}
.rollnut{font-size:0}
.rollnut .rn{width:40px;height:40px;display:block}
.grave .stone{width:46px;height:46px}
.popz .zh{width:38px;height:44px;display:block}

/* music toggle */
.mus{
  width:46px;height:46px;border-radius:50%;border:none;flex:none;cursor:pointer;
  background:var(--paper);font-size:19px;box-shadow:0 4px 0 rgba(0,0,0,.14)
}
.mus:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.mus.off{opacity:.5}

/* ---------------------------------------------------------------- 读故事 -- */
/* Reading wants a different rhythm from the drills: long line length, generous
   leading, and the taught characters marked without turning the page into a
   highlighter accident. */
.story-head{display:flex;align-items:center;gap:12px;padding:4px 18px 10px}
.story-head .em{font-size:34px}
.story-head b{display:block;font-size:19px;font-weight:900}
.story-head small{color:#7a7290;font-size:12.5px;font-weight:700}

.card.story{padding:20px 18px 22px}
.story-text{font-size:21px;line-height:2.05;letter-spacing:.5px;color:#2f2a3d}

/* 无拼音时：整段是普通文字，只把学过的字标出来 */
.story-text > .hz{display:inline-block;font-weight:800;color:#7b3fb5;
                  background:#f1e7ff;border-radius:7px;padding:0 3px;margin:0 1px;
                  cursor:pointer;transition:transform .12s,background .12s}
.story-text > .hz:active{transform:scale(.9);background:#e2cdff}

/* 有拼音时：每个字都是一个「拼音在上、汉字在下」的等高小格，所以整行永远齐 */
.story-text.ruby{line-height:1.25;letter-spacing:0}
.story-text .ru{display:inline-block;vertical-align:top;text-align:center;
                margin:0 .5px 8px}
.story-text .ru .p{display:block;font-style:normal;font-size:11px;line-height:1.5;
                   font-weight:700;color:#a99ec4;white-space:nowrap;
                   font-family:-apple-system,"Helvetica Neue",sans-serif}
.story-text .ru .c{display:block;font-style:normal;line-height:1.3;padding:0 1px;
                   border-radius:6px}
.story-text .ru.hz{cursor:pointer}
.story-text .ru.hz .p{color:#9a63d6}
.story-text .ru.hz .c{font-weight:800;color:#7b3fb5;background:#f1e7ff;padding:0 4px}
.story-text .ru.hz:active .c{background:#e2cdff}

.story-bar{display:flex;justify-content:center;gap:10px;padding:2px 16px 0}

.opts{display:grid;gap:11px;padding:0 16px}
.opt{font:inherit;font-size:17px;font-weight:700;text-align:left;
     padding:15px 18px;border-radius:16px;border:2px solid #e3dcf2;
     background:#fff;color:#2f2a3d;cursor:pointer;line-height:1.45}
.opt:active{transform:scale(.985)}
.opt.good{background:#d9f7e2;border-color:#63c98a}
.opt.bad{background:#ffe2e2;border-color:#ef8b8b}

/* 关卡列表：每一行本身就是一个入口 */
.path-row{width:100%;background:none;border:none;font:inherit;color:inherit;
          text-align:left;cursor:pointer;border-radius:14px;
          transition:background .12s,transform .1s}
.path-row:active{background:#f4f0fb;transform:scale(.985)}
.path-row .go{flex:none;font-size:12px;color:#b6acd0;padding-right:2px}
.path-row:active .go{color:#7b3fb5}

/* 割草机余量：归零时变红，提示这一关再被冲破就结束了 */
.mowpill{background:linear-gradient(#e8f7dd,#c9ecb0);color:#37622a;
         box-shadow:0 3px 0 #9cc97e}
.mowpill.hot{background:linear-gradient(#ffe0e0,#ffbcbc);color:#8a2020;
             box-shadow:0 3px 0 #e08a8a;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* belt and braces: whatever else lands on the screen, the question stays tappable */
.pvz-q,.ask{position:relative;z-index:2}

/* 窄问题卡里的图片提示 —— 看图选字全靠它 */
.pvz-qpic{flex:none;font-size:34px;line-height:1.1}

/* ------------------------------------------------------- 🌻 向日葵农场 -- */
/* Suns fall in a narrow band just above the beds instead of anywhere on the
   screen, and the orbs are big enough for a seven-year-old's finger. */
.farm-sky{min-height:150px}
.farm-beds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
           padding:0 14px 6px;flex:none}
.plot{aspect-ratio:1;border:none;border-radius:14px;cursor:pointer;
      background:repeating-linear-gradient(45deg,#b98a5e,#b98a5e 6px,#ad7f54 6px,#ad7f54 12px);
      box-shadow:inset 0 -4px 0 #96683f, 0 3px 0 rgba(0,0,0,.15);
      display:grid;place-items:center;padding:4px;transition:transform .12s}
.plot:active{transform:scale(.94)}
.plot.grown{background:linear-gradient(#cfeeb0,#a8dc86);box-shadow:inset 0 -4px 0 #7fbb62}
.plot.grown svg{width:100%;height:100%}
.plot.pulse{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.12)}}

.sunorb.big{width:62px;height:62px}
.sunorb.fading{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.sunbank.rich{animation:pulse 1.2s ease-in-out infinite}

/* 题面里紧跟 icon 的那张小图 */
.pvz-qt .qpic{font-style:normal;font-size:24px;vertical-align:-3px}

/* -------------------------------------------------------- 🧱 字词砌墙 -- */
.lane{flex:none;height:170px;margin:0 10px;border-radius:16px;
      background:linear-gradient(#243055,#3a4a72 55%,#46613c);
      box-shadow:inset 0 0 0 3px #1c2440}
.house{position:absolute;left:10px;bottom:6px;font-size:50px;line-height:1;
       filter:drop-shadow(0 3px 4px #0006)}
.brickwall{position:absolute;left:92px;bottom:6px;width:30px;
           display:flex;flex-direction:column-reverse;gap:2px;transition:opacity .2s}
.brickwall .bk{display:block;height:12px;border-radius:3px;
               background:linear-gradient(#d97b52,#b85f3c);
               box-shadow:inset 0 -2px 0 #9c4c2e}
.lanez{position:absolute;width:58px;height:70px}
.lanez.eating{animation:chomp .4s infinite}
@keyframes chomp{50%{transform:translateX(-4px) rotate(-3deg)}}

.brickpill{background:linear-gradient(#fff0e4,#ffd7bd);color:#8a4520;
           box-shadow:0 3px 0 #dda27a}
.brickpill.low{background:linear-gradient(#ffd6d6,#ffb0b0);color:#8a2020;
               box-shadow:0 3px 0 #e08a8a;animation:pulse 1s ease-in-out infinite}

/* 词语填空：缺的那个字留一个明显的空格 */
.wordgap{display:flex;gap:6px;align-items:center;flex:none}
.wordgap i{font-style:normal;font-size:30px;font-weight:800;color:#2f2a3d;
           background:#f4f1fa;border-radius:10px;padding:2px 8px;line-height:1.25}
.wordgap i.gap{background:#fff2c9;color:#c08a20;border:2px dashed #e0b34a;padding:0 6px}

/* 答题倒计时：犹豫才是真正致命的 */
.qclock{height:6px;border-radius:999px;background:#00000012;overflow:hidden;margin:0 0 8px}
.qclock i{display:block;height:100%;border-radius:999px;background:#63c98a;
          transition:width .12s linear}
.qclock.urgent i{background:#e8663f}
.wavepill{background:linear-gradient(#dceeff,#b8dcff);color:#1f4a75;box-shadow:0 3px 0 #8dbde8}
.combopill{background:linear-gradient(#f0f0f4,#dcdce4);color:#555;box-shadow:0 3px 0 #b8b8c2}
.combopill.hot{background:linear-gradient(#ffe0b8,#ffbf7a);color:#8a4a10;
               box-shadow:0 3px 0 #e0a05a;animation:pulse 1s ease-in-out infinite}
.bestpill{background:linear-gradient(#fff3cd,#ffe49a);color:#7a5a10;box-shadow:0 3px 0 #d9b94c}
.lanez.cone svg,.lanez.bucket svg{filter:drop-shadow(0 0 3px #0007)}

/* ------------------------------------------------------- ⚡ 汉字快线 ---- */
/* One lane, constant speed, right to left. Predictable motion is the point:
   a seven-year-old can put a finger where the character is going to be. */
.belt{position:relative;flex:none;height:150px;margin:6px 10px 8px;border-radius:18px;
      overflow:hidden;background:linear-gradient(#3a3f63,#2c3050);
      box-shadow:inset 0 0 0 3px #23263f}
.belt::before,.belt::after{content:'';position:absolute;left:0;right:0;height:10px;
      background:repeating-linear-gradient(90deg,#5a608c,#5a608c 14px,#474d76 14px,#474d76 28px)}
.belt::before{top:0} .belt::after{bottom:0}
.beltlane{position:absolute;inset:10px 0}
.beltedge{position:absolute;left:0;top:0;bottom:0;width:26px;z-index:2;
          background:linear-gradient(90deg,#0006,#0000)}
.belt.slip{animation:shake .26s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.beltcard{position:absolute;top:50%;transform:translateY(-50%);
          width:84px;height:84px;border:none;border-radius:22px;cursor:pointer;
          font-family:var(--font);font-size:44px;font-weight:600;color:#2f2a3d;
          background:#fffffff5;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.beltcard:active{transform:translateY(-50%) scale(.93)}
.beltcard.good{background:#d8f8e4;box-shadow:0 5px 0 #46b57a}
.beltcard.bad{background:#ffe6e6;box-shadow:0 5px 0 #e08a8a}

.tally{display:flex;gap:8px;justify-content:center;padding:0 12px 4px}

/* 深色天空上的文字一律转浅色 —— 标题、提示、返回键 */
.screen.on-dark .top h1{color:#f4f0ff;text-shadow:0 2px 6px #0007}
.screen.on-dark > .hint,
.screen.on-dark .scroll > .hint{color:#cdc4e8}
.screen.on-dark .back{background:#ffffff2e;color:#fff}

/* ------------------------------------------------------- ✍️ 描摹练字 --- */
.write-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
            padding:2px 18px 10px}
.write-head b{display:block;font-size:18px;font-weight:900}
.write-head small{color:var(--ink-soft);font-size:12.5px;font-weight:700}
.card.write-card{display:grid;place-items:center;padding:16px}

/* 米字格：实线外框 + 虚线中线和对角线 */
.gridbox{position:relative;border-radius:10px;background:#fff;
         box-shadow:inset 0 0 0 3px #d9cfe8}
.gridbox canvas{position:absolute;inset:0;border-radius:10px}
.gridbox .inklayer{touch-action:none;cursor:crosshair;z-index:2}

/* ------------------------------------------------------------- 加练区 -- */
.drills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drill{border:none;cursor:pointer;font-family:var(--font);text-align:left;
       border-radius:16px;padding:12px 13px;color:#fff;
       box-shadow:0 4px 0 rgba(0,0,0,.16);transition:transform .1s}
.drill:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.drill .ic{font-size:24px;display:block;line-height:1.2}
.drill b{display:block;font-size:14.5px;font-weight:900;margin-top:2px}
.drill small{display:block;font-size:11px;opacity:.9;line-height:1.35;margin-top:1px}

/* 拼音选项：字母要大，声调符号看得清 */
.opt.pyopt{text-align:center;font-size:24px;letter-spacing:.5px;
           font-family:-apple-system,"Helvetica Neue",sans-serif}

/* ------------------------------------------------------ 对错小判官 ---- */
.judgecard{margin:0 16px 12px;background:#fff;border-radius:22px;padding:22px 16px;
           box-shadow:0 6px 0 rgba(0,0,0,.14);text-align:center}
.judgecard .jt{font-size:76px;font-weight:600;line-height:1.05;color:#2f2a3d}
.judgecard .jb{font-size:40px;margin-top:8px;color:#5b4b8a;font-weight:800;
               font-family:-apple-system,"Helvetica Neue",sans-serif}
.judgecard .jb.sm{font-size:28px;font-family:var(--font);color:#2f2a3d}
.judgerow{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.judgebtn{border:none;cursor:pointer;font-family:var(--font);font-size:19px;
          font-weight:900;border-radius:18px;padding:16px 0;color:#fff;
          box-shadow:0 5px 0 rgba(0,0,0,.18)}
.judgebtn .em{display:block;font-size:30px;line-height:1.1}
.judgebtn.yes{background:linear-gradient(#6fd39a,#3fae74)}
.judgebtn.no{background:linear-gradient(#ff9a9a,#e2604f)}
.judgebtn:active{transform:translateY(2px)}
.judgebtn.good{filter:brightness(1.12)}
.judgebtn.bad{animation:wob .35s}

/* ------------------------------------------------------- 擦亮汉字 ----- */
.gridbox.dusty{box-shadow:inset 0 0 0 3px #a8977f}

/* 描摹进度：三个描红点 + 一个空心的「自己写」 */
.wdots{display:flex;gap:5px;margin-top:6px}
.wdots i{width:16px;height:6px;border-radius:3px;background:#e0d8ee}
.wdots i.on{background:#8a5fe0}
.wdots i.now{background:#c2603a;animation:pulse 1.2s ease-in-out infinite}
.wdots i.free{width:22px;box-shadow:inset 0 0 0 2px #b9aede;background:#fff}
.wdots i.free.on{background:#8a5fe0;box-shadow:none}
.wdots i.free.now{background:#c2603a;box-shadow:none}

/* 更多玩法：没解锁的压暗，最该做的那个挑出来 */
.drill.locked{filter:grayscale(.75) brightness(.92);opacity:.72}
.drill.urgent{box-shadow:0 0 0 3px #ffd84d, 0 4px 0 rgba(0,0,0,.16)}

/* 关卡链：两列紧凑排布，十关不再占满一屏 */
.chain{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chain-i{display:flex;align-items:center;gap:8px;width:100%;
         background:#f7f4fd;border:none;border-radius:13px;padding:8px 9px;
         font:inherit;color:inherit;text-align:left;cursor:pointer;
         transition:background .12s,transform .1s}
.chain-i:active{background:#ece5fa;transform:scale(.97)}
.chain-i .n{flex:none;width:19px;height:19px;border-radius:7px;background:#ded3f5;
            color:#5b4b8a;font-size:11px;font-weight:900;display:grid;place-items:center}
.chain-i .ic{flex:none;font-size:19px;line-height:1}
.chain-i .tx{flex:1;min-width:0}
.chain-i .tx b{display:block;font-size:13px;font-weight:800;
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chain-i .tx small{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:600;
                   white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------------------------------------------------------- 🃏 闪字卡 -- */
.flash-top{padding:2px 18px 10px}
.flash-top b{display:block;font-size:17px;font-weight:900}
.flash-top small{color:var(--ink-soft);font-size:12.5px;font-weight:700}
.flashcard{margin:0 16px 12px;background:#fff;border-radius:24px;padding:26px 18px;
           min-height:210px;display:flex;flex-direction:column;align-items:center;
           justify-content:center;gap:6px;box-shadow:0 7px 0 rgba(0,0,0,.14)}
.flashcard .fc-ch{font-size:104px;font-weight:600;line-height:1.05;color:#2f2a3d}
.flashcard .fc-ch.small{font-size:68px}
.flashcard .fc-py{font-size:24px;font-weight:800;color:#7b3fb5;
                  font-family:-apple-system,"Helvetica Neue",sans-serif}
.flashcard .fc-mean{font-size:18px;font-weight:800;color:#4a4360}
.flashcard .fc-words{font-size:16px;color:#6b6480;font-weight:700}
.flashcard .fc-sent{font-size:14px;color:#8a80a8;margin-top:4px;text-align:center}
.flashcard.turned{animation:flipin .34s}
@keyframes flipin{0%{transform:rotateY(70deg);opacity:.3}100%{transform:none;opacity:1}}

/* 单元页顶部的「快忘了」提醒条 */
.duebar{display:flex;align-items:center;gap:11px;width:100%;margin-bottom:12px;
        border:none;border-radius:18px;padding:13px 15px;cursor:pointer;font:inherit;
        text-align:left;color:#4a2a00;
        background:linear-gradient(#ffe9a8,#ffcf6b);box-shadow:0 5px 0 #dfa63a}
.duebar:active{transform:translateY(2px);box-shadow:0 3px 0 #dfa63a}
.duebar .ic{font-size:26px;flex:none}
.duebar .tx{flex:1;min-width:0}
.duebar .tx b{display:block;font-size:15.5px;font-weight:900}
.duebar .tx small{display:block;font-size:12px;font-weight:700;opacity:.8}
.duebar .chs{flex:none;font-size:20px;font-weight:600;letter-spacing:1px;opacity:.85}

/* 单册版本底部的署名 */
/* 署名。以前是 12.5px 的半透明灰字，读起来像在道歉 —— 这个游戏是 Eric
   设计的，署名该像块小铭牌，不是页脚免责声明。 */
.credit{width:fit-content;margin:24px auto 10px;padding:9px 20px 10px;
        border-radius:999px;background:#fff;color:var(--ink);
        font-size:15px;font-weight:900;letter-spacing:.6px;text-align:center;
        box-shadow:0 4px 0 rgba(0,0,0,.10), 0 0 0 3px #ffffff66}
.credit::before{content:'✦ ';color:#f0a93b}
.credit::after{content:' ✦';color:#f0a93b}


/* ------------------------------------------------------------ 选人页 -- */
.whogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.whocard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
         background:#fff;border:none;border-radius:18px;padding:13px 14px;
         cursor:pointer;font:inherit;text-align:left;
         box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .1s}
.whocard:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.whocard .av{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
             font-size:20px;font-weight:900;color:#fff;margin-bottom:4px;
             background:linear-gradient(#a58bf0,#7b57d8)}
.whocard .nm{font-size:17px;font-weight:900;color:#2f2a3d}
.whocard .st{font-size:11.5px;color:var(--ink-soft);font-weight:700}

/* 「开始冒险」下面的薄弱汉字入口：有就醒目，没有就安静 */
.weakbar{display:flex;align-items:center;gap:11px;width:100%;margin:0 0 12px;
         border:none;border-radius:18px;padding:13px 15px;cursor:pointer;font:inherit;
         text-align:left;color:#4a2a00;
         background:linear-gradient(#ffe9a8,#ffcf6b);box-shadow:0 5px 0 #dfa63a}
.weakbar:active{transform:translateY(2px);box-shadow:0 3px 0 #dfa63a}
.weakbar .ic{font-size:26px;flex:none}
.weakbar .tx{flex:1;min-width:0}
.weakbar .tx b{display:block;font-size:15.5px;font-weight:900}
.weakbar .tx small{display:block;font-size:12px;font-weight:700;opacity:.8}
.weakbar .chs{flex:none;font-size:20px;font-weight:600;letter-spacing:1px;opacity:.85}
.weakbar.calm{background:#f2eef8;color:#6b6480;box-shadow:0 4px 0 #ded4ee}
.weakbar.calm:active{box-shadow:0 2px 0 #ded4ee}

/* 加练 / 更多玩法：左右并排 */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.two-col > .card{margin:0}
/* 窄栏里每格独占一行，字才放得下 */
.two-col .drills{grid-template-columns:1fr}
.two-col .drill{padding:10px 11px}
.two-col .drill b{font-size:13.5px}
.two-col .drill small{font-size:10.5px}
@media(max-width:420px){ .two-col{grid-template-columns:1fr} }

/* 薄弱汉字 —— 就在「开始冒险」上面，两种状态样子完全不同。
   有字要练时做成一张「票券」：撕口边、角标、缓慢扫过的高光；
   没有时退成一条灰线，不抢注意力。 */
.weakslot{position:relative;margin:0 0 12px;border-radius:20px;overflow:hidden;
          padding:15px 16px 14px;
          background:linear-gradient(140deg,#ff9f45,#ff7a59 60%,#f2545b);
          box-shadow:0 7px 0 #c9482f, 0 0 0 4px #ffffff55}
/* 撕口：两侧各一个凹缺，像一张票 */
.weakslot::before,.weakslot::after{content:'';position:absolute;top:50%;
  width:18px;height:18px;border-radius:50%;background:var(--sky-under,#bfe6ff);
  transform:translateY(-50%);box-shadow:none}
.weakslot::before{left:-9px} .weakslot::after{right:-9px}
.weakslot .ribbon{position:absolute;top:11px;right:-30px;transform:rotate(38deg);
  background:#fff;color:#c9482f;font-size:11px;font-weight:900;letter-spacing:1px;
  padding:3px 34px;box-shadow:0 2px 0 #00000022}
.weakslot .wc-head{display:flex;align-items:center;gap:12px}
.weakslot .wc-head .ic{font-size:32px;flex:none;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,86%,100%{transform:none}90%{transform:rotate(-10deg) scale(1.12)}
                 95%{transform:rotate(8deg) scale(1.08)}}
.weakslot b{display:block;font-size:19px;font-weight:900;color:#fff;
            text-shadow:0 2px 0 #00000026}
.weakslot small{display:block;font-size:12.5px;font-weight:700;color:#fff;opacity:.9}
.weakslot .wc-chips{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 12px}
.weakslot .wc-chips i{font-style:normal;font-size:24px;font-weight:600;color:#b8402c;
                      background:#fff;border-radius:11px;padding:3px 10px;
                      box-shadow:0 2px 0 #00000018}
.weakslot .wc-chips i.more{font-size:15px;font-weight:800;padding:8px 10px}
.weakslot .wc-go{width:100%;border:none;cursor:pointer;font:inherit;
                 font-size:17px;font-weight:900;color:#b8402c;text-align:left;
                 background:#fff;border-radius:14px;padding:12px 15px;
                 box-shadow:0 4px 0 #00000022;position:relative;overflow:hidden}
.weakslot .wc-go small{color:#a06048;font-weight:700;margin-top:1px}
.weakslot .wc-go::after{content:'';position:absolute;top:0;bottom:0;width:60px;
  background:linear-gradient(90deg,#fff0,#ffffffcc,#fff0);
  animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%{left:-80px}55%,100%{left:110%}}
.weakslot .wc-go:active{transform:translateY(2px);box-shadow:0 2px 0 #00000022}

/* 安静状态 */
.weakslot.calm{background:#f2eef8;box-shadow:0 4px 0 #ded4ee;padding:12px 15px}
.weakslot.calm b{color:#6b6480;font-size:15.5px;text-shadow:none}
.weakslot.calm small{color:#8a80a8;opacity:1}
.weakslot.calm .wc-head .ic{font-size:24px;animation:none}
.weakslot.calm::before,.weakslot.calm::after{display:none}

@media (prefers-reduced-motion: reduce){
  .weakslot .wc-head .ic,.weakslot .wc-go::after{animation:none}
}

/* 跟读：正在念到的那个字亮起来 */
.mini.hot{background:linear-gradient(#ffe6a8,#ffd070);box-shadow:0 3px 0 #d9a63a}
.card.story.echo{padding:22px 18px}
.story-text .ru.lit .c{background:#ffd76b;border-radius:8px;
                       box-shadow:0 0 0 3px #ffd76b;color:#5a3a00}
.story-text .ru.lit .p{color:#c07a10}
.story-text .ru .c{transition:background .12s,color .12s,box-shadow .12s}

/* 还没做的课：列出来，但看得出点不进去 */
.unit.soon{opacity:.6;filter:grayscale(.55)}
.unit.soon .n{background:#ded8ea;color:#8a80a8}

/* ---- 我的汉字库 ------------------------------------------------------- */
.libstat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.libstat .ls{background:#fff;border-radius:16px;padding:10px 4px;text-align:center;
             box-shadow:0 4px 0 rgba(0,0,0,.09)}
.libstat .ls .i{font-size:19px;display:block}
.libstat .ls b{font-size:21px;display:block;line-height:1.15}
.libstat .ls small{font-size:11px;color:var(--ink-soft);font-weight:700}
.libtabs{display:flex;gap:8px;margin-bottom:12px}
.libtabs .lt{flex:1;border:none;font:inherit;font-size:15px;font-weight:800;
             padding:10px;border-radius:14px;background:#ffffffaa;color:var(--ink-soft);
             cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.libtabs .lt.on{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.14)}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.libc{border:none;font:inherit;cursor:pointer;background:#fff7ea;border-radius:14px;
      padding:7px 2px 5px;box-shadow:0 3px 0 rgba(0,0,0,.1);display:grid;gap:1px}
.libc .g{font-size:29px;font-weight:600;line-height:1.1}
.libc .s{font-size:9.5px;color:var(--ink-soft)}
.libc:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.1)}
/* 时间冲淡的字 —— 不是错，是该再见一面了 */
.libc.fade{background:#f1eef7;opacity:.75}
.libc.fade .g{color:#8a83a0}

/* ---- 接下来做什么：和汉字库同款横条，用颜色区分 -------------------- */
.libbar.k-review  {background:linear-gradient(120deg,#fff0dc,#ffe2c2)}
.libbar.k-continue{background:linear-gradient(120deg,#e6f1ff,#d5e6ff)}
.libbar.k-start   {background:linear-gradient(120deg,#e4f7e6,#d2f0d8)}
.libbar.k-free    {background:linear-gradient(120deg,#f1ecff,#e5daff)}
.libbar.k-review   .ic{animation:nudge 2.6s ease-in-out infinite}
.libbar .nums.chs i{font-size:19px;font-weight:600;background:#ffffffcc;
                    padding:3px 8px;color:#2a2140}
.libbar .nums.chs i.more{font-size:12px;font-weight:800;padding:6px 7px}

/* ---- 接下来做什么（Coach 推荐） --------------------------------------- */
.nextup{width:100%;border:none;font:inherit;cursor:pointer;text-align:left;
        display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
        padding:14px 15px;border-radius:20px;margin:0 0 12px;position:relative;
        background:linear-gradient(140deg,#6ed0ff,#4aa8f0 60%,#3d7fe0);
        box-shadow:0 7px 0 #2e63b8, 0 0 0 4px #ffffff55;color:#fff}
.nextup.k-review{background:linear-gradient(140deg,#ffc46b,#ff9d3d 60%,#f2803b);
                 box-shadow:0 7px 0 #c9642f, 0 0 0 4px #ffffff55}
.nextup.k-start{background:linear-gradient(140deg,#8ee08a,#4cc27a 60%,#2f9d61);
                box-shadow:0 7px 0 #24784a, 0 0 0 4px #ffffff55}
.nextup:active{transform:translateY(3px);box-shadow:0 4px 0 #2e63b8, 0 0 0 4px #ffffff55}
.nextup .nu-ic{font-size:34px;line-height:1;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* 1fr 的下限是内容宽度，长副标题会把整页撑出横向滚动条 —— 右边的 ⚙️ 和
   「0/11 字」就是这么被裁掉的。min-width:0 才允许它收窄。 */
.nextup .nu-tx{min-width:0}
.nextup .nu-tx b,.nextup .nu-tx small{overflow:hidden;text-overflow:ellipsis;
                                      white-space:nowrap}
.nextup .nu-tx .kick{font-size:10.5px;font-weight:900;letter-spacing:2px;opacity:.85}
.nextup .nu-tx b{display:block;font-size:19px;font-weight:900;
                 text-shadow:0 2px 0 #00000026}
.nextup .nu-tx small{display:block;font-size:12.5px;font-weight:700;opacity:.92}
.nextup .nu-go{font-size:22px;font-weight:900;opacity:.9}
.nextup .nu-chips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.nextup .nu-chips i{font-style:normal;font-size:20px;font-weight:600;color:#2c4a7a;
                    background:#fff;border-radius:9px;padding:2px 8px;
                    box-shadow:0 2px 0 #00000018}
.nextup.k-review .nu-chips i{color:#a35a1e}

/* ---- 课程结算 --------------------------------------------------------- */
.tally{display:flex;gap:8px;justify-content:center;margin:14px 0 2px;flex-wrap:wrap}
.tally .ty{border-radius:15px;padding:8px 14px;min-width:76px;
           box-shadow:0 3px 0 rgba(0,0,0,.1)}
.tally .ty .i{font-size:14px;display:block;line-height:1.3}
.tally .ty b{font-size:23px;display:block;line-height:1.1}
.tally .ty small{font-size:11px;font-weight:800;opacity:.8}
.tally .t-g{background:#ddf6e3;color:#1f7a4a}
.tally .t-m{background:#fff2d4;color:#a06a12}
.tally .t-l{background:#ffe4e0;color:#b4452f}
.sum-ch b.sm-good{color:#2f9d61}
.loot{display:flex;gap:12px;justify-content:center;margin-top:14px;
      font-size:15px;font-weight:800;color:var(--ink-soft)}
.badge-win{display:flex;align-items:center;gap:12px;justify-content:center;
           margin-top:14px;background:#fff6de;border-radius:16px;padding:10px 14px;
           box-shadow:0 3px 0 #00000012}
.badge-win small{display:block;font-size:11px;font-weight:800;color:#a06a12;
                 letter-spacing:1px}
.badge-win b{font-size:17px}
.card.comeback{background:linear-gradient(150deg,#fff,#eef6ff);text-align:center}
.comeback .cb-h{font-size:12px;font-weight:900;letter-spacing:2px;color:#4a7ec0}
.comeback .cb-t{font-size:18px;font-weight:900;margin:4px 0 8px}
.comeback .cb-chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.comeback .cb-chips i{font-style:normal;font-size:24px;font-weight:600;color:#3d6fb5;
                      background:#e7f1ff;border-radius:11px;padding:3px 10px}

/* ---- 家长面板：周报与易混字 ------------------------------------------- */
.pstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.pstat b{font-size:22px;display:block;line-height:1.2}
.pstat small{font-size:11.5px;color:var(--ink-soft);font-weight:700}
.confp{display:inline-flex;align-items:center;gap:5px;background:#fff0e6;
       border-radius:12px;padding:5px 11px;font-size:23px;font-weight:600;
       box-shadow:0 2px 0 #00000012}
.confp i{font-style:normal;font-size:13px;color:#c9482f}
.confp small{font-size:11px;font-weight:800;color:#a06048;margin-left:2px}

/* 不在路线上的加练格子：同一个网格，换个语气 */
.chain-i.extra{background:#fff6e4}
.chain-i.extra .n{background:#f3d9a4;color:#8a6520;font-weight:900}

/* ---- 首屏的汉字库入口 -------------------------------------------------- */
.libbar{width:100%;border:none;font:inherit;cursor:pointer;text-align:left;
        display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:11px;
        background:#fff;border-radius:18px;padding:11px 14px;margin:0 0 12px;
        box-shadow:0 5px 0 rgba(0,0,0,.10)}
.libbar:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.10)}
.libbar .ic{font-size:26px;line-height:1}
.libbar .tx{min-width:0}
.libbar .tx b{display:block;font-size:17px;font-weight:900;line-height:1.25}
.libbar .tx small{display:block;font-size:12px;color:var(--ink-soft);font-weight:700}
.libbar .nums{display:flex;gap:5px}
.libbar .nums i{font-style:normal;font-size:12px;font-weight:800;border-radius:9px;
                padding:4px 8px;white-space:nowrap}
.libbar .nums .g{background:#ddf6e3;color:#1f7a4a}
.libbar .nums .l{background:#fff2d4;color:#a06a12}
.libbar .nums .r{background:#ffe4e0;color:#b4452f}
.libbar .go{font-size:22px;font-weight:900;color:#bdb5cf}

/* ---- 小图案锁 --------------------------------------------------------- */
.whocard .lk{position:absolute;top:8px;right:10px;font-size:15px;opacity:.75}
.pickrow{display:flex;gap:12px;justify-content:center;margin:6px 0 16px}
.pickrow i{font-style:normal;width:74px;height:74px;border-radius:20px;background:#fff;
  display:grid;place-items:center;font-size:34px;color:#c8c0dc;
  box-shadow:0 4px 0 rgba(0,0,0,.10);border:3px dashed #ded4f0}
.pickrow i.on{border-style:solid;border-color:#7d5bd4;color:inherit}
.picgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.picb{border:none;font:inherit;font-size:36px;cursor:pointer;background:#fff;
  border-radius:18px;padding:12px 0;box-shadow:0 4px 0 rgba(0,0,0,.10)}
.picb:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.10)}

/* 老师还没放出来的一课：灰下去，但看得出内容是有的 */
.unit.later{opacity:.5;filter:grayscale(.7)}
.unit.later .n{background:#ded8ea;color:#8a83a0}
.gaterow{display:flex;align-items:center;gap:10px;justify-content:space-between;
         padding:7px 0;border-bottom:1px solid #f0ecf8}
.gaterow:last-child{border:0}
.gaterow b{display:block;font-size:14.5px}
.gaterow small{display:block;font-size:12px;color:var(--ink-soft);font-weight:700}

/* ---- 陪玩的小人：在布景层，不挡操作 ---------------------------------- */
.pal{position:absolute;left:6px;bottom:0;pointer-events:none;z-index:0;
     opacity:.92;animation:palbob 3.6s ease-in-out infinite}
@keyframes palbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.screen > .scroll, .screen > .top, .screen > .ask{position:relative;z-index:1}

/* ---- 选项方块：做成贴纸，不是网页按钮 -------------------------------- */
.tile{
  border:3px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.16), 0 0 0 1px rgba(0,0,0,.04);
  transition:transform .1s, box-shadow .1s
}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
/* 一进来轻轻弹一下，看得出是"活的" */
.tile{animation:tilein .34s cubic-bezier(.34,1.56,.64,1) backwards}
.tile:nth-child(2){animation-delay:.05s}
.tile:nth-child(3){animation-delay:.10s}
.tile:nth-child(4){animation-delay:.15s}
@keyframes tilein{from{transform:scale(.7) translateY(10px);opacity:0}
                  to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  .tile{animation:none}
  .pal{animation:none}
}

/* ---- 关卡线路图 -------------------------------------------------------
   照 Eric 画的草图：一条横着走的波浪，圆点一上一下；一行走完折回来接下一行。 */
.roadmap{position:relative;margin:6px 0 2px}
.road{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.roadline{fill:none;stroke:#cdbff0;stroke-width:5.5;stroke-linecap:round;
          vector-effect:non-scaling-stroke;stroke-dasharray:0.5 13}
.stop{position:absolute;transform:translate(-50%,-50%);border:none;background:none;
      font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;
      gap:5px;padding:0}
.stop .dot{position:relative;width:54px;height:54px;border-radius:50%;flex:none;
           display:grid;place-items:center;border:4px solid #fff;
           box-shadow:0 5px 0 rgba(0,0,0,.16)}
.stop .dot i{font-style:normal;font-size:24px;line-height:1}
.stop .dot b{position:absolute;left:-5px;top:-5px;width:22px;height:22px;
             border-radius:50%;background:#fff;color:#4a3d7a;font-size:11.5px;
             display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.14)}
.stop .lbl{text-align:center;line-height:1.2}
.stop .lbl b{display:block;font-size:12px;font-weight:900;white-space:nowrap}
.stop .lbl small{display:block;font-size:10px;color:var(--ink-soft);font-weight:700;
                 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop:active .dot{box-shadow:0 2px 0 rgba(0,0,0,.16);filter:brightness(.96)}
.stop.extra .dot{filter:saturate(.55)}
.stop.extra .dot b{color:#8a6520}

/* 起点：路上的第一个点，比别的关大一圈，箭头指进第一关 */
/* 起点要一眼看见 —— 它是这一页真正让人下手的那个东西 */
.stop.startdot .dot{width:88px;height:88px;border-width:5px;
  background:linear-gradient(150deg,#ffd873,#f7a93b 60%,#ef8f2c);
  box-shadow:0 6px 0 #c9721d, 0 0 0 5px #ffffff88;
  animation:startpulse 2.2s ease-in-out infinite}
.stop.startdot .dot i{font-size:38px;color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.2);margin-left:4px}
.stop.startdot .lbl b{font-size:19px;color:#b8721a;letter-spacing:1px;
  text-shadow:0 2px 0 #fff}
@keyframes startpulse{0%,100%{box-shadow:0 7px 0 #c9721d, 0 0 0 6px #ffffff99}
                      50%{box-shadow:0 7px 0 #c9721d, 0 0 0 16px #ffffff33}}
@media (prefers-reduced-motion:reduce){.stop.startdot .dot{animation:none}}
/* 波谷上的关卡，字排到圆点上方 —— 和波峰的字朝相反方向让开 */
.stop.up{flex-direction:column-reverse}

/* 终点的小红旗。绝对定位，不参与位置计算 —— 它是装饰，不该把关卡挤开 */
.stop .flag{position:absolute;left:calc(50% + 22px);top:-38px;
            width:52px;height:61px;line-height:0;pointer-events:none;
            transform-origin:bottom left;
            animation:flagwave 2.8s ease-in-out infinite}
.stop .flag svg{display:block;width:100%;height:100%;
                filter:drop-shadow(0 3px 2px rgba(0,0,0,.28))}
@keyframes flagwave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.stop .flag{animation:none}}

/* ---- 挑一个自己的小英雄 ------------------------------------------------ */
.herorow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.herocard{border:none;font:inherit;cursor:pointer;background:#fff;border-radius:22px;
          padding:16px 8px;box-shadow:0 5px 0 rgba(0,0,0,.12);
          display:flex;flex-direction:column;align-items:center}
.herocard:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
/* 没有薄弱汉字时的平静态：还在原位，但不喊人 */
.libbar.k-calm{background:linear-gradient(120deg,#f2f6ff,#e9eefc);cursor:default}
.libbar.k-calm .tx b{color:#5c6b8a}

/* ---- 冒险途中的进度地图 ------------------------------------------------ */
/* 带地图的过场卡要放宽：卡片本来只有 250px 宽，地图量到这个宽度就只能把
   关卡一个个往下堆，挤成一条 —— 一张"你在哪儿"的图，先得有地方摊开。 */
.stage-in.with-map{width:min(94vw,440px);padding:18px 12px 14px}
.stage-in.with-map .ic{font-size:40px}
.stage-in.with-map .nm{font-size:19px}
.stage-map{width:100%;overflow:hidden;margin-top:8px}
.stage-map .roadmap{transform:scale(.62);transform-origin:top center}
.stage-map .stop{pointer-events:none}
/* 过场卡上的地图不写关卡名：卡片上方已经用大字写着"汉字修理厂 第5关"，
   地图要回答的是另一个问题 ——「我在整条路的哪儿」，圆点和旗子就够了。
   十二个名字挤在缩小的图上，反而谁也读不清。 */
.stage-map .stop .lbl{display:none}
.stage-map .roadmap{transform:scale(.74);transform-origin:top center}
/* 走过的关卡变淡，前面的关卡照常 —— 一眼看得出走到哪儿了 */
.stop.walked{opacity:.42;filter:grayscale(.55)}
.stop.walked .lbl{opacity:.8}
.stop.ahead .dot{opacity:.9}
/* 正在玩的那一关：一圈脉动的光。旗子说"到这儿了"，光圈说"就是这个" */
.stop.here .dot{box-shadow:0 5px 0 rgba(0,0,0,.16), 0 0 0 5px #ffffffcc;
                animation:herering 1.8s ease-in-out infinite}
@keyframes herering{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.16), 0 0 0 5px #ffffffcc}
                    50%    {box-shadow:0 5px 0 rgba(0,0,0,.16), 0 0 0 12px #ffffff66}}
.stage-map .stop .flag{left:calc(50% + 10px);top:-34px;width:46px;height:54px}
@media (prefers-reduced-motion:reduce){.stop.here .dot{animation:none}}


/* ---------------------------------------------------- 📝 汉字默写 ------- */
/* 线索卡：给读音、给挖了空的词、给图 —— 就是不给字。露了就不是默写。 */
.dict-clue{display:flex;align-items:center;gap:14px}
.dict-clue .dc-e{font-size:40px;line-height:1}
.dict-clue .dc-t{flex:1;min-width:0}

.dict-clue .dc-t span{color:var(--ink-soft);font-size:15px}
.dict-check{text-align:center}
.dict-check .dc-q{font-weight:800;font-size:17px;margin-bottom:10px}
.dict-check .dc-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}


/* ---------------------------------------------------- 📋 通关报告 ------- */
.rep-head{text-align:center}
.rep-head .rp-name{font-size:24px;font-weight:900}
.rep-head .rp-sub{color:var(--ink-soft);font-size:14px;margin-top:2px}
.rep-big{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.rep-big .rb{background:#fff;border-radius:14px;padding:10px 4px;text-align:center;
             box-shadow:0 3px 0 rgba(0,0,0,.07)}
.rep-big .rb b{display:block;font-size:19px;font-weight:900}
.rep-big .rb small{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px}
.rep-big .rb.ok{background:#e2f7e8}
.rep-tab .rt-h,.rep-tab .rt-r{display:grid;grid-template-columns:1.1fr 1.3fr 1.3fr 1.3fr;
                              align-items:center;gap:6px;padding:7px 2px}
.rep-tab .rt-h{font-size:12px;color:var(--ink-soft);font-weight:800;
               border-bottom:2px solid #0000000f}
.rep-tab .rt-r{border-bottom:1px solid #0000000a;font-size:14px}
.rep-tab .rt-r:last-child{border-bottom:none}
.rep-tab .rt-c{font-size:22px;font-weight:900}
.rep-tab .rt-r.none{opacity:.45}
.rep-tab .ok{color:#2e9c5c;font-weight:800}
.rep-tab .no{color:#c8681f;font-weight:800}
.rep-sm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.rep-sm b{display:block;font-size:18px;font-weight:900}
.rep-sm small{display:block;font-size:11px;color:var(--ink-soft)}

/* 打地鼠题面里的组词小字：「只敲 牛」下面补一句「牛肉 的 牛」——
   复习的是生字和组词两样，不是光认字形。 */
.ask .q .wd-hint{display:block;font-size:13px;font-weight:700;opacity:.72;
                 margin-top:2px;letter-spacing:.5px}

/* ------------------------------------------------------------- accessors -- */
const Data = {
  HZ, COMPOSE, UNITS, WORLDS, FUTURE_GRADES, PART_INFO,

  /** the books this edition ships — a single-book build hides the rest */
  worlds(){
    return EDITION.worlds ? WORLDS.filter(w => EDITION.worlds.includes(w.id)) : WORLDS;
  },

  char(c){ return HZ[c]; },

  /** Every character this edition teaches. A single-book build must not pull
      distractors out of a book the child has never opened, so the whole
      collection is only "all" in the full build. */
  all(){
    if (!EDITION.worlds) return Object.keys(HZ);
    if (!this._all){
      const set = new Set();
      this.worlds().forEach(w => (w.units || []).forEach(u =>
        (UNITS[u] ? UNITS[u].chars : []).forEach(c => set.add(c))));
      (Store.data.addedChars || []).forEach(r => set.add(r.ch));
      this._all = [...set].filter(c => HZ[c]);
    }
    return this._all;
  },
  unit(id){ return UNITS[id]; },
  world(id){ return WORLDS.find(w => w.id === id); },
  unitChars(id){ return (UNITS[id] && UNITS[id].chars) || []; },

  /** 老师还没放出来的一课。
      和 `soon`（内容根本还没做）是两回事：这一课做好了，只是这周先不开。
      老师在家长面板里可以随时解锁，不用等我改代码。 */
  /** 这一课现在能不能点。两种"不能"：
      · locked —— 练熟上半课老师才放出来（同一课的后半）
      · 这学期从第 N 课教起，前面几课根本不在进度里（EDITION.from） */
  isLocked(id){
    const u = UNITS[id];
    if (!u) return false;
    const early = EDITION.from && u.n && u.n < EDITION.from;
    if (!u.locked && !early) return false;
    return !((Store.data.unlocked || {})[id]);   // 老师仍可在家长面板里放出来
  },

  /** 是"这学期不学"，还是"练熟了才放"？两种灰，两种说法。 */
  isBeforeStart(id){
    const u = UNITS[id];
    return !!(u && EDITION.from && u.n && u.n < EDITION.from);
  },
  worldChars(id){
    const w = this.world(id); if (!w) return [];
    return w.units.flatMap(u => this.unitChars(u));
  },
  /** recipes whose every part is either a studied char or a known component */
  /** 结果字就是【这一课】生字的配方。

      recipesFor 只看部件在不在通用部件表里 —— 女马八刀土也上下都在表里，
      所以那四条配方在任何一课都成立。于是第二课的拼装工厂全在考第一课的
      字（妈、分、地、卡），本课六个字一个都没练到。

      这一关开不开，要看这一课自己有没有合体字。 */
  recipesOwn(chars){
    const set = new Set(chars);
    return this.recipesFor(chars).filter(r => set.has(r.result));
  },

  recipesFor(chars){
    const set = new Set(chars);
    const seen = new Set();
    // Books share components, so the same recipe can be listed twice (土+也=地
    // arrives from both 一年级下册 and 美洲华语二册). One round of four would
    // then ask the same question twice.
    return COMPOSE.filter(r => {
      if (!r.parts.every(p => set.has(p) || PART_INFO[p])) return false;
      const k = r.result + ':' + r.parts.join('');
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  },
  /** characters that carry an origin card */
  pictographs(chars){ return chars.filter(c => HZ[c] && HZ[c].origin); },
  /** merge in characters added from the parent panel */
  addChar(rec){ HZ[rec.ch] = rec; },
};

/* ---------------------------------------------------------------- Story -- */
const Story = {
  all: STORIES,

  get(unitId){ return (unitId && STORIES[unitId]) || null; },

  /** for free play / weak mode: any story mostly made of characters he knows */
  any(pool){
    const ids = Object.keys(STORIES);
    let best = null, bestHit = 0;
    ids.forEach(id => {
      const s = STORIES[id];
      const hit = this.targets(s, pool).length;
      if (hit > bestHit){ bestHit = hit; best = s; }
    });
    return bestHit >= 3 ? best : null;
  },

  text(story){ return story.lines.join(''); },

  /** the unit's characters that actually turn up in the text */
  targets(story, pool){
    const t = this.text(story);
    return (pool || []).filter(c => t.indexOf(c) >= 0);
  },

  /** A line from the story with one taught character blanked out. Retrieval
      from a sentence he has just read beats retrieval from a bare prompt. */
  blanks(story, targets, n){
    const out = [];
    shuffle(targets.slice()).forEach(ch => {
      if (out.length >= n) return;
      const hits = l => l.split(ch).length - 1;
      // A line where the character appears twice would leave the answer
      // sitting in plain sight, so prefer a line that holds it exactly once
      // and blank every occurrence when there is no such line.
      const line = story.lines.find(l => hits(l) === 1)
                || story.lines.find(l => hits(l) > 0);
      if (!line) return;
      out.push({
        ch,
        masked: line.split(ch).join('＿'),
        say:    line.split(ch).join('什么'),
      });
    });
    return out;
  },

  /** split a paragraph into sentences a child can hold in one breath

      这里刻意不用正则的「后行断言」（ES2018）—— Safari 直到 16.4（2023 年
      3 月）才支持。关键在于它是**解析期**就会报语法错误：老 iPad 上整份内联
      脚本一行都不会执行，孩子看到的是一片空白，还没有任何报错提示。为了一个
      断句功能把整个游戏赌上不值得。改成先在句号后插一个不会出现在课文里的
      记号，再按记号切。 */
  sentences(line){
    const MARK = '\u0001';
    return String(line).replace(/([。！？])/g, '$1' + MARK).split(MARK)
                       .map(x => x.trim()).filter(Boolean);
  },

  /** the reading for the character at `i`, context first, then the tables */
  pyAt(line, i){
    const c = line[i];
    for (let k = 0; k < PY_CTX.length; k++){
      const [word, target, py] = PY_CTX[k];
      if (c !== target) continue;
      const at = word.indexOf(target);
      if (line.substr(i - at, word.length) === word) return py;
    }
    const info = Data.char(c);
    return (info && info.py) || STORY_PY[c] || '';
  },

  /** One paragraph as DOM.

      Pinyin rides above every character the game has data for, not just the
      taught ones — a reader who stalls on a supporting character stalls on the
      whole sentence. It is a crutch though, so it can be switched off; by the
      end of 二年级 he should be reading without it. */
  render(line, targets, py){
    const wrap = el('div', {class:'story-text' + (py ? ' ruby' : '')});
    const set = new Set(targets || []);
    const tap = (c, info) => () => {
      Sfx.tap();
      Say.speak(Say.inWord(c), {rate:0.55, interrupt:true});
      if (info) UI.toast({emoji:'📖', text:`${c}　${info.py}`,
                          sub:info.words[0] || info.mean, ms:1200});
    };

    const src = String(line);
    Array.from(src).forEach((c, idx) => {
      const info = Data.char(c);
      const hot = set.has(c);

      if (!py){
        if (!hot){ wrap.append(document.createTextNode(c)); return; }
        const b = el('b', {class:'hz'}, c);
        b.onclick = tap(c, info);
        wrap.append(b);
        return;
      }

      // Not <ruby>: its native alignment differs between browsers and breaks
      // the moment two boxes on a line have different heights. A plain two-row
      // stack, given to EVERY character including punctuation, always sits
      // level — punctuation just carries a blank top row.
      const reading = Story.pyAt(src, idx);
      const cell = el('span', {class:'ru' + (hot ? ' hz' : '')},
        el('i', {class:'p'}, reading || '\u00a0'),
        el('i', {class:'c'}, c));
      if (hot) cell.onclick = tap(c, info);
      wrap.append(cell);
    });
    return wrap;
  },
};
